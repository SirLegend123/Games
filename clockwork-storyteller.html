<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Storyteller">
<title>Clockwork Storyteller</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15121b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script src="companion.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* One phone, passed around the table. Dark-first, same palette as the Clocktower Companion apps. */
:root {
  --bg: #15121b; --surface: #211c29; --surface-2: #2b2534; --line: #3b3346;
  --fg: #ece6f2; --muted: #a69cb3; --brass: #d4ab55;
  --parch: #efe4c9; --parch-ink: #2a2118;
  --good: #4c8ce4; --evil: #d8435a;
  --townsfolk: #3e7fd6; --outsider: #3aa0b5; --minion: #d4485e; --demon: #9e1f33;
  --ok: #3aa35c; --warn: #e3a53c;
  --felt-1: #2c2436; --felt-2: #1b1622;
  --font-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f1eef4; --surface: #ffffff; --surface-2: #f4f0f7; --line: #dcd4e3;
    --fg: #231d2b; --muted: #6c6278; --brass: #94701f;
    --good: #2463c2; --evil: #be2a42;
    --townsfolk: #2463c2; --outsider: #1f8296; --minion: #c0344b; --demon: #8a1428; --ok: #2a9150; --warn: #b7791f;
    --felt-1: #ffffff; --felt-2: #e2dbe9;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f1eef4; --surface: #ffffff; --surface-2: #f4f0f7; --line: #dcd4e3;
  --fg: #231d2b; --muted: #6c6278; --brass: #94701f;
  --good: #2463c2; --evil: #be2a42;
  --townsfolk: #2463c2; --outsider: #1f8296; --minion: #c0344b; --demon: #8a1428; --ok: #2a9150; --warn: #b7791f;
  --felt-1: #ffffff; --felt-2: #e2dbe9;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #15121b; --surface: #211c29; --surface-2: #2b2534; --line: #3b3346;
  --fg: #ece6f2; --muted: #a69cb3; --brass: #d4ab55;
  --good: #4c8ce4; --evil: #d8435a;
  --townsfolk: #3e7fd6; --outsider: #3aa0b5; --minion: #d4485e; --demon: #9e1f33; --ok: #3aa35c; --warn: #e3a53c;
  --felt-1: #2c2436; --felt-2: #1b1622;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 1rem; line-height: 1.45; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; display: grid; gap: 14px; }
.bar { display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; margin-inline: -16px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { font-family: var(--font-display); font-weight: 400; font-size: 1.45rem; color: var(--brass); margin: 0; line-height: 1; margin-right: auto; }
.phase { font-weight: 800; font-size: .9rem; color: var(--muted); white-space: nowrap; }
@media (max-width: 420px) { .brand { font-size: 1.15rem; } }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 700; min-height: 44px; }
.btn:hover { border-color: var(--brass); }
.btn.primary { background: var(--brass); color: #1a1408; border-color: var(--brass); }
.btn.sm { padding: 5px 11px; min-height: 34px; font-size: .88rem; }
.btn.danger { color: var(--evil); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.45rem; color: var(--brass); }
.card h3 { margin: 0; font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 800; }
.card p { margin: 0; }
.hint { font-size: .88rem; color: var(--muted); }
.muted { color: var(--muted); }
textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 220px; resize: vertical; }
select.inp { flex: 1 1 14em; min-width: 0; max-width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* Name grid for passing the phone */
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.name-btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 14px 10px; font-weight: 800; font-size: 1.05rem; min-height: 56px; overflow-wrap: anywhere; }
.name-btn:hover:not(:disabled) { border-color: var(--brass); }
.name-btn:disabled { opacity: .45; cursor: default; font-weight: 600; }

/* Player picker */
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.pc { border: 2px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 8px; font-weight: 700; min-height: 48px; overflow-wrap: anywhere; }
.pc.on { border-color: var(--brass); background: color-mix(in srgb, var(--brass) 22%, var(--surface-2)); }
.pc.dead { color: var(--muted); }

/* Private screens */
.private { border-color: var(--brass); }
.big-name { font-family: var(--font-display); font-size: 2.2rem; color: var(--brass); text-align: center; line-height: 1.1; overflow-wrap: anywhere; }
.role-card { background: var(--parch); color: var(--parch-ink); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; border-left: 6px solid var(--townsfolk); }
.role-card.outsider { border-left-color: var(--outsider); } .role-card.minion { border-left-color: var(--minion); } .role-card.demon { border-left-color: var(--demon); }
.role-name { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.1; }
.role-team { font-weight: 800; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
.role-card.townsfolk .role-team, .role-card.outsider .role-team { color: #1f5bb0; }
.role-card.minion .role-team, .role-card.demon .role-team { color: #a3203a; }
.info { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.info b { color: var(--brass); }
.msg { background: color-mix(in srgb, var(--evil) 16%, var(--surface-2)); border: 1px solid var(--evil); border-radius: 10px; padding: 10px 12px; }
.hist { display: grid; gap: 8px; }
.hist-when { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 800; }

/* Grimoire table (Spy and end of game) */
table.grim { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.grim td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.grim tr.dead td:first-child { text-decoration: line-through; color: var(--muted); }
.tag { display: inline-block; font-size: .72rem; font-weight: 800; border-radius: 99px; padding: 1px 8px; margin: 1px 2px 1px 0; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.tag.evil { color: var(--evil); border-color: var(--evil); } .tag.good { color: var(--good); border-color: var(--good); }

/* Town square */
.banner { border-radius: 12px; padding: 12px 14px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); }
.banner.evil { border-color: var(--evil); color: var(--evil); }
.timer { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 1.2rem; }
.big-timer { text-align: center; font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size: clamp(4rem, 26vw, 9rem); line-height: 1; color: var(--brass); padding: 10px 0 4px; }
.big-timer.low { color: var(--warn); }
.big-timer.up { color: var(--evil); font-size: clamp(3rem, 17vw, 6rem); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .big-timer.up { animation: none; } }
.timer-row { justify-content: center; }
.tok.next { box-shadow: 0 0 0 5px var(--brass), 0 3px 10px rgba(0,0,0,.35); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 14px; font-weight: 700; min-height: 44px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--brass); color: #1a1408; }
.setting { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.setting > span { font-weight: 700; min-width: 5.5em; }
.win { text-align: center; font-family: var(--font-display); font-size: clamp(3.2rem, 17vw, 7rem); line-height: 1; padding: 28px 12px; border-radius: 14px; border: 2px solid currentColor; text-wrap: balance; }
.win.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.win.evil { color: var(--evil); background: color-mix(in srgb, var(--evil) 14%, var(--surface)); }
.win-reason { text-align: center; font-size: 1.2rem; text-wrap: balance; }

/* The table: seats in a circle, clockwise from the top */
.table { position: relative; width: 100%; max-width: 560px; margin: 4px auto; aspect-ratio: 1; container-type: inline-size; border-radius: 50%; background: radial-gradient(circle at 50% 45%, var(--felt-1) 0%, var(--felt-2) 72%); border: 1px solid var(--line); }
.tok { position: absolute; width: var(--d); height: var(--d); transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center; padding: 4%; background: var(--parch); color: var(--parch-ink); border: 3px solid var(--line); box-shadow: 0 3px 10px rgba(0,0,0,.35); font: 800 var(--fs)/1.05 var(--font-body); text-align: center; }
.tok-nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: var(--nfs); }
button.tok { cursor: pointer; border-color: var(--brass); animation: glow 1.8s ease-in-out infinite; }
button.tok:hover { transform: translate(-50%, -50%) scale(1.07); }
.tok.done { opacity: .5; }
.tok.dead { filter: grayscale(1) brightness(.68); }
.tok.block { border-color: var(--evil); box-shadow: 0 0 0 3px var(--evil); }
.tok .mark { position: absolute; top: -6%; right: -10%; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 99px; padding: 1px 5px; font-size: max(10px, calc(var(--fs) * .8)); white-space: nowrap; }
.tok-sub { font-weight: 700; font-size: var(--sfs); color: color-mix(in srgb, var(--parch-ink) 72%, transparent); white-space: nowrap; }
.tok:has(.tok-sub) { align-content: center; gap: 1px; }
.tok.flipped { animation: none; border-width: 4px; }
.tok.flipped.good { border-color: var(--good); } .tok.flipped.evil { border-color: var(--evil); }
.tok.flipped.minion, .tok.flipped.demon { background: color-mix(in srgb, var(--evil) 22%, var(--parch)); }
.tok.flipped.dead { filter: none; opacity: .72; }
.tok.picked { box-shadow: 0 0 0 4px var(--brass), 0 3px 10px rgba(0,0,0,.35); }
.reveal-detail { display: grid; gap: 8px; }
.reveal-detail h3 { font-size: .9rem; color: var(--fg); }
.table-mid { position: absolute; inset: 27%; display: grid; place-content: center; text-align: center; gap: 2px; }
.mid-big { font-family: var(--font-display); color: var(--brass); font-size: 11cqw; line-height: 1; }
.mid-sm { color: var(--muted); font-weight: 700; font-size: max(11px, 3.6cqw); }
@keyframes glow { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--brass) 40%, transparent), 0 3px 10px rgba(0,0,0,.35); } }
@media (prefers-reduced-motion: reduce) { button.tok { animation: none; } }
.log { display: grid; gap: 4px; font-size: .92rem; }
.log .when { font-weight: 800; color: var(--brass); margin-top: 8px; }
.err { color: var(--evil); font-weight: 700; }
.wait { text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.wait b { color: var(--brass); font-size: 1.2rem; }
.pc:disabled { opacity: .55; cursor: default; }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="btn sm home-link" href="index.html" title="Choose another app" aria-label="All apps" style="text-decoration:none;color:inherit;display:inline-grid;place-items:center">&#8962;</a>
    <h1 class="brand">Clockwork Storyteller</h1>
    <span class="phase" id="phase"></span>
    <button class="btn sm" data-act="menu">Menu</button>
  </header>
  <main id="app" class="wrap" style="padding:0;width:100%"></main>
</div>
<script>
'use strict';
const KEY = 'clockwork-storyteller-v1';

/* ---------- Trouble Brewing ---------- */
const ROLES = {
  'Washerwoman': { type: 'townsfolk', text: 'You start knowing that 1 of 2 players is a particular Townsfolk.' },
  'Librarian': { type: 'townsfolk', text: 'You start knowing that 1 of 2 players is a particular Outsider (or that zero are in play).' },
  'Investigator': { type: 'townsfolk', text: 'You start knowing that 1 of 2 players is a particular Minion.' },
  'Chef': { type: 'townsfolk', text: 'You start knowing how many pairs of evil players are sitting next to each other.' },
  'Empath': { type: 'townsfolk', text: 'Each night, you learn how many of your 2 alive neighbours are evil.' },
  'Fortune Teller': { type: 'townsfolk', text: 'Each night, choose 2 players: you learn if either is the Demon. There is a good player that registers as the Demon to you.' },
  'Undertaker': { type: 'townsfolk', text: 'Each night except the first, you learn which character died by execution today.' },
  'Monk': { type: 'townsfolk', text: 'Each night except the first, choose a player (not yourself): they are safe from the Demon tonight.' },
  'Ravenkeeper': { type: 'townsfolk', text: 'If you die at night, you are woken to choose a player: you learn their character.' },
  'Virgin': { type: 'townsfolk', text: 'The 1st time you are nominated, if the nominator is a Townsfolk, they are executed immediately.' },
  'Slayer': { type: 'townsfolk', text: 'Once per game, during the day, publicly choose a player: if they are the Demon, they die.' },
  'Soldier': { type: 'townsfolk', text: 'You are safe from the Demon.' },
  'Mayor': { type: 'townsfolk', text: 'If only 3 players live and no execution occurs, your team wins. If you die at night, another player might die instead.' },
  'Butler': { type: 'outsider', text: 'Each night, choose a player (not yourself): tomorrow, you may only vote if they are voting too.' },
  'Drunk': { type: 'outsider', text: 'You do not know you are the Drunk. You think you are a Townsfolk character, but you are not.' },
  'Recluse': { type: 'outsider', text: 'You might register as evil and as a Minion or Demon, even if dead.' },
  'Saint': { type: 'outsider', text: 'If you die by execution, your team loses.' },
  'Poisoner': { type: 'minion', text: 'Each night, choose a player: they are poisoned tonight and tomorrow day.' },
  'Spy': { type: 'minion', text: 'Each night, you see the Grimoire. You might register as good and as a Townsfolk or Outsider, even if dead.' },
  'Scarlet Woman': { type: 'minion', text: 'If there are 5 or more players alive and the Demon dies, you become the Demon.' },
  'Baron': { type: 'minion', text: 'There are extra Outsiders in play. [+2 Outsiders]' },
  'Imp': { type: 'demon', text: 'Each night except the first, choose a player: they die. If you kill yourself this way, a Minion becomes the Imp.' },
};
const TF = Object.keys(ROLES).filter(r => ROLES[r].type === 'townsfolk');
const OS = Object.keys(ROLES).filter(r => ROLES[r].type === 'outsider');
const MN = Object.keys(ROLES).filter(r => ROLES[r].type === 'minion');
// Townsfolk, Outsiders, Minions, Demons
const COUNTS = { 5: [3,0,1,1], 6: [3,1,1,1], 7: [5,0,1,1], 8: [5,1,1,1], 9: [5,2,1,1], 10: [7,0,2,1], 11: [7,1,2,1], 12: [7,2,2,1], 13: [9,0,3,1], 14: [9,1,3,1], 15: [9,2,3,1] };
// How often the Storyteller's choices go a particular way
const LIE = 0.8;            // a drunk or poisoned player gets false info
const SPY_GOOD = 0.5;       // the Spy registers as good
const RECLUSE_EVIL = 0.4;   // the Recluse registers as evil
const MAYOR_BOUNCE = 0.5;   // a Demon kill on the Mayor goes to someone else
// Every private turn lasts at least this long, so nobody can tell who has an ability by how quickly they finish
let TURN_WAIT = 5;

/* ---------- State ---------- */
let G = load();
/* ---------- This phone's settings: text size and voice ---------- */
const PREFS_KEY = 'clockwork-storyteller-prefs';
let prefs = { text: 1, voice: true, voiceURI: '', rate: 0.95 };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREFS_KEY)) || {}); } catch (e) {}
function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {} applyPrefs(); }
function applyPrefs() { document.documentElement.style.fontSize = ''; }  // text size is now in the shared ⚙ settings
applyPrefs();
const canSpeak = () => typeof speechSynthesis !== 'undefined' && typeof SpeechSynthesisUtterance !== 'undefined';
// The voices this phone offers (the list can arrive a moment after the page loads)
function voiceList() { try { return canSpeak() && speechSynthesis.getVoices ? speechSynthesis.getVoices() : []; } catch (e) { return []; } }
try { if (canSpeak() && speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', () => { if (U.menu === true) render(); }); } catch (e) {}
function voiceSample() { speak(`Pass the phone to ${G ? (P(nextUpSafe()) || G.players[0]).name : 'Alice'}.`); }
// Reads public announcements aloud. Never call this with anything private.
function speak(text) {
  if (!prefs.voice || !canSpeak() || !text) return;
  const tmp = document.createElement('div'); tmp.innerHTML = text;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(tmp.textContent.replace(/\s+/g, ' ').trim());
    const v = voiceList().find(v => v.voiceURI === prefs.voiceURI);
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';
    u.rate = prefs.rate;
    speechSynthesis.speak(u);
  } catch (e) {}
}

let U = { view: G ? 'game' : 'home', turn: null, sel: [], need: 0, day: null, hands: [], menu: false, timerEnd: null, setupText: '' };

function load() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function save() { try { if (G) localStorage.setItem(KEY, JSON.stringify(G)); else localStorage.removeItem(KEY); } catch (e) {} }

const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const chance = p => Math.random() < p;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const P = id => G.players.find(p => p.id === id);
const nm = id => esc(P(id).name);
const alive = () => G.players.filter(p => p.alive);
const believed = p => p.role === 'Drunk' ? p.fake : p.role;
const isGood = p => ROLES[p.role].type === 'townsfolk' || ROLES[p.role].type === 'outsider';
const inPlay = r => G.players.some(p => p.role === r);
const poisonerAlive = () => G.players.some(p => p.alive && p.role === 'Poisoner');
const poisoned = p => G.poison === p.id && poisonerAlive();
const sober = p => p.role !== 'Drunk' && !poisoned(p);
const why = p => p.role === 'Drunk' ? 'they are the Drunk' : 'they are poisoned';
const label = () => (G.time === 'night' ? 'Night ' : 'Day ') + G.n;
const plural = (n, one, many) => n === 1 ? one : many;
const list = names => names.length < 2 ? names.join('') : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];

function log(text) { G.log.push({ when: label(), text }); }
function town(text) { G.town.push({ when: label(), text }); }
function tell(id, lines) { G.info[id].push({ when: label(), lines }); }
function message(id, html) { G.inbox[id].push(html); tell(id, [html]); }
function win(team, reason) { if (!G.winner) { G.winner = { team, reason }; log(`${team === 'good' ? 'Good' : 'Evil'} wins: ${reason}`); } }
function checkTwoLeft() {
  if (!G.winner && alive().length <= 2 && alive().some(p => p.role === 'Imp')) win('evil', 'Only two players are left alive, and one of them is the Demon.');
}

function teamWord(r) {
  return { townsfolk: 'Townsfolk · good', outsider: 'Outsider · good', minion: 'Minion · evil', demon: 'Demon · evil' }[ROLES[r].type];
}
function roleCard(r) {
  return `<div class="role-card ${ROLES[r].type}"><div class="role-team">${teamWord(r)}</div><div class="role-name">${esc(r)}</div><div>${esc(ROLES[r].text)}</div></div>`;
}
function bluffLine() { return `Three good characters not in play, safe to bluff as: <b>${G.bluffs.map(esc).join(', ')}</b>.`; }

/* ---------- Setup ---------- */
function breakdown(n) {
  if (!COUNTS[n]) return '';
  const [t, o, m] = COUNTS[n];
  return `${t} Townsfolk, ${o} ${plural(o, 'Outsider', 'Outsiders')}, ${m} ${plural(m, 'Minion', 'Minions')} and the Imp (a Baron swaps 2 Townsfolk for 2 Outsiders).`;
}
function parseNames(text) {
  const seen = {};
  return text.split(/\n|,/).map(s => s.trim()).filter(Boolean).map(s => {
    seen[s] = (seen[s] || 0) + 1;
    return seen[s] > 1 ? `${s} ${seen[s]}` : s;
  });
}

function newGame(names) {
  const n = names.length;
  let [t, o, m] = COUNTS[n];
  const minions = shuffle(MN).slice(0, m);
  if (minions.includes('Baron')) { t -= 2; o += 2; }
  const dealt = shuffle(['Imp', ...minions, ...shuffle(OS).slice(0, o), ...shuffle(TF).slice(0, t)]);
  G = {
    v: 1, n: 1, time: 'night', stage: 'pass', created: Date.now(),
    players: names.map((name, i) => ({ id: i, name, role: dealt[i], alive: true, ghost: true, used: false, master: null })),
    log: [], town: [], info: {}, inbox: {}, poison: null, bluffs: [], redHerring: null,
    lastExecuted: null, winner: null, pass: null, announce: null, dayS: null, dawnInfo: {}, diedTonight: [], rkLearned: {},
  };
  G.players.forEach(p => { G.info[p.id] = []; G.inbox[p.id] = []; });
  const drunk = G.players.find(p => p.role === 'Drunk');
  if (drunk) drunk.fake = pick(TF.filter(r => !inPlay(r)));
  G.bluffs = shuffle([...TF, ...OS].filter(r => r !== 'Drunk' && !inPlay(r) && !(drunk && drunk.fake === r))).slice(0, 3);
  G.redHerring = pick(G.players.filter(isGood)).id;

  log(`Setup for ${n} players: ` + G.players.map(p => `${esc(p.name)} is the ${p.role === 'Drunk' ? `Drunk (thinks they're the ${p.fake})` : p.role}`).join('; ') + '.');
  log(`Demon bluffs: ${G.bluffs.join(', ')}. The Fortune Teller's red herring is ${nm(G.redHerring)}.`);

  const imp = G.players.find(p => p.role === 'Imp');
  const minionPs = G.players.filter(p => MN.includes(p.role));
  G.players.forEach(p => {
    const lines = [roleCard(believed(p))];
    if (n >= 7) {
      if (MN.includes(p.role)) {
        lines.push(`The Demon is <b>${esc(imp.name)}</b>.`);
        const mates = minionPs.filter(q => q.id !== p.id);
        if (mates.length) lines.push(`Your fellow ${plural(mates.length, 'Minion is', 'Minions are')} <b>${esc(list(mates.map(q => q.name)))}</b>.`);
      }
      if (p.role === 'Imp') {
        lines.push(`Your ${plural(minionPs.length, 'Minion is', 'Minions are')} <b>${esc(list(minionPs.map(q => q.name)))}</b>.`);
        lines.push(bluffLine());
      }
    }
    tell(p.id, lines);
  });
  startPass('night');
}

/* ---------- Passing the phone ---------- */
function startPass(kind) {
  if (kind === 'night') G.duskAlive = alive().map(p => p.id);
  G.stage = 'pass';
  G.pass = { kind, order: G.duskAlive.slice(), done: {}, choices: {} };
  U.turn = null;
}
function finishTurn(id, choice) {
  G.pass.done[id] = true;
  G.pass.last = id;
  if (choice) G.pass.choices[id] = choice;
  G.inbox[id] = [];
  U.turn = null; U.sel = [];
}
function nextUp() {
  const N = G.players.length, start = G.pass.last == null ? 0 : G.pass.last + 1;
  for (let k = 0; k < N; k++) { const id = (start + k) % N; if (G.pass.order.includes(id) && !G.pass.done[id]) return id; }
  return null;
}
function nextUpSafe() { try { return G.stage === 'pass' ? nextUp() : null; } catch (e) { return null; } }
function sayNext(prefix) {
  const id = nextUp();
  speak(id == null ? `${prefix || ''} Everyone has had their turn.` : `${prefix || ''} Pass the phone to ${P(id).name}.`);
}
const passComplete = () => G.pass.order.every(id => G.pass.done[id]);

/* ---------- How players register to abilities ---------- */
function reg(q, want) {
  if (q.role === 'Spy' && sober(q) && chance(SPY_GOOD)) {
    const type = want === 'outsider' ? 'outsider' : (want === 'townsfolk' || chance(0.8)) ? 'townsfolk' : 'outsider';
    const pool = (type === 'townsfolk' ? TF : OS).filter(r => r !== 'Drunk');
    const free = pool.filter(r => !inPlay(r));
    return { good: true, type, role: pick(free.length ? free : pool), spoof: true };
  }
  if (q.role === 'Recluse' && sober(q) && chance(RECLUSE_EVIL)) {
    const type = want === 'minion' || want === 'demon' ? want : chance(0.3) ? 'demon' : 'minion';
    return { good: false, type, role: type === 'demon' ? 'Imp' : pick(MN), spoof: true };
  }
  return { good: isGood(q), type: ROLES[q.role].type, role: q.role };
}
const others = p => G.players.filter(q => q.id !== p.id);
function aliveNeighbours(p) {
  const N = G.players.length, out = [];
  for (const dir of [-1, 1]) {
    for (let k = 1; k < N; k++) {
      const q = G.players[((p.id + dir * k) % N + N) % N];
      if (q.alive && q.id !== p.id) { if (!out.includes(q)) out.push(q); break; }
    }
  }
  return out;
}
// Records what an info character learned, plus a Storyteller note if it was false
function noteInfo(p, text, lied, extra) {
  const br = believed(p);
  const tag = lied ? ` <i>(false: ${why(p)})</i>` : !sober(p) ? ` <i>(true, though ${why(p)})</i>` : '';
  log(`${esc(br)} ${nm(p.id)} learned: ${text}${tag}${extra ? ' ' + extra : ''}`);
}

function onePairInfo(p, kind) {
  const pool = kind === 'townsfolk' ? TF : kind === 'outsider' ? OS : MN;
  let lie = !sober(p) && chance(LIE);
  if (!lie) {
    const hit = shuffle(others(p)).map(q => ({ q, r: reg(q, kind) })).find(x => x.r.type === kind);
    if (hit) {
      const other = pick(others(p).filter(q => q.id !== hit.q.id));
      const pair = shuffle([hit.q, other]);
      return { text: `One of <b>${esc(pair[0].name)}</b> and <b>${esc(pair[1].name)}</b> is the <b>${esc(hit.r.role)}</b>.`, lie: false, extra: hit.r.spoof ? `(${esc(hit.q.name)} is really the ${hit.q.role})` : '' };
    }
    if (kind === 'outsider' && sober(p)) return { text: 'There are <b>no Outsiders</b> in play.', lie: false };
    lie = true;
  }
  const pair = shuffle(others(p)).slice(0, 2);
  return { text: `One of <b>${esc(pair[0].name)}</b> and <b>${esc(pair[1].name)}</b> is the <b>${esc(pick(pool.filter(r => r !== believed(p))))}</b>.`, lie: true };
}
function falseCharacter(q) { return isGood(q) ? pick([...MN, 'Imp']) : pick(TF); }

/* ---------- Night ---------- */
function killAtNight(t) {
  if (!t.alive) return;
  die(t, 'night');
  G.diedTonight.push(t.id);
  if (believed(t) === 'Ravenkeeper') log(`The Ravenkeeper (${nm(t.id)}) died at night and will choose a player in the morning.`);
}
function starPass(imp) {
  imp.alive = false;
  G.diedTonight.push(imp.id);
  const minions = alive().filter(q => MN.includes(q.role));
  if (!minions.length) { log(`The Imp (${nm(imp.id)}) killed themselves with no Minion left to take over.`); win('good', `The Demon (${esc(imp.name)}) died.`); return; }
  const heir = minions.find(q => q.role === 'Scarlet Woman') || pick(minions);
  log(`The Imp (${nm(imp.id)}) killed themselves; the ${heir.role} (${nm(heir.id)}) became the Imp.`);
  heir.was = heir.role; heir.role = 'Imp';
  message(heir.id, `The Imp (${nm(imp.id)}) killed themselves to pass on their power. <b>You are now the Imp.</b> From tomorrow night, you choose who dies. ${bluffLine()}`);
}
function die(p, cause) {
  if (!p.alive) return;
  const before = alive().length;
  p.alive = false;
  if (cause === 'execution' && p.role === 'Saint' && sober(p)) win('evil', `The Saint (${esc(p.name)}) was executed.`);
  if (p.role === 'Imp') {
    const sw = G.players.find(q => q.alive && q.role === 'Scarlet Woman' && sober(q));
    if (sw && before >= 5) {
      sw.was = 'Scarlet Woman'; sw.role = 'Imp';
      log(`The Imp (${nm(p.id)}) died, so the Scarlet Woman (${nm(sw.id)}) became the Imp.`);
      message(sw.id, `The Demon (${nm(p.id)}) has died. As the Scarlet Woman, <b>you are now the Imp</b>. Each night, you choose who dies. ${bluffLine()}`);
    } else win('good', `The Demon (${esc(p.name)}) died.`);
  }
}

function resolveNight() {
  const c = G.pass.choices, n = G.n, awake = id => G.pass.order.includes(id);
  const holder = role => G.players.find(p => p.role === role && awake(p.id));
  G.diedTonight = []; G.dawnInfo = {}; G.rkLearned = {};
  const say = (p, line) => (G.dawnInfo[p.id] = G.dawnInfo[p.id] || []).push(line);

  // Poisoner: the old poison ends at dusk
  G.poison = null;
  const pz = holder('Poisoner');
  if (pz && c[pz.id]) { G.poison = c[pz.id][0]; log(`The Poisoner (${nm(pz.id)}) poisoned ${nm(G.poison)}.`); }

  // Monk
  let protect = null;
  if (n >= 2) G.players.filter(p => awake(p.id) && believed(p) === 'Monk' && c[p.id]).forEach(p => {
    if (sober(p)) { protect = c[p.id][0]; log(`The Monk (${nm(p.id)}) protected ${nm(protect)}.`); }
    else log(`The Monk (${nm(p.id)}) chose ${nm(c[p.id][0])}, but ${why(p)}, so nobody is protected.`);
  });

  // Imp
  const imp = holder('Imp');
  if (imp && n >= 2 && c[imp.id]) {
    const t = P(c[imp.id][0]);
    if (poisoned(imp)) log(`The Imp (${nm(imp.id)}) chose ${nm(t.id)}, but is poisoned, so nobody dies.`);
    else if (t.id === imp.id) starPass(imp);
    else if (!t.alive) log(`The Imp chose ${nm(t.id)}, who is already dead.`);
    else if (t.id === protect) log(`The Imp chose ${nm(t.id)}, but the Monk protected them.`);
    else if (t.role === 'Soldier' && sober(t)) log(`The Imp chose ${nm(t.id)}, but the Soldier is safe from the Demon.`);
    else if (t.role === 'Mayor' && sober(t) && chance(MAYOR_BOUNCE)) {
      const opts = alive().filter(q => q.id !== t.id && q.id !== imp.id && isGood(q) && q.id !== protect && !(q.role === 'Soldier' && sober(q)));
      if (opts.length) { const b = pick(opts); log(`The Imp chose the Mayor (${nm(t.id)}); the kill bounced to ${nm(b.id)}.`); killAtNight(b); }
      else { log(`The Imp killed the Mayor (${nm(t.id)}).`); killAtNight(t); }
    } else { log(`The Imp (${nm(imp.id)}) killed ${nm(t.id)}.`); killAtNight(t); }
  }

  // Information, after the kills (as in the real wake order)
  G.players.filter(p => awake(p.id) && p.alive).forEach(p => {
    const br = believed(p), lie = () => !sober(p) && chance(LIE);
    if (n === 1 && (br === 'Washerwoman' || br === 'Librarian' || br === 'Investigator')) {
      const r = onePairInfo(p, { Washerwoman: 'townsfolk', Librarian: 'outsider', Investigator: 'minion' }[br]);
      say(p, r.text); noteInfo(p, r.text, r.lie, r.extra);
    }
    if (n === 1 && br === 'Chef') {
      const evil = G.players.map(q => !reg(q).good), N = evil.length;
      let k = 0; for (let i = 0; i < N; i++) if (evil[i] && evil[(i + 1) % N]) k++;
      const l = lie(); if (l) k = pick([0, 1, 2].filter(x => x !== k));
      const text = `There ${k === 1 ? 'is <b>1</b> pair' : `are <b>${k}</b> pairs`} of evil players sitting next to each other.`;
      say(p, text); noteInfo(p, text, l);
    }
    if (br === 'Empath') {
      const nb = aliveNeighbours(p);
      let k = nb.filter(q => !reg(q).good).length;
      const l = lie(); if (l) k = pick([0, 1, 2].filter(x => x !== k && x <= nb.length));
      const text = `<b>${k}</b> of your alive neighbours (${esc(list(nb.map(q => q.name)))}) ${k === 1 ? 'is' : 'are'} evil.`;
      say(p, text); noteInfo(p, text, l);
    }
    if (br === 'Fortune Teller' && c[p.id]) {
      const pair = c[p.id].map(P);
      let yes = pair.some(q => q.id === G.redHerring || reg(q, 'demon').type === 'demon');
      const l = lie(); if (l) yes = !yes;
      const names = pair.map(q => esc(q.name));
      const text = yes ? `<b>Yes</b>: one of ${names[0]} and ${names[1]} is the Demon.` : `<b>No</b>: neither ${names[0]} nor ${names[1]} is the Demon.`;
      say(p, text); noteInfo(p, text, l);
    }
    if (br === 'Undertaker' && n >= 2 && G.lastExecuted != null) {
      const q = P(G.lastExecuted), l = lie();
      const r = l ? falseCharacter(q) : reg(q).role;
      const text = `The player executed today, ${esc(q.name)}, was the <b>${esc(r)}</b>.`;
      say(p, text); noteInfo(p, text, l);
    }
    if (p.role === 'Butler' && c[p.id]) { p.master = c[p.id][0]; log(`The Butler (${nm(p.id)}) chose ${nm(p.master)} as their master.`); }
    if (p.role === 'Spy') say(p, `You see the Grimoire:${grimoireHtml()}`);
  });
  Object.keys(G.dawnInfo).forEach(id => tell(+id, G.dawnInfo[id]));
  checkTwoLeft();
  if (G.winner) dawnAnnounce(); else startPass('dawn');
}
// A Ravenkeeper (or a Drunk who thinks they are one) killed tonight who hasn't chosen yet
const ravenkeeperWaiting = p => G.pass && G.pass.kind === 'dawn' && believed(p) === 'Ravenkeeper' && G.diedTonight.includes(p.id) && !(G.rkLearned && G.rkLearned[p.id]);
function ravenkeeperLearns(p, tid) {
  const q = P(tid), l = !sober(p) && chance(LIE);
  const r = l ? falseCharacter(q) : reg(q).role;
  const text = `${esc(q.name)} is the <b>${esc(r)}</b>.`;
  (G.dawnInfo[p.id] = G.dawnInfo[p.id] || []).push(text);
  tell(p.id, [text]);
  noteInfo(p, text, l);
  (G.rkLearned = G.rkLearned || {})[p.id] = true;
}

function dawnAnnounce() {
  G.time = 'day';
  const lines = G.diedTonight.length ? G.diedTonight.map(id => `${nm(id)} died in the night.`) : ['Nobody died in the night.'];
  G.dayS = { nominators: [], nominees: [], block: null, highest: 0, events: [] };
  lines.forEach(dayEvent);
  G.lastExecuted = null;
  if (G.winner) lines.push(winLine());
  G.announce = { title: G.winner ? 'The game is over' : `Dawn of day ${G.n}`, lines, then: G.winner ? 'over' : 'day' };
  G.stage = 'announce';
}
const winLine = () => `<b>${G.winner.team === 'good' ? 'Good' : 'Evil'} wins.</b> ${G.winner.reason}`;

/* ---------- Day ---------- */
const votesNeeded = () => Math.ceil(alive().length / 2);
function dayEvent(text) { G.dayS.events.push(text); town(text); }
function toDusk(lines) {
  checkTwoLeft();
  if (G.winner) lines.push(winLine());
  G.announce = { title: G.winner ? 'The game is over' : `Dusk of day ${G.n}`, lines, then: G.winner ? 'over' : 'night' };
  G.stage = 'announce';
  U.day = null; U.timerEnd = null;
}
function execute(q) {
  G.lastExecuted = q.id;
  const line = q.alive ? `${nm(q.id)} is executed and dies.` : `${nm(q.id)} is executed, but they were already dead.`;
  town(line); log(line);
  die(q, 'execution');
  return line;
}
function nominate(a, b) {
  const d = G.dayS, nomr = P(a), nomd = P(b);
  d.nominators.push(a); d.nominees.push(b);
  if (nomd.role === 'Virgin' && nomd.alive && !nomd.used) {
    nomd.used = true;
    const r = reg(nomr, 'townsfolk');
    if (sober(nomd) && r.type === 'townsfolk') {
      log(`The Virgin (${nm(b)}) was nominated by a Townsfolk (${nm(a)}${r.spoof ? ', the Spy registering as one' : ''}).`);
      dayEvent(`${nm(a)} nominated ${nm(b)}.`);
      toDusk([`${nm(a)} nominated ${nm(b)}… and ${nm(a)} is executed immediately!`, execute(nomr)]);
      return;
    }
    log(`The Virgin (${nm(b)}) was nominated by ${nm(a)}; nothing happened${sober(nomd) ? '' : ' (the Virgin ' + why(nomd) + ')'}.`);
  }
  U.day = { mode: 'vote', a, b };
  U.hands = [];
}
function countVotes() {
  const d = G.dayS, { a, b } = U.day, k = U.hands.length, need = votesNeeded();
  U.hands.forEach(id => { const q = P(id); if (!q.alive) q.ghost = false; });
  let res;
  if (k >= need && k > d.highest) { d.block = b; d.highest = k; res = `${nm(b)} is on the block.`; }
  else if (k >= need && k === d.highest) { d.block = null; res = 'That ties the highest vote, so nobody is on the block.'; }
  else if (k < need) res = `Not enough votes (${need} needed).`;
  else res = `Not enough to beat ${d.highest}.`;
  dayEvent(`${nm(a)} nominated ${nm(b)}: ${k} ${plural(k, 'vote', 'votes')}${k ? ' (' + esc(list(U.hands.map(id => P(id).name))) + ')' : ''}. ${res}`);
  U.day = null; U.hands = [];
}
function slayerShot(a, b) {
  const s = P(a), t = P(b);
  let hit = false;
  if (s.role === 'Slayer' && !s.used) {
    s.used = true;
    const r = reg(t, 'demon');
    hit = sober(s) && t.alive && r.type === 'demon';
    log(`The Slayer (${nm(a)}) shot ${nm(b)}: ${hit ? 'hit' + (r.spoof ? ' (the Recluse registered as the Demon)' : '') : sober(s) ? 'miss' : 'nothing, as ' + why(s)}.`);
  } else log(`${nm(a)} claimed a Slayer shot at ${nm(b)}, but ${s.role === 'Drunk' ? 'is the Drunk' : s.role === 'Slayer' ? 'had already used it' : 'is not the Slayer'}.`);
  if (hit) {
    dayEvent(`${nm(a)} shot at ${nm(b)}. ${nm(b)} dies!`);
    die(t, 'slayer');
    checkTwoLeft();
    if (G.winner) { toDusk([`${nm(a)} shot at ${nm(b)}, and ${nm(b)} dies!`]); return; }
  } else dayEvent(`${nm(a)} shot at ${nm(b)}. Nothing happens.`);
  U.day = null;
}
function endDay() {
  const d = G.dayS, lines = [];
  if (d.block != null) lines.push(execute(P(d.block)));
  else {
    lines.push('Nobody is executed today.'); town('Nobody was executed.');
    const mayor = G.players.find(q => q.alive && q.role === 'Mayor' && sober(q));
    if (alive().length === 3 && mayor) win('good', 'Only three players were alive, nobody was executed, and the Mayor was alive.');
  }
  toDusk(lines);
}

/* ---------- Views ---------- */
const $app = document.getElementById('app');
function picker(ids, k, locked) {
  U.need = k;
  return `<div class="pick">${ids.map(id => { const q = P(id); return `<button class="pc ${U.sel.includes(id) ? 'on' : ''} ${q.alive ? '' : 'dead'}" data-act="sel" data-id="${id}" ${locked ? 'disabled' : ''}>${esc(q.name)}${q.alive ? '' : ' ☠'}</button>`; }).join('')}</div>`;
}
function grimoireHtml() {
  const rows = G.players.map(q => {
    const role = q.role === 'Drunk' ? `Drunk <span class="muted">(thinks they're the ${esc(q.fake)})</span>` : esc(q.role) + (q.was ? ` <span class="muted">(was ${esc(q.was)})</span>` : '');
    const tags = [
      `<span class="tag ${isGood(q) ? 'good' : 'evil'}">${isGood(q) ? 'good' : 'evil'}</span>`,
      q.alive ? '' : '<span class="tag">dead</span>',
      poisoned(q) ? '<span class="tag evil">poisoned</span>' : '',

    ].join('');

  }).join('');
  return `<table class="grim">${rows}</table><p class="hint">Demon bluffs: ${G.bluffs.map(esc).join(', ')}</p>`;
}
function inboxHtml(p) { return G.inbox[p.id].map(m => `<div class="msg">${m}</div>`).join(''); }
function reminder(p) { return `<p class="hint">You are the <b>${esc(believed(p))}</b>. ${esc(ROLES[believed(p)].text)}</p>`; }

function homeView() {
  const live = G && !G.winner;
  return `<section class="card">

}
function howView() {
  return `<section class="card">

      <li>Once everyone has had a turn, the app resolves the night in the real wake order: Poisoner, Monk, Imp, then the information characters.</li>

    <h3>Each day</h3>

      <li>Talk as usual. Start the discussion timer if you want one: it shows big enough to see from across the table, and the voice warns at one minute left.</li>
      <li><b>Nominate:</b> pick who nominates whom, then tap everyone whose hand is raised. The app counts the votes, spends ghost votes and keeps track of who is on the block. The Virgin works automatically.</li>
      <li><b>Slayer shot:</b> anyone can publicly claim a shot. It only works for the real Slayer.</li>
      <li><b>My character:</b> any player can privately re-read their character and everything they've learned.</li>
      <li><b>End the day:</b> the player on the block is executed. Saint, Scarlet Woman, Mayor and Demon wins are all checked for you.</li>

      <li>The Spy and the Recluse sometimes register as the other team.</li>

      <li>When the Imp kills themselves, the Scarlet Woman takes over if she's alive.</li>

    <h3>Text size and voice</h3>

    <p class="hint">Games are saved in this browser only. Nothing is uploaded.</p>
    <div class="row"><button class="btn" data-act="home">Back</button></div>

}

// seat(q) returns { button, attrs, cls, mark } for each player's token
function tableHtml(seat, mid) {
  const N = G.players.length, d = Math.min(23, 0.9 * 2 * Math.PI * 39 / N);
  const toks = G.players.map((q, i) => {
    const a = 2 * Math.PI * i / N - Math.PI / 2, s = seat(q), tag = s.button ? 'button' : 'div';
    // Shrink long names so each word fits on one line inside the token
    const text = s.text || q.name, longest = Math.max(3, ...text.split(/\s+/).map(w => w.length));
    const nfs = (s.text ? Math.min(d * 0.19, d * 1.05 / longest) : Math.min(d * 0.24, d * 1.4 / longest)).toFixed(2);
    const sfs = s.sub ? Math.min(d * 0.16, d * 1.25 / Math.max(4, s.sub.length)).toFixed(2) : 0;
    return `<${tag} class="tok ${s.cls || ''}" style="left:${(50 + 39 * Math.cos(a)).toFixed(2)}%;top:${(50 + 39 * Math.sin(a)).toFixed(2)}%;--nfs:${nfs}cqw;--sfs:${sfs}cqw" ${s.attrs || ''}><span class="tok-nm">${esc(text)}</span>${s.sub ? `<span class="tok-sub">${esc(s.sub)}</span>` : ''}${s.mark ? `<span class="mark">${s.mark}</span>` : ''}</${tag}>`;
  }).join('');
  return `<div class="table" style="--d:${d.toFixed(2)}cqw;--fs:${(d * 0.2).toFixed(2)}cqw">${toks}<div class="table-mid">${mid}</div></div>`;
}
function hubView() {
  const k = G.pass.kind, done = G.pass.order.filter(id => G.pass.done[id]).length, total = G.pass.order.length;
  const intro = k === 'night'
    ? (G.n === 1 ? 'Everyone closes their eyes… Pass the phone round. Tap your own name to see your character and make your choice.' : 'Pass the phone round. Tap your own name to make your choice for tonight.')
    : 'Pass the phone round again. Tap your own name to read what you learned in the night.';
  return `<section class="card">
    <h2>${k === 'night' ? `Night ${G.n}: night turns` : `Night ${G.n}: morning news`}</h2>
    <p>${intro}</p>
    <p class="hint">Glowing seats still need a turn. The ringed seat is next round the circle, but any order is fine.</p>
    ${tableHtml(q => {
      if (!G.pass.order.includes(q.id)) return { cls: 'dead', mark: '☠' };
      if (G.pass.done[q.id]) return { cls: 'done', mark: '✓' };
      return { button: true, cls: q.id === nextUp() ? 'next' : '', attrs: `data-act="turn" data-id="${q.id}" aria-label="${esc(q.name)}: take your turn"` };
    }, `<div class="mid-big">${done}/${total}</div><div class="mid-sm">${k === 'night' ? 'night turns' : 'read their news'}</div>${nextUp() != null ? `<div class="mid-sm">Next: <b>${nm(nextUp())}</b></div>` : ''}`)}

function confirmView(id, back) {

function nightTurn(p) {
  const n = G.n, br = believed(p);
  let h = inboxHtml(p) + (n === 1 ? G.info[p.id][0].lines.map(l => l.startsWith('<div') ? l : `<div class="info">${l}</div>`).join('') : reminder(p));
  const al = alive().map(q => q.id), oth = al.filter(id => id !== p.id), all = G.players.map(q => q.id);
  let need;
  if (br === 'Poisoner') need = { k: 1, ids: al, prompt: 'Choose a player to poison. They are poisoned tonight and all of tomorrow.' };
  else if (br === 'Monk' && n >= 2) need = { k: 1, ids: oth, prompt: 'Choose a player (not yourself) to protect from the Demon tonight.' };
  else if (p.role === 'Imp' && n >= 2) need = { k: 1, ids: al, prompt: 'Choose a player to kill. If you choose yourself, you die and a Minion becomes the Imp.' };
  else if (br === 'Fortune Teller') need = { k: 2, ids: all, prompt: 'Choose 2 players. In the morning you learn whether either of them is the Demon.' };
  else if (br === 'Butler') need = { k: 1, ids: oth, prompt: 'Choose your master. Tomorrow, you may only vote if they are voting too.' };
  else need = { k: 1, ids: al, prompt: 'You have nothing to do tonight. Tap any player, then Done, so nobody watching can tell who has an ability. It has no effect.' };
  return { h, need };
}
function dawnTurn(p) {
  let h = inboxHtml(p) + reminder(p), need = null;
  if (ravenkeeperWaiting(p)) {
    h += `<div class="msg">You were killed tonight. As the Ravenkeeper, you may learn one player's character.</div>`;
    need = { k: 1, ids: G.players.map(q => q.id), prompt: 'Choose a player: you learn their character.', btn: 'Learn their character' };
  }
  const lines = G.dawnInfo[p.id] || [];
  if (lines.length) h += lines.map(l => `<div class="info">${l}</div>`).join('');
  else if (!need) h += `<div class="info">Nothing for you this morning.</div>`;
  return { h, need };
}
// Seconds left before this private turn can be finished (0 once the wait is over)
function turnWait() {
  const t = U.turn;

}
function turnView() {
  const t = U.turn, p = P(t.id);

    <h2>${nm(p.id)}</h2>

function render() {
  let html = '';

  }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id != null ? +b.dataset.id : null;
  const go = () => { render(); window.scrollTo(0, 0); };
  switch (act) {
    case 'menu': U.menu = !U.menu && U.menu !== 'abandon' ? true : false; break;
    case 'home': U.view = 'home'; U.menu = false; break;
    case 'how': U.view = 'how'; U.menu = false; return go();
    case 'resume': U.view = 'game'; break;
    case 'setup': U.view = 'setup'; U.menu = false; return go();
    case 'setup-same': U.setupText = G.players.map(p => p.name).join('\n'); U.view = 'setup'; return go();
    case 'start': newGame(parseNames(U.setupText)); U.view = 'game'; sayNext('Night 1. Everyone, close your eyes.'); return go();
    case 'abandon': U.menu = 'abandon'; break;
    case 'text': prefs.text = +b.dataset.v; savePrefs(); break;
    case 'voice': prefs.voice = b.dataset.v === '1'; savePrefs(); if (prefs.voice) speak('Voice on.'); else if (canSpeak()) speechSynthesis.cancel(); break;
    case 'voice-test': speak('This is the Clockwork Storyteller.'); break;
    case 'rate': prefs.rate = +b.dataset.v; savePrefs(); voiceSample(); break;
    case 'abandon-yes': G = null; U.view = 'home'; U.menu = false; break;
    case 'turn': U.turn = { id, step: 'confirm' }; U.sel = []; return go();
    case 'hub': U.turn = null; break;
    case 'reveal':
      if (U.turn) { U.turn.step = 'show'; U.turn.shown = Date.now(); } else U.day.step = 'show';
      U.sel = []; return go();
    case 'sel':
      if (U.sel.includes(id)) U.sel = U.sel.filter(x => x !== id);
      else if (U.need === 1) U.sel = [id];
      else { U.sel.push(id); if (U.sel.length > U.need) U.sel.shift(); }
      break;
    case 'done': {
      const p = P(U.turn.id);
      if (ravenkeeperWaiting(p)) { ravenkeeperLearns(p, U.sel[0]); U.sel = []; break; }
      finishTurn(p.id, U.sel.length ? U.sel.slice() : null);
      sayNext(passComplete() ? '' : 'Thank you.');
      return go();
    }
    case 'pass-done':
      if (G.pass.kind === 'night') resolveNight(); else dawnAnnounce();
      if (G.stage === 'pass') sayNext('Morning news.'); else speakAnnounce();
      return go();
    case 'continue': {
      const t = G.announce.then;
      G.announce = null;
      if (t === 'day') G.stage = 'day';
      else if (t === 'night') { G.n++; G.time = 'night'; startPass('night'); sayNext(`Night ${G.n}. Everyone, close your eyes.`); }
      else G.stage = 'over';
      return go();
    }
    case 'nom': case 'slay': U.day = { mode: act, step: 1 }; U.sel = []; return go();
    case 'nom-next': case 'slay-next': {
      const m = U.day;
      if (m.step === 1) { m.a = U.sel[0]; m.step = 2; U.sel = []; return go(); }
      const target = U.sel[0]; U.sel = [];
      const before = G.dayS.events.length;
      if (m.mode === 'nom') nominate(m.a, target); else slayerShot(m.a, target);
      if (G.stage === 'announce') speakAnnounce(); else if (G.dayS.events.length > before) speak(G.dayS.events[G.dayS.events.length - 1]);
      return go();
    }
    case 'hand': U.hands = U.hands.includes(id) ? U.hands.filter(x => x !== id) : [...U.hands, id]; break;
    case 'count': {
      const { b: who } = U.day, k = U.hands.length;
      countVotes();
      speak(`${k} ${plural(k, 'vote', 'votes')} to execute ${P(who).name}. ${G.dayS.block === who ? `${P(who).name} is on the block.` : G.dayS.block == null && G.dayS.highest === k && k >= votesNeeded() ? 'A tie. Nobody is on the block.' : 'Not enough.'}`);
      return go();
    }
    case 'peek': U.day = { mode: 'peek', step: 'pick' }; return go();
    case 'peek-who': U.day = { mode: 'peek', step: 'confirm', id }; return go();
    case 'cancel': U.day = null; U.sel = []; return go();
    case 'end': U.day = { mode: 'end' }; return go();
    case 'end-yes': endDay(); speakAnnounce(); return go();
    case 'flip': {
      const shown = G.revealed = G.revealed || [];
      if (!shown.includes(id)) shown.push(id);
      U.revealSel = id;
      break;
    }
    case 'flip-all': G.revealed = G.players.map(q => q.id); U.revealSel = null; break;
    case 'flip-none': G.revealed = []; U.revealSel = null; break;
    case 'timer': {
      const v = b.dataset.min;
      U.timerEnd = v === 'add' ? Math.max(U.timerEnd, Date.now()) + 60000 : +v ? Date.now() + +v * 60000 : null;
      U.timerSaid = {};
      if (+v) speak(`${v} minutes on the clock.`);
      break;
    }
  }
  render();
});
setInterval(() => {
  const el = document.getElementById('timer');
  if (el) { el.textContent = timerText(); el.className = timerClass(); }
  // Spoken warnings for the discussion timer
  const left = timerLeft();
  if (left != null && G && G.stage === 'day') {
    U.timerSaid = U.timerSaid || {};
    if (left === 60 && !U.timerSaid[60]) { U.timerSaid[60] = true; speak('One minute left.'); }
    if (left === 0 && !U.timerSaid[0]) { U.timerSaid[0] = true; speak("Time's up."); }
  }
  // Count down a private turn's wait, and unlock the names and Done when it ends
  if (U.view === 'game' && G && G.stage === 'pass' && U.turn && U.turn.step === 'show' && document.querySelector('.wait')) render();
}, 1000);
render();
</script>
