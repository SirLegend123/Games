<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120708">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Shadows">
<script>document.documentElement.dataset.theme = "dark";</script>
<link rel="icon" type="image/png" href="img/shadows-icon-180.png">
<link rel="apple-touch-icon" href="img/shadows-icon-180.png">
<title>The Shadows</title>
<script>window.APP_V = 124;</script>
<script src="update.js?v=124"></script>
<script src="vendor/firebase.js"></script>
<script src="daily.js?v=124"></script>
<script src="shadows.js?v=124"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="daily.css?v=124">
<link rel="stylesheet" href="shadows.css?v=124">

</head>
<body>
<div class="wrap" id="app"><p class="hint">Opening…</p></div>
<dialog id="dlg"></dialog>
<script>
/* ---------- The Shadows: the player's app ----------
   Join with the game code, then play in your own time: talk in private, vote at the round table each evening,
   and find out at breakfast who was murdered. The Shadows also meet each night to choose their victim. */
const LKEY = "shd-player-game";
const params = new URLSearchParams(location.search);
const lastGame = (() => { try { return localStorage.getItem(LKEY) || ""; } catch (e) { return ""; } })();
// A Home Screen app always opens at the address it was saved with, which may be an old game, so it uses the last game instead
let gid = fromHomeScreen() && lastGame ? (lastGame === "none" ? "" : lastGame) : cleanCode(params.get("g")) || (lastGame === "none" ? "" : lastGame);
let G = null, me = "", SEC = null, joined = null, ready = false, loadErr = "", push = "";
let myAnswer = undefined, square = [], chats = {}, conclave = [], ghosts = [], myAct = null, gated = {}, myBallot = undefined;
const ui = { tab: "today", chat: "", draft: {}, toast: "", codeIn: "", nameIn: "" };
const subs = {}, cur = { day: 0 };
const $ = s => document.querySelector(s);
const seen = (() => { try { return JSON.parse(localStorage.getItem("shd-seen")) || {}; } catch (e) { return {}; } })();
const saveSeen = () => { try { localStorage.setItem("shd-seen", JSON.stringify(seen)); } catch (e) {} };

/* ---------- Live data ---------- */
function sub(key, target, cb) { if (subs[key]) return; subs[key] = FB.onSnapshot(target, cb, e => { console.warn(key, e.code || e); delete subs[key]; }); }
function unsub(prefix) { for (const k of Object.keys(subs)) if (k.startsWith(prefix)) { subs[k](); delete subs[k]; } }
const inConclave = () => !!(SEC && SEC.side === "shadow" && !SEC.out);
function watch() {
  sub("game", gref(gid), s => {
    if (!s.exists()) { loadErr = "There's no game with that code. Check it with your host. (Games are deleted 30 days after they end.)"; G = null; ready = true; return render(); }
    G = s.data(); ready = true; loadErr = "";
    const other = wrongApp(G, false); if (other) return location.replace(`${other}?g=${gid}${EMU ? "&emu=1" : ""}`);
    if (G.next && G.next !== gid) return switchGame(G.next);
    try { localStorage.setItem(LKEY, gid); } catch (e) {}
    const was = me;
    me = Object.keys(G.uids || {}).find(p => G.uids[p] === myUid) || "";
    if (me !== was) { unsub("sec"); unsub("chat"); unsub("conclave"); chats = {}; SEC = null; conclave = []; }
    if (!me) { FB.getDoc(gref(gid, "joins", myUid)).then(d => { joined = d.exists() ? d.data() : null; render(); }).catch(() => {}); return render(); }
    sub("sec", gref(gid, "secret", me), d => { SEC = d.exists() ? d.data() : null; watchConclave(); render(); revealSide(); revealAllies(); showOffer(); });
    if (!push) refreshPush(false);
    for (const s2 of G.seats) if (s2.id !== me) {
      const pair = pairId(me, s2.id);
      sub("chat" + pair, FB.query(gcol(gid, "chats", pair, "msgs"), FB.orderBy("at")), q => { chats[pair] = q.docs.map(x => x.data()); render(); });
    }
    sub("chat-st", FB.query(gcol(gid, "stchat", me, "msgs"), FB.orderBy("at")), q => { chats.st = q.docs.map(x => x.data()); render(); });
    const d = G.day || 0;
    if (d !== cur.day) { cur.day = d; myBallot = undefined; }
    loadBallot(); loadAct(); refreshGated(); ping();
    render();
  });
  sub("square", FB.query(gcol(gid, "square"), FB.orderBy("at", "desc"), FB.limit(300)), q => { square = q.docs.map(x => ({ id: x.id, ...x.data() })).reverse(); render(); });
}
// The Shadows' own chat, for as long as you're a Shadow still in the game
function watchConclave() {
  watchGhosts();
  if (!inConclave()) { unsub("conclave"); conclave = []; return; }
  sub("conclave", FB.query(gcol(gid, "conclave"), FB.orderBy("at")), q => { conclave = q.docs.map(x => x.data()); render(); });
}
// Once you're out of the game, the dead have a chat of their own
function watchGhosts() {
  if (!G || !me || !dead()[me]) return;
  sub("ghosts", FB.query(gcol(gid, "ghosts"), FB.orderBy("at")), q => { ghosts = q.docs.map(x => x.data()); render(); });
}
function switchGame(code) {
  for (const k of Object.keys(subs)) { subs[k](); delete subs[k]; }
  clearTimeout(gatedTimer);
  push = ""; G = null; me = ""; SEC = null; joined = null; ready = false; square = []; chats = {}; conclave = []; ghosts = []; myAct = null; gated = {}; myBallot = undefined; cur.day = 0;
  ui.tab = "today"; ui.chat = ""; ui.draft = {};
  gid = code;
  try { localStorage.setItem(LKEY, gid); } catch (e) {}
  history.replaceState(null, "", `?g=${gid}${EMU ? "&emu=1" : ""}`);
  render(true); toast("🔄 A new game has started");
  watch();
}
// Your own vote at today's round table (nobody else sees it until voting closes)
async function loadBallot() {
  const d = G.day || 0;
  if (!d || !me || myBallot !== undefined) return;
  myBallot = null;
  try { const b = await FB.getDoc(gref(gid, "days", String(d), "ballots", me)); myBallot = b.exists() ? b.data() : null; } catch (e) {}
  render();
}
async function loadAct() {
  const n = (G.day || 0) + 1;
  if (!me || !G.nights || !G.nights[n] || (myAct && myAct.n === n)) return;
  myAct = { n, pick: "", saved: false };
  try { const a = await FB.getDoc(gref(gid, "nights", String(n), "acts", me)); if (a.exists()) myAct = { n, pick: (a.data().picks || [])[0] || "", saved: true }; } catch (e) {}
  render();
}
// News that waits for its moment: breakfast, the banishment, the end of the game
let gatedTimer = 0;
async function refreshGated() {
  if (!G || !G.status || G.status === "lobby") return;
  clearTimeout(gatedTimer);
  const now = nowMs(), want = [], d = G.day || 0;
  if (d && now >= G.days[d].dawn) want.push("dawn" + d);
  if (d && now >= G.days[d].reveal) want.push("result" + d);
  for (let i = 1; i < d; i++) want.push("dawn" + i, "result" + i);
  if (G.overAt && now >= G.overAt) want.push("end");
  for (const k of want) if (!gated[k]) {
    try {
      const x = await retryDenied(() => FB.getDoc(gref(gid, "gated", k)));
      if (x.exists()) { const v = x.data(); if (k.startsWith("result")) v.deaths = v.exec ? [{ pid: v.exec, how: "banished", d: v.d }] : []; gated[k] = v; watchGhosts(); render(); revealBanished(); }
    } catch (e) { /* not yet */ }
  }
  const missing = want.some(k => !gated[k]);
  const due = [d && G.days[d].dawn, d && G.days[d].reveal, G.overAt].filter(t => t && t > nowMs());
  const next = missing ? 4000 : due.length ? Math.min(...due) - nowMs() + 1500 : 0;
  if (next) gatedTimer = setTimeout(refreshGated, Math.min(next, 2 ** 31 - 1));
}

/* ---------- Helpers ---------- */
function toast(t) { ui.toast = t; render(true); clearTimeout(toast.h); toast.h = setTimeout(() => { ui.toast = ""; render(true); }, 3500); }
async function run(fn, done) {
  try { await retryDenied(fn); if (done) toast(done); }
  catch (e) { console.error(e); toast("⚠️ " + (e.code === "permission-denied" ? "That's closed now." : e.message || e)); }
}
const nm = pid => esc(seatName(G, pid));
const P = () => phaseOf(G);
const dead = () => deadNow(G, gated);
const amOut = () => !!dead()[me];
const mySide = () => SEC && SEC.side;
// Sides everyone knows: the banished, revealed at the round table
const revealed = () => { const out = {}; for (const [k, v] of Object.entries(gated)) if (k.startsWith("result") && v && v.exec) out[v.exec] = v.side; return out; };
const infoNow = () => ((SEC && SEC.info) || []).filter(x => x.at <= nowMs()).sort((a, b) => b.at - a.at);
const chatKey = pid => pid === "st" || pid === "conclave" || pid === "ghosts" ? pid : pairId(me, pid);
const msgsOf = k => k === "conclave" ? conclave : k === "ghosts" ? ghosts : chats[k] || [];
const unreadChat = k => msgsOf(k).filter(m => m.from !== me && m.at > (seen[gid + k] || 0)).length;
const unreadInfo = () => infoNow().filter(x => x.at > (seen[gid + "info"] || 0)).length;
const unreadSquare = () => square.filter(m => m.at > (seen[gid + "sq"] || 0) && m.pid !== me).length;
const roundTable = p => p.k === "vote";
const needsVote = p => roundTable(p) && p.n === G.day && !amOut() && myBallot === null;

/* ---------- Screens ---------- */
let pending = false;
function render(force) {
  const a = document.activeElement;
  if (!force && a && a.closest && a.closest("#app") && a.matches("input[type=text], textarea")) { pending = true; return; }
  pending = false;
  markSeen();
  const feed = $("#feed"), atBottom = feed && feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40, y = window.scrollY;
  $("#app").innerHTML = `<header><h1><img class="title-img" src="img/title-the-shadows.webp?v=124" alt="The Shadows" width="${TITLE_W}" height="150" style="height:var(--title-h, 44px);width:auto;max-width:100%;display:block"></h1>
    <span class="head-btns">${G && G.sched ? `<button class="btn" data-act="cal" aria-label="Add the timetable to your calendar">📅</button>` : ""}<button class="btn" data-act="rules" aria-label="How to play">📜<span class="lbl"> How to play</span></button></span></header>
    ${body()}<footer class="brand"><span>An unofficial, fan-made party game. <a href="privacy.html">Privacy notice</a></span></footer>${ui.toast ? `<div class="toast" role="status">${esc(ui.toast)}</div>` : ""}`;
  window.scrollTo(0, y);
  const f = $("#feed"); if (f && (atBottom || !feed)) f.scrollTop = f.scrollHeight;
}
const TITLE_W = 544;
document.addEventListener("focusout", () => setTimeout(() => { if (pending) render(); }, 0));
function markSeen() {
  if (!G || !me) return;
  let ch = false;
  const mark = (k, v) => { if (v && v > (seen[gid + k] || 0)) { seen[gid + k] = v; ch = true; } };
  if (ui.tab === "chats" && ui.chat) { const k = chatKey(ui.chat), l = msgsOf(k); mark(k, l.length ? l[l.length - 1].at : 0); }
  if (ui.tab === "square" && square.length) mark("sq", square[square.length - 1].at);
  if (ui.tab === "me") { const i = infoNow(); if (i.length) mark("info", i[0].at); }
  if (ch) saveSeen();
}
function body() {
  if (!gid) return `<div class="centre-page">${joinCodeHtml()}</div>`;
  if (loadErr) return `<section class="card"><p class="err">${esc(loadErr)}</p><div class="row"><button class="btn" data-act="other-game">Enter another code</button></div></section>`;
  if (!ready) return `<p class="hint">Finding the game…</p>`;
  if (!me) return `<div class="centre-page">${joinNameHtml()}</div>`;
  if (G.status === "lobby" || !SEC) return `<div class="centre-page">${waitHtml()}</div>`;
  return gameHtml();
}
const crest = `<img class="shd-logo" src="img/shadows-logo.webp" alt="" width="600" height="600">`;

/* ---------- Joining ---------- */
const homeTipHtml = () => !isIOS() || fromHomeScreen() ? "" : `<section class="card home-tip">${gid && G ? `<h2>📲 Already on your Home Screen?</h2>
    <p class="lead">A QR code always opens Safari. Open <b>The Shadows</b> from your Home Screen instead, tap <b>🎲 Join a different game</b>, and enter this code:</p>
    <div class="row"><span class="code">${gid}</span><button class="btn small" data-act="copy-code">📋 Copy</button></div>
    <h3>Not on your Home Screen yet?</h3>` : `<h2>📲 Want it on your Home Screen?</h2>`}
    <p class="lead">Do it <b>now</b>, before you join:</p>
    <ol class="steps"><li>Tap <b>Share</b> <span aria-hidden="true">(the square with an arrow ⬆️)</span></li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b></li><li>Open <b>The Shadows</b> from your Home Screen and join there</li></ol>
    <p class="hint">If you join here first and add it afterwards, the Home Screen app won't know who you are. Happy to stay in Safari? Just join below.</p></section>`;
function joinCodeHtml() {
  return `<section class="card">${crest}<h2>Welcome to The Shadows</h2>
    <p class="lead">A game of murder and suspicion that runs over several days. Shadows hide amongst the Guests: can you find them before they get you? You play on this phone, in your own time.</p>
    <div class="field"><span class="label">Game code</span><input type="text" id="code" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="e.g. K7QM2X" value="${esc(ui.codeIn)}"></div>
    <div class="row"><button class="btn primary" data-act="go-code">Find the game →</button></div>
    </section>${homeTipHtml()}`;
}
function joinNameHtml() {
  if (joined) return `<section class="card"><div class="big-ico">⏳</div><h2>${esc(G.name)}</h2>
    <p class="lead">Thanks, ${esc(joined.name)}. The host will give you a seat soon.</p>
    <p class="hint">Keep this page open, or come back to it later on this phone. Game code <b>${gid}</b>.</p>
    <div class="row"><button class="btn small" data-act="other-game">Not your game?</button></div></section>`;
  return `${homeTipHtml()}<section class="card">${crest}<h2>${esc(G.name)}</h2>
    <p class="lead">You've found the game. What's your name?</p>
    <div class="field"><span class="label">Your name</span><input type="text" id="name" maxlength="30" autocomplete="given-name" value="${esc(ui.nameIn)}"></div>
    <div class="row"><button class="btn primary" data-act="join">Join the game</button><button class="btn small" data-act="other-game">Not your game?</button></div>
    <p class="hint">If you've played in this game on another phone, join with the same name: the host will move your seat to this phone.</p>
    <p class="hint">🔒 Your name, and what you do in the game, are kept until the game is deleted (30 days after it ends). <a href="privacy.html">Privacy notice</a></p></section>`;
}
function waitHtml() {
  return `${pushCardHtml()}<section class="card"><div class="big-ico">🕯️</div><h2>${esc(G.name)}</h2>
    <p class="lead">You're in, ${nm(me)}. The host will choose the Shadows soon: you'll find out here which side you're on.</p>
    <p class="hint">${plural(G.seats.length, "player")} seated so far.</p>
    <div class="row"><button class="btn small" data-act="other-game">🎲 Not this game? Join a different one</button></div></section>
    ${timetableHtml()}`;
}
function timetableHtml() {
  const s = G.sched, t = G.days && G.days[G.day];
  return `<section class="card"><h2>⏰ Each day</h2>
    <ul class="tt">${(K => K.map(([k, ic, label, sub], i) => { const at = t ? t[k] : null, now = nowMs(), nextAt = t && i < K.length - 1 ? t[K[i + 1][0]] : Infinity;
      return `<li class="${at && now >= at ? (now < nextAt ? "now" : "past") : ""}"><b>${t ? clock(at) : s[k]}</b><span>${ic}</span><span>${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ""}</span></li>`; }).join(""))(SCHED_KEYS.filter(([k]) => t ? t[k] : s[k]))}</ul>
    <div class="row"><button class="btn small" data-act="cal">📅 Add to my calendar</button></div>
    <p class="hint">Between breakfast and the round table, private chats only: that's when alliances are made. The dead have their own chat.</p></section>`;
}

/* ---------- The game ---------- */
function gameHtml() {
  const p = P();
  const chatDot = unreadChat("st") > 0 || (inConclave() && unreadChat("conclave") > 0) || (amOut() && unreadChat("ghosts") > 0) || G.seats.some(s => s.id !== me && unreadChat(pairId(me, s.id)) > 0);
  const tabs = [["today", "🏠", "Today", unreadInfo() > 0], ["square", "🗣️", "Table", unreadSquare() > 0], ["chats", "✉️", "Chats", chatDot], ["vote", "🗳️", "Vote", needsVote(p)], ["me", mySide() === "shadow" ? "🗡️" : "🕯️", "Me", false]];
  const nav = `<nav class="tabs bottom">${tabs.map(([k, ic, l, dot]) => `<button data-act="tab" data-tab="${k}" aria-pressed="${ui.tab === k}"><span class="ti" aria-hidden="true">${ic}</span> <span>${l}</span>${dot ? `<span class="dot" aria-label="new"></span>` : ""}</button>`).join("")}</nav>`;
  return `${bannerHtml(p)}${nav}${{ today: todayHtml, square: squareHtml, chats: chatsHtml, vote: voteHtml, me: meHtml }[ui.tab](p)}`;
}
function bannerHtml(p) {
  const dark = ["night", "dark", "wait"].includes(p.k);
  const what = {
    night: myMurder(p) ? "The Shadows meet: choose who to murder." : "Sleep tight, and lock your door.",
    dark: "The host is working out the night.", dawn: "Breakfast is served.", chats: `Private chats only, until the round table at ${G.days[G.day] ? clock(G.days[G.day].noms) : G.sched.noms}. Who do you trust?`,
    noms: "The round table: discuss with everyone. Private chats are closed.", vote: trustDay(G, G.day) ? "The trust vote: who do you trust most?" : "Voting: banish the player you suspect.", count: "The votes are being counted.", dusk: "Night falls soon.", over: "", wait: "", lobby: ""
  }[p.k];
  const till = isFinite(p.to) ? `Until ${when(p.to)} · ${left(p.to)} left` : p.k === "dark" ? `Breakfast is usually at ${G.sched.dawn}` : "";
  return `<section class="banner ${dark ? "dark" : ""}"><span class="ph">${phaseGold(shownPhase(G, p))}</span>${till ? `<span class="till">${till}</span>` : ""}${what ? `<span>${what}</span>` : ""}</section>`;
}
// A Shadow still in the game chooses a victim at night (once today's banishment is known)
const myMurder = p => p.k === "night" && inConclave() && !amOut();
const waitingForResult = () => !!(G.day && !gated["result" + G.day] && !G.overAt);
function todayHtml(p) {
  const out = [];
  if (p.k === "over") out.push(overHtml());
  out.push(pushCardHtml());
  if (myMurder(p) && waitingForResult()) out.push(`<section class="card"><p class="lead">🗡️ The Shadows meet once the host has revealed today's banishment. Check back soon.</p></section>`);
  else if (myMurder(p)) out.push(murderHtml(p));
  const o = myOffer();
  if (o) out.push(`<section class="card ${myAnswer ? "" : "todo"}"><h2>${MODES[o.type].ic} The Shadows' offer</h2><p class="lead">${myAnswer ? (myAnswer.answer === "accept" ? "You accepted. The host will confirm it before breakfast." : "You refused.") : nowMs() < o.until ? `You have until ${when(o.until)} to decide.` : "The time to decide has passed."}</p>
    ${!myAnswer && nowMs() < o.until ? `<div class="row"><button class="btn primary" data-act="offer-open">Decide now</button></div>` : ""}</section>`);
  const d = G.day || 0, bk = gated["dawn" + d], res = gated["result" + d];
  if (res && ["dusk", "night", "dark", "over"].includes(p.k)) out.push(resultHtml(res));
  if (d && bk && ["dawn", "chats", "noms", "vote", "count", "dusk", "night", "dark"].includes(p.k)) out.push(breakfastHtml(bk));
  if (d && !bk && nowMs() >= G.days[d].dawn) out.push(`<section class="card"><p class="hint">Fetching the news from the night…</p></section>`);
  if (p.k === "dusk" && !res) out.push(`<section class="card"><p class="lead">The host is still counting the votes. Check back soon.</p></section>`);
  if (d && (p.k === "chats" || p.k === "dawn") && p.n === d && !amOut()) { const t = G.days[d] || {};
    if (t.task === "whisper") out.push(whisperCardHtml(d));
    if (t.task === "combination") out.push(comboCardHtml(d));
    if (t.task === "lanterns") out.push(lanternsCardHtml(d));
    if (t.task === "dayoff") out.push(`<section class="card"><h2>🌤️ A day off</h2><p class="lead">No task today. Relax, chat, and enjoy the castle.</p></section>`);
    if (t.mission || (mySide() === "shadow" && SEC.mission && SEC.mission.d === d)) out.push(missionCardHtml(d)); }
  const trust = trustDay(G, d);
  if (roundTable(p) && p.n === d && !amOut()) out.push(`<section class="card ${myBallot === null ? "todo" : ""}"><h2>🗳️ ${trust ? "The trust vote is open" : "Voting is open"}</h2>
    <p class="lead">${myBallot ? `You've voted for <b>${nm(myBallot.of)}</b>. You can change your vote until ${when(G.days[d].close)}.` : trust ? `Who do you trust most? The winner gets a shield tonight. Vote before ${when(G.days[d].close)}.` : `Vote to banish the player you suspect, before ${when(G.days[d].close)}.`}</p>
    <div class="row"><button class="btn ${myBallot ? "" : "primary"}" data-act="tab" data-tab="vote">🗳️ ${myBallot ? "See your vote" : "Vote now"}</button></div></section>`);
  if (d && p.k === "chats" && p.n === d) out.push(`<section class="card"><p class="lead">🤫 Private chats are open until ${when(G.days[d].noms)}, when the round table begins.</p></section>`);
  if (tableOpen(p) && p.n === d) out.push(`<section class="card todo"><h2>🗣️ The round table</h2><p class="lead">Discuss with everyone until ${when(G.days[d].vote)}, when voting begins.</p>
    <div class="row"><button class="btn primary" data-act="tab" data-tab="square">🗣️ Join the discussion</button></div></section>`);
  const fresh = infoNow().filter(x => x.at >= (d ? G.days[d].dawn : 0) - 1);
  if (fresh.length) out.push(`<section class="card"><h2>📜 From the host</h2>${fresh.map(infoHtml).join("")}<p class="hint">Everything you've been told is under Me.</p></section>`);
  if (unreadInfo()) { seen[gid + "info"] = infoNow()[0].at; saveSeen(); }
  out.push(castleHtml(), timetableHtml());
  return out.join("");
}
// The Shadows' mission: the code phrase (and, for Guests, the chance to catch it)
function missionCardHtml(d) {
  const t = G.days[d], M = SEC.mission || {}, w = SEC.whisper && SEC.whisper.d === d ? SEC.whisper : null;

// Today's task: the Combination. You hold one digit; share in private chats, then enter the whole code.

// Today's task: the Whisper. Pass it on once, to someone who hasn't had it; it must go round everyone and back to the start.

  if (t.wfail) return `${head}<p class="warn">The Whisper has failed: someone was sent it for the third time. No shield today.</p></section>`;
  if (w && w.start === true && w.final) return `${head}<p class="lead">The whisper has come back to you. You started it with:</p><p class="quote">“${esc(w.phrase)}”</p>

    <p class="lead">${w.changed ? "🔎 <b>It has changed.</b> Only you know. What will you tell the round table?" : "✅ It came back unchanged."}</p></section>`;

  if (w.out) return `${head}<p class="warn">You said the whisper again, so you're out of the running for the shield.</p>${rules}</section>`;
  if (w.passedTo) return `${head}<p class="lead">You passed it to <b>${nm(w.passedTo)}</b>${w.added ? `, with “${esc(w.added)}” added` : ""}. Now don't say it again!</p>${rules}</section>`;

    <p class="hint">This sends the whisper to them in your private chat.</p>${rules}</section>`;

/* ---------- Notifications ---------- */

  try { push = await pushSubscribe("player", me, ask); } catch (e) { console.warn("push", e); push = "error"; }
  render(true);
  if (ask && push === "on") toast("🔔 Notifications are on");
}

  }
});
document.getElementById("app").addEventListener("input", e => {
  const el = e.target;
  if (el.id === "say") ui.draft.sq = el.value;
  if (el.id === "dm") ui.draft[chatKey(ui.chat)] = el.value;
  if (el.id === "code") ui.codeIn = el.value;
  if (el.id === "name") ui.nameIn = el.value;
  if (el.id === "why") ui.draft.why = el.value;
  if (el.id === "wtext") ui.wtext = el.value;
  if (el.id === "combo") ui.combo = el.value;
});
document.getElementById("app").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && (e.target.id === "dm" || e.target.id === "say")) { e.preventDefault(); e.target.closest(".send").querySelector("button").click(); }
  if (e.key === "Enter" && e.target.id === "code") $("[data-act=go-code]").click();
  if (e.key === "Enter" && e.target.id === "name") $("[data-act=join]").click();
});

/* ---------- Start ---------- */
// Let the host see when you were last here (at most every few minutes)
let lastPing = 0;
function ping(force) {
  if (!G || !me || document.visibilityState !== "visible" || (!force && nowMs() - lastPing < 4 * 60000)) return;
  lastPing = nowMs();
  FB.setDoc(gref(gid, "joins", myUid), { seen: nowMs() }, { merge: true }).catch(() => {});
}
setInterval(() => { if (G) { refreshGated(); loadAct(); loadBallot(); ping(); } render(); }, 20000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && G) { refreshGated(); ping(true); render(); } });
fbStart().then(() => { if (gid) watch(); else render(); }).catch(e => { loadErr = "Couldn't connect: " + (e.message || e); ready = true; render(); });
