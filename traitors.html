<style>
/* The Traitors, played online: a castle screen shared on a video call, and every player on their own phone.
   Same palette as the Clocktower apps. */
:root {
  --bg: #15121b; --surface: #211c29; --surface-2: #2b2534; --line: #3b3346;
  --fg: #ece6f2; --muted: #a69cb3; --brass: #d4ab55; --parch: #efe4c9; --parch-ink: #2a2118;
  --faithful: #4c8ce4; --traitor: #d8435a; --cloak: #8e1428;
  --ok: #3aa35c; --warn: #e3a53c;
  --felt: radial-gradient(circle at 50% 0%, #2c2436 0%, #1b1622 55%, #15121b 100%);
  --font-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f1eef4; --surface: #ffffff; --surface-2: #f4f0f7; --line: #dcd4e3;
    --fg: #231d2b; --muted: #6c6278; --brass: #94701f;
    --faithful: #2463c2; --traitor: #be2a42; --cloak: #8a1428; --ok: #2a9150; --warn: #b7791f;
    --felt: radial-gradient(circle at 50% 0%, #ffffff 0%, #ebe5f0 60%, #e2dbe9 100%);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f1eef4; --surface: #ffffff; --surface-2: #f4f0f7; --line: #dcd4e3;
  --fg: #231d2b; --muted: #6c6278; --brass: #94701f;
  --faithful: #2463c2; --traitor: #be2a42; --cloak: #8a1428; --ok: #2a9150; --warn: #b7791f;
  --felt: radial-gradient(circle at 50% 0%, #ffffff 0%, #ebe5f0 60%, #e2dbe9 100%);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); background-image: var(--felt); background-attachment: fixed; color: var(--fg); font-family: var(--font-body); font-size: 1rem; line-height: 1.45; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.bar { display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { font-family: var(--font-display); font-weight: 400; font-size: 1.45rem; color: var(--brass); margin: 0; line-height: 1; margin-right: auto; }
.phase { font-weight: 800; font-size: .9rem; color: var(--muted); white-space: nowrap; }
@media (max-width: 420px) { .brand { font-size: 1.15rem; } }
.wrap { max-width: 640px; margin: 0 auto; padding: 14px 16px 48px; display: grid; gap: 14px; }
.wrap.castle { max-width: 1100px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 700; min-height: 48px; }
.btn:hover { border-color: var(--brass); }
.btn.primary { background: var(--brass); color: #1a1408; border-color: var(--brass); }
.btn.sm { padding: 5px 11px; min-height: 36px; font-size: .88rem; }
.btn.danger { color: var(--traitor); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.row > .grow { flex: 1; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; line-height: 1.1; color: var(--brass); text-wrap: balance; }
.card h3 { margin: 4px 0 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.card p { margin: 0; }
.hint { color: var(--muted); font-size: .92rem; }
.center { text-align: center; }
.kicker { color: var(--muted); text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; font-weight: 800; margin: 0; }
.title { font-family: var(--font-display); font-weight: 400; color: var(--brass); font-size: clamp(2rem, 9vw, 3rem); line-height: 1; margin: 0; }
input[type="text"], textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 48px; width: 100%; }
.code-input { text-transform: uppercase; letter-spacing: .3em; font-weight: 800; font-size: 1.4rem; text-align: center; }
.set { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 6px 0; border-top: 1px solid var(--line); }
.set > span { font-weight: 700; margin-right: auto; }
.set small { display: block; color: var(--muted); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface-2); padding: 8px 12px; min-height: 40px; font-weight: 700; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--brass); color: #1a1408; }

.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.pick button { min-height: 56px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); font-weight: 800; padding: 8px; overflow-wrap: anywhere; }
.pick button[aria-pressed="true"] { border-color: var(--brass); background: color-mix(in srgb, var(--brass) 22%, var(--surface-2)); }
.pick button small { display: block; font-weight: 600; color: var(--muted); font-size: .78rem; }
.pick button:disabled { cursor: default; opacity: .55; }

.role { border-radius: 16px; padding: 22px 16px; text-align: center; display: grid; gap: 8px; color: #fff; }
.role.faithful { background: linear-gradient(160deg, color-mix(in srgb, var(--faithful) 85%, #000) 0%, color-mix(in srgb, var(--faithful) 55%, #000) 100%); }
.role.traitor { background: linear-gradient(160deg, var(--traitor) 0%, var(--cloak) 100%); }
.role .rname { font-family: var(--font-display); font-size: clamp(2.4rem, 12vw, 4rem); line-height: 1; }
.role p { margin: 0; }
.role .kicker { color: #fff; opacity: .8; }
.tag { display: inline-block; font-weight: 800; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 99px; }
.tag.faithful { background: color-mix(in srgb, var(--faithful) 20%, transparent); color: var(--faithful); }
.tag.traitor { background: color-mix(in srgb, var(--traitor) 20%, transparent); color: var(--traitor); }
.tag.out { background: var(--surface-2); color: var(--muted); }
.tag.ok { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }

.list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); flex-wrap: wrap; }
.list li b { margin-right: auto; overflow-wrap: anywhere; }
.list li.out { opacity: .55; }
.list li.new { animation: arrive .5s ease-out; }
@keyframes arrive { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .list li.new, .ballot { animation: none; } }
.big-news { font-family: var(--font-display); font-size: clamp(1.8rem, 6vw, 3rem); line-height: 1.1; text-align: center; margin: 6px 0; text-wrap: balance; }
.big-news.bad { color: var(--traitor); }
.ballot { text-align: center; display: grid; gap: 4px; padding: 18px; border-radius: 14px; background: var(--parch); color: var(--parch-ink); animation: arrive .4s ease-out; }
.ballot .slate { font-family: var(--font-display); font-size: clamp(2.2rem, 8vw, 4rem); line-height: 1; }
.tally { display: grid; gap: 6px; }
.tally div { display: grid; grid-template-columns: minmax(0, 9em) 1fr auto; gap: 8px; align-items: center; font-weight: 700; }
.tally span.b { height: 14px; border-radius: 7px; background: var(--brass); min-width: 4px; }
.gold { color: var(--brass); font-weight: 800; }
.big-timer { text-align: center; font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size: clamp(4rem, 18vw, 9rem); line-height: 1; color: var(--brass); }
.big-timer.low { color: var(--warn); }
.big-timer.up { color: var(--traitor); }
.banner { text-align: center; padding: 26px 16px; border-radius: 16px; color: #fff; display: grid; gap: 6px; }
.banner.faithful { background: linear-gradient(160deg, var(--faithful), color-mix(in srgb, var(--faithful) 45%, #000)); }
.banner.traitors { background: linear-gradient(160deg, var(--traitor), var(--cloak)); }
.banner .title, .banner .kicker { color: #fff; }
.hist { display: grid; gap: 4px; font-size: .95rem; }
.hist p { margin: 0; }
.secret { border: 1px solid var(--traitor); border-radius: 12px; padding: 10px 12px; background: color-mix(in srgb, var(--traitor) 10%, var(--surface)); display: grid; gap: 4px; }
.secret.seer { border-color: var(--faithful); background: color-mix(in srgb, var(--faithful) 10%, var(--surface)); }
.secret p { margin: 0; }
.chat { display: grid; gap: 6px; max-height: 40vh; overflow-y: auto; }
.chat p { margin: 0; background: var(--surface-2); border-radius: 10px; padding: 6px 10px; overflow-wrap: anywhere; }
.chat p b { color: var(--traitor); }
.gallery { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.gallery li { background: var(--parch); color: var(--parch-ink); border-radius: 10px; padding: 14px 10px; text-align: center; font-weight: 800; font-family: var(--font-display); font-size: 1.15rem; }
.status { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: .85rem; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
.dot.on { background: var(--ok); }
.dot.off { background: var(--traitor); }

/* The castle screen is shared on a video call: everything bigger */
.castle .card { padding: 22px; }
.castle .card h2 { font-size: clamp(1.8rem, 3.6vw, 2.6rem); }
.castle .list li { font-size: 1.15rem; padding: 10px 14px; }
.castle-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .castle-grid { grid-template-columns: minmax(0, 1fr); } }
.joincode { font-family: var(--font-display); font-size: clamp(3rem, 12vw, 6rem); letter-spacing: .12em; color: var(--brass); line-height: 1; text-align: center; }
.qr { width: min(240px, 70%); margin: 0 auto; background: #fff; border-radius: 12px; padding: 8px; }
.qr svg { display: block; width: 100%; height: auto; }
.joinurl { font-weight: 700; text-align: center; overflow-wrap: anywhere; user-select: all; }
.waitlist { display: flex; flex-wrap: wrap; gap: 6px; }
.waitlist span { background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; font-weight: 700; }
.waitlist span.done { border-color: var(--ok); color: var(--ok); }

.sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.5); display: grid; place-items: end center; }
@media (min-width: 640px) { .sheet-back { place-items: center; } }
.sheet { width: min(560px, 100%); max-height: min(88vh, 900px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }
@media (min-width: 640px) { .sheet { border-radius: 16px; } }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; color: var(--brass); font-size: 1.45rem; margin-right: auto; }
.sheet h3 { margin: 6px 0 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.sheet p, .sheet ul { margin: 0; }
.sheet ul { padding-left: 1.2em; display: grid; gap: 4px; }
footer.note { text-align: center; color: var(--muted); font-size: .8rem; }
</style>
</head>

const rnd = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function say(t) {
  if (!prefs.voice || !('speechSynthesis' in window)) return;

// Testing hook: ?peerhost=localhost&peerport=9000 points the game at a local connection server instead of the public one
const params = new URLSearchParams(location.search);
function peerOptions() {
  const host = params.get('peerhost');
  return host ? { host, port: +(params.get('peerport') || 9000), path: params.get('peerpath') || '/', secure: false, debug: 0 } : { debug: 0 };
}
function joinLink(code) {
  const u = new URL(location.href.split('#')[0]);
  ['join', 'host'].forEach(k => u.searchParams.delete(k));

/* ---------- Messages from phones ---------- */
function onPlayerMessage(conn, msg) {
  if (!msg || typeof msg !== 'object') return;
  if (msg.t === 'hello') {
    const token = String(msg.token || '').slice(0, 64), name = String(msg.name || '').trim().replace(/\s+/g, ' ').slice(0, 20);
    let i = H.players.findIndex(p => p.token === token);
    if (i < 0) {
      if (H.phase !== 'lobby') return conn.send({ t: 'error', text: 'This game has already started. Only players who joined before the start can rejoin.' });
      if (!name) return conn.send({ t: 'error', text: 'Type your name to join.' });
      if (H.players.some(p => p.name.toLowerCase() === name.toLowerCase())) return conn.send({ t: 'error', text: `Someone called ${name} has already joined. Add an initial to make your name different.` });
      if (H.players.length >= MAX_PLAYERS) return conn.send({ t: 'error', text: `The castle is full (${MAX_PLAYERS} players).` });
      H.players.push({ name, token, role: null, alive: true, out: null, clues: [] });
      i = H.players.length - 1;
      say(`${name} has arrived at the castle.`);
    }
    conn.token = token;
    conns[token] = conn;
    update();
    return;
  }
  const i = H.players.findIndex(p => p.token === conn.token);
  if (i < 0) return;
  if (msg.t === 'act') answer(i, msg.kind, msg.value);
  else if (msg.t === 'chat' && H.phase === 'night' && H.night && H.night.stage === 'meeting' && inMeeting(i)) {
    const text = String(msg.text || '').trim().slice(0, 200);
    if (text) { H.chat.push({ from: i, text, day: H.day }); update(); }
  }
}
// After every change: save, redraw the castle, and send each connected phone its own view
function update() {
  saveCastle();
  render();
  H.players.forEach((p, i) => { const c = conns[p.token]; if (c && c.open) try { c.send({ t: 'view', v: viewFor(i) }); } catch (e) {} });
}

/* ---------- Connection: the castle side ---------- */
let peer = null, castleNet = 'connecting';
function openCastle() {
  if (peer) try { peer.destroy(); } catch (e) {}
  castleNet = 'connecting'; render();
  if (typeof Peer !== 'function') { castleNet = 'failed'; return render(); }
  peer = new Peer(PREFIX + H.code, peerOptions());
  peer.on('open', () => { castleNet = 'open'; render(); });
  peer.on('connection', conn => {
    conn.on('data', msg => onPlayerMessage(conn, msg));
    conn.on('close', () => { if (conns[conn.token] === conn) delete conns[conn.token]; render(); });
    conn.on('error', () => {});
  });
  peer.on('disconnected', () => { castleNet = 'connecting'; render(); setTimeout(() => { try { peer.reconnect(); } catch (e) {} }, 2000); });
  peer.on('error', err => {
    // After a refresh, the service may still hold the old address for a few seconds
    if (err && err.type === 'unavailable-id') { castleNet = 'connecting'; render(); setTimeout(openCastle, 4000); }
    else if (err && (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error' || err.type === 'socket-closed')) { castleNet = 'connecting'; render(); setTimeout(openCastle, 4000); }
  });
}

function historyHtml() {
  const nm = i => esc(nameOf(i));
  const days = H.days.map(d => {
    const bits = [];
    if (d.murdered != null) bits.push(`<p>☠ ${nm(d.murdered)} was murdered in the night.</p>`);
    if (d.mission) bits.push(`<p>⚔ ${esc(MISSION_KINDS[d.mission.kind].name)} earned ${money(d.mission.gold)}${d.mission.shields.length ? `; ${d.mission.shields.map(nm).join(' and ')} took the Shield` : ''}${d.mission.tookGold.length ? `; ${d.mission.tookGold.map(nm).join(' and ')} chose gold` : ''}.</p>`);
    d.seers.forEach(x => bits.push(`<p>👁 ${nm(x.who)} was a Seer. Their clue: ${esc(clueText(x.clue))}</p>`));
    d.votes.forEach(v => bits.push(`<p>🗳 ${v.round > 1 ? 'Revote' : 'Votes'}: ${v.ballots.map(([a, b]) => `${nm(a)}→${nm(b)}`).join(', ')}</p>`));
    d.endVotes.forEach(ev => bits.push(`<p>🔥 Fire pit: ${ev.map(([a, c]) => `${nm(a)} ${c ? 'end' : 'banish'}`).join(', ')}</p>`));
    if (d.banished) bits.push(`<p>🚪 ${nm(d.banished.who)} was banished${d.banished.secret ? ' (role kept secret)' : ''}: ${d.banished.role === 'traitor' ? `<b style="color:var(--traitor)">${d.banished.st ? 'Secret Traitor' : 'Traitor'}</b>` : 'Faithful'}.</p>`);
    if (d.shortlist) bits.push(`<p class="hint">The Secret Traitor's shortlist: ${[d.shortlist.r ? `recruit from ${d.shortlist.r.map(nm).join(', ')}` : '', d.shortlist.m ? `murder from ${d.shortlist.m.map(nm).join(', ')}` : ''].filter(Boolean).join('; ')}.</p>`);
    if (d.recruited != null) bits.push(`<p>🗝 ${nm(d.recruited)} accepted the Traitors' offer.</p>`);
    if (d.refused != null) bits.push(`<p>🗝 ${nm(d.refused)} refused to join the Traitors${d.refusedDied ? ' and was murdered for it' : ''}.</p>`);

/* ---------- Connection: the phone side ---------- */
let ppeer = null, pconn = null, retryT = null;
function openPlayer() {
  clearTimeout(retryT);
  if (typeof Peer !== 'function') { pnet = 'failed'; return render(); }
  if (!ppeer || ppeer.destroyed) {
    ppeer = new Peer(undefined, peerOptions());
    ppeer.on('open', connectToCastle);
    ppeer.on('error', err => { pnet = err && err.type === 'peer-unavailable' ? 'nocastle' : 'connecting'; if (err && err.type === 'peer-unavailable') V = null; render(); retry(); });
    ppeer.on('disconnected', () => { setTimeout(() => { try { ppeer.reconnect(); } catch (e) {} }, 2000); });
  } else if (ppeer.open) connectToCastle();
  else retry();
}
function connectToCastle() {
  if (pconn) try { pconn.close(); } catch (e) {}
  pconn = ppeer.connect(PREFIX + ME.code, { reliable: true });
  pconn.on('open', () => { pnet = 'open'; pconn.send({ t: 'hello', name: ME.name, token: ME.token }); render(); });
  pconn.on('data', msg => {
    if (msg && msg.t === 'view') { V = msg.v; render(); }
    else if (msg && msg.t === 'error') { homeError = msg.text; mode = 'home'; V = null; try { pconn.close(); ppeer.destroy(); } catch (e) {} ppeer = null; render(); }
  });
  pconn.on('close', () => { if (mode !== 'player') return; pnet = 'connecting'; render(); retry(); });
  pconn.on('error', () => {});
}
function retry() { clearTimeout(retryT); if (mode === 'player') retryT = setTimeout(() => { if (!pconn || !pconn.open) openPlayer(); }, 3000); }
function send(kind, value) { if (pconn && pconn.open) pconn.send({ t: 'act', kind, value }); }

/* ---------- Menu ---------- */

  if (menu === 'rules') return `<div class="row"><h2>How to play</h2><button class="btn sm" data-act="menu">‹ Back</button><button class="btn sm" data-act="close" aria-label="Close">✕</button></div>
    <ul>
      <li>One person opens the <b>castle screen</b> and shares it on your video call. Everyone joins on their own phone with the room code. Your phone only ever shows your own secrets.</li>
      <li>Some players are <b>Traitors</b>; nobody is told how many. With the Secret Traitor on, one Traitor is hidden even from the others.</li>

      <li><b>Recruiting</b>: after a Traitor is banished, while more than 6 remain, the Traitors recruit. With two or more of them it's a seduction (refusing is safe, and they still murder); with one, it's blackmail, face to face: join or die.</li>

  return `<div class="row"><h2>Menu</h2><button class="btn sm" data-act="close" aria-label="Close">✕</button></div>

/* ---------- Draw ---------- */

  if (mode === 'castle') {
    $('#phase').textContent = H.phase === 'lobby' ? `Room ${H.code}` : H.phase === 'over' ? 'Game over' : `${H.phase === 'night' ? 'Night' : 'Day'} ${H.day}`;
    app.innerHTML = `<div class="castle-grid"><div style="display:grid;gap:16px;min-width:0">${castleMainHtml()}</div>${sideHtml()}</div>`;
  } else if (mode === 'player') {
    $('#phase').textContent = V ? (V.phase === 'lobby' ? `Room ${V.code}` : V.phase === 'over' ? 'Game over' : `${V.phase === 'night' ? 'Night' : 'Day'} ${V.day}`) : '';
    app.innerHTML = playerHtml();
    const log = $('#chatLog'); if (log) log.scrollTop = log.scrollHeight;
  } else { $('#phase').textContent = ''; app.innerHTML = homeHtml(); }
  $('#sheet').innerHTML = menu ? `<div class="sheet-back" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-label="Menu">${menuHtml()}</div></div>` : '';
  if (keep) { const el = document.getElementById(keep.id); if (el && 'value' in el) { el.value = keep.value; el.focus(); } }
  clearInterval(tick);
  if ($('#clock')) tick = setInterval(() => {
    const el = $('#clock'); if (!el) return clearInterval(tick);
    const s = timerLeft();
    el.textContent = s ? fmt(s) : "Time's up";
    el.className = 'big-timer' + (s === 0 ? ' up' : s <= 30 ? ' low' : '');
    if (T.running && s === 0) { T.running = false; T.left = 0; say("Time's up. Vote on your phones."); render(); }
  }, 250);
  // The portrait gallery covers itself after a few seconds
  if (mode === 'player' && V && V.screen.type === 'mission' && V.screen.items[L.i] && V.screen.items[L.i].show && !L.shown && !L.memo) {
    const k = L.key, i = L.i;
    L.memo = setTimeout(() => { if (L.key === k && L.i === i) { L.shown = true; L.memo = null; render(); } }, 6000);
  }
}

/* ---------- Taps ---------- */
function startCastle(fresh) {
  H = fresh ? newCastle() : load(CASTLE_KEY);
  if (!H) H = newCastle();
  mode = 'castle'; saveCastle(); render(); openCastle();
  if (H.phase === 'table') T = { left: H.settings.talk * 60, end: 0, running: false };
}
function startPlayer() {
  mode = 'player'; V = null; pnet = 'connecting'; render(); openPlayer();
}
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset.act !== 'chatform') return;
  e.preventDefault();
  const box = $('#chatBox'), text = box.value.trim();
  if (text && pconn && pconn.open) pconn.send({ t: 'chat', text });
  box.value = '';
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'FORM') return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'backdrop') { if (e.target === b) { menu = null; render(); } return; }
  switch (a) {
    case 'menu': menu = 'main'; return render();
    case 'rules': menu = 'rules'; return render();
    case 'close': menu = null; return render();
    case 'myrole': menu = 'role'; return render();
    case 'voice': prefs.voice = !prefs.voice; store(PKEY, prefs); return render();
    case 'quit': menu = 'quit'; return render();
    case 'quityes': menu = null; if (peer) try { peer.destroy(); } catch (e2) {} peer = null; store(CASTLE_KEY, null); H = null; mode = 'home'; return render();
    case 'leave': menu = null; mode = 'home'; V = null; clearTimeout(retryT); try { if (pconn) pconn.close(); if (ppeer) ppeer.destroy(); } catch (e2) {} ppeer = null; pconn = null; return render();
    // Home
    case 'host': return startCastle(true);
    case 'resume': return startCastle(false);
    case 'join': {
      const code = $('#joinCode').value.trim().toUpperCase(), name = $('#joinName').value.trim().replace(/\s+/g, ' ').slice(0, 20);
      if (!/^[A-Z]{4}$/.test(code)) { homeError = 'The room code is 4 letters. It\'s on the castle screen.'; return render(); }
      if (!name) { homeError = 'Type your name so the others know who you are.'; return render(); }
      // Keep the same seat (token) when rejoining the same room under the same name
      const token = ME && ME.code === code && ME.name.toLowerCase() === name.toLowerCase() && ME.token ? ME.token : Array.from(crypto.getRandomValues(new Uint8Array(12)), x => x.toString(16).padStart(2, '0')).join('');
      ME = { code, name, token }; store(ME_KEY, ME); homeError = '';
      return startPlayer();
    }
  }
  if (mode === 'castle') return castleTap(a, v, b);
  if (mode === 'player') return playerTap(a, v);
});
function castleTap(a, v, b) {
  switch (a) {
    case 'set': { const k = b.dataset.k; H.settings[k] = v === 'true' ? true : v === 'false' ? false : +v; break; }
    case 'kick': { const i = +v, p = H.players[i]; if (conns[p.token]) { try { conns[p.token].send({ t: 'error', text: 'The host removed you from the lobby.' }); } catch (e) {} delete conns[p.token]; } H.players.splice(i, 1); break; }
    case 'start': if (H.players.length >= MIN_PLAYERS) startGame(); break;
    case 'skip': skipWaiting(); return;
    case 'next': if (H.phase === 'dawn') startMission(); else if (H.phase === 'missionResult' && !H.need) toTable(); break;
    case 'timer': if (T.running) { T.left = timerLeft(); T.running = false; } else { if (!T.left) T.left = H.settings.talk * 60; T.end = Date.now() + T.left * 1000; T.running = true; } break;
    case 'plus': if (T.running) T.end += 60000; else T.left += 60; break;
    case 'vote': T.running = false; startVote(1, null); break;
    case 'showvote': { const vt = H.vote, [x, t] = vt.ballots[vt.shown++]; say(`${nameOf(x)} votes for ${nameOf(t)}.`); break; }
    case 'showall': H.vote.shown = H.vote.ballots.length; break;
    case 'count': afterVotes(); break;
    case 'revote': startVote(2, H.tie); break;
    case 'reveal': revealBanished(); break;
    case 'afterban': afterBanish(); break;
    case 'morning': dawn(); break;
    case 'arrive': { const bf = H.bf, i = bf.order[bf.shown++]; say(`${nameOf(i)}.`); if (bf.shown >= bf.order.length) announce(); break; }
    case 'arriveall': H.bf.shown = H.bf.order.length; announce(); break;
    case 'afterbf': afterBreakfast(); break;
    case 'showend': { const e2 = H.endVote, [x, c] = e2.ballots[e2.shown++]; say(`${nameOf(x)}: ${c ? 'end the game' : 'banish again'}.`); break; }
    case 'afterend': afterEndVotes(); break;
    case 'again': { const keepP = H.players.map(p => ({ name: p.name, token: p.token, role: null, alive: true, out: null, clues: [] })); const code = H.code, settings = H.settings; H = newCastle(); Object.assign(H, { code, settings, players: keepP }); break; }
    default: return;
  }
  update();
}
function announce() {
  const b = H.bf;
  if (b.victim != null) say(`${nameOf(b.victim)} never came down to breakfast. They were murdered in the night.`);
  else say(H.night && H.night.result === 'saved' ? 'Everyone is here. The Shield saved a life.' : 'Everyone is here.');
}
function playerTap(a, v) {
  const s = V && V.screen;
  switch (a) {
    case 'ready': send('ready', true); return;
    case 'memorised': clearTimeout(L.memo); L.memo = null; L.shown = true; return render();
    case 'answer': L.ans[L.i] = +v; L.i++; L.shown = false; clearTimeout(L.memo); L.memo = null; if (L.i >= s.items.length) send('mission', L.ans); return render();
    case 'shield': send('shield', v); return;
    case 'pick': L.sel = +v; return render();
    case 'castvote': if (L.sel != null) send('vote', L.sel); return;
    case 'endvote': send('endvote', +v); return;
    case 'letter': send('letter', +v); return;
    case 'stm': case 'str': { const list = L.st[a === 'stm' ? 'm' : 'r'], x = +v, k = list.indexOf(x); if (k >= 0) list.splice(k, 1); else if (list.length < s.need) list.push(x); return render(); }
    case 'sendst': send('stlist', { m: L.st.m, r: L.st.r }); return;
    case 'meet1': L.meet.c = +v; if (L.meet.c2 === +v) L.meet.c2 = null; return render();
    case 'meet2': L.meet.c2 = +v; return render();
    case 'sendmeet': send('meeting', { choice: L.meet.c, choice2: s.two ? L.meet.c2 : null }); return;
  }
}

// Keep the screen awake while the castle or a phone is in a game (where the browser allows it)
let wakeLock = null;
async function keepAwake() {
  try { if (mode !== 'home' && 'wakeLock' in navigator && document.visibilityState === 'visible' && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', keepAwake);
document.addEventListener('click', keepAwake);

/* ---------- Start ---------- */
if (params.get('join')) { mode = 'home'; }
render();
</script>
