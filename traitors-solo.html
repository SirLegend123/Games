<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>The Traitors: Solo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15121b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script src="companion.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* The Traitors, solo: you against bots. Same look as the group game and the Clocktower apps. */
:root {
  --bg: #15121b; --surface: #211c29; --surface-2: #2b2534; --line: #3b3346;
  --fg: #ece6f2; --muted: #a69cb3; --brass: #d4ab55;
  --faithful: #4c8ce4; --traitor: #d8435a; --cloak: #8e1428;
  --ok: #3aa35c; --warn: #e3a53c;
  --felt: radial-gradient(circle at 50% 0%, #2c2436 0%, #1b1622 55%, #15121b 100%);
  --font-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f1eef4; --surface: #ffffff; --surface-2: #f4f0f7; --line: #dcd4e3;
    --fg: #231d2b; --muted: #6c6278; --brass: #94701f;
    --faithful: #2463c2; --traitor: #be2a42; --cloak: #8a1428; --ok: #2a9150; --warn: #b7791f;
    --felt: radial-gradient(circle at 50% 0%, #ffffff 0%, #ebe5f0 60%, #e2dbe9 100%);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f1eef4; --surface: #ffffff; --surface-2: #f4f0f7; --line: #dcd4e3;
  --fg: #231d2b; --muted: #6c6278; --brass: #94701f;
  --faithful: #2463c2; --traitor: #be2a42; --cloak: #8a1428; --ok: #2a9150; --warn: #b7791f;
  --felt: radial-gradient(circle at 50% 0%, #ffffff 0%, #ebe5f0 60%, #e2dbe9 100%);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); background-image: var(--felt); background-attachment: fixed; color: var(--fg); font-family: var(--font-body); font-size: 1rem; line-height: 1.45; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; display: grid; gap: 14px; }
.bar { display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; padding: 10px 16px; margin-bottom: 14px; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { font-family: var(--font-display); font-weight: 400; font-size: 1.45rem; color: var(--brass); margin: 0; line-height: 1; margin-right: auto; }
.phase { font-weight: 800; font-size: .9rem; color: var(--muted); white-space: nowrap; }
@media (max-width: 420px) { .brand { font-size: 1.15rem; } }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 700; min-height: 48px; }
.btn:hover { border-color: var(--brass); }
.btn.primary { background: var(--brass); color: #1a1408; border-color: var(--brass); }
.btn.sm { padding: 5px 11px; min-height: 36px; font-size: .88rem; }
.btn.danger { color: var(--traitor); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btn[aria-pressed="true"] { background: var(--brass); color: #1a1408; border-color: var(--brass); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; line-height: 1.1; color: var(--brass); }
.card h3 { margin: 4px 0 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.card p { margin: 0; }
.hint { color: var(--muted); font-size: .92rem; }
.center { text-align: center; }
.kicker { color: var(--muted); text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; font-weight: 800; margin: 0; }
.title { font-family: var(--font-display); font-weight: 400; color: var(--brass); font-size: clamp(2rem, 9vw, 3rem); line-height: 1; margin: 0; }

/* Setup */
.names { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; counter-reset: seat; }
.names li { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 4px 6px 4px 12px; counter-increment: seat; }
.names li::before { content: counter(seat); color: var(--muted); font-weight: 800; min-width: 1.4em; }
.names li span { margin-right: auto; font-weight: 700; overflow-wrap: anywhere; }
.add { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; }
input[type="text"], textarea, select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 48px; }
textarea { width: 100%; min-height: 70px; resize: vertical; }
.set { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 6px 0; border-top: 1px solid var(--line); }
.set > span { font-weight: 700; margin-right: auto; }
.set small { display: block; color: var(--muted); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface-2); padding: 8px 12px; min-height: 40px; font-weight: 700; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--brass); color: #1a1408; }

/* Picking a player */
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.pick button { min-height: 56px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); font-weight: 800; padding: 8px; overflow-wrap: anywhere; }
.pick button[aria-pressed="true"] { border-color: var(--brass); background: color-mix(in srgb, var(--brass) 22%, var(--surface-2)); }
.pick button small { display: block; font-weight: 600; color: var(--muted); font-size: .78rem; }

/* Pass the phone */
.pass { min-height: calc(100vh - 140px); display: grid; align-content: center; gap: 18px; text-align: center; }
.pass .who { font-family: var(--font-display); font-size: clamp(2.4rem, 12vw, 4rem); line-height: 1.05; color: var(--fg); margin: 0; overflow-wrap: anywhere; }
.dots { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i.done { background: var(--brass); }
.dots i.now { background: var(--fg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--fg) 30%, transparent); }
.private { border: 2px dashed var(--brass); }

/* Roles */
.role { border-radius: 16px; padding: 22px 16px; text-align: center; display: grid; gap: 8px; color: #fff; }
.role.faithful { background: linear-gradient(160deg, color-mix(in srgb, var(--faithful) 85%, #000) 0%, color-mix(in srgb, var(--faithful) 55%, #000) 100%); }
.role.traitor { background: linear-gradient(160deg, var(--traitor) 0%, var(--cloak) 100%); }
.role .rname { font-family: var(--font-display); font-size: clamp(2.6rem, 13vw, 4.2rem); line-height: 1; }
.role p { margin: 0; }
.tag { display: inline-block; font-weight: 800; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 99px; }
.tag.faithful { background: color-mix(in srgb, var(--faithful) 20%, transparent); color: var(--faithful); }
.tag.traitor { background: color-mix(in srgb, var(--traitor) 20%, transparent); color: var(--traitor); }
.tag.out { background: var(--surface-2); color: var(--muted); }

/* Breakfast, votes, players */
.list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.list li b { margin-right: auto; overflow-wrap: anywhere; }
.list li.out { opacity: .55; }
.list li.new { animation: arrive .5s ease-out; }
@keyframes arrive { from { opacity: 0; transform: translateY(8px); } }
.big-news { font-family: var(--font-display); font-size: clamp(1.8rem, 8vw, 2.6rem); line-height: 1.1; text-align: center; margin: 6px 0; }
.big-news.bad { color: var(--traitor); }
.ballot { text-align: center; display: grid; gap: 4px; padding: 14px; border-radius: 14px; background: var(--parch, #efe4c9); color: #2a2118; animation: arrive .4s ease-out; }
.ballot .slate { font-family: var(--font-display); font-size: clamp(2rem, 10vw, 3rem); line-height: 1; }
.tally { display: grid; gap: 6px; }
.tally div { display: grid; grid-template-columns: minmax(0, 8em) 1fr auto; gap: 8px; align-items: center; font-weight: 700; }
.tally span.b { height: 14px; border-radius: 7px; background: var(--brass); min-width: 4px; }
.gold { color: var(--brass); font-weight: 800; }

.big-timer { text-align: center; font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size: clamp(4rem, 24vw, 8rem); line-height: 1; color: var(--brass); padding: 6px 0 0; }
.big-timer.low { color: var(--warn); }
.big-timer.up { color: var(--traitor); }

.banner { text-align: center; padding: 26px 16px; border-radius: 16px; color: #fff; display: grid; gap: 6px; }
.banner.faithful { background: linear-gradient(160deg, var(--faithful), color-mix(in srgb, var(--faithful) 45%, #000)); }
.banner.traitors { background: linear-gradient(160deg, var(--traitor), var(--cloak)); }
.banner .title { color: #fff; }
.mission { font-size: 1.15rem; font-weight: 700; }
details summary { cursor: pointer; font-weight: 800; }
.hist { display: grid; gap: 4px; font-size: .95rem; }
.hist p { margin: 0; }

.sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.5); display: grid; place-items: end center; }
@media (min-width: 640px) { .sheet-back { place-items: center; } }
.sheet { width: min(560px, 100%); max-height: min(88vh, 900px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }
@media (min-width: 640px) { .sheet { border-radius: 16px; } }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; color: var(--brass); font-size: 1.45rem; margin-right: auto; }
.sheet h3 { margin: 6px 0 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.sheet p, .sheet ul { margin: 0; }
.sheet ul { padding-left: 1.2em; display: grid; gap: 4px; }
footer.note { text-align: center; color: var(--muted); font-size: .8rem; }

/* Round Table talk */
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 55vh; overflow-y: auto; }
.feed li { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.feed li.me { border-color: var(--brass); }
.feed li.new { animation: arrive .4s ease-out; }
.feed li p { flex-basis: 100%; margin: 0; min-width: 0; }
.pick button.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 22%, var(--surface-2)); opacity: 1; }
.pick button.wrong { border-color: var(--traitor); background: color-mix(in srgb, var(--traitor) 18%, var(--surface-2)); opacity: 1; }
.pick button:disabled { cursor: default; opacity: .6; }
.dossier li { align-items: flex-start; }
.dossier li > div { min-width: 0; }
.sheet ul.dossier { padding-left: 0; }
.dossier ul { margin: 4px 0 0; padding-left: 1.1em; font-size: .9rem; color: var(--muted); display: grid; gap: 2px; }
.dossier ul li { display: list-item; background: none; border: 0; border-radius: 0; padding: 0; }
.list li .hint { margin-right: 4px; }
/* Secret Traitor mission */
.secret { border: 1px solid var(--traitor); border-radius: 12px; padding: 10px 12px; background: color-mix(in srgb, var(--traitor) 10%, var(--surface)); display: grid; gap: 4px; }
.secret p { margin: 0; }
.secret label { gap: 8px; font-weight: 700; }
.secret.seer { border-color: var(--faithful); background: color-mix(in srgb, var(--faithful) 10%, var(--surface)); }
.gallery { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.gallery li { background: var(--parch, #efe4c9); color: #2a2118; border-radius: 10px; padding: 14px 10px; text-align: center; font-weight: 800; font-family: var(--font-display); font-size: 1.15rem; }
/* The castle's read */
.odds { display: inline-block; font-size: .74rem; font-weight: 800; font-variant-numeric: tabular-nums; padding: 1px 6px; border-radius: 99px; background: var(--surface); color: var(--muted); border: 1px solid var(--line); vertical-align: middle; }
.odds.mid { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.odds.hi { color: var(--traitor); border-color: color-mix(in srgb, var(--traitor) 60%, var(--line)); }
details.read { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 8px; }
details.read[open] { gap: 8px; }
details.read .tally { margin-top: 6px; }
.tally span.b.hi { background: var(--traitor); }
</style>
</head>
<body>
<header class="bar">
  <a class="btn sm" href="index.html" title="Choose another app" aria-label="All apps" style="text-decoration:none;color:inherit;display:inline-grid;place-items:center">&#8962;</a>
  <h1 class="brand">The Traitors: Solo</h1>
  <span class="phase" id="phase"></span>
  <button class="btn sm" type="button" data-act="menu">Menu</button>
</header>
<main class="wrap" id="app"></main>
<div id="sheet"></div>

<script>
'use strict';
/* ---------- Saved game and preferences ---------- */
const KEY = 'traitors-solo-v1', PKEY = 'traitors-prefs';
const DEFAULTS = { players: 12, role: 'random', missions: true, shields: true, recruit: true };
// The show's endgame, as in the group game: secret banishments from the final five, the fire pit at four
const SECRET_AT = 5, FIRE_PIT = 4, RECRUIT_ABOVE = 6, GOLD_PER_ANSWER = 500;
let prefs = { voice: true };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PKEY)) || {}); } catch (e) {}
const savePrefs = () => { try { localStorage.setItem(PKEY, JSON.stringify(prefs)); } catch (e) {} };

// Bots: a name and a personality, which sets how they talk, how good they are at missions and how sure they need to be
const BOTS = [['Aisha', 'bold'], ['Ben', 'calm'], ['Chloe', 'sharp'], ['Dev', 'joker'], ['Ellie', 'nervous'], ['Finn', 'bold'], ['Grace', 'calm'], ['Harry', 'joker'],
  ['Isla', 'sharp'], ['Jamal', 'calm'], ['Kate', 'nervous'], ['Leo', 'bold'], ['Mia', 'sharp'], ['Noah', 'joker'], ['Olivia', 'calm'], ['Priya', 'sharp'],
  ['Rory', 'nervous'], ['Sophie', 'bold'], ['Tom', 'calm'], ['Zara', 'joker']];
const PERSONA = {
  bold: { skill: .62, need: .3, label: 'Bold' }, calm: { skill: .7, need: .37, label: 'Calm' }, sharp: { skill: .8, need: .4, label: 'Sharp' },
  joker: { skill: .58, need: .27, label: 'Joker' }, nervous: { skill: .55, need: .5, label: 'Nervous' },
};

let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || S.v !== 1) S = fresh();
function fresh(settings, me) {
  return { v: 1, phase: 'setup', settings: Object.assign({}, DEFAULTS, settings || {}), myName: me || '', players: [], day: 0, pot: 0, shield: null,
    noise: [], pf: [], herd: [], facts: [], days: [], rt: null, fp: null, vote: null, endVote: null, mission: null, bf: null, ban: null, night: null,
    recruitNext: false, resume: null, outSeen: false, watching: false, winner: null, usedQ: [] };
}
// Games saved before ties were shared: one Shield and one winner become lists
if (S.shield != null) { S.shields = [S.shield]; S.shield = null; }
if (S.mission && S.mission.result && !S.mission.result.winners) {
  const r = S.mission.result, w = r.winner;
  r.winners = w != null ? [w] : []; r.mode = r.choice === 'seer' ? 'seer' : w != null ? 'shield' : null;
  r.choices = r.choice && r.choice !== 'seer' && w != null ? { [w]: r.choice } : {}; r.seers = r.seer && w != null ? { [w]: r.seer } : {};
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rnd = n => Math.floor(Math.random() * n);
const chance = p => Math.random() < p;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[rnd(a.length)];
const ME = 0;
const P = i => S.players[i];
const nm = i => i === ME ? 'You' : esc(P(i).name);
const nmPlain = i => P(i).name;
const alive = () => S.players.map((p, i) => i).filter(i => P(i).alive);
const traitorsAlive = () => alive().filter(i => P(i).role === 'traitor');
const faithfulAlive = () => alive().filter(i => P(i).role === 'faithful');
const meAlive = () => P(ME).alive;
const iAmTraitor = () => P(ME).role === 'traitor';
const money = n => '£' + n.toLocaleString('en-GB');
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const today = () => S.days[S.days.length - 1];
const secretRange = n => n <= 8 ? [1, 2] : n <= 12 ? [2, 3] : [3, 4];
const isFaithfulBot = i => P(i).bot && P(i).role === 'faithful';
function say(t) {
  if (!prefs.voice || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.rate = 1; u.lang = 'en-GB'; speechSynthesis.speak(u); } catch (e) {}
}

/* ---------- What the bots believe ---------- */
// A Faithful bot's suspicion of a player: its own hunch, plus the public evidence about that player (weighted by how much
// this bot trusts evidence), plus what it has been persuaded of at the Round Table. Traitor bots know the truth and only
// care what the Faithful think ("heat").
const factSum = b => S.facts[b].reduce((t, f) => t + f.w, 0);
const sus = (a, b) => S.noise[a][b] + S.pf[a] * factSum(b) + S.herd[a][b];
function heat(b) {
  const fs = alive().filter(f => f !== b && isFaithfulBot(f));
  return fs.length ? fs.reduce((t, f) => t + sus(f, b), 0) / fs.length : 0;
}
function addFact(b, text, w) { S.facts[b].push({ text, w, day: S.day }); }
function topSuspect(a, opts) {
  let best = null, bv = -1e9;
  opts.forEach(b => { if (b === a) return; const v = sus(a, b) + (Math.random() - .5) * .16; if (v > bv) { bv = v; best = b; } });
  return best;
}
function traitorTarget(a, opts) {
  // A secret mission to get someone banished overrides everything else
  if (S.secret && S.secret.type === 'vote' && opts.includes(S.secret.target) && S.secret.target !== a && P(S.secret.target).alive && S.phase !== 'firepit') return S.secret.target;
  const mates = opts.filter(b => b !== a && P(b).role === 'traitor'), others = opts.filter(b => b !== a && P(b).role !== 'traitor');
  let best = null, bv = -1e9;
  others.forEach(b => { const v = heat(b) + (Math.random() - .5) * .3; if (v > bv) { bv = v; best = b; } });
  // A fellow Traitor who is going to be banished anyway: sometimes vote with the crowd to look clean
  mates.forEach(m => { if (heat(m) > bv + .25 && chance(.5)) { best = m; bv = heat(m); } });
  return best != null ? best : mates[0];
}
const botChoice = (a, opts) => P(a).role === 'traitor' ? traitorTarget(a, opts) : topSuspect(a, opts);

/* ---------- From suspicion to probability ---------- */
// How many Traitors are probably still in the game, judged only from what everyone has seen: the likely number at the
// start, less Traitors revealed at banishments, less each secret banishment's chance of having been a Traitor, plus a
// share for every night a recruitment could have happened.
function expectedTraitors() {
  const [lo, hi] = secretRange(S.players.length);
  let e = (lo + hi) / 2 + (S.recruitGuess || 0);
  S.days.forEach(d => { if (d.banished) e -= d.banished.secret ? (d.banished.pGone || 0) : d.banished.role === 'traitor' ? 1 : 0; });
  return Math.max(0, e);
}
// A bot's chance that each other player is a Traitor. Half comes from sharing out the expected number of Traitors in
// proportion to its suspicions; half from how suspicious each player looks in their own right.
function probs(b) {
  const others = alive().filter(x => x !== b), out = {};
  if (!others.length) return out;
  const e = Math.min(expectedTraitors(), others.length - .01), w = others.map(x => Math.exp(3 * sus(b, x))), tot = w.reduce((a, c) => a + c, 0);
  others.forEach((x, k) => { const own = 1 / (1 + Math.exp(-5 * (sus(b, x) - .45))); out[x] = Math.min(.97, .5 * Math.min(1, e * w[k] / tot) + .5 * own); });
  return out;
}
const pClean = pr => Object.values(pr).reduce((a, p) => a * (1 - p), 1);
// The castle's read: the average of what every bot says the chance is for this player (their belief, not the truth).

      const pool = (S.days[S.days.length - 2] || { acc: [] }).acc.filter(([s, t]) => s === sh && P(t).alive && t !== b).map(([, t]) => t);
      const t = pool.length ? pool[0] : null;
      if (t != null) nudge(t, .06, b);
      talk.push({ who: b, text: b === sh ? 'Nobody died… The Shield saved me. They came for me. I must be onto something.' : t != null ? `Everyone's here, so the Traitors must have gone for ${SH}, who had the Shield. ${SH} has been on to ${nmPlain(t)}. That's no coincidence.` : `Everyone's here! They must have tried for ${SH}. The Shield saved a life last night.`, t });
    });
  } else if (n.result === 'final5') {
    speakers.slice(0, 2).forEach(b => talk.push({ who: b, text: pick(['The final five. No more murders, so it\'s all down to us now.', 'Five of us left. If there\'s a Traitor at this table, today is the day we find them.', 'No more hiding behind murders. Whoever is left has to face us.']) }));
  } else {
    speakers.slice(0, 3).forEach(b => talk.push({ who: b, text: pick(['Nobody was murdered? That doesn\'t happen. Something else went on in the night.', 'No murder… I don\'t like it. Have the Traitors recruited someone?', 'Everyone came down. Either the Traitors got clever, or somebody here made a deal.']) }));
  }
  // The first to point the finger this morning is remembered
  const f = talk.find(e => e.t != null && e.kind !== 'defend' && e.kind !== 'notice');
  if (f) today().first.push([f.who, f.t]);
  return talk;
}

// Your reaction at breakfast: it goes into the conversation, and the castle takes note
function humanReact(how, t) {
  const b = S.bf, V = nmPlain(b.victim), add = [];
  b.myReact = how;
  if (how === 'mourn') {
    add.push({ who: ME, text: pick([`I'm gutted about ${V}. They were one of the good ones, and the Traitors will pay for this.`, `${V} didn't deserve that. I'll find whoever did it.`]) });
    alive().forEach(l => { if (isFaithfulBot(l)) S.herd[l][ME] -= .03; });
  } else if (how === 'quiet') {
    add.push({ who: ME, text: 'You say nothing and stare at your plate.', kind: 'notice' });
    if (chance(.35)) { addFact(ME, 'stayed silent after the murder', .06); const q = pick(alive().filter(i => i !== ME)); if (q != null) add.push({ who: q, text: `You're very quiet this morning, ${nmPlain(ME)}.`, t: ME, kind: 'notice' }); }
  } else {
    add.push({ who: ME, text: `${V} was onto someone, and I think it was ${nmPlain(t)}. ${reasonFor(t)}`, t });
    nudge(t, .1, ME);
    if (!today().first.length) today().first.push([ME, t]);
    if (P(t).bot) add.push({ who: t, text: defendLine(t, ME), kind: 'defend' });
  }
  b.talk = b.talk.slice(0, b.heard).concat(add, b.talk.slice(b.heard));
  b.heard += add.length;
  S.scrollFeed = true;
}

/* ---------- The fire pit ---------- */
function firepitLine(b) {
  if (P(b).role === 'traitor') {
    const fake = .7 + Math.random() * .25;
    return { end: true, text: pick([`I make it ${pct(fake)} that we're all Faithful. I trust everyone at this fire. Let's end it.`, `We've done it. I'd put it at ${pct(fake)} that the Traitors are gone. End the game.`, `I'm ready. ${pct(fake)} sure, and that's enough for me.`]) };
  }
  // A Faithful bot weighs the chance that everyone left is Faithful against how much certainty its personality needs
  const pr = probs(b), pc = pClean(pr), need = PERSONA[P(b).persona].need;
  const top = Object.keys(pr).map(Number).sort((x, y) => pr[y] - pr[x])[0];
  const end = chance(Math.max(.03, Math.min(.97, .55 + (pc - need) * 3)));
  const T = top === ME ? 'You' : nmPlain(top);
  return end
    ? { end: true, pc, text: `I make it ${pct(pc)} that we're all Faithful. ${pc >= need ? 'That\'s good enough for me.' : 'It\'s a risk, but I\'ll take it.'} I'm voting to end.` }
    : { end: false, pc, t: top, text: `I only make it ${pct(pc)} that we're all Faithful. ${T} worr${top === ME ? 'y' : 'ies'} me most, at ${pct(pr[top])}. I can't end it yet.` };
}
function firepitNext() { const f = S.fp; if (f.i < f.order.length) { const b = f.order[f.i++]; f.feed.push(Object.assign({ who: b }, firepitLine(b))); } }
function castEndVotes(mine) {
  const f = S.fp;
  while (f.i < f.order.length) firepitNext();
  const ballots = shuffle(alive()).map(x => [x, x === ME ? mine : f.feed.find(e => e.who === x).end ? 1 : 0]);
  S.endVote = { ballots, shown: 0 };
  S.phase = 'endreveal';
}
function afterEndVotes() {
  const e = S.endVote;
  today().endVotes.push(e.ballots);
  if (e.ballots.every(b => b[1] === 1)) return endGame(traitorsAlive().length ? 'traitors' : 'faithful', traitorsAlive().length ? 'The game was ended with a Traitor still at the fire.' : 'Everyone left at the fire was Faithful.');
  S.fp.talk = true;
  toTable();
  say('Not everyone agrees. The Round Table must banish again.');
}

/* ---------- The end ---------- */
function endGame(w, why) {
  S.winner = w; S.winWhy = why; S.phase = 'over';
  const mine = (P(ME).role === 'traitor') === (w === 'traitors');
  say(mine ? (meAlive() ? 'You won!' : 'Your team won.') : 'You lost.');
}
// When you're out and don't want to watch: play every remaining step automatically
function skipToEnd() {
  S.watching = true;
  for (let k = 0; k < 2000 && S.phase !== 'over'; k++) {
    switch (S.phase) {
      case 'out': resumeAfterOut(); break;
      case 'breakfast': afterBreakfast(); break;
      case 'mission': resolveMission(); break;
      case 'missionResult': toTable(); break;
      case 'table': while (S.rt.i < S.rt.order.length) nextSpeaker(); startVote(1, null); break;
      case 'vote': castVotes(null); break;
      case 'votereveal': afterVotes(); break;
      case 'tie': startVote(2, S.tie); break;
      case 'banish': if (!S.ban.secret && !S.ban.shown) revealBanished(); afterBanish(); break;
      case 'night': if (S.night.final5) dawn(null); else resolveNight(S.night.sugg, S.night.msugg); break;
      case 'firepit': castEndVotes(null); break;
      case 'endreveal': afterEndVotes(); break;
      default: return;
    }
  }
}

function tagFor(i) {

          ${t ? `<div class="tally">${Object.keys(t.counts).sort((a, b) => t.counts[b] - t.counts[a]).map(k => `<div><span>${nm(+k)}</span><span class="b" style="width:${t.counts[k] / v.ballots.length * 100}%"></span><span>${t.counts[k]}</span></div>`).join('')}</div>` : ''}

          <button class="btn primary block" data-act="afterban">Continue</button></section>`;
      if (!b.shown) return `<section class="card center"><p class="kicker">Day ${S.day} · Banished</p>${b.drawn ? '<p class="hint">Still tied: the draw chose.</p>' : ''}
          <p class="big-news bad">${nm(i)}</p><p>${i === ME ? 'You have been banished. Tell them who you really are.' : `${nm(i)} stands up: "I am…"`}</p>

      return `<div class="role ${t ? 'traitor' : 'faithful'}"><p class="kicker" style="color:#fff;opacity:.8">${i === ME ? 'You were' : `${nm(i)} was`}</p><div class="rname">${t ? 'a Traitor' : 'Faithful'}</div>

        return `<section class="card">
            <p class="kicker">Night ${S.day} · The Traitors' meeting</p><h2>Who do you ${verb}?</h2>
            <p>${!n.recruit ? 'Choose a Faithful to murder.' : n.black ? 'You are the last Traitor. Blackmail a Faithful: they join you, or die. Nobody else is murdered tonight.' : 'A Traitor was banished. Seduce a Faithful to join you (they may refuse), and murder another.'}</p>
            ${mates.length && n.sugg != null ? `<p class="hint">${mates.map(i => esc(nmPlain(i))).join(' and ')} suggest${mates.length === 1 ? 's' : ''} <b>${nm(n.sugg)}</b>.</p>` : ''}

          <div class="rname" style="font-size:2rem">${n.black ? 'Join us, or die' : 'The Traitors want you'}</div>
          <p>${n.black ? `In a candlelit room, the last Traitor is waiting for you: <b>${esc(nmPlain(lone))}</b>. This is blackmail. Join, or refuse and be murdered tonight.` : 'Join them and become a Traitor, or refuse and stay Faithful. Nothing happens to you if you refuse. If you join, you\'ll meet the others straight away.'}</p></div>

      const mates = traitorsAlive().filter(i => i !== ME), n = S.night;
      return `<div class="role traitor"><p class="kicker" style="color:#fff;opacity:.8">You accepted</p><div class="rname">You are a Traitor</div>

          ${!done ? `<button class="btn primary block" data-act="showend">Next vote</button>` : `<button class="btn primary block" data-act="afterend">${e.ballots.every(b => b[1] === 1) ? 'Everyone voted to end: reveal' : 'Back to the Round Table'}</button>`}
        </section>`;
    }

}
function overHtml() {
  const w = S.winner, winners = alive().filter(i => (P(i).role === 'traitor') === (w === 'traitors'));
  const share = winners.length ? Math.floor(S.pot / winners.length) : 0, myTeam = (P(ME).role === 'traitor') === (w === 'traitors');
  const me = !myTeam ? `You lost. ${iAmTraitor() ? 'The Faithful found the Traitors.' : 'The Traitors fooled the castle.'}`
    : meAlive() ? `You won${winners.length ? ` ${money(share)}` : ''}!` : `Your team won, but you were ${P(ME).out.how} on ${P(ME).out.how === 'murdered' ? `night ${P(ME).out.day - 1}` : `day ${P(ME).out.day}`}, so you leave with nothing.`;
  const hist = S.days.map(d => {
    const bits = [];
    if (d.murdered != null) bits.push(`<p>☠ ${nm(d.murdered)} ${d.murdered === ME ? 'were' : 'was'} murdered in the night.</p>`);
    if (d.mission) {
      const sh = d.mission.shields || (d.mission.shield != null ? [d.mission.shield] : []), gd = Array.isArray(d.mission.tookGold) ? d.mission.tookGold : d.mission.tookGold != null ? [d.mission.tookGold] : [];
      bits.push(`<p>⚔ The mission earned ${money(d.mission.gold)}${sh.length ? `; ${sh.map(nm).join(' and ')} took the Shield` : ''}${gd.length ? `; ${gd.map(nm).join(' and ')} turned down the Shield for gold` : ''}.</p>`);
      const seers = d.mission.seers || (d.mission.seer != null ? [d.mission.seer] : []), clues = d.mission.clues || (d.mission.seer != null ? { [d.mission.seer]: d.mission.clue } : {});
      seers.forEach(w => bits.push(`<p>👁 ${nm(w)} became a Seer. The true clue: ${esc(clueText(clues[w]))}</p>`));
    }
    if (d.secret) bits.push(`<p>🗡 Secret Traitor mission: ${d.secret.type === 'vote' ? `get ${nm(d.secret.target)} banished` : `say "${esc(d.secret.phrase)}"`}, ${d.secret.win ? `<b>succeeded</b> (+${money(SECRET_GOLD)})` : 'failed'}.</p>`);
    d.votes.forEach(v => bits.push(`<p>🗳 ${v.round > 1 ? 'Revote' : 'Votes'}: ${v.ballots.map(([a, b]) => `${nm(a)}→${nm(b)}`).join(', ')}</p>`));
    d.endVotes.forEach(ev => bits.push(`<p>🔥 Fire pit vote: ${ev.map(([a, c]) => `${nm(a)} ${c ? 'end' : 'banish'}`).join(', ')}</p>`));
    if (d.banished) bits.push(`<p>🚪 ${nm(d.banished.who)} ${d.banished.who === ME ? 'were' : 'was'} banished${d.banished.secret ? ' (role kept secret)' : ''}: ${d.banished.role === 'traitor' ? '<b style="color:var(--traitor)">Traitor</b>' : 'Faithful'}.</p>`);
    if (d.recruited != null) bits.push(`<p>🗝 ${nm(d.recruited)} accepted the Traitors' offer.</p>`);
    if (d.refused != null) bits.push(`<p>🗝 ${nm(d.refused)} refused to join the Traitors${d.refusedDied ? ' and paid for it' : ''}.</p>`);
    return bits.length ? `<div class="hist"><h3>Day ${d.day}</h3>${bits.join('')}</div>` : '';
  }).join('');
  const reads = S.players.map((p, i) => i).filter(i => isFaithfulBot(i)).map(i => { const t = topSuspect(i, S.players.map((q, j) => j).filter(j => j !== i)); return `<li><b>${nm(i)}</b><span class="hint">suspected ${nm(t)} most</span><span class="tag ${P(t).role}">${P(t).role === 'traitor' ? 'right' : 'wrong'}</span></li>`; }).join('');
  return `<div class="banner ${w}"><p class="kicker" style="color:#fff;opacity:.85">Game over</p><p class="title">${w === 'traitors' ? 'The Traitors win' : 'The Faithful win'}</p>
      <p>${esc(S.winWhy || '')}</p><p><b>${me}</b></p>
      <p>${winners.length ? `${winners.map(nm).join(', ')} ${winners.length === 1 && winners[0] !== ME ? 'takes' : 'share'} ${money(S.pot)}.` : ''}</p></div>
    <section class="card"><h2>Who was who</h2>
      <ul class="list">${S.players.map((p, i) => `<li class="${p.alive ? '' : 'out'}"><b>${nm(i)}</b>${p.first !== p.role ? '<span class="hint">recruited</span>' : ''}<span class="tag ${p.role}">${p.role === 'traitor' ? 'Traitor' : 'Faithful'}</span>${p.alive ? '' : `<span class="tag out">${p.out.how}</span>`}</li>`).join('')}</ul></section>
    ${reads ? `<section class="card"><h2>The Faithful's final reads</h2><ul class="list">${reads}</ul></section>` : ''}
    <section class="card"><h2>How it happened</h2>${hist}</section>
    <div class="row"><button class="btn primary" style="flex:1" data-act="again">Play again</button><button class="btn" data-act="newgame">Change settings</button></div>`;
}

/* ---------- Menu: the dossier, rules and settings ---------- */
let menu = null;
function menuHtml() {
  if (menu === 'rules') return `<div class="row"><h2>How to play</h2><button class="btn sm" data-act="menu">‹ Back</button><button class="btn sm" data-act="close" aria-label="Close">✕</button></div>
    <ul>
      <li>You are one of the players in the castle. Everyone else is a bot. Some players are <b>Traitors</b>; nobody is told how many.</li>
      <li><b>Missions</b>: three rounds of one of four challenges: the Library Quiz, quick sums in the Counting House, anagrams in the Scrambled Scrolls, or a memory test in the Portrait Gallery. Every right answer from anyone adds ${money(GOLD_PER_ANSWER)} to the pot. The top scorer chooses the <b>Shield</b> (safe from murder that night) or £2,000 for the pot; if players tie for the top score, every one of them chooses. Traitors sometimes sabotage by answering wrongly.</li>
      <li><b>Round Table</b>: the bots take turns to accuse someone and give a reason. You can accuse someone too, and defend yourself if you're accused. Then everyone votes, and the slates are turned one by one.</li>
      <li>Bots remember what happens. Voting for someone who turns out to be Faithful makes you look suspicious; voting out a Traitor clears you a little. If a murder victim had accused someone, that person looks guilty. The <b>Dossier</b> in this menu shows what the castle knows about each player. The percentage beside each name is the <b>castle's read</b>: the bots' average belief that the player is a Traitor (not the truth).</li>
      <li><b>Night</b>: the Traitors murder a Faithful. If you're a Traitor, you choose who. After a Traitor is banished, and while more than 6 remain, the Traitors also recruit: a <b>seduction</b> (refusing is safe, and they still murder someone else) with two or more Traitors left, or <b>blackmail</b> (join or die, and no other murder) with only one. Who died is only revealed at breakfast, even to you.</li>
      <li><b>The final five</b>: there is no murder on the night five players remain, and from then on the mission's top scorer becomes the <b>Seer</b> instead of winning the Shield: they get a true clue about two players. Bot Seers announce theirs, but a Traitor Seer lies. Banished players no longer reveal their role. <b>The fire pit</b>: once 4 remain there are no more murders. Everyone votes to end the game or banish again. Each Faithful bot works out the chance that everyone left is Faithful and votes to end with a probability based on it; nervous bots need more convincing than bold ones. If everyone votes to end with a Traitor still there, the Traitors take the pot.</li>
      <li><b>Tells</b>: Traitors can give themselves away. Watch for players who never go after each other, people who defend someone later revealed as a Traitor, slips of the tongue at breakfast, anyone oddly calm when a murder is announced, rumours of footsteps in the night, odd phrases at the Round Table (some days the Traitors have a secret mission), a top scorer turning down the Shield for gold, and whoever is first to point the finger at someone who turns out Faithful. None of these is proof: Faithful players trip up too.</li>
      <li>If you're murdered or banished, you can watch the rest or skip to the end. Only players still in the game at the end share the gold.</li>
    </ul>`;

    ${inGame && S.players.length ? `<h3>Your role</h3><p>You ${meAlive() ? 'are' : 'were'} <b style="color:var(--${iAmTraitor() ? 'traitor' : 'faithful'})">${iAmTraitor() ? 'a Traitor' : 'Faithful'}</b>.${(S.myClues || []).length ? ` Your Seer's clue${S.myClues.length > 1 ? 's' : ''}: ${S.myClues.map(c => `<b>${esc(c.text)}</b> (day ${c.day})`).join('; ')}.` : ''}${iAmTraitor() ? ` Your team: ${S.players.map((p, i) => i).filter(i => i !== ME && P(i).role === 'traitor').map(i => esc(nmPlain(i)) + (P(i).alive ? '' : ' (out)')).join(', ') || 'just you'}.` : ''}</p>
      <h3>Dossier</h3><p class="hint">What the whole castle knows about each player. The percentage is the castle's read: how likely the bots think that player is a Traitor.</p>
      <ul class="list dossier">${S.players.map((p, i) => i).sort((a, b) => P(b).alive - P(a).alive).map(i => `<li class="${P(i).alive ? '' : 'out'}"><div><b>${nm(i)}</b> ${P(i).alive ? oddsTag(castleRead()[i]) : ''}${P(i).bot ? ` <span class="hint">${PERSONA[P(i).persona].label}</span>` : ''} ${tagFor(i)}${S.facts[i].length ? `<ul>${S.facts[i].slice(-4).map(f => `<li>${esc(f.text)} (day ${f.day})</li>`).join('')}</ul>` : ''}</div></li>`).join('')}</ul>

}
function renderMenu() { $('#sheet').innerHTML = menu ? `<div class="sheet-back" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-label="Menu">${menuHtml()}</div></div>` : ''; }
let memoTimer = null;

/* ---------- Taps ---------- */
document.addEventListener('input', e => { if (e.target.id === 'myName') { e.target.setCustomValidity(''); S.myName = e.target.value.trim(); save(); } });
// Change your name mid-game: everything already said about you is updated too
function renameMe(name) {
  const old = nmPlain(ME), re = new RegExp(`\\b${old.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'g');
  const fix = t => typeof t === 'string' ? t.replace(re, name) : t;
  S.facts.forEach(fs => fs.forEach(f => { f.text = fix(f.text); }));
  [S.rt && S.rt.feed, S.bf && S.bf.talk, S.fp && S.fp.feed].forEach(feed => (feed || []).forEach(e => { e.text = fix(e.text); }));

}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');

  switch (a) {
    case 'menu': menu = 'main'; return renderMenu();

    case 'voice': prefs.voice = !prefs.voice; savePrefs(); if (!prefs.voice && window.speechSynthesis) speechSynthesis.cancel(); return renderMenu();
    case 'set': S.settings[b.dataset.k] = v === 'true' ? true : v === 'false' ? false : isNaN(+v) ? v : +v; top = false; break;
    case 'start': {
      // Read the box directly (autofill and autocorrect don't always send an input event), and insist on a name
      const box = $('#myName'), name = (box && box.value.trim()) || S.myName;

    }
    case 'rename': {
      const box = $('#renameBox'), name = box && box.value.trim().replace(/\s+/g, ' ').slice(0, 20);

    }
    case 'enter': newDay(); startMission(); break;
    case 'arrive': { const bf = S.bf, i = bf.order[bf.shown++]; say(i === ME ? 'You.' : nmPlain(i) + '.'); if (bf.shown >= bf.order.length) announce(); top = false; break; }
    case 'arriveall': S.bf.shown = S.bf.order.length; announce(); break;

    case 'react': if (v === 'theory') { S.ui = S.ui === 'theory' ? null : 'theory'; } else humanReact(v); top = false; break;
    case 'theory': humanReact('theory', +v); S.ui = null; top = false; break;
    case 'talkall': S.bf.heard = S.bf.talk.length; top = false; break;
    case 'answer': { const m = S.mission; if (m.picked != null) return; m.picked = +v; m.mine[m.i] = +v === m.items[m.i].ans; top = false; break; }
    case 'memorised': S.mission.stage = 'ask'; clearTimeout(memoTimer); break;
    case 'nextq': { const m = S.mission; m.picked = null; if (m.i < 2) { m.i++; if (m.kind === 'memory') m.stage = 'show'; } else resolveMission(); break; }
    case 'shieldpick': if (myChoicePending()) shieldChoice(ME, v); top = false; break;
    case 'totable': if (!myChoicePending()) toTable(); break;
    case 'speak': nextSpeaker(); S.ui = null; S.scrollFeed = true; top = false; break;
    case 'speakall': while (S.rt.i < S.rt.order.length) nextSpeaker(); S.ui = null; top = false; break;
    case 'accusemenu': S.ui = S.ui === 'accuse' ? null : 'accuse'; top = false; break;
    case 'defendmenu': S.ui = S.ui === 'defend' ? null : 'defend'; top = false; break;
    case 'accuse': humanAccuse(+v); S.ui = null; S.scrollFeed = true; top = false; break;
    case 'defend': humanDefend(v); S.ui = null; S.scrollFeed = true; top = false; break;
    case 'protectmenu': S.ui = S.ui === 'protect' ? null : 'protect'; top = false; break;
    case 'protect': humanProtect(+v); S.ui = null; S.scrollFeed = true; top = false; break;
    case 'sayword': S.rt.sayWord = b.checked; top = false; break;
    case 'tovote': while (S.rt.i < S.rt.order.length) nextSpeaker(); S.ui = null; startVote(1, null); break;
    case 'myvote': S.vote.mine = +v; top = false; break;
    case 'castvote': if (S.vote.mine != null) castVotes(S.vote.mine); break;
    case 'showvote': { const vt = S.vote, [x, t] = vt.ballots[vt.shown++]; say(`${x === ME ? 'You' : nmPlain(x)}: ${t === ME ? 'you' : nmPlain(t)}.`); break; }
    case 'showall': S.vote.shown = S.vote.ballots.length; break;
    case 'countvotes': afterVotes(); break;
    case 'revote': startVote(2, S.tie); break;
    case 'reveal': revealBanished(); break;
    case 'afterban': afterBanish(); break;
    case 'nightpick': S.night.choice = +v; if (S.night.mchoice === +v) S.night.mchoice = null; top = false; break;
    case 'nightmurder': S.night.mchoice = +v; top = false; break;
    case 'nightgo': if (S.night.choice != null) resolveNight(S.night.choice, S.night.mchoice); break;
    case 'sleep': if (S.night.final5) dawn(null); else resolveNight(S.night.sugg, S.night.msugg); break;
    case 'letter': resolveLetter(v === '1'); break;
    case 'welcomed': finishNight(); break;
    case 'watch': resumeAfterOut(); break;
    case 'skip': skipToEnd(); break;
    case 'fpnext': firepitNext(); top = false; break;
    case 'fpall': while (S.fp.i < S.fp.order.length) firepitNext(); top = false; break;
    case 'endvote': castEndVotes(v === '' ? null : +v); break;
    case 'showend': S.endVote.shown++; top = false; break;
    case 'afterend': afterEndVotes(); break;
    case 'again': { const st = S.settings, me = S.myName; S = fresh(st, me); start(); break; }
    case 'newgame': S = fresh(S.settings, S.myName); break;
    default: return;
  }
  save(); render();
  if (top) scrollTo(0, 0);
});
function announce() {
  const b = S.bf;
  if (b.victim != null) say(`${b.victim === ME ? 'You' : nmPlain(b.victim)} never came down to breakfast.`);
  else say(S.night && S.night.result === 'saved' ? 'Everyone is here. The Shield saved a life.' : 'Everyone is here. Nobody was murdered.');
}
render();
</script>
</body>
</html>
