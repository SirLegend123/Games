<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15121b">
<title>Storyteller: Face to Face</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
:root {
  --bg: #15121b; --surface: #211c29; --surface-2: #2b2534; --line: #3b3346;
  --fg: #ece6f2; --muted: #a69cb3; --brass: #d4ab55; --on-brass: #1a1408;
  --parch: #efe4c9; --parch-ink: #2a2118;
  --good: #4c8ce4; --evil: #d8435a;
  --townsfolk: #3e7fd6; --outsider: #5cb8ec; --minion: #d4485e; --demon: #b0263d;
  --warn: #e3a53c;
  --felt: radial-gradient(circle at 50% 40%, #2c2436 0%, #1b1622 62%, #15121b 100%);
  --font-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f1eef4; --surface: #ffffff; --surface-2: #f4f0f7; --line: #dcd4e3;
    --fg: #231d2b; --muted: #6c6278; --brass: #94701f; --on-brass: #fff;
    --good: #2463c2; --evil: #be2a42;
    --townsfolk: #2463c2; --outsider: #2a92cc; --minion: #c0344b; --demon: #8a1428; --warn: #b7791f;
    --felt: radial-gradient(circle at 50% 40%, #ffffff 0%, #ebe5f0 70%, #e2dbe9 100%);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.wrap { max-width: 920px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header h1 { margin: 0 auto 0 0; font-family: var(--font-display); font-weight: 400; color: var(--brass); font-size: 1.6rem; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps span { font-size: .8rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
.steps span.on { background: var(--brass); color: var(--on-brass); border-color: var(--brass); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; color: var(--brass); }
.card h3 { margin: 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; }
.hint { color: var(--muted); font-size: .92rem; margin: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 16px; min-height: 46px; font-weight: 800; }
.btn:hover:not(:disabled) { border-color: var(--brass); }
.btn.primary { background: var(--brass); color: var(--on-brass); border-color: var(--brass); }
.btn.danger { color: var(--evil); }
.btn.evil { background: var(--evil); border-color: var(--evil); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.huge { font-size: 1.15rem; min-height: 58px; padding: 12px 26px; }
.icon { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); display: inline-grid; place-items: center; font-size: 1rem; }
.icon:disabled { opacity: .3; cursor: default; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 10px; }

input[type=text], select, textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; }
textarea { resize: vertical; }
label.field { display: grid; gap: 6px; }
.label { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; color: var(--muted); }

/* Players */
.players { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 2em minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.prow .n { color: var(--muted); font-weight: 800; text-align: right; }
.prow .btns { display: flex; gap: 4px; }
.add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }

/* Counts */
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.count { border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: .9rem; color: #fff; border: 2px solid transparent; }
.count.townsfolk { background: var(--townsfolk); } .count.outsider { background: var(--outsider); } .count.minion { background: var(--minion); } .count.demon { background: var(--demon); }
.count.off { border-color: var(--warn); box-shadow: 0 0 0 2px var(--warn); }
.warn { color: var(--warn); font-weight: 700; }

/* Bag */
.team-h { display: flex; align-items: baseline; gap: 8px; }
.team-h .hint { font-size: .85rem; }
.t-townsfolk { color: var(--townsfolk); } .t-outsider { color: var(--outsider); } .t-minion { color: var(--minion); } .t-demon { color: var(--demon); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.tile { display: grid; justify-items: center; gap: 2px; padding: 10px 6px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); text-align: center; font-weight: 700; font-size: .9rem; line-height: 1.15; min-height: 84px; align-content: center; }
.tile .ico { font-size: 1.7rem; line-height: 1.2; }
.tile[aria-pressed="true"] { background: var(--parch); color: var(--parch-ink); }
.tile.townsfolk[aria-pressed="true"] { border-color: var(--townsfolk); } .tile.outsider[aria-pressed="true"] { border-color: var(--outsider); }
.tile.minion[aria-pressed="true"] { border-color: var(--minion); } .tile.demon[aria-pressed="true"] { border-color: var(--demon); }
.tile[aria-pressed="false"] .ico { filter: grayscale(.6); opacity: .75; }
.sticky { position: sticky; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 5; box-shadow: 0 8px 24px rgba(0,0,0,.35); }

/* Pass and play: a full-screen cover */
.draw { position: fixed; inset: 0; z-index: 50; overflow-y: auto; background: var(--felt); background-color: var(--bg); display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.draw-inner { width: min(620px, 100%); display: grid; gap: 18px; text-align: center; justify-items: center; }
.draw h1 { margin: 0; font-family: var(--font-display); font-weight: 400; color: var(--brass); font-size: clamp(2.2rem, 8vw, 3.2rem); line-height: 1.1; overflow-wrap: break-word; max-width: 100%; }
.draw p { margin: 0; }
.lead { font-size: 1.15rem; }
.draw-foot { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; }
.bag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 14px; width: 100%; }
.bag-tok { aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--brass); background: radial-gradient(circle at 35% 30%, var(--surface-2), var(--surface) 70%); color: var(--brass); font-family: var(--font-display); font-size: 2rem; box-shadow: 0 3px 10px rgba(0,0,0,.35); transition: transform .12s ease; }
.bag-tok:hover, .bag-tok:focus-visible { transform: scale(1.06); }
.big-tok { --size: min(270px, 72vw); width: var(--size); aspect-ratio: 1; border-radius: 50%; background: var(--parch); color: var(--parch-ink); border: 10px solid var(--good); display: grid; place-content: center; justify-items: center; gap: 4px; padding: 12%; text-align: center; font-family: var(--font-display); line-height: 1.05; box-shadow: 0 6px 22px rgba(0,0,0,.45); animation: flip .4s ease; }
.big-tok.evil { border-color: var(--evil); } .big-tok.outsider { border-color: var(--outsider); } .big-tok.townsfolk { border-color: var(--townsfolk); }
.big-tok .ico { font-size: calc(var(--size) * .27); line-height: 1.1; }
.big-tok .nm { font-size: calc(var(--size) * var(--fs, .12)); }
@keyframes flip { from { transform: rotateY(90deg); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .big-tok { animation: none; } }
.ability { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; max-width: 460px; font-size: 1.05rem; }
.ability small { display: block; color: var(--muted); margin-top: 6px; font-size: .85rem; }
.al-good { color: var(--good); font-weight: 800; } .al-evil { color: var(--evil); font-weight: 800; }

/* Storyteller's list */
.who { display: grid; gap: 8px; }
.wrow { display: grid; grid-template-columns: 2em 2.4em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); border-left: 5px solid var(--good); }
.wrow.evil { border-left-color: var(--evil); }
.wrow .n { color: var(--muted); font-weight: 800; text-align: right; }
.wrow .ico { font-size: 1.6rem; text-align: center; }
.wrow .thinks { color: var(--muted); font-size: .9rem; }
/* Grimoire circle */
.grim-wrap { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .grim-wrap { grid-template-columns: minmax(0, 1.2fr) minmax(320px, 1fr); } }
.side { display: grid; gap: 16px; }
.circle { position: relative; width: 100%; max-width: 640px; margin: 0 auto; aspect-ratio: 1; container-type: inline-size; border-radius: 50%; background: var(--felt); border: 1px solid var(--line); }
.seat { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; background: none; border: 0; padding: 0; width: var(--tok); color: inherit; z-index: 1; }
.disc { width: var(--tok); aspect-ratio: 1; border-radius: 50%; background: var(--parch); color: var(--parch-ink); border: 4px solid var(--good); display: grid; place-content: center; justify-items: center; text-align: center; padding: 6%; box-shadow: 0 2px 6px rgba(0,0,0,.35); overflow: hidden; font-family: var(--font-display); line-height: 1.02; }
.seat.evil .disc { border-color: var(--evil); }
.seat.sel .disc { outline: 4px solid var(--brass); outline-offset: 2px; }
.seat.dead .disc { filter: grayscale(1) brightness(.65); }
.disc .ico { font-size: calc(var(--tok) * .3); line-height: 1.1; }
.disc .nm { font-family: var(--font-body); font-weight: 800; font-size: calc(var(--tok) * var(--fs)); }
.disc .th { font-family: var(--font-body); font-weight: 700; font-size: calc(var(--tok) * .12); color: #6b5d48; }
.plate { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font-weight: 800; font-size: clamp(.7rem, 2.6cqi, .9rem); max-width: calc(var(--tok) * 1.5); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat.dead .plate { text-decoration: line-through; color: var(--muted); }
.rems { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; width: calc(var(--tok) * 1.6); }
.rem { font-size: clamp(.6rem, 2.1cqi, .72rem); font-weight: 800; border-radius: 999px; padding: 0 6px; background: var(--evil); color: #fff; white-space: nowrap; }
.rem.info { background: #6c6278; } .rem.safe { background: var(--good); }
.rem.big { font-size: .85rem; padding: 4px 6px 4px 10px; display: inline-flex; align-items: center; gap: 4px; }
.rem .x { background: none; border: 0; color: #fff; font-weight: 800; padding: 0 4px; }
.center { position: absolute; inset: 30%; display: grid; place-content: center; justify-items: center; text-align: center; gap: 4px; }
.center .ph { font-family: var(--font-display); color: var(--brass); font-size: clamp(1.2rem, 6cqi, 2.2rem); }
.bluff-icons { font-size: clamp(1.1rem, 5cqi, 1.8rem); display: flex; gap: 6px; }
.bluffs { display: grid; gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .grid3 { grid-template-columns: minmax(0, 1fr); } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface-2); padding: 8px 16px; min-height: 44px; font-weight: 800; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--brass); color: var(--on-brass); }
.seg button.g[aria-pressed="true"] { background: var(--good); color: #fff; } .seg button.e[aria-pressed="true"] { background: var(--evil); color: #fff; }
.bignum { font-size: 1.8rem; font-weight: 800; min-width: 1.5em; text-align: center; }
.tiles.small { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.tiles.small .tile { min-height: 70px; font-size: .82rem; }
.notice { margin: 0; background: var(--surface-2); border-left: 4px solid var(--brass); border-radius: 8px; padding: 10px 12px; }
.x-inline { background: none; border: 0; color: var(--muted); font-weight: 800; padding: 0 6px; }
.seat.town .disc { border-color: var(--brass); }
.over h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.4rem, 8vw, 3.6rem); line-height: 1.1; }
.over.good h1 { color: var(--good); } .over.evil h1 { color: var(--evil); }
.over.good { border-color: var(--good); } .over.evil { border-color: var(--evil); }
.story-text { font-size: 1.15rem; line-height: 1.6; max-width: 70ch; }
.story-text h3 { margin: 18px 0 4px; font-family: var(--font-display); font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 1.4rem; color: var(--brass); }
.story-text p { margin: 0 0 10px; }
#townBtn.live { background: var(--good); border-color: var(--good); color: #fff; }
.town-card { border-color: var(--brass); }
.town-code { font-weight: 800; font-size: clamp(3rem, 12vw, 5rem); letter-spacing: .2em; text-align: center; color: var(--brass); font-variant-numeric: tabular-nums; }
.kill { display: grid; gap: 6px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.history summary { cursor: pointer; padding: 6px 0; }
.history h3 { margin-top: 10px; }
.log { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }

/* What the woken player sees */
.answer { font-weight: 800; font-size: clamp(4rem, 18vw, 7rem); line-height: 1; color: var(--brass); }
.answer.small { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 9vw, 3.2rem); }
.answer.evil-t { color: var(--evil); }
.names, .chars { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.nmchip { font-family: var(--font-display); font-size: clamp(1.6rem, 6vw, 2.4rem); background: var(--surface); border: 2px solid var(--brass); border-radius: 14px; padding: 6px 18px; }
.charchip { display: grid; justify-items: center; gap: 2px; background: var(--parch); color: var(--parch-ink); border-radius: 14px; padding: 10px 16px; font-weight: 800; font-size: 1.1rem; min-width: 110px; }
.charchip .ico { font-size: 2.4rem; line-height: 1.1; }
.charchip { border: 5px solid var(--townsfolk); }
.charchip.t-outsider { border-color: var(--outsider); } .charchip.t-minion, .charchip.t-demon { border-color: var(--evil); }
/* A woken player's screen is tinted with their team's colour */
.draw.tint-evil { background: radial-gradient(circle at 50% 35%, #8a1a2c 0%, #4a0c17 55%, #24050b 100%); }
.draw.tint-townsfolk { background: radial-gradient(circle at 50% 35%, #2456a8 0%, #12305f 55%, #0a1730 100%); }
.draw.tint-outsider { background: radial-gradient(circle at 50% 35%, #49a6dc 0%, #1d628c 55%, #0d3149 100%); }
.draw[class*="tint-"] { color: #f6f2fa; --fg: #f6f2fa; --muted: #ddd3e8; --surface: rgba(0,0,0,.3); --line: rgba(255,255,255,.3); --brass: #f0c66a; --on-brass: #1a1408; }
.draw[class*="tint-"] .t-townsfolk, .draw[class*="tint-"] .t-outsider, .draw[class*="tint-"] .t-minion, .draw[class*="tint-"] .t-demon { color: inherit; }
.draw[class*="tint-"] .charchip { color: var(--parch-ink); }
.pickgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; width: 100%; }
/* Night screens are read across a table: make everything big */
.draw[class*="tint-"] .draw-inner, .draw.dawn .draw-inner { width: min(900px, 100%); gap: 22px; }
.draw[class*="tint-"] .lead, .draw.dawn .lead { font-size: clamp(1.5rem, 3.6vw, 2.1rem); line-height: 1.3; }
.draw[class*="tint-"] h1, .draw.dawn h1 { font-size: clamp(2.8rem, 9vw, 4.4rem); }
.draw[class*="tint-"] .nmchip, .draw.dawn .nmchip { font-size: clamp(2.2rem, 7vw, 3.4rem); padding: 8px 24px; border-width: 3px; }
.draw[class*="tint-"] .charchip { font-size: clamp(1.4rem, 3.4vw, 1.9rem); min-width: 170px; padding: 14px 22px; }
.draw[class*="tint-"] .charchip .ico { font-size: clamp(3rem, 8vw, 4.4rem); }
.draw[class*="tint-"] .pickgrid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.draw[class*="tint-"] .pick { min-height: 90px; font-size: clamp(1.5rem, 3.6vw, 2rem); }
.draw[class*="tint-"] .answer { font-size: clamp(6rem, 24vw, 10rem); }
.draw[class*="tint-"] .answer.small, .draw.dawn .answer.small { font-size: clamp(2.6rem, 10vw, 4rem); }
.draw[class*="tint-"] .ability { font-size: clamp(1.3rem, 3vw, 1.6rem); max-width: 640px; }
.draw[class*="tint-"] .btn.huge, .draw.dawn .btn.huge { font-size: clamp(1.4rem, 3vw, 1.7rem); min-height: 72px; padding: 14px 34px; }
.draw[class*="tint-"] .tiles.small { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.draw[class*="tint-"] .tiles.small .tile { font-size: 1.15rem; min-height: 100px; }
.draw[class*="tint-"] .tiles.small .tile .ico { font-size: 2.4rem; }
.draw[class*="tint-"] .big-tok { --size: min(340px, 72vw); }
.pick:disabled { opacity: .45; cursor: not-allowed; }
.pick small { display: block; font-size: .6em; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
.pick.ally { border-color: #ff6b81; background: rgba(216,67,90,.45); }
.pick.ally small { color: #ffd0d7; }
/* The day timer, readable across a room */
.draw.timer .draw-inner { width: min(1000px, 100%); gap: 20px; }
.clock { font-weight: 800; font-variant-numeric: tabular-nums; font-size: clamp(6rem, 30vw, 18rem); line-height: .95; letter-spacing: -.02em; color: var(--fg); }
.draw.timer .lead { font-size: clamp(1.4rem, 3.4vw, 2rem); }
.draw.timer .btn.huge { min-width: 120px; min-height: 68px; font-size: clamp(1.2rem, 2.6vw, 1.6rem); }
.draw.timer.low .clock { color: var(--warn); }
.draw.timer.up { animation: flash 1s steps(2) 3; background: #5a0f1c; }
.draw.timer.up .clock, .draw.timer.up #tStatus { color: #ff5c72; }
@keyframes flash { 50% { background: #a3162d; } }
@media (prefers-reduced-motion: reduce) { .draw.timer.up { animation: none; } }
.draw.dawn { background: radial-gradient(circle at 50% 35%, #9b1b2f 0%, #5c0d1a 55%, #2a050c 100%); color: #fff4f4; --fg: #fff4f4; --muted: #ffd9de; --surface: rgba(0,0,0,.3); --line: rgba(255,255,255,.35); --brass: #ffd27a; --on-brass: #2a1a08; }
.draw.dawn h1, .draw.dawn .answer.small { color: #fff1e0; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
.draw.dawn .names { flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.draw.dawn .nmchip { font-size: clamp(3.6rem, 13vw, 9rem); line-height: 1.05; padding: 10px 40px; border-width: 4px; background: rgba(0,0,0,.25); border-color: #ffd27a; max-width: 100%; overflow-wrap: anywhere; }
.pick { min-height: 60px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 800; font-size: 1.1rem; }
.pick[aria-pressed="true"] { background: var(--brass); color: var(--on-brass); border-color: var(--brass); }
.pick.dead { opacity: .6; text-decoration: line-through; }
.spy { width: 100%; }
footer { color: var(--muted); font-size: .8rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Storyteller</h1>
    <nav class="steps" id="steps" aria-label="Steps"></nav>
    <button class="btn" id="newBtn" data-act="new-game">＋ New game</button>
    <button class="btn" id="townBtn" data-act="town-open" aria-label="Town Square">📺</button>
  </header>
  <div id="townBox"></div>
  <main id="app"></main>
  <footer><i>Blood on the Clocktower</i> and its character names belong to The Pandemonium Institute. Unofficial fan-made tool; the symbols are our own.</footer>
</div>
<div id="draw" class="draw" hidden role="dialog" aria-modal="true" aria-label="Draw your character"></div>

<script src="characters.js"></script>
<script src="vendor/peerjs.min.js"></script>
<script>
/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
// Fair randomness for the draw
const rnd = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const byTeam = (a, b) => TEAMS.indexOf(teamOf(a.role)) - TEAMS.indexOf(teamOf(b.role)) || a.role.localeCompare(b.role);
const nameOf = pid => { const i = S.players.findIndex(p => p.id === pid); return i < 0 ? "someone" : (S.players[i].name.trim() || `Seat ${i + 1}`); };

/* ---------- State ---------- */
const LS = "botc-storyteller-ftf-v1";
const fresh = () => ({ step: "players", script: "tb", players: [], bag: [], draw: null, drawn: {} });
let S;
try { S = JSON.parse(localStorage.getItem(LS)); } catch (e) { S = null; }
if (!S || !S.step) S = fresh();
if (S.step === "done") S.step = "grim";
let show = null; // a player looking at their character again, after the draw
const ui = { sel: null, reveal: false, story: false, timerOpen: false };
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };

/* ---------- Setup counts ---------- */
// What the setup should be for these characters, after Baron, Godfather, Fang Gu and Vigormortis
function expected(n, roles) {
  if (!COMP[n]) return null;
  const c = [...COMP[n]], notes = [];
  if (roles.includes("Baron")) { c[0] -= 2; c[1] += 2; notes.push("Baron +2 Outsiders"); }
  if (roles.includes("Fang Gu")) { c[0] -= 1; c[1] += 1; notes.push("Fang Gu +1 Outsider"); }
  if (roles.includes("Vigormortis") && c[1] > 0) { c[0] += 1; c[1] -= 1; notes.push("Vigormortis −1 Outsider"); }
  return { c, notes, godfather: roles.includes("Godfather") };
}
// Each team's count, and whether it matches. The Godfather allows one more or one fewer Outsider
function teamCheck(n, roles) {
  const ex = expected(n, roles);
  const have = TEAMS.map(t => roles.filter(r => teamOf(r) === t).length);
  const gf = ex && ex.godfather && Math.abs(have[1] - ex.c[1]) === 1 && have[0] + have[1] === ex.c[0] + ex.c[1];
  const ok = TEAMS.map((t, i) => !ex || have[i] === ex.c[i] || (gf && i < 2));
  return { ex, have, ok };
}
function countsHtml(n, roles) {
  const { ex, have, ok } = teamCheck(n, roles);
  return `<div class="counts">${TEAMS.map((t, i) => `<span class="count ${t}${ok[i] ? "" : " off"}">${have[i]}${ex ? " / " + ex.c[i] : ""} ${TEAM_LABEL[t]}</span>`).join("")}</div>
    ${ex && (ex.notes.length || ex.godfather) ? `<p class="hint">${[...ex.notes, ex.godfather ? "Godfather ±1 Outsider" : ""].filter(Boolean).join(" · ")}</p>` : ""}`;
}
const countsOk = (n, roles) => teamCheck(n, roles).ok.every(Boolean);

/* ---------- The bag ---------- */
function randomBag(n) {
  const R = SCRIPTS[S.script].roles;
  const take = (list, k) => shuffle(list.map(x => x[0])).slice(0, Math.max(0, k));
  const evil = [...take(R.demon, 1), ...take(R.minion, COMP[n][2])];
  const c = expected(n, evil).c;
  if (evil.includes("Godfather")) { const d = c[1] > 0 && rnd(2) ? -1 : 1; c[0] -= d; c[1] += d; }
  const short = Math.max(0, c[1] - R.outsider.length);
  c[1] -= short; c[0] += short;
  return fixShown([...evil, ...take(R.outsider, c[1]), ...take(R.townsfolk, c[0])].map(role => ({ role, shown: "" }))).sort(byTeam);
}
// The Drunk is shown a Townsfolk that isn't in the bag; the Lunatic is shown a Demon
function fixShown(bag) {
  const R = SCRIPTS[S.script].roles;
  const used = new Set(bag.flatMap(b => [b.role, b.shown]).filter(Boolean));
  for (const b of bag) {
    if (!SHOWN[b.role]) { b.shown = ""; continue; }
    if (b.shown) continue;
    const demon = bag.find(x => teamOf(x.role) === "demon");
    const pool = b.role === "Lunatic" ? (demon ? [demon.role] : R.demon.map(x => x[0])) : R.townsfolk.map(x => x[0]).filter(r => !used.has(r));
    b.shown = pool.length ? pool[rnd(pool.length)] : "";
    used.add(b.shown);
  }
  return bag;
}

/* ---------- Screens ---------- */
function render() {
  const steps = [["players", "Players"], ["bag", "Bag"], ["draw", "Draw"], ["grim", "Grimoire"], ["night", `Night ${S.n || 1}`], ["day", `Day ${S.n || 1}`], ...(S.over ? [["over", "Game over"]] : [])];
  $("steps").innerHTML = steps.map(([k, l]) => `<span class="${(S.draw ? k === "draw" : S.over ? k === "over" : S.step === k) ? "on" : ""}">${l}</span>`).join("");
  if (["grim", "night", "day"].includes(S.step)) setupGrim();
  if (S.step === "grim" && S.phase === "day1") startDay(); // games saved before the day was built
  $("app").innerHTML = S.over ? overHtml() : S.step === "players" ? playersHtml() : S.step === "bag" ? bagHtml() : S.step === "night" ? nightHtml() : S.step === "day" ? dayHtml() : grimHtml();
  renderDraw();
  renderTown();
  townSend();
  save();
}

function playersHtml() {
  const n = S.players.length;
  const rows = S.players.map((p, i) => `<div class="prow" data-i="${i}">
      <span class="n">${i + 1}</span>
      <input type="text" data-name="${i}" value="${esc(p.name)}" placeholder="Player name" aria-label="Seat ${i + 1} name" autocomplete="off">
      <span class="btns">
        <button class="icon" data-act="up" data-i="${i}" aria-label="Move up" ${i === 0 ? "disabled" : ""}>↑</button>
        <button class="icon" data-act="down" data-i="${i}" aria-label="Move down" ${i === n - 1 ? "disabled" : ""}>↓</button>
        <button class="icon" data-act="del" data-i="${i}" aria-label="Remove">×</button>
      </span>
    </div>`).join("");
  const ex = expected(n, []);
  return `<section class="card">
    <h2>Who's playing?</h2>
    <label class="field"><span class="label">Script</span>
      <select data-script>${Object.entries(SCRIPTS).map(([k, v]) => `<option value="${k}" ${S.script === k ? "selected" : ""}>${v.name}</option>`).join("")}</select>
    </label>
    <p class="hint">Add everyone in seat order, going clockwise round the table. You can type several names separated by commas.</p>
    <div class="add">
      <input type="text" id="newName" placeholder="Name" autocomplete="off" enterkeyhint="done" aria-label="New player's name">
      <button class="btn primary" data-act="add">Add</button>
    </div>
    ${n ? `<div class="players">${rows}</div>` : ""}
    <p class="hint">${n < 5 ? `${plural(n, "player")}. You need at least 5.` : n > 15 ? `${n} players. The most is 15.` : `${plural(n, "player")}: ${ex.c.map((x, i) => `${x} ${i === 3 ? "Demon" : TEAM_LABEL[TEAMS[i]]}`).join(", ")}.`}</p>
    <div class="row">
      ${n ? `<button class="btn danger" data-act="clear-players">Clear all</button>` : ""}
      <span class="spacer"></span>
      <button class="btn primary" data-act="to-bag" ${COMP[n] ? "" : "disabled"}>Build the bag →</button>
    </div>
  </section>`;
}

function bagHtml() {
  const n = S.players.length, R = SCRIPTS[S.script].roles;
  const inBag = new Set(S.bag.map(b => b.role)), roles = S.bag.map(b => b.role);
  const shownSel = S.bag.map((b, i) => {
    if (!SHOWN[b.role]) return "";
    const pool = R[SHOWN[b.role]].map(x => x[0]).filter(r => b.role === "Lunatic" || !inBag.has(r));
    return `<label class="field"><span class="label">The ${esc(b.role)} will see</span><select data-shown="${i}">${pool.map(r => `<option ${r === b.shown ? "selected" : ""}>${esc(r)}</option>`).join("")}</select></label>`;
  }).join("");
  const size = S.bag.length;
  return `<section class="card">
    <h2>Build the bag</h2>
    <p class="hint">Tap characters to put them in the bag, or pick a random setup and adjust it. You need ${plural(n, "character")} for ${plural(n, "player")}.</p>
    <div class="row"><button class="btn" data-act="random">🎲 Random setup</button><button class="btn" data-act="empty-bag" ${size ? "" : "disabled"}>Empty the bag</button></div>
    ${countsHtml(n, roles)}
    ${shownSel}
  </section>
  ${TEAMS.map(t => `<section class="card">
    <div class="team-h"><h3 class="t-${t}">${TEAM_LABEL[t]}</h3><span class="hint">${S.bag.filter(b => teamOf(b.role) === t).length} in the bag</span></div>
    <div class="tiles">${R[t].map(([name, icon]) => `<button class="tile ${t}" data-act="toggle" data-role="${esc(name)}" aria-pressed="${inBag.has(name)}"><span class="ico" aria-hidden="true">${icon}</span>${esc(name)}</button>`).join("")}</div>
  </section>`).join("")}
  <section class="card sticky">
    <div class="row">
      <button class="btn" data-act="to-players">← Players</button>
      <span class="spacer"></span>
      <span class="${size === n ? "hint" : "warn"}">${size} of ${n} in the bag</span>
      <button class="btn primary" data-act="start-draw" ${size === n ? "" : "disabled"}>Start the draw →</button>
    </div>
  </section>`;
}

/* ---------- The Grimoire ---------- */
const roleOf = pid => (S.drawn[pid] || {}).role || "";
const shownOf = pid => (S.drawn[pid] || {}).shown || "";
const sideOf = pid => (S.drawn[pid] || {}).align || alignOf(roleOf(pid));
const seatNo = pid => S.players.findIndex(p => p.id === pid) + 1;
const inPlay = () => S.players.map(p => p.id).filter(pid => roleOf(pid));
const remsOf = pid => S.rem[pid] || [];
const addRem = (pid, r) => { S.rem[pid] = [...new Set([...remsOf(pid), r])]; };
const alive = pid => !S.dead[pid];
const scriptChars = (teams = TEAMS) => teams.flatMap(t => SCRIPTS[S.script].roles[t].map(x => x[0]));
const listJoin = a => a.length <= 1 ? (a[0] || "") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
const names = pids => listJoin(pids.map(nameOf));
const pickOne = a => a.length ? a[rnd(a.length)] : "";
const REM_CLS = { Poisoned: "", Drunk: "", Cursed: "", Mad: "", Dead: "", Safe: "safe", Protected: "safe", Master: "info", "Red herring": "info", Grandchild: "info", Twin: "info" };
const REM_ALL = ["Poisoned", "Drunk", "Protected", "Safe", "Cursed", "Mad", "Master", "Red herring", "Grandchild", "Twin"];

// Good characters not in play, and not what the Drunk thinks they are
function freeGood() {
  const used = new Set(inPlay().flatMap(pid => [roleOf(pid), shownOf(pid)]));
  return scriptChars(["townsfolk", "outsider"]).filter(r => !used.has(r));
}
function autoBluffs() {
  const free = freeGood().filter(r => !S.bluffs.includes(r));
  const tf = shuffle(free.filter(r => teamOf(r) === "townsfolk")), out = shuffle(free.filter(r => teamOf(r) === "outsider"));
  S.bluffs = S.bluffs.map(b => b || tf.shift() || out.shift() || "");
}
const ftInPlay = () => inPlay().some(pid => roleOf(pid) === "Fortune Teller" || shownOf(pid) === "Fortune Teller");
function autoRedHerring() {
  if (!ftInPlay() || S.redHerring) return;
  S.redHerring = pickOne(inPlay().filter(pid => sideOf(pid) === "good"));
}
// Get the Grimoire ready the first time the Storyteller sees it
function setupGrim() {
  S.bluffs = S.bluffs || ["", "", ""];
  S.rem = S.rem || {}; S.dead = S.dead || {}; S.log = S.log || [];
  S.n = S.n || 1; S.used = S.used || {}; S.deathCause = S.deathCause || {}; S.history = S.history || [];
  for (const pid of inPlay()) if (!S.drawn[pid].align) S.drawn[pid].align = alignOf(roleOf(pid));
  autoBluffs(); autoRedHerring();
}

function tokenSize(n) { return n <= 7 ? 19 : n <= 10 ? 16.5 : n <= 13 ? 14 : 12.5; }
function circleHtml(opts = {}) {
  const n = S.players.length, tok = tokenSize(n);
  const seats = S.players.map((p, i) => {
    const a = (i / n) * 2 * Math.PI - Math.PI / 2, x = 50 + 39 * Math.cos(a), y = 50 + 39 * Math.sin(a);
    const role = roleOf(p.id), c = CHAR[role] || { icon: "" };
    const word = Math.max(...(role || "x").split(/\s+/).map(w => w.length));
    const rems = [...(p.id === S.redHerring ? ["Red herring"] : []), ...remsOf(p.id)];
    const hl = opts.hl && opts.hl.includes(p.id);
    return `<button class="seat ${sideOf(p.id)} ${S.dead[p.id] ? "dead" : ""} ${ui.sel === p.id || hl ? "sel" : ""}" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%" data-act="sel" data-pid="${p.id}" aria-label="Seat ${i + 1}: ${esc(nameOf(p.id))}, ${esc(role || "no character")}">
      <span class="disc">${role ? `<span class="ico" aria-hidden="true">${c.icon}</span><span class="nm" style="--fs:${Math.min(.17, 1.45 / word).toFixed(3)}">${esc(role)}</span>${shownOf(p.id) ? `<span class="th">${esc(shownOf(p.id))}</span>` : ""}` : `<span class="nm" style="--fs:.12">?</span>`}</span>
      <span class="plate">${esc(nameOf(p.id))}</span>
      ${rems.length ? `<span class="rems">${rems.map(r => `<span class="rem ${REM_CLS[r] ?? "info"}">${esc(r)}</span>`).join("")}</span>` : ""}
    </button>`;
  }).join("");
  const label = S.step === "night" ? `Night ${S.n}` : S.step === "day" ? `Day ${S.day.n}` : "Setup";
  return `<div class="circle" style="--tok:min(96px, ${tok}cqi)">
    ${seats}
    <div class="center"><span class="ph">${label}</span>
      ${S.bluffs.some(Boolean) ? `<span class="hint">Bluffs</span><span class="bluff-icons">${S.bluffs.filter(Boolean).map(b => `<span title="${esc(b)}">${(CHAR[b] || {}).icon || "?"}</span>`).join("")}</span>` : ""}
    </div>
  </div>`;
}

function playerPanel(pid) {
  const role = roleOf(pid), R = scriptChars();
  return `<section class="card">
    <div class="row"><h2 style="margin-right:auto">${seatNo(pid)}. ${esc(nameOf(pid))}</h2><button class="icon" data-act="sel" data-pid="${pid}" aria-label="Close">×</button></div>
    <label class="field"><span class="label">Character</span><select data-setrole="${pid}">${R.map(r => `<option ${r === role ? "selected" : ""}>${esc(r)}</option>`).join("")}</select></label>
    ${SHOWN[role] ? `<label class="field"><span class="label">Thinks they are the</span><select data-setshown="${pid}">${scriptChars([SHOWN[role]]).map(r => `<option ${r === shownOf(pid) ? "selected" : ""}>${esc(r)}</option>`).join("")}</select></label>` : ""}
    <div class="row">
      <span class="seg"><button class="g" data-act="side" data-pid="${pid}" data-v="good" aria-pressed="${sideOf(pid) === "good"}">Good</button><button class="e" data-act="side" data-pid="${pid}" data-v="evil" aria-pressed="${sideOf(pid) === "evil"}">Evil</button></span>
      <button class="btn" data-act="dead" data-pid="${pid}">${S.dead[pid] ? "Bring back to life" : "Mark dead"}</button>
    </div>
    <div class="field"><span class="label">Reminders</span>
      <div class="row">${remsOf(pid).map(r => `<span class="rem big ${REM_CLS[r] ?? "info"}">${esc(r)} <button class="x" data-act="unrem" data-pid="${pid}" data-r="${esc(r)}" aria-label="Remove ${esc(r)}">×</button></span>`).join("") || `<span class="hint">None</span>`}</div>
      <select data-addrem="${pid}"><option value="">+ Add a reminder</option>${REM_ALL.filter(r => !remsOf(pid).includes(r)).map(r => `<option>${r}</option>`).join("")}</select>
    </div>
    <button class="btn" data-act="show-again" data-pid="${pid}">Show them their character</button>
  </section>`;
}

function grimHtml() {
  const bluffSel = i => {
    const free = new Set(freeGood());
    const opts = scriptChars(["townsfolk", "outsider"]).filter(r => r === S.bluffs[i] || (free.has(r) && !S.bluffs.includes(r)));
    return `<select data-bluff="${i}" aria-label="Bluff ${i + 1}"><option value="">Bluff ${i + 1}</option>${opts.map(r => `<option value="${esc(r)}" ${r === S.bluffs[i] ? "selected" : ""}>${esc((CHAR[r] || {}).icon || "")} ${esc(r)}</option>`).join("")}</select>`;
  };
  const side = ui.sel ? playerPanel(ui.sel) : "";
  const setup = S.phase !== "day1" ? `
    <section class="card">
      <h2>Demon bluffs</h2>
      <p class="hint">3 good characters not in play. The Demon is shown these on Night 1.</p>
      <div class="bluffs">${[0, 1, 2].map(bluffSel).join("")}</div>
      <div class="row"><button class="btn" data-act="bluffs-random">🎲 Pick for me</button></div>
    </section>
    ${ftInPlay() ? `<section class="card">
      <h2>Red herring</h2>
      <p class="hint">A good player who registers as a Demon to the Fortune Teller.</p>
      <select data-redherring><option value="">None</option>${inPlay().filter(pid => sideOf(pid) === "good").map(pid => `<option value="${pid}" ${pid === S.redHerring ? "selected" : ""}>${esc(nameOf(pid))} (${esc(roleOf(pid))})</option>`).join("")}</select>
    </section>` : ""}
    <section class="card">
      <h2>Ready?</h2>
      <p class="hint">Night 1 takes you through everyone who wakes, in order. For each one you'll check their info, then show them the phone.</p>
      <div class="row"><button class="btn" data-act="redraw">Draw again</button><span class="spacer"></span><button class="btn primary" data-act="start-night">Start Night 1 →</button></div>
    </section>` : `
    <section class="card"><h2>Night 1</h2>${logHtml()}</section>
    <section class="card"><div class="row"><button class="btn danger" data-act="new-game">New game</button></div></section>`;
  return `<div class="grim-wrap">
    <div>${circleHtml()}<p class="hint" style="text-align:center">Tap a player to change their character, reminders or alive/dead.</p></div>
    <div class="side">${side}${setup}</div>
  </div>`;
}
const logHtml = () => S.log.length ? `<ol class="log">${S.log.map(l => `<li>${l}</li>`).join("")}</ol>` : `<p class="hint">Nothing logged.</p>`;

/* ---------- Nights ---------- */
// First night wake order. MINION and DEMON are the evil team's info (7 or more players).
const FIRST_NIGHT = ["TOLD", "Philosopher", "MINION", "Lunatic", "DEMON", "Sailor", "Courtier", "Poisoner", "Snake Charmer", "Godfather", "Devil's Advocate", "Evil Twin", "Witch", "Cerenovus", "Pukka", "Washerwoman", "Librarian", "Investigator", "Chef", "Empath", "Fortune Teller", "Butler", "Grandmother", "Clockmaker", "Dreamer", "Seamstress", "Spy", "Chambermaid", "Mathematician"];
// Every other night. TOLD wakes a player whose character changed, to tell them.
const OTHER_NIGHTS = ["TOLD", "Philosopher", "Poisoner", "Sailor", "Courtier", "Innkeeper", "Gambler", "Snake Charmer", "Monk", "Devil's Advocate", "Witch", "Cerenovus", "Pit-Hag", "Exorcist", "Lunatic", "Imp", "Zombuul", "Pukka", "Shabaloth", "Po", "Fang Gu", "No Dashii", "Vortox", "Vigormortis", "Assassin", "Godfather", "Gossip", "Tinker", "Sage", "Professor", "Ravenkeeper", "Empath", "Fortune Teller", "Undertaker", "Dreamer", "Flowergirl", "Town Crier", "Oracle", "Seamstress", "Juggler", "Butler", "Spy", "Chambermaid", "Mathematician"];
// pick: how many players they choose. chars: they choose a character too. rem: the reminder their choice gets.
// once: once per game. when: whether they wake (default: alive). kill: their choice can kill.
const ACT = {
  TOLD: { info: "told", when: () => true },
  Philosopher: { pick: 0, chars: ["townsfolk", "outsider"], optional: true, once: true, say: "Choose a good character to gain their ability, or keep your ability for another night." },
  Sailor: { pick: 1, say: "Choose a player: either you or they are drunk until dusk." },
  Courtier: { pick: 0, chars: TEAMS, optional: true, once: true, say: "Choose a character: they are drunk for 3 nights & 3 days. Or keep your ability for another night." },
  Poisoner: { pick: 1, rem: "Poisoned", say: "Choose a player to poison." },
  "Snake Charmer": { pick: 1, result: "snake", say: "Choose a player. If they are the Demon, you swap characters and alignments." },
  Godfather: { info: "outsiders" },
  "Devil's Advocate": { pick: 1, rem: "Safe", say: "Choose a player: if they are executed tomorrow, they don't die." },
  "Evil Twin": { info: "twin" },
  Witch: { pick: 1, rem: "Cursed", say: "Choose a player to curse: if they nominate tomorrow, they die." },
  Cerenovus: { pick: 1, chars: ["townsfolk", "outsider"], rem: "Mad", say: "Choose a player and a good character: tomorrow they must be mad that they are this character." },
  Pukka: { pick: 1, rem: "Poisoned", say: "Choose a player to poison." },
  Washerwoman: { info: "pair", team: "townsfolk" },
  Librarian: { info: "pair", team: "outsider" },
  Investigator: { info: "pair", team: "minion" },
  Chef: { info: "number", calc: "chef", say: "Pairs of evil players sitting next to each other" },
  Empath: { info: "number", calc: "empath", say: "Evil players among your 2 alive neighbours" },
  "Fortune Teller": { pick: 2, result: "ft", say: "Choose 2 players: you learn if either is the Demon." },
  Butler: { pick: 1, notSelf: true, rem: "Master", say: "Choose your master (not yourself): tomorrow, you may only vote if they are voting too." },
  Grandmother: { info: "grandchild" },
  Clockmaker: { info: "number", calc: "clock", say: "Steps from the Demon to its nearest Minion" },
  Dreamer: { pick: 1, notSelf: true, result: "dream", say: "Choose a player: you learn 1 good and 1 evil character, 1 of which is theirs." },
  Seamstress: { pick: 2, notSelf: true, optional: true, once: true, result: "seam", say: "You may choose 2 players (not yourself): you learn if they are the same alignment. Once per game." },
  Spy: { info: "grim" },
  Chambermaid: { pick: 2, notSelf: true, result: "chamber", say: "Choose 2 players (not yourself): you learn how many of them woke tonight because of their own ability." },
  Mathematician: { info: "number", calc: "math", say: "Players whose abilities worked abnormally tonight" },

function endNotes(pid, died) {
  const notes = [], role = roleOf(pid), left = aliveIds().length;
  if (role === "Saint" && died) notes.push(unreliable(pid).length ? "The Saint was executed, but they are drunk or poisoned: the game goes on." : "The Saint was executed: <b>evil wins</b>.");
  if (teamOf(role) === "demon" && died) {
    const sw = inPlay().find(q => roleOf(q) === "Scarlet Woman" && alive(q));
    if (sw && left + 1 >= 5) notes.push(`The Demon was executed, but there were 5 or more alive: <b>${esc(nameOf(sw))}, the Scarlet Woman, becomes the ${esc(role)}</b>. Wake them tonight to tell them.`);
    else if (inPlay().some(q => roleOf(q) === "Mastermind" && alive(q))) notes.push("The Demon was executed, but the Mastermind is alive: play one more day.");
    else notes.push("The Demon was executed: <b>good wins</b>.");
  }
  if (left <= 2 && !(teamOf(role) === "demon" && died)) notes.push("Only 2 players are left alive: <b>evil wins</b>.");
  if (remsOf(pid).includes("Twin") && sideOf(pid) === "good" && died) notes.push("The Evil Twin's good twin was executed: <b>evil wins</b>.");
  return notes;
}
// When the Demon dies with 5 or more alive, the Scarlet Woman becomes the Demon and is told at night
function scarletTakeover(demon) {
  const sw = inPlay().find(q => roleOf(q) === "Scarlet Woman" && alive(q) && !unreliable(q).length);
  if (!sw || teamOf(roleOf(demon)) !== "demon" || aliveIds().length + 1 < 5) return "";
  S.drawn[sw] = { ...S.drawn[sw], role: roleOf(demon) };
  tell(sw);
  return sw;
}
function execute(pid, cause, dies = true) {
  if (dies) { S.dead[pid] = true; S.deathCause = { ...(S.deathCause || {}), [pid]: cause }; }
  S.day.exec = { pid, cause, dies, notes: endNotes(pid, dies) };
  if (dies) S.day.exec.sw = scarletTakeover(pid);
  S.day.done = true; S.day.draft = null;
}

// Whether the game is over, and who won. ctx says what just happened.
function winCheck(ctx = {}) {
  const live = aliveIds(), e = ctx.exec;
  if (e && e.dies && roleOf(e.pid) === "Saint" && !unreliable(e.pid).length) return { winner: "evil", reason: `${nameOf(e.pid)}, the Saint, was executed.` };
  if (e && e.dies && remsOf(e.pid).includes("Twin") && sideOf(e.pid) === "good") return { winner: "evil", reason: `${nameOf(e.pid)}, the Evil Twin's good twin, was executed.` };
  if (!demons().some(alive)) {
    if (e && e.dies && teamOf(roleOf(e.pid)) === "demon" && inPlay().some(q => roleOf(q) === "Mastermind" && alive(q))) return null;
    const k = ctx.killed || (e && e.pid), d = k && teamOf(roleOf(k)) === "demon" ? k : demons().filter(q => S.dead[q]).pop();
    return { winner: "good", reason: d ? `The Demon, ${nameOf(d)} the ${roleOf(d)}, is dead.` : "No Demon is alive." };
  }
  if (live.length <= 2) return { winner: "evil", reason: "Only 2 players are left alive." };
  if (ctx.noExec && inPlay().some(q => roleOf(q) === "Vortox" && alive(q))) return { winner: "evil", reason: "Nobody was executed while the Vortox is alive." };
  if (ctx.noExec && live.length === 3 && live.some(q => roleOf(q) === "Mayor" && !unreliable(q).length)) return { winner: "good", reason: "Only 3 players are alive, nobody was executed, and the Mayor is alive." };
  return null;
}
// Stop the game when someone has won. before is the state to go back to.
function checkOver(before, ctx) {
  const w = winCheck(ctx);
  if (w) { S.over = { ...w, before }; ui.sel = null; }
}
// Reveal each player's character on the Town Square, one at a time, in whatever order makes the best ending

    <div class="pickgrid">${S.players.map(p => { const on = shown.includes(p.id); return `<button class="pick ${on ? "" : ""}" data-act="reveal-one" data-pid="${p.id}" aria-pressed="${on}">${esc(nameOf(p.id))}<small>${on ? esc(roleOf(p.id)) : "tap to reveal"}</small></button>`; }).join("")}</div>
    <div class="row"><button class="btn" data-act="reveal-all" ${shown.length === S.players.length ? "disabled" : ""}>Reveal everyone</button>${shown.length ? `<button class="btn" data-act="reveal-none">Hide them all again</button>` : ""}</div>
    <p class="hint">Each reveal flashes up big on the Town Square. Tap a revealed player again to hide them.</p></div>`;
}
function overHtml() {

/* The Slayer's shot */
// tags: a note under a name. locked: players who can't be picked right now.
const pickBtns = (ids, act, sel = [], tags = {}, locked = []) => `<div class="pickgrid">${ids.map(q => `<button class="pick ${S.dead[q] ? "dead" : ""}" data-act="${act}" data-pid="${q}" aria-pressed="${sel.includes(q)}" ${locked.includes(q) ? "disabled" : ""}>${esc(nameOf(q))}${tags[q] ? `<small>${esc(tags[q])}</small>` : ""}</button>`).join("")}</div>`;
// The Butler (alive, sober and healthy) may only vote if their master votes too
function butlerRule() {
  const butler = inPlay().find(q => roleOf(q) === "Butler" && alive(q) && !unreliable(q).length);
  const master = butler && S.players.map(p => p.id).find(q => remsOf(q).includes("Master"));
  return butler && master ? { butler, master } : null;
}
function slayerHtml(d) {
  if (d.stage === "slayer-by") return `<section class="card"><h2>🏹 Slayer shot: who is shooting?</h2><p class="hint">Anyone can claim to be the Slayer. Tap the player who shoots.</p>
    ${pickBtns(aliveIds(), "slay-by")}<div class="row"><button class="btn" data-act="nom-cancel">Cancel</button></div></section>`;
  if (d.stage === "slayer-at") return `<section class="card"><h2>🏹 ${esc(nameOf(d.by))} shoots…</h2>
    ${pickBtns(S.players.map(p => p.id).filter(q => q !== d.by), "slay-at")}<div class="row"><button class="btn" data-act="nom-cancel">Cancel</button></div></section>`;
  const r = slayerResult(d.by, d.at);
  return `<section class="card"><h2>🏹 ${esc(nameOf(d.by))} shoots ${esc(nameOf(d.at))}</h2>
    <p><b>${esc(nameOf(d.by))}</b> is the <b>${esc(roleOf(d.by))}</b>. <b>${esc(nameOf(d.at))}</b> is the <b>${esc(roleOf(d.at))}</b>.</p>
    <p class="notice">${esc(r.why)}</p>

    <div class="row"><button class="btn ${r.hit ? "evil" : ""}" data-act="slay-ok" data-v="1">${esc(nameOf(d.at))} dies</button><button class="btn ${r.hit ? "" : "primary"}" data-act="slay-ok" data-v="0">Nothing happens</button><span class="spacer"></span><button class="btn" data-act="nom-cancel">Cancel</button></div>
    ${r.real ? `<p class="hint">Either way, the Slayer's ability is now used up.</p>` : ""}</section>`;
}
function slayerResult(by, at) {
  const real = roleOf(by) === "Slayer", demon = teamOf(roleOf(at)) === "demon";
  if (!real) return { real, hit: false, why: `${nameOf(by)} isn't the Slayer, so nothing happens.` };
  if (S.used[by]) return { real, hit: false, why: "The Slayer has already used their ability, so nothing happens." };
  const bad = unreliable(by);
  if (bad.length) return { real, hit: false, why: `The Slayer's ability doesn't work (${bad[0]}), so nothing happens.` };
  return demon ? { real, hit: true, why: `${nameOf(at)} is the Demon: they die.` } : { real, hit: false, why: `${nameOf(at)} isn't the Demon, so nothing happens.` };
}
const shotLines = () => (S.day.shots || []).map(x => `🏹 <b>${esc(nameOf(x.by))}</b> shot <b>${esc(nameOf(x.at))}</b>: ${x.died ? `${esc(nameOf(x.at))} died` : "nothing happened"}.`);

function townCircle(hl = []) {
  const n = S.players.length, tok = tokenSize(n), spent = ghostSpent();
  const seats = S.players.map((p, i) => {
    const a = (i / n) * 2 * Math.PI - Math.PI / 2, x = 50 + 39 * Math.cos(a), y = 50 + 39 * Math.sin(a);
    const nm = nameOf(p.id), word = Math.max(...nm.split(/\s+/).map(w => w.length), 3);
    const dead = S.dead[p.id];
    return `<div class="seat town ${dead ? "dead" : ""} ${hl.includes(p.id) ? "sel" : ""}" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%">
      <span class="disc"><span class="nm" style="--fs:${Math.min(.2, 1.3 / word).toFixed(3)}">${esc(nm)}</span>${dead ? `<span class="th">${spent.has(p.id) ? "no vote" : "👻 ghost vote"}</span>` : ""}</span>
      <span class="plate">${i + 1}</span>
    </div>`;
  }).join("");
  const b = onBlock();
  return `<div class="circle" style="--tok:min(96px, ${tok}cqi)">${seats}
    <div class="center"><span class="ph">Day ${S.day.n}</span><span class="hint">${aliveIds().length} alive · ${votesNeeded()} to execute</span>
    ${b.who && !S.day.done ? `<span class="hint">On the block: <b>${esc(nameOf(b.who))}</b> (${b.best})</span>` : ""}</div>
  </div>`;
}

function nomListHtml() {

    ${S.day.done ? "" : `<button class="x-inline" data-act="nom-del" data-i="${k}" aria-label="Delete this nomination">×</button>`}</li>`).join("")}</ol>`;
}

function dayHtml() {
  const D = S.day, d = D.draft, need = votesNeeded();
  let card;
  if (D.done) {

    card = `<section class="card"><h2>Day ${D.n} is over</h2>
      ${e ? `<p class="lead">${e.dies ? `<b>${esc(nameOf(e.pid))}</b> was executed${e.cause === "executed" ? "" : ` (${esc(e.cause)})`} and died.` : `<b>${esc(nameOf(e.pid))}</b> was executed but did not die.`}</p>` : `<p class="lead">Nobody was executed.</p>`}

      <h3>Nominations</h3>${nomListHtml()}

      <div class="row"><button class="btn primary" data-act="nom-new">+ New nomination</button><button class="btn" data-act="slay-new">🏹 Slayer shot</button><button class="btn" data-act="timer-open">⏱ Timer${T.end || T.left ? ` <span id="tBadge">${fmtTime(timerLeft())}</span>` : ""}</button><span class="spacer"></span><button class="btn" data-act="day-end">End the day →</button></div>

    card = `<section class="card"><h2>${esc(nameOf(d.by))} nominates…</h2><p class="hint">Players who haven't been nominated today.</p>

      <p><b>${esc(nameOf(d.by))}</b> is the <b>${esc(roleOf(d.by))}</b>: ${tf ? "a Townsfolk." : `not a Townsfolk${spy ? " (but the Spy might register as one)" : roleOf(d.by) === "Drunk" ? " (the Drunk only thinks they are)" : ""}.`}</p>
      ${why.length ? `<p class="warn">⚠ The Virgin's ability doesn't work: ${esc(listJoin(why))}.</p>` : ""}
      <p class="notice">${fires ? `${esc(nameOf(d.by))} is executed immediately, and the day ends.` : "Nothing happens. Go on to the vote."}</p>
      <div class="row"><button class="btn ${fires ? "primary" : ""}" data-act="virgin-exec">Execute ${esc(nameOf(d.by))}</button><button class="btn ${fires ? "" : "primary"}" data-act="virgin-no">Nothing happens: vote</button><span class="spacer"></span><button class="btn" data-act="nom-cancel">Cancel</button></div>
      <p class="hint">Either way, the Virgin's ability is now used up.</p></section>`;
  } else {
    const voters = S.players.map(p => p.id).filter(hasVote), count = d.votes.length;
    const br = butlerRule();

    card = `<section class="card"><h2>Votes for ${esc(nameOf(d.of))}</h2>

      ${pickBtns(voters, "vote", d.votes, br ? { [br.butler]: `🔒 after ${nameOf(br.master)}` } : {}, locked)}
      <p class="lead"><b class="bignum">${count}</b> of ${need} needed${onBlock().best ? ` · ${onBlock().best} to beat` : ""}</p>
      ${br ? `<p class="hint">🔒 ${esc(nameOf(br.butler))} can only vote once ${esc(nameOf(br.master))} has voted.</p>` : ""}

      ${survives ? `<p class="warn">⚠ They might not die: ${remsOf(who).includes("Safe") ? "the Devil's Advocate protected them" : role === "Fool" || role === "Zombuul" ? `they are the ${esc(role)}` : "the Pacifist is in play"}.</p>` : ""}
      <div class="row">${who ? `<button class="btn primary" data-act="exec" data-pid="${who}">Execute ${esc(nameOf(who))}</button><button class="btn" data-act="exec-live" data-pid="${who}">Executed, but they don't die</button>` : `<button class="btn primary" data-act="exec-none">No execution</button>`}<span class="spacer"></span><button class="btn" data-act="day-end-back">← Back</button></div>
    </section>`;
  }
  const hl = d ? [d.by, d.of].filter(Boolean) : D.exec ? [D.exec.pid] : [];
  return `<div class="grim-wrap">
    <div>${card}${ui.reveal && ui.sel ? playerPanel(ui.sel) : ""}</div>
    <div>${ui.reveal ? circleHtml({ hl }) : townCircle(hl)}
      <div class="row" style="justify-content:center;margin-top:8px"><button class="btn" data-act="reveal">${ui.reveal ? "🙈 Hide the Grimoire" : "👁 Show the Grimoire"}</button></div>
      <p class="hint" style="text-align:center">${ui.reveal ? "Tap a player to change them. Hide it before players can see." : "The town view shows no characters, so it's safe if players see the screen."}</p>
    </div>
  </div>`;
}

/* ---------- The Storyteller's script, read out at the end ---------- */
// It keeps everyone's secret until they die: before that, players are only "the Empath" or "the Imp",
// and the evil team is unmasked at the very end.
const STORY_VERB = { Poisoner: "poisoned", Pukka: "poisoned", Monk: "protected", Innkeeper: "protected", Witch: "cursed", "Devil's Advocate": "protected from execution", Sailor: "drank with", Butler: "chose as their master", Exorcist: "tried to exorcise", "Snake Charmer": "charmed", Dreamer: "dreamt about", Seamstress: "compared", Chambermaid: "watched", "Fortune Teller": "looked into the futures of", Ravenkeeper: "pointed at", Professor: "tried to bring back", Assassin: "assassinated", Godfather: "chose", Imp: "attacked", Zombuul: "attacked", Shabaloth: "attacked", Po: "attacked", "Fang Gu": "attacked", "No Dashii": "attacked", Vortox: "attacked", Vigormortis: "attacked" };
function storyHtml() {
  const out = [], P = t => out.push(`<p>${t}</p>`), H = t => out.push(`<h3>${esc(t)}</h3>`);
  const shown = new Set(); // players whose character has been revealed
  const deeds = {};        // what each evil player did, held back until they're unmasked: pid -> [{ n, clause }]
  const said = {};         // the last thing each info character learnt, so repeats can be skipped
  let nights = 0;
  const nm = q => `<b>${esc(nameOf(q))}</b>`;
  // A player as the story may name them: by character until revealed, by name after
  const ref = (q, roles) => {
    if (shown.has(q)) return nm(q);
    const r = roles[q] || roleOf(q);
    return `the ${esc(r === "Drunk" && S.drawn[q] && S.drawn[q].shown ? S.drawn[q].shown : r)}`; // the Drunk keeps their secret
  };
  const known = q => { shown.add(q); return ""; };
  // "Looking back, Dad had been busy: they poisoned Sophie on Night 1 and Mum on Night 2."
  const flashback = q => {
    const list = deeds[q] || [];
    delete deeds[q];
    if (!list.length) return "";
    const when = ns => ns.length > 1 && ns.length === nights ? "every night" : `on ${ns.length > 1 ? "Nights" : "Night"} ${listJoin(ns.map(String))}`;
    const verbs = [...new Set(list.map(d => d.verb))], perNight = new Set(list.map(d => d.n)).size === list.length;
    let text;
    if (verbs.length === 1 && perNight) {
      // One kind of deed, once a night: "poisoned Ben on Night 1, Gus on Night 2 and Ann on Night 3"
      const objs = [...new Set(list.map(d => d.obj))];
      text = objs.length === 1 ? `${verbs[0]}${objs[0] ? " " + objs[0] : ""} ${when(list.map(d => d.n))}` : `${verbs[0]} ${listJoin(list.map(d => `${d.obj} on Night ${d.n}`))}`;
    } else {
      // Otherwise night by night: "on Night 3 they became the Imp and killed Gus"
      const byNight = {};
      list.forEach(d => (byNight[d.n] = byNight[d.n] || []).push(`${d.verb}${d.obj ? " " + d.obj : ""}`));
      text = listJoin(Object.entries(byNight).map(([n, ds]) => `on Night ${n}, they ${listJoin(ds)}`));
      return ` Looking back, ${nm(q)} had been busy: ${text}.`;
    }
    return ` Looking back, ${nm(q)} had been busy: they ${text}.`;
  };
  const reveal = (q, role) => {
    if (shown.has(q)) return "";
    shown.add(q);
    const d = S.drawn[q], evil = alignOf(role) === "evil";
    return ` ${nm(q)} was the <b class="t-${teamOf(role)}">${esc(role)}</b>${role === "Drunk" && d && d.shown ? `, who believed they were the ${esc(d.shown)}` : ""}${evil ? "!" + flashback(q) : "."}`;
  };
  const chron = [...(S.chron || [])];
  if (S.step === "day" && S.day && !chron.some(c => c.type === "day" && c.n === S.day.n)) chron.push(dayRecord());
  P(`Gather round, everyone, and let me tell you what really happened in this game of <i>${esc(SCRIPTS[S.script].name)}</i>. Some of you have been hiding who you really are. Not for much longer.`);
  const NIGHT_OPEN = ["Night fell, and the town closed their eyes once more.", "Darkness returned to the town.", "Once again, the town slept.", "Night came, and with it, danger."];
  const QUIET_DAWN = ["When the sun rose, everyone was still alive.", "Morning came, and to everyone's relief, nobody had died.", "The town woke to find everyone safe, for now."];
  const DAY_OPEN = ["The town gathered again, fewer and warier than before.", "Suspicion hung over the town square.", "The town met once more, looking for the Demon among them."];
  for (const ph of chron) {
    if (ph.type === "night") {

   the messages go straight between the two players' devices and never come here. */
const chatDay = () => S.step === "day" && !S.over;
const tellPlayer = (pid, m) => { const P = town.players[pid]; if (P && P.conn.open) try { P.conn.send(m); } catch (e) {} };
const inChat = pid => town.chats.some(c => c.a === pid || c.b === pid);
function fromPlayer(c, m) {
  if (!m || !m.t) return;
  if (m.t === "join") {
    const pid = m.pid;
    if (!S.players.some(p => p.id === pid)) return c.send({ t: "error", why: "That seat isn't in this game." });
    S.linkSecrets = S.linkSecrets || {};
    if (S.linkSecrets[pid] && S.linkSecrets[pid] !== m.secret) return c.send({ t: "error", why: `Someone else has already joined as ${nameOf(pid)}.` });
    S.linkSecrets[pid] = m.secret; save();
    const old = town.players[pid];
    if (old && old.conn !== c) try { old.conn.close(); } catch (e) {}
    town.players[pid] = { conn: c, peer: c.peer };
    c.pid = pid;
    sendLobby(true); renderTown(); return;
  }
  const me = c.pid;
  if (!me) return;
  if (m.t === "chat-req") {
    const to = m.to, no = why => c.send({ t: "chat-no", to, why });
    if (!chatDay()) return no("Private chats are only allowed during the day.");
    if (!town.players[to]) return no(`${nameOf(to)} isn't linked to the game.`);
    if (inChat(me)) return no("You're already in a private chat.");
    if (inChat(to)) return no(`${nameOf(to)} is already in a private chat.`);
    const id = uid();
    town.reqs[id] = { from: me, to };
    c.send({ t: "chat-wait", id, to });
    tellPlayer(to, { t: "chat-req", id, from: me });
    return;
  }
  if (m.t === "chat-cancel" || m.t === "chat-ans") {
    const r = town.reqs[m.id];
    if (!r) return;
    delete town.reqs[m.id];
    if (m.t === "chat-cancel") return tellPlayer(r.to, { t: "chat-gone", id: m.id });
    if (!m.ok) return tellPlayer(r.from, { t: "chat-no", to: r.to, why: `${nameOf(r.to)} said no.` });
    if (!chatDay() || inChat(r.from) || inChat(r.to) || !town.players[r.from]) { tellPlayer(r.to, { t: "chat-gone", id: m.id }); return tellPlayer(r.from, { t: "chat-no", to: r.to, why: "The chat couldn't start." }); }
    town.chats.push({ id: m.id, a: r.from, b: r.to });
    tellPlayer(r.from, { t: "chat-open", id: m.id, with: r.to, peer: town.players[r.to].peer, call: true });
    tellPlayer(r.to, { t: "chat-open", id: m.id, with: r.from, peer: town.players[r.from].peer, call: false });
    sendLobby(true); townSend(true); renderTown();
    return;
  }
  if (m.t === "chat-end") endChat(m.id, `${nameOf(me)} ended the chat.`);
}
function endChat(id, why) {
  const ch = town.chats.find(x => x.id === id);
  if (!ch) return;
  town.chats = town.chats.filter(x => x !== ch);
  for (const pid of [ch.a, ch.b]) tellPlayer(pid, { t: "chat-closed", id, why });
  sendLobby(true); townSend(true); renderTown();
}
function playerLeft(c) {
  const pid = c.pid;
  if (!pid || !town.players[pid] || town.players[pid].conn !== c) return;
  delete town.players[pid];
  town.chats.filter(x => x.a === pid || x.b === pid).forEach(x => endChat(x.id, `${nameOf(pid)} left the game.`));
  for (const [id, r] of Object.entries(town.reqs)) if (r.from === pid || r.to === pid) { delete town.reqs[id]; tellPlayer(r.from === pid ? r.to : r.from, { t: r.from === pid ? "chat-gone" : "chat-no", id, to: r.to, why: `${nameOf(pid)} left.` }); }
  sendLobby(true);
}
// Who's here, who's busy, and whether it's daytime, for every linked player
function sendLobby(force) {
  if (!chatDay() && (town.chats.length || Object.keys(town.reqs).length)) {
    town.chats.slice().forEach(x => endChat(x.id, "Night has fallen. Private chats are over."));
    for (const [id, r] of Object.entries(town.reqs)) { tellPlayer(r.to, { t: "chat-gone", id }); tellPlayer(r.from, { t: "chat-no", to: r.to, why: "Night has fallen." }); }
    town.reqs = {};
  }
  const base = lobbyBase();
  const json = JSON.stringify(base);
  if (!force && json === town.lobby) return;
  town.lobby = json;
  for (const pid of Object.keys(town.players)) tellPlayer(pid, { ...base, you: pid });
}
function lobbyBase() {
  return { t: "lobby", day: chatDay(), script: S.script, ph: S.over ? null : S.step === "night" ? (S.n - 1) * 2 : S.step === "day" ? (S.n - 1) * 2 + 1 : null, label: S.over ? "Game over" : S.step === "night" ? `Night ${S.n}` : S.step === "day" ? `Day ${S.n}` : "Setting up",
    players: S.players.map(p => ({ id: p.id, name: nameOf(p.id), online: !!town.players[p.id], busy: inChat(p.id), dead: !!(S.dead || {})[p.id] })),
    chats: town.chats.map(c => [c.a, c.b]) };
}
// Send the public view to every Town Square screen, and to other windows on this device
function townSend(force) {
  const st = publicState(), json = JSON.stringify(st);
  if (!force && json === town.last) return;
  town.last = json;
  if (townBC) townBC.postMessage(st);
  sendLobby();
  town.conns = town.conns.filter(c => c.open);
  for (const c of town.conns) { try { c.send(st); } catch (e) {} }
}
setInterval(() => { townSend(true); sendLobby(true); }, 4000);

/* ---------- Pass and play ---------- */
function tokenHtml(role, shown) {
  const seen = shown || role, c = CHAR[seen] || { icon: "", text: "", team: "townsfolk" };
  const align = alignOf(seen);
  const word = Math.max(...seen.split(/\s+/).map(w => w.length));
  return `<p class="lead">You are the</p>
    <div class="big-tok ${align === "evil" ? "evil" : c.team}"><span class="ico" aria-hidden="true">${c.icon}</span><span class="nm" style="--fs:${Math.min(.13, .95 / word).toFixed(3)}">${esc(seen)}</span></div>
    <p class="lead"><span class="t-${c.team}" style="font-weight:800">${TEAM_ONE[c.team]}</span> · <span class="al-${align}">${align === "evil" ? "Evil" : "Good"}</span></p>
    ${c.text ? `<p class="ability">${esc(c.text)}${c.text.includes("night*") ? "<small>* not the first night</small>" : ""}</p>` : ""}`;
}

  if (!D && !show && !NP && !S.announce && !TM) { box.hidden = true; box.innerHTML = ""; return; }

  const handback = (go, again) => `<h1>Close your eyes</h1><p class="lead">Pass the phone back to the Storyteller.</p>
    <button class="btn primary huge" data-act="${go}">I'm the Storyteller</button>${again ? `<button class="link" data-act="${again}">Show them again</button>` : ""}`;

    else if (D.step === "pick") h = `<p class="lead">${name}, tap a token to draw it</p>
      <div class="bag-grid">${D.left.map((_, i) => `<button class="bag-tok" data-act="draw-pick" data-i="${i}" aria-label="Token ${i + 1}">?</button>`).join("")}</div>
      <button class="link" data-act="draw-back">Not ${name}? Go back</button>`;
    else if (D.step === "show") { const d = S.drawn[pid]; h = `${tokenHtml(d.role, d.shown)}<p class="hint">Remember it, then hide it before you pass the phone on.</p><button class="btn primary huge" data-act="draw-hide">Got it: hide it</button>`; }
    else if (D.step === "ready") h = `<p class="lead">${name}, you've drawn your character</p><button class="btn primary huge" data-act="draw-reshow">Show it again</button>`;
    else h = `<p class="hint">${total - D.queue.length} of ${total} drawn</p><p class="lead">Pass the phone to</p><h1>${name}</h1>
      <button class="btn primary huge" data-act="draw-me">I'm ${name}: draw my character</button>

/* ---------- Actions ---------- */
function addNames() {
  const el = $("newName");
  const names = el.value.split(/[,\n;]+/).map(s => s.trim()).filter(Boolean);
  if (!names.length) return;
  for (const name of names) S.players.push({ id: uid(), name });
  render();
  $("newName").focus();
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const i = Number(el.dataset.i), D = S.draw;
  switch (el.dataset.act) {
    case "add": return addNames();
    case "up": case "down": { const j = el.dataset.act === "up" ? i - 1 : i + 1; [S.players[i], S.players[j]] = [S.players[j], S.players[i]]; break; }
    case "del": S.players.splice(i, 1); break;
    case "clear-players": if (!confirm("Remove every player?")) return; S.players = []; break;
    case "to-bag": S.step = "bag"; break;
    case "to-players": S.step = "players"; break;

      const r = el.dataset.role;
      S.bag = S.bag.some(b => b.role === r) ? S.bag.filter(b => b.role !== r) : [...S.bag, { role: r, shown: "" }].sort(byTeam);

    }

    case "draw-reshow": D.step = "show"; break;
    case "draw-hide": D.queue.shift(); D.step = D.queue.length ? "pass" : "done"; break;
    case "draw-stop": D.step = "stop"; break;

    case "draw-finish": S.draw = null; S.step = "grim"; Object.assign(S, { bluffs: ["", "", ""], redHerring: "", rem: {}, dead: {}, log: [], phase: "", night: null, day: null, n: 1, used: {}, deathCause: {}, history: [], chron: [], toTell: [], today: null, ghostSpent: [], virginUsed: false, pukkaPrev: "", poCharged: false, fangJumped: false }); break;

    case "unrem": S.rem[el.dataset.pid] = remsOf(el.dataset.pid).filter(r => r !== el.dataset.r); break;
    case "bluffs-random": S.bluffs = ["", "", ""]; autoBluffs(); break;
    case "start-night":
      if (S.bluffs.filter(Boolean).length < 3 && S.players.length >= 7 && !confirm("You haven't chosen 3 bluffs for the Demon. Start anyway?")) return;
      S.n = 1; startNight(); wake(); break;
    case "night-cancel": if (S.preNight) S = JSON.parse(S.preNight); else { S.night = null; S.step = "grim"; } break;
    case "night-next": nextStep(false); break;
    case "night-back": prevStep(); break;
    case "night-show": S.night.view = "player"; S.night.cur.skipped = false; break;
    case "night-hide": S.night.view = "handback"; S.night.after = "st"; break;

    case "timer-go": if (T.end) { T.left = timerLeft(); T.end = 0; } else if (T.left) { T.end = Date.now() + T.left; T.rang = false; } break;

    case "nom-of": {

      if (br && q === br.butler && !d.votes.includes(q) && !d.votes.includes(br.master)) return; // master hasn't voted

      break;
    }
    case "vote-ok": {
      const d = S.day.draft;
      S.day.noms.push({ by: d.by, of: d.of, votes: d.votes, ghosts: d.votes.filter(q => !alive(q)), count: d.votes.length, need: votesNeeded(), ...(d.virginNothing ? { virgin: "nothing" } : {}) });

    }
    case "nom-del": {

      const [n] = S.day.noms.splice(i, 1);

      break;
    }
    case "day-end": S.day.end = true; break;
    case "day-end-back": S.day.end = false; break;
    case "exec": { const before = JSON.stringify(S); execute(el.dataset.pid, "executed"); S.day.end = false; checkOver(before, { exec: S.day.exec }); break; }
    case "exec-live": execute(el.dataset.pid, "executed", false); S.day.end = false; break;
    case "exec-none": { const before = JSON.stringify(S); S.day.exec = null; S.day.done = true; S.day.end = false; checkOver(before, { noExec: true }); break; }
    case "slay-new": S.day.draft = { stage: "slayer-by" }; break;
    case "slay-by": S.day.draft.by = el.dataset.pid; S.day.draft.stage = "slayer-at"; break;
    case "slay-at": S.day.draft.at = el.dataset.pid; S.day.draft.stage = "slayer-res"; break;
    case "slay-ok": {
      const before = JSON.stringify(S), d = S.day.draft, died = el.dataset.v === "1", real = roleOf(d.by) === "Slayer";
      const shot = { by: d.by, at: d.at, died, used: real && !S.used[d.by] };
      if (shot.used) S.used[d.by] = true;
      if (died) { S.dead[d.at] = true; S.deathCause[d.at] = "shot by the Slayer"; shot.sw = scarletTakeover(d.at); }

    case "slay-del": {

      const [x] = S.day.shots.splice(i, 1);

      if (x.died) S.dead[x.at] = false;
      if (x.sw) { S.drawn[x.sw] = { ...S.drawn[x.sw], role: "Scarlet Woman" }; S.toTell = (S.toTell || []).filter(q => q !== x.sw); }
      break;
    }
    case "over-undo": S = JSON.parse(S.over.before); ui.story = false; break;
    case "reveal-one": { const r = S.revealed || [], q = el.dataset.pid; S.revealed = r.includes(q) ? r.filter(x => x !== q) : [...r, q]; if (!r.includes(q)) S.spot = { id: q, at: Date.now() }; break; }
    case "reveal-all": S.revealed = S.players.map(p => p.id); S.spot = null; break;
    case "reveal-none": S.revealed = []; S.spot = null; break;
    case "story": ui.story = !ui.story; break;
    case "story-copy": {
      const text = storyText();
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => { el.textContent = "Copied ✓"; }, () => { const r = document.createRange(); r.selectNodeContents(document.querySelector(".story-text")); getSelection().removeAllRanges(); getSelection().addRange(r); el.textContent = "Selected: copy it now"; });
      return;
    }
    case "day-reopen": {
      const e = S.day.exec;
      if (e && e.dies) S.dead[e.pid] = false;
      if (e && e.sw) { S.drawn[e.sw] = { ...S.drawn[e.sw], role: "Scarlet Woman" }; S.toTell = (S.toTell || []).filter(q => q !== e.sw); }
      if (e && e.cause === "nominated the Virgin") S.day.noms = S.day.noms.filter(n => n.virgin !== "executed");
      S.day.exec = null; S.day.done = false; break;
    }
    case "truth": { const N = S.night, st = N.steps[N.i]; N.cur.truth = el.dataset.v === "1"; if (actOf(st.key).info) N.cur.info = makeInfo(st, N.cur.truth); break; }
    case "num": S.night.cur.info.n = Math.max(0, S.night.cur.info.n + Number(el.dataset.v)); break;
    case "info-toggle": { const I = S.night.cur.info, r = el.dataset.role; I.roles = I.roles.includes(r) ? I.roles.filter(x => x !== r) : [...I.roles, r]; break; }
    case "np-pick": {
      const c = S.night.cur, a = actOf(S.night.steps[S.night.i].key), q = el.dataset.pid;
      c.picks = c.picks.includes(q) ? c.picks.filter(x => x !== q) : [...c.picks, q].slice(-pickN(a));
      break;
    }
    case "np-char": S.night.cur.char = el.dataset.role; break;
    case "np-ok": { const N = S.night, st = N.steps[N.i]; workResult(st, N.cur); N.cur.done = true; break; }
    case "np-skip": S.night.cur.skipped = true; S.night.view = "handback"; S.night.after = "next"; break;
    case "show-again": show = { pid: el.dataset.pid, step: "ready" }; break;
    case "show-reveal": show.step = "show"; break;
    case "show-hide": show.step = "handback"; break;
    case "show-close": show = null; break;
    case "redraw": if (!confirm("Clear everyone's characters and go back to the bag?")) return; S.drawn = {}; S.step = "bag"; ui.sel = null; break;
    case "new-game": {
      const playing = S.step !== "players" || S.bag.length;
      if (playing && !confirm(S.over ? "Start a new game with the same players?" : "Start a new game? This game ends now. The players stay; the bag, characters and everything that has happened are cleared.")) return;
      S = { ...fresh(), script: S.script, players: S.players, townOn: S.townOn, townCode: S.townCode, linkSecrets: S.linkSecrets };
      Object.assign(T, { end: 0, left: 0, total: 0, rang: false });
      Object.assign(ui, { sel: null, reveal: false, story: false, timerOpen: false }); show = null;
      break;
    }
    default: return;
  }
  render();
  if (!["reveal-one", "reveal-all", "reveal-none", "timer-set", "timer-add", "timer-go", "timer-reset", "np-pick", "np-char", "num", "truth", "info-toggle", "side", "dead", "unrem", "vote", "reveal", "kill-set", "yn"].includes(el.dataset.act)) window.scrollTo({ top: 0 });
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.dataset.name !== undefined) { S.players[Number(t.dataset.name)].name = t.value; save(); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.script !== undefined) { if (S.bag.length && !confirm("Changing the script empties the bag. Change it?")) { t.value = S.script; return; } S.script = t.value; S.bag = []; render(); }
  if (t.dataset.shown !== undefined) { S.bag[Number(t.dataset.shown)].shown = t.value; render(); }
  if (t.dataset.bluff !== undefined) { S.bluffs[Number(t.dataset.bluff)] = t.value; render(); }
  if (t.dataset.redherring !== undefined) { S.redHerring = t.value; render(); }
  if (t.dataset.setrole) { const d = S.drawn[t.dataset.setrole]; d.role = t.value; d.align = alignOf(t.value); d.shown = ""; if (SHOWN[t.value]) d.shown = pickOne(scriptChars([SHOWN[t.value]]).filter(r => !inPlay().some(q => roleOf(q) === r))); render(); }
  if (t.dataset.setshown) { S.drawn[t.dataset.setshown].shown = t.value; render(); }
  if (t.dataset.addrem && t.value) { addRem(t.dataset.addrem, t.value); render(); }
  const I = S.night && S.night.cur && S.night.cur.info;
  if (I && t.dataset.infoPid !== undefined) { const k = t.dataset.infoPid; if (k === "g") I.pid = t.value; else I.pids[Number(k)] = t.value; render(); }
  if (I && t.dataset.infoRole !== undefined) { I.role = t.value; render(); }
  const C = S.night && S.night.cur;
  if (C && t.dataset.sttarget !== undefined) { C.stTarget = t.value; render(); }
  if (C && t.dataset.killInstead !== undefined) { C.kills[Number(t.dataset.killInstead)].instead = t.value; render(); }
  if (C && t.dataset.starpass !== undefined) { C.starpass = t.value; render(); }
  if (I && t.dataset.infoNone !== undefined) { I.none = t.checked; if (!t.checked && !I.pids) Object.assign(I, makeInfo({ ...S.night.steps[S.night.i] }, false), { none: false }); render(); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.id === "newName") { ev.preventDefault(); addNames(); } });

// Keep the screen on while the phone is passed round, where the browser allows it
let lock = null;
async function wake() { try { if (navigator.wakeLock && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => (lock = null)); } } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (S.draw || S.step === "night")) wake(); });

// Carry on sharing with the Town Square after a reload
if (S.townOn) townStart();
// A draw in progress picks up where it left off, without showing the last token to whoever holds the phone
if (S.draw && S.draw.step === "show") S.draw.step = "ready";
render();
</script>
</body>
