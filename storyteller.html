  const guess = w === "evil" ? (aliveCount(S) <= 2 ? "Only two players were left alive" : "") : dead ? "The Demon was executed" : "";
  $("modal").innerHTML = `<div class="overlay" data-act="close-bg"><div class="card dialog" role="dialog" aria-modal="true" aria-label="End the game">
    <h2>End the game on ${phaseName(G.phase)}</h2>
    <div class="field"><span class="label">Who won?</span><span class="seg" id="endW"><button class="g" data-act="endw" data-v="good" aria-pressed="${w === "good"}">Good</button><button class="e" data-act="endw" data-v="evil" aria-pressed="${w === "evil"}">Evil</button></span></div>
    <label class="field"><span class="label">How</span><input type="text" id="endReason" list="endList" value="${esc(guess)}" placeholder="e.g. The Demon was executed"></label>
    <p class="err" id="endErr" hidden>Pick who won.</p>

/* ---------- Events ---------- */
document.addEventListener("click", ev => {
  const tabBtn = ev.target.closest("[data-tab]");
  if (tabBtn) return setTab(tabBtn.dataset.tab);
  const go = ev.target.closest("[data-tab-go]");
  if (go) return setTab(go.dataset.tabGo);
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const row = el.closest("[data-pid]");
  const rp = row && P(row.dataset.pid);
  const E = id => G.events.find(x => x.id === id);
  switch (act) {
    case "close-bg": if (ev.target === el) { closeEditor(); } return;
    case "close": closeEditor(); return;
    case "ask": { const r = asking.res, v = asking.vals[Number(el.dataset.i)]; asking = null; $("modal").innerHTML = ""; r(v); return; }
    case "new-game": return newGame();
    case "add-player": G.players.push(mkPlayer()); break;
    case "del-player": {
      const drop = () => { G.players = G.players.filter(p => p !== rp); render(); };
      if (G.events.some(e => e.actor === rp.id || (e.targets || []).includes(rp.id))) ask(`${nameOf(rp.id)} appears in the log. Remove them anyway?`, [["Cancel", null, ""], ["Remove", true, "evil"]]).then(ok => ok && drop());
      else drop();
      return;
    }
    case "up": case "down": { const i = G.players.indexOf(rp), j = act === "up" ? i - 1 : i + 1; if (j < 0 || j >= G.players.length) return; [G.players[i], G.players[j]] = [G.players[j], G.players[i]]; break; }
    case "align": rp.align = el.dataset.v; break;
    case "bulk": { const v = $("bulk").value.split(/[,\n;]+/).map(s => s.trim()).filter(Boolean); v.forEach(n => G.players.push(mkPlayer(n))); break; }
    case "shuffle-roles": {
      if (G.started && !el.dataset.sure) { ask("The game has started. Shuffle characters anyway?", [["Cancel", null, ""], ["Shuffle", true, "primary"]]).then(ok => { if (ok) { el.dataset.sure = 1; el.click(); } }); return; }
      const rs = G.players.map(p => [p.role, p.thinks]);
      for (let i = rs.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [rs[i], rs[j]] = [rs[j], rs[i]]; }
      G.players.forEach((p, i) => { p.role = rs[i][0]; p.thinks = rs[i][1]; p.align = defAlign(p.role); });
      break;
    }
    case "start": G.started = true; delete G.example; ui.tab = "grim"; break;
    case "open-past": {
      const g = store.archive.find(x => x.id === el.dataset.id);
      if (!g) return;
      store.archive = store.archive.filter(x => x !== g);
      if (G.started && !G.example) store.archive.push(G);
      store.game = G = g; ui.sel = null; ui.tab = "review";
      break;
    }
    case "del-past": ask("Delete this game for good?", [["Cancel", null, ""], ["Delete", true, "evil"]]).then(ok => { if (ok) { store.archive = store.archive.filter(x => x.id !== el.dataset.id); render(); } }); return;
    case "sel": ui.sel = ui.sel === el.dataset.pid ? null : el.dataset.pid; break;
    case "goto": G.phase = Math.max(0, Math.min(G.maxPhase, Number(el.dataset.ph))); break;
    case "goto-grim": G.phase = Number(el.dataset.ph); ui.tab = "grim"; break;
    case "next-phase": G.phase += 1; G.maxPhase = Math.max(G.maxPhase, G.phase); break;
    case "add": return openEditor({ type: el.dataset.type, actor: el.dataset.actor, target: el.dataset.target, role: el.dataset.role, votes: el.dataset.votes });
    case "no-exec": insertEvent({ id: uid(), ph: G.phase, type: "exec", targets: [], note: "" }); break;
    case "edit": return openEditor({ eid: el.dataset.eid });
    case "star": { const e = E(el.dataset.eid); e.star = !e.star; break; }
    case "del-ev": ask("Delete this entry?", [["Cancel", null, ""], ["Delete", true, "evil"]]).then(ok => { if (ok) { G.events = G.events.filter(x => x.id !== el.dataset.eid); render(); } }); return;
    case "ev-up": {
      const i = G.events.findIndex(x => x.id === el.dataset.eid);
      if (i > 0 && G.events[i - 1].ph === G.events[i].ph) [G.events[i - 1], G.events[i]] = [G.events[i], G.events[i - 1]];
      break;
    }
    case "ghost": G.ghost[el.dataset.pid] = !G.ghost[el.dataset.pid]; break;
    case "unrem": { const e = E(el.dataset.eid); e.removed = e.removed || {}; e.removed[el.dataset.pid] = G.phase; break; }
    case "end-game": return openEnd(el.dataset.w || "");
    case "endw": document.querySelectorAll("#endW button").forEach(b => b.setAttribute("aria-pressed", String(b === el))); return;
    case "end-save": {
      const w = document.querySelector('#endW [aria-pressed="true"]');
      if (!w) { $("endErr").hidden = false; return; }
      G.end = { winner: w.dataset.v, reason: $("endReason").value.trim(), ph: G.phase };
      G.maxPhase = G.phase;
      closeEditor(); ui.tab = "review"; break;
    }
    case "reopen": G.end = null; ui.tab = "grim"; break;
    case "big": ui.big = !ui.big; break;
    case "copy": {
      const text = reviewText(buildReview());
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.querySelector(".scroll")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); el.textContent = "Selected: copy it now"; };
      try { (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => { el.textContent = "Copied ✓"; setTimeout(() => (el.textContent = "Copy as text"), 1500); }, fallback); } catch (e) { fallback(); }
      return;
    }
    // Editor
    case "ftype": F.type = el.dataset.v; if (F.type === "ability" && F.actor && !F.role) { const s = stateAt(F.ph)[F.actor]; F.role = s.thinks || s.role; } F.err = ""; renderEditor(); return;
    case "fset": F[el.dataset.k] = el.dataset.v; renderEditor(); return;
    case "pick": {
      const f = el.dataset.f, id = el.dataset.id;
      if (el.dataset.multi) F[f] = F[f].includes(id) ? F[f].filter(x => x !== id) : [...F[f], id];
      else if (f === "targets") F.targets = id ? [id] : [];
      else F[f] = F[f] === id ? "" : id;
      const S = F.id ? stateBefore(F.id) : stateAt(F.ph);
      if (f === "actor" && F.type === "ability" && F.actor) F.role = S[F.actor].thinks || S[F.actor].role;
      if (f === "targets" && F.type === "change" && F.targets[0] && !F.align) F.align = S[F.targets[0]].align;
      renderEditor(); return;
    }
    case "save-ev": return saveEditor();
    default: return;
  }
  render();
});

document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.dataset.ff && F) { F[t.dataset.ff] = t.value; if (t.dataset.ff === "role" && F.type === "change") { F.align = defAlign(t.value); } return; }
  if (t.dataset.fc && F) { F[t.dataset.fc] = t.checked; renderEditor(); return; }
  if (t.dataset.f) {
    const p = P(t.closest("[data-pid]").dataset.pid);
    p[t.dataset.f] = t.value;
    if (t.dataset.f === "role") { p.align = defAlign(t.value); t.className = "role " + teamOf(t.value); }
    save(); return;
  }
  if (t.dataset.bluff) { G.bluffs[Number(t.dataset.bluff)] = t.value; save(); return; }
  if (t.dataset.g) { G[t.dataset.g] = t.value; save(); if (t.tagName === "SELECT") render(); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.f === "role" || t.dataset.f === "name") render();
  if (t.dataset.ff === "role" && F && F.type === "change") renderEditor();
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && $("modal").innerHTML) closeEditor();
  if (ev.key === "Enter" && ev.target.id === "bulk") ev.target.closest(".row").querySelector('[data-act="bulk"]').click();
});

function setTab(t) {
  ui.tab = t;
  render();
  window.scrollTo({ top: 0 });
}

async function newGame() {
  let keep = false;
  if (G.players.length) {
    const a = await ask("Start a new game. Keep the same players and seats? Characters are cleared either way.", [["Cancel", null, ""], ["Empty table", "empty", ""], ["Keep players", "keep", "primary"]]);
    if (!a) return;
    keep = a === "keep";
  }
  if (G.started && !G.example) store.archive.push(G);
  store.archive = store.archive.slice(-25);
  const players = keep ? G.players.map(p => mkPlayer(p.name)) : [];
  store.game = G = mkGame(players);
  G.script = (store.archive[store.archive.length - 1] || {}).script || "tb";
  ui.sel = null;
  setTab("setup");
}

lastJson = snapshotJson();
render();
connectAccount();
</script>
