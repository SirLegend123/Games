<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15121b">
<title>Storyteller: Face to Face</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
:root {
  --bg: #15121b; --surface: #211c29; --surface-2: #2b2534; --line: #3b3346;
  --fg: #ece6f2; --muted: #a69cb3; --brass: #d4ab55; --on-brass: #1a1408;
  --parch: #efe4c9; --parch-ink: #2a2118;
  --good: #4c8ce4; --evil: #d8435a;
  --townsfolk: #3e7fd6; --outsider: #3aa0b5; --minion: #d4485e; --demon: #b0263d;
  --warn: #e3a53c;
  --felt: radial-gradient(circle at 50% 40%, #2c2436 0%, #1b1622 62%, #15121b 100%);
  --font-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f1eef4; --surface: #ffffff; --surface-2: #f4f0f7; --line: #dcd4e3;
    --fg: #231d2b; --muted: #6c6278; --brass: #94701f; --on-brass: #fff;
    --good: #2463c2; --evil: #be2a42;
    --townsfolk: #2463c2; --outsider: #1f8296; --minion: #c0344b; --demon: #8a1428; --warn: #b7791f;
    --felt: radial-gradient(circle at 50% 40%, #ffffff 0%, #ebe5f0 70%, #e2dbe9 100%);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.wrap { max-width: 920px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header h1 { margin: 0 auto 0 0; font-family: var(--font-display); font-weight: 400; color: var(--brass); font-size: 1.6rem; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps span { font-size: .8rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
.steps span.on { background: var(--brass); color: var(--on-brass); border-color: var(--brass); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; color: var(--brass); }
.card h3 { margin: 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; }
.hint { color: var(--muted); font-size: .92rem; margin: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 16px; min-height: 46px; font-weight: 800; }
.btn:hover:not(:disabled) { border-color: var(--brass); }
.btn.primary { background: var(--brass); color: var(--on-brass); border-color: var(--brass); }
.btn.danger { color: var(--evil); }
.btn.evil { background: var(--evil); border-color: var(--evil); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.huge { font-size: 1.15rem; min-height: 58px; padding: 12px 26px; }
.icon { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); display: inline-grid; place-items: center; font-size: 1rem; }
.icon:disabled { opacity: .3; cursor: default; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 10px; }

input[type=text], select, textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; }
textarea { resize: vertical; }
label.field { display: grid; gap: 6px; }
.label { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; color: var(--muted); }

/* Players */
.players { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 2em minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.prow .n { color: var(--muted); font-weight: 800; text-align: right; }
.prow .btns { display: flex; gap: 4px; }
.add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }

/* Counts */
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.count { border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: .9rem; color: #fff; border: 2px solid transparent; }
.count.townsfolk { background: var(--townsfolk); } .count.outsider { background: var(--outsider); } .count.minion { background: var(--minion); } .count.demon { background: var(--demon); }
.count.off { border-color: var(--warn); box-shadow: 0 0 0 2px var(--warn); }
.warn { color: var(--warn); font-weight: 700; }

/* Bag */
.team-h { display: flex; align-items: baseline; gap: 8px; }
.team-h .hint { font-size: .85rem; }
.t-townsfolk { color: var(--townsfolk); } .t-outsider { color: var(--outsider); } .t-minion { color: var(--minion); } .t-demon { color: var(--demon); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.tile { display: grid; justify-items: center; gap: 2px; padding: 10px 6px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); text-align: center; font-weight: 700; font-size: .9rem; line-height: 1.15; min-height: 84px; align-content: center; }
.tile .ico { font-size: 1.7rem; line-height: 1.2; }
.tile[aria-pressed="true"] { background: var(--parch); color: var(--parch-ink); }
.tile.townsfolk[aria-pressed="true"] { border-color: var(--townsfolk); } .tile.outsider[aria-pressed="true"] { border-color: var(--outsider); }
.tile.minion[aria-pressed="true"] { border-color: var(--minion); } .tile.demon[aria-pressed="true"] { border-color: var(--demon); }
.tile[aria-pressed="false"] .ico { filter: grayscale(.6); opacity: .75; }
.sticky { position: sticky; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 5; box-shadow: 0 8px 24px rgba(0,0,0,.35); }

/* Pass and play: a full-screen cover */
.draw { position: fixed; inset: 0; z-index: 50; overflow-y: auto; background: var(--felt); background-color: var(--bg); display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.draw-inner { width: min(620px, 100%); display: grid; gap: 18px; text-align: center; justify-items: center; }
.draw h1 { margin: 0; font-family: var(--font-display); font-weight: 400; color: var(--brass); font-size: clamp(2.2rem, 8vw, 3.2rem); line-height: 1.1; overflow-wrap: break-word; max-width: 100%; }
.draw p { margin: 0; }
.lead { font-size: 1.15rem; }
.draw-foot { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; }
.bag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 14px; width: 100%; }
.bag-tok { aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--brass); background: radial-gradient(circle at 35% 30%, var(--surface-2), var(--surface) 70%); color: var(--brass); font-family: var(--font-display); font-size: 2rem; box-shadow: 0 3px 10px rgba(0,0,0,.35); transition: transform .12s ease; }
.bag-tok:hover, .bag-tok:focus-visible { transform: scale(1.06); }
.big-tok { --size: min(270px, 72vw); width: var(--size); aspect-ratio: 1; border-radius: 50%; background: var(--parch); color: var(--parch-ink); border: 10px solid var(--good); display: grid; place-content: center; justify-items: center; gap: 4px; padding: 12%; text-align: center; font-family: var(--font-display); line-height: 1.05; box-shadow: 0 6px 22px rgba(0,0,0,.45); animation: flip .4s ease; }
.big-tok.evil { border-color: var(--evil); }
.big-tok .ico { font-size: calc(var(--size) * .27); line-height: 1.1; }
.big-tok .nm { font-size: calc(var(--size) * var(--fs, .12)); }
@keyframes flip { from { transform: rotateY(90deg); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .big-tok { animation: none; } }
.ability { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; max-width: 460px; font-size: 1.05rem; }
.ability small { display: block; color: var(--muted); margin-top: 6px; font-size: .85rem; }
.al-good { color: var(--good); font-weight: 800; } .al-evil { color: var(--evil); font-weight: 800; }

/* Storyteller's list */
.who { display: grid; gap: 8px; }
.wrow { display: grid; grid-template-columns: 2em 2.4em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); border-left: 5px solid var(--good); }
.wrow.evil { border-left-color: var(--evil); }
.wrow .n { color: var(--muted); font-weight: 800; text-align: right; }
.wrow .ico { font-size: 1.6rem; text-align: center; }
.wrow .thinks { color: var(--muted); font-size: .9rem; }
/* Grimoire circle */
.grim-wrap { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .grim-wrap { grid-template-columns: minmax(0, 1.2fr) minmax(320px, 1fr); } }
.side { display: grid; gap: 16px; }
.circle { position: relative; width: 100%; max-width: 640px; margin: 0 auto; aspect-ratio: 1; container-type: inline-size; border-radius: 50%; background: var(--felt); border: 1px solid var(--line); }
.seat { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; background: none; border: 0; padding: 0; width: var(--tok); color: inherit; z-index: 1; }
.disc { width: var(--tok); aspect-ratio: 1; border-radius: 50%; background: var(--parch); color: var(--parch-ink); border: 4px solid var(--good); display: grid; place-content: center; justify-items: center; text-align: center; padding: 6%; box-shadow: 0 2px 6px rgba(0,0,0,.35); overflow: hidden; font-family: var(--font-display); line-height: 1.02; }
.seat.evil .disc { border-color: var(--evil); }
.seat.sel .disc { outline: 4px solid var(--brass); outline-offset: 2px; }
.seat.dead .disc { filter: grayscale(1) brightness(.65); }
.disc .ico { font-size: calc(var(--tok) * .3); line-height: 1.1; }
.disc .nm { font-family: var(--font-body); font-weight: 800; font-size: calc(var(--tok) * var(--fs)); }
.disc .th { font-family: var(--font-body); font-weight: 700; font-size: calc(var(--tok) * .12); color: #6b5d48; }
.plate { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font-weight: 800; font-size: clamp(.7rem, 2.6cqi, .9rem); max-width: calc(var(--tok) * 1.5); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat.dead .plate { text-decoration: line-through; color: var(--muted); }
.rems { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; width: calc(var(--tok) * 1.6); }
.rem { font-size: clamp(.6rem, 2.1cqi, .72rem); font-weight: 800; border-radius: 999px; padding: 0 6px; background: var(--evil); color: #fff; white-space: nowrap; }
.rem.info { background: #6c6278; } .rem.safe { background: var(--good); }
.rem.big { font-size: .85rem; padding: 4px 6px 4px 10px; display: inline-flex; align-items: center; gap: 4px; }
.rem .x { background: none; border: 0; color: #fff; font-weight: 800; padding: 0 4px; }
.center { position: absolute; inset: 30%; display: grid; place-content: center; justify-items: center; text-align: center; gap: 4px; }
.center .ph { font-family: var(--font-display); color: var(--brass); font-size: clamp(1.2rem, 6cqi, 2.2rem); }
.bluff-icons { font-size: clamp(1.1rem, 5cqi, 1.8rem); display: flex; gap: 6px; }
.bluffs { display: grid; gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .grid3 { grid-template-columns: minmax(0, 1fr); } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface-2); padding: 8px 16px; min-height: 44px; font-weight: 800; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--brass); color: var(--on-brass); }
.seg button.g[aria-pressed="true"] { background: var(--good); color: #fff; } .seg button.e[aria-pressed="true"] { background: var(--evil); color: #fff; }
.bignum { font-size: 1.8rem; font-weight: 800; min-width: 1.5em; text-align: center; }
.tiles.small { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.tiles.small .tile { min-height: 70px; font-size: .82rem; }
.log { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }

/* What the woken player sees */
.answer { font-weight: 800; font-size: clamp(4rem, 18vw, 7rem); line-height: 1; color: var(--brass); }
.answer.small { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 9vw, 3.2rem); }
.answer.evil-t { color: var(--evil); }
.names, .chars { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.nmchip { font-family: var(--font-display); font-size: clamp(1.6rem, 6vw, 2.4rem); background: var(--surface); border: 2px solid var(--brass); border-radius: 14px; padding: 6px 18px; }
.charchip { display: grid; justify-items: center; gap: 2px; background: var(--parch); color: var(--parch-ink); border-radius: 14px; padding: 10px 16px; font-weight: 800; font-size: 1.1rem; min-width: 110px; }
.charchip .ico { font-size: 2.4rem; line-height: 1.1; }
.pickgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; width: 100%; }
.pick { min-height: 60px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 800; font-size: 1.1rem; }
.pick[aria-pressed="true"] { background: var(--brass); color: var(--on-brass); border-color: var(--brass); }
.pick.dead { opacity: .6; text-decoration: line-through; }
.spy { width: 100%; }
footer { color: var(--muted); font-size: .8rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Storyteller</h1>
    <nav class="steps" id="steps" aria-label="Steps"></nav>
  </header>
  <main id="app"></main>
  <footer><i>Blood on the Clocktower</i> and its character names belong to The Pandemonium Institute. Unofficial fan-made tool; the symbols are our own.</footer>
</div>
<div id="draw" class="draw" hidden role="dialog" aria-modal="true" aria-label="Draw your character"></div>

<script>
/* ---------- Characters ---------- */
// [name, symbol, ability]. A * after "night" means not the first night.
const SCRIPTS = {
  tb: { name: "Trouble Brewing", roles: {

      ["Barber", "💈", "If you died today or tonight, the Demon may choose 2 players (not another Demon) to swap characters."],
      ["Klutz", "🍌", "When you learn that you died, publicly choose 1 alive player: if they are evil, your team loses."]
    ],
    minion: [
      ["Evil Twin", "👯", "You & an opposing player know each other. If the good player is executed, evil wins. Good can't win if you both live."],
      ["Witch", "🧙", "Each night, choose a player: if they nominate tomorrow, they die. If just 3 players live, you lose this ability."],
      ["Cerenovus", "🌀", "Each night, choose a player & a good character: they are \"mad\" they are this character tomorrow, or might be executed."],
      ["Pit-Hag", "🐸", "Each night*, choose a player & a character they become (if not in play). If a Demon is made, deaths tonight are arbitrary."]
    ],
    demon: [
      ["Fang Gu", "🐉", "Each night*, choose a player: they die. The 1st Outsider this kills becomes an evil Fang Gu & you die instead. [+1 Outsider]"],
      ["Vigormortis", "🦴", "Each night*, choose a player: they die. Minions you kill keep their ability & poison 1 Townsfolk neighbour. [−1 Outsider]"],
      ["No Dashii", "🦑", "Each night*, choose a player: they die. Your 2 Townsfolk neighbours are poisoned."],
      ["Vortox", "🌪️", "Each night*, choose a player: they die. Townsfolk abilities yield false info. Each day, if no-one is executed, evil wins."]
    ]
  } }
};
const TEAMS = ["townsfolk", "outsider", "minion", "demon"];
const TEAM_LABEL = { townsfolk: "Townsfolk", outsider: "Outsiders", minion: "Minions", demon: "Demon" };
const TEAM_ONE = { townsfolk: "Townsfolk", outsider: "Outsider", minion: "Minion", demon: "Demon" };
const CHAR = {};
for (const sc of Object.values(SCRIPTS)) for (const t of TEAMS) for (const [name, icon, text] of sc.roles[t]) CHAR[name] = { name, icon, text, team: t };
const teamOf = r => (CHAR[r] || {}).team || "townsfolk";
const alignOf = r => ["minion", "demon"].includes(teamOf(r)) ? "evil" : "good";
// Townsfolk / Outsiders / Minions / Demon by player count
const COMP = { 5: [3,0,1,1], 6: [3,1,1,1], 7: [5,0,1,1], 8: [5,1,1,1], 9: [5,2,1,1], 10: [7,0,2,1], 11: [7,1,2,1], 12: [7,2,2,1], 13: [9,0,3,1], 14: [9,1,3,1], 15: [9,2,3,1] };
// Characters who are shown something else when they draw
const SHOWN = { Drunk: "townsfolk", Lunatic: "demon" };

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
// Fair randomness for the draw
const rnd = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const byTeam = (a, b) => TEAMS.indexOf(teamOf(a.role)) - TEAMS.indexOf(teamOf(b.role)) || a.role.localeCompare(b.role);
const nameOf = pid => { const i = S.players.findIndex(p => p.id === pid); return i < 0 ? "someone" : (S.players[i].name.trim() || `Seat ${i + 1}`); };

/* ---------- State ---------- */
const LS = "botc-storyteller-ftf-v1";
const fresh = () => ({ step: "players", script: "tb", players: [], bag: [], draw: null, drawn: {} });
let S;
try { S = JSON.parse(localStorage.getItem(LS)); } catch (e) { S = null; }
if (!S || !S.step) S = fresh();
if (S.step === "done") S.step = "grim";

/* ---------- Setup counts ---------- */
// What the setup should be for these characters, after Baron, Godfather, Fang Gu and Vigormortis
function expected(n, roles) {
  if (!COMP[n]) return null;
  const c = [...COMP[n]], notes = [];
  if (roles.includes("Baron")) { c[0] -= 2; c[1] += 2; notes.push("Baron +2 Outsiders"); }
  if (roles.includes("Fang Gu")) { c[0] -= 1; c[1] += 1; notes.push("Fang Gu +1 Outsider"); }
  if (roles.includes("Vigormortis") && c[1] > 0) { c[0] += 1; c[1] -= 1; notes.push("Vigormortis −1 Outsider"); }
  return { c, notes, godfather: roles.includes("Godfather") };
}
// Each team's count, and whether it matches. The Godfather allows one more or one fewer Outsider
function teamCheck(n, roles) {
  const ex = expected(n, roles);
  const have = TEAMS.map(t => roles.filter(r => teamOf(r) === t).length);
  const gf = ex && ex.godfather && Math.abs(have[1] - ex.c[1]) === 1 && have[0] + have[1] === ex.c[0] + ex.c[1];
  const ok = TEAMS.map((t, i) => !ex || have[i] === ex.c[i] || (gf && i < 2));
  return { ex, have, ok };
}
function countsHtml(n, roles) {
  const { ex, have, ok } = teamCheck(n, roles);
  return `<div class="counts">${TEAMS.map((t, i) => `<span class="count ${t}${ok[i] ? "" : " off"}">${have[i]}${ex ? " / " + ex.c[i] : ""} ${TEAM_LABEL[t]}</span>`).join("")}</div>
    ${ex && (ex.notes.length || ex.godfather) ? `<p class="hint">${[...ex.notes, ex.godfather ? "Godfather ±1 Outsider" : ""].filter(Boolean).join(" · ")}</p>` : ""}`;
}
const countsOk = (n, roles) => teamCheck(n, roles).ok.every(Boolean);

/* ---------- The bag ---------- */
function randomBag(n) {
  const R = SCRIPTS[S.script].roles;
  const take = (list, k) => shuffle(list.map(x => x[0])).slice(0, Math.max(0, k));
  const evil = [...take(R.demon, 1), ...take(R.minion, COMP[n][2])];
  const c = expected(n, evil).c;
  if (evil.includes("Godfather")) { const d = c[1] > 0 && rnd(2) ? -1 : 1; c[0] -= d; c[1] += d; }
  const short = Math.max(0, c[1] - R.outsider.length);
  c[1] -= short; c[0] += short;
  return fixShown([...evil, ...take(R.outsider, c[1]), ...take(R.townsfolk, c[0])].map(role => ({ role, shown: "" }))).sort(byTeam);
}
// The Drunk is shown a Townsfolk that isn't in the bag; the Lunatic is shown a Demon
function fixShown(bag) {
  const R = SCRIPTS[S.script].roles;
  const used = new Set(bag.flatMap(b => [b.role, b.shown]).filter(Boolean));
  for (const b of bag) {
    if (!SHOWN[b.role]) { b.shown = ""; continue; }
    if (b.shown) continue;
    const demon = bag.find(x => teamOf(x.role) === "demon");
    const pool = b.role === "Lunatic" ? (demon ? [demon.role] : R.demon.map(x => x[0])) : R.townsfolk.map(x => x[0]).filter(r => !used.has(r));
    b.shown = pool.length ? pool[rnd(pool.length)] : "";
    used.add(b.shown);
  }
  return bag;
}

/* ---------- Screens ---------- */
function render() {
  const steps = [["players", "Players"], ["bag", "Bag"], ["draw", "Draw"], ["grim", "Grimoire"], ["night", "Night 1"]];
  $("steps").innerHTML = steps.map(([k, l]) => `<span class="${(S.draw ? k === "draw" : S.step === k) ? "on" : ""}">${l}</span>`).join("");

  $("app").innerHTML = S.step === "players" ? playersHtml() : S.step === "bag" ? bagHtml() : S.step === "night" ? nightHtml() : grimHtml();
  renderDraw();
  save();
}

/* ---------- The Grimoire ---------- */
const roleOf = pid => (S.drawn[pid] || {}).role || "";
const shownOf = pid => (S.drawn[pid] || {}).shown || "";
const sideOf = pid => (S.drawn[pid] || {}).align || alignOf(roleOf(pid));
const seatNo = pid => S.players.findIndex(p => p.id === pid) + 1;
const inPlay = () => S.players.map(p => p.id).filter(pid => roleOf(pid));
const remsOf = pid => S.rem[pid] || [];
const addRem = (pid, r) => { S.rem[pid] = [...new Set([...remsOf(pid), r])]; };
const alive = pid => !S.dead[pid];
const scriptChars = (teams = TEAMS) => teams.flatMap(t => SCRIPTS[S.script].roles[t].map(x => x[0]));
const listJoin = a => a.length <= 1 ? (a[0] || "") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
const names = pids => listJoin(pids.map(nameOf));
const pickOne = a => a.length ? a[rnd(a.length)] : "";
const REM_CLS = { Poisoned: "", Drunk: "", Cursed: "", Mad: "", Dead: "", Safe: "safe", Protected: "safe", Master: "info", "Red herring": "info", Grandchild: "info", Twin: "info" };
const REM_ALL = ["Poisoned", "Drunk", "Protected", "Safe", "Cursed", "Mad", "Master", "Red herring", "Grandchild", "Twin"];

// Good characters not in play, and not what the Drunk thinks they are
function freeGood() {
  const used = new Set(inPlay().flatMap(pid => [roleOf(pid), shownOf(pid)]));
  return scriptChars(["townsfolk", "outsider"]).filter(r => !used.has(r));
}
function autoBluffs() {
  const free = freeGood().filter(r => !S.bluffs.includes(r));
  const tf = shuffle(free.filter(r => teamOf(r) === "townsfolk")), out = shuffle(free.filter(r => teamOf(r) === "outsider"));
  S.bluffs = S.bluffs.map(b => b || tf.shift() || out.shift() || "");
}
const ftInPlay = () => inPlay().some(pid => roleOf(pid) === "Fortune Teller" || shownOf(pid) === "Fortune Teller");
function autoRedHerring() {
  if (!ftInPlay() || S.redHerring) return;
  S.redHerring = pickOne(inPlay().filter(pid => sideOf(pid) === "good"));
}
// Get the Grimoire ready the first time the Storyteller sees it
function setupGrim() {
  S.bluffs = S.bluffs || ["", "", ""];
  S.rem = S.rem || {}; S.dead = S.dead || {}; S.log = S.log || [];
  for (const pid of inPlay()) if (!S.drawn[pid].align) S.drawn[pid].align = alignOf(roleOf(pid));
  autoBluffs(); autoRedHerring();
}

function tokenSize(n) { return n <= 7 ? 19 : n <= 10 ? 16.5 : n <= 13 ? 14 : 12.5; }
function circleHtml(opts = {}) {
  const n = S.players.length, tok = tokenSize(n);
  const seats = S.players.map((p, i) => {
    const a = (i / n) * 2 * Math.PI - Math.PI / 2, x = 50 + 39 * Math.cos(a), y = 50 + 39 * Math.sin(a);
    const role = roleOf(p.id), c = CHAR[role] || { icon: "" };
    const word = Math.max(...(role || "x").split(/\s+/).map(w => w.length));
    const rems = [...(p.id === S.redHerring ? ["Red herring"] : []), ...remsOf(p.id)];
    const hl = opts.hl && opts.hl.includes(p.id);
    return `<button class="seat ${sideOf(p.id)} ${S.dead[p.id] ? "dead" : ""} ${ui.sel === p.id || hl ? "sel" : ""}" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%" data-act="sel" data-pid="${p.id}" aria-label="Seat ${i + 1}: ${esc(nameOf(p.id))}, ${esc(role || "no character")}">
      <span class="disc">${role ? `<span class="ico" aria-hidden="true">${c.icon}</span><span class="nm" style="--fs:${Math.min(.17, 1.45 / word).toFixed(3)}">${esc(role)}</span>${shownOf(p.id) ? `<span class="th">${esc(shownOf(p.id))}</span>` : ""}` : `<span class="nm" style="--fs:.12">?</span>`}</span>
      <span class="plate">${esc(nameOf(p.id))}</span>
      ${rems.length ? `<span class="rems">${rems.map(r => `<span class="rem ${REM_CLS[r] ?? "info"}">${esc(r)}</span>`).join("")}</span>` : ""}
    </button>`;
  }).join("");
  const label = S.step === "night" ? "Night 1" : S.phase === "day1" ? "Day 1" : "Setup";
  return `<div class="circle" style="--tok:min(96px, ${tok}cqi)">
    ${seats}
    <div class="center"><span class="ph">${label}</span>
      ${S.bluffs.some(Boolean) ? `<span class="hint">Bluffs</span><span class="bluff-icons">${S.bluffs.filter(Boolean).map(b => `<span title="${esc(b)}">${(CHAR[b] || {}).icon || "?"}</span>`).join("")}</span>` : ""}
    </div>
  </div>`;
}

}
const logHtml = () => S.log.length ? `<ol class="log">${S.log.map(l => `<li>${l}</li>`).join("")}</ol>` : `<p class="hint">Nothing logged.</p>`;

/* ---------- Night 1 ---------- */
// First night wake order. MINION and DEMON are the evil team's info (7 or more players).
const FIRST_NIGHT = ["Philosopher", "MINION", "Lunatic", "DEMON", "Sailor", "Courtier", "Poisoner", "Snake Charmer", "Godfather", "Devil's Advocate", "Evil Twin", "Witch", "Cerenovus", "Pukka", "Washerwoman", "Librarian", "Investigator", "Chef", "Empath", "Fortune Teller", "Butler", "Grandmother", "Clockmaker", "Dreamer", "Seamstress", "Spy", "Chambermaid", "Mathematician"];

const wakesAs = pid => roleOf(pid) === "Drunk" ? shownOf(pid) : roleOf(pid);
const minions = () => inPlay().filter(pid => teamOf(roleOf(pid)) === "minion");
const demons = () => inPlay().filter(pid => teamOf(roleOf(pid)) === "demon");

function buildNight(after = -1) {
  const evilInfo = S.players.length >= 7, steps = [];
  FIRST_NIGHT.forEach((k, ki) => {
    if (ki <= after) return;
    if (k === "MINION") { if (evilInfo && minions().length) steps.push({ key: k, pid: minions()[0] }); return; }
    if (k === "DEMON") { if (evilInfo && demons().length) steps.push({ key: k, pid: demons()[0] }); return; }
    if (k === "Lunatic" && !evilInfo) return;
    for (const pid of inPlay()) if (wakesAs(pid) === k) steps.push({ key: k, pid });

}

// Why this player's info might be wrong tonight
function unreliable(pid) {
  const why = [], role = roleOf(pid);
  if (role === "Drunk") why.push("they are the Drunk");
  if (remsOf(pid).includes("Poisoned")) why.push("they are poisoned");
  if (remsOf(pid).includes("Drunk")) why.push("they are drunk");
  if (teamOf(wakesAs(pid)) === "townsfolk" && inPlay().some(p => roleOf(p) === "Vortox")) why.push("the Vortox makes Townsfolk info false");
  const nd = inPlay().find(p => roleOf(p) === "No Dashii");
  if (nd && teamOf(role) === "townsfolk" && nearTownsfolk(nd).includes(pid)) why.push("they are next to the No Dashii");
  return why;
}
// The nearest Townsfolk each side of a player
function nearTownsfolk(pid) {
  const ids = S.players.map(p => p.id), n = ids.length, i = ids.indexOf(pid), out = [];
  for (const dir of [1, -1]) for (let k = 1; k < n; k++) { const q = ids[(i + dir * k + n * n) % n]; if (teamOf(roleOf(q)) === "townsfolk") { out.push(q); break; } }
  return out;
}
const neighbours = pid => {
  const ids = S.players.map(p => p.id).filter(q => q === pid || alive(q)), n = ids.length, i = ids.indexOf(pid);
  return n < 3 ? ids.filter(q => q !== pid) : [ids[(i + n - 1) % n], ids[(i + 1) % n]];
};

function trueNumber(calc, pid) {
  const ids = S.players.map(p => p.id), n = ids.length, evil = q => sideOf(q) === "evil";
  if (calc === "chef") return ids.filter((q, i) => evil(q) && evil(ids[(i + 1) % n])).length;
  if (calc === "empath") return neighbours(pid).filter(evil).length;
  if (calc === "clock") {
    const d = ids.indexOf(demons()[0]);
    const ds = minions().map(m => { const k = Math.abs(ids.indexOf(m) - d); return Math.min(k, n - k); });
    return ds.length ? Math.min(...ds) : 0;
  }
  return 0;
}
const others = pid => S.players.map(p => p.id).filter(q => q !== pid);
// Info for a step, true or false
function makeInfo(st, truth) {
  const a = ACT[st.key], pid = st.pid;
  if (a.info === "number") { const t = trueNumber(a.calc, pid); return { n: truth ? t : Math.max(0, t + (t === 0 || rnd(2) ? 1 : -1)) }; }
  if (a.info === "pair") {
    const team = a.team, holders = others(pid).filter(q => teamOf(roleOf(q)) === team);
    if (truth) {
      if (!holders.length) return team === "outsider" ? { none: true } : { pids: [], role: "" };
      const h = pickOne(holders), o = pickOne(others(pid).filter(q => q !== h));
      return { pids: shuffle([h, o]), role: roleOf(h) };
    }
    const two = shuffle(others(pid)).slice(0, 2);
    const role = pickOne(scriptChars([team]).filter(r => !two.some(q => roleOf(q) === r)));
    return { pids: two, role };
  }
  if (a.info === "outsiders") {
    const real = [...new Set(inPlay().map(roleOf).filter(r => teamOf(r) === "outsider"))];
    return { roles: truth ? real : shuffle(scriptChars(["outsider"])).slice(0, Math.max(0, real.length + (real.length && rnd(2) ? -1 : 1))) };
  }
  if (a.info === "grandchild") {
    const good = others(pid).filter(q => sideOf(q) === "good"), g = pickOne(good);
    return { pid: g, role: truth ? roleOf(g) : pickOne(scriptChars(["townsfolk", "outsider"]).filter(r => r !== roleOf(g))) };
  }
  if (a.info === "twin") return { pid: pickOne(others(pid).filter(q => sideOf(q) === "good")) };
  if (a.info === "lunatic") return { pids: shuffle(others(pid).filter(q => teamOf(roleOf(q)) !== "demon")).slice(0, Math.max(1, minions().length)) };

}

// The answer a choosing character gets, worked out once when they confirm

/* ---------- Pass and play ---------- */
function tokenHtml(role, shown) {
  const seen = shown || role, c = CHAR[seen] || { icon: "", text: "", team: "townsfolk" };
  const align = alignOf(seen);
  const word = Math.max(...seen.split(/\s+/).map(w => w.length));
  return `<p class="lead">You are the</p>
    <div class="big-tok ${align}"><span class="ico" aria-hidden="true">${c.icon}</span><span class="nm" style="--fs:${Math.min(.13, .95 / word).toFixed(3)}">${esc(seen)}</span></div>
    <p class="lead"><span class="t-${c.team}" style="font-weight:800">${TEAM_ONE[c.team]}</span> · <span class="al-${align}">${align === "evil" ? "Evil" : "Good"}</span></p>
    ${c.text ? `<p class="ability">${esc(c.text)}${c.text.includes("night*") ? "<small>* not the first night</small>" : ""}</p>` : ""}`;
}

function renderDraw() {
  const box = $("draw"), D = S.draw, NP = S.step === "night" && S.night && S.night.view === "player";
  if (!D && !show && !NP) { box.hidden = true; box.innerHTML = ""; return; }
  let h;
  if (NP) h = nightPlayerHtml();
  else if (show) {
    h = show.step === "ready"
      ? `<p class="lead">Pass the phone to</p><h1>${esc(nameOf(show.pid))}</h1>
        <button class="btn primary huge" data-act="show-reveal">I'm ${esc(nameOf(show.pid))}: show my character</button>
        <button class="link" data-act="show-close">Cancel</button>`
      : `${tokenHtml(S.drawn[show.pid].role, S.drawn[show.pid].shown)}<button class="btn primary huge" data-act="show-close">Hide it</button>`;
  } else {
    const pid = D.queue[0], name = pid ? esc(nameOf(pid)) : "", total = S.players.length;
    if (D.step === "stop") h = `<h1>Stop the draw?</h1><p class="lead">Players who have drawn keep their characters.</p>
      <div class="draw-foot"><button class="btn huge" data-act="draw-back">Keep drawing</button><button class="btn evil huge" data-act="draw-stop-yes">Stop</button></div>`;
    else if (D.step === "done") h = `<h1>Everyone has a character</h1><p class="lead">Hand the phone back to the Storyteller.</p>
      <button class="btn primary huge" data-act="draw-finish">I'm the Storyteller: open the Grimoire</button>`;
    else if (D.step === "pick") h = `<p class="lead">${name}, tap a token to draw it</p>
      <div class="bag-grid">${D.left.map((_, i) => `<button class="bag-tok" data-act="draw-pick" data-i="${i}" aria-label="Token ${i + 1}">?</button>`).join("")}</div>
      <button class="link" data-act="draw-back">Not ${name}? Go back</button>`;
    else if (D.step === "show") { const d = S.drawn[pid]; h = `${tokenHtml(d.role, d.shown)}<p class="hint">Remember it, then hide it before you pass the phone on.</p><button class="btn primary huge" data-act="draw-hide">Got it: hide it</button>`; }
    else if (D.step === "ready") h = `<p class="lead">${name}, you've drawn your character</p><button class="btn primary huge" data-act="draw-reshow">Show it again</button>`;
    else h = `<p class="hint">${total - D.queue.length} of ${total} drawn</p><p class="lead">Pass the phone to</p><h1>${name}</h1>
      <button class="btn primary huge" data-act="draw-me">I'm ${name}: draw my character</button>
      <div class="draw-foot">${D.queue.length > 1 ? `<button class="link" data-act="draw-later">${name} isn't here: draw later</button>` : ""}<button class="link" data-act="draw-stop">Storyteller: stop the draw</button></div>`;
  }
  box.innerHTML = `<div class="draw-inner">${h}</div>`;
  box.hidden = false;
  box.scrollTop = 0;
}

/* ---------- Actions ---------- */
function addNames() {
  const el = $("newName");
  const names = el.value.split(/[,\n;]+/).map(s => s.trim()).filter(Boolean);
  if (!names.length) return;
  for (const name of names) S.players.push({ id: uid(), name });
  render();
  $("newName").focus();
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const i = Number(el.dataset.i), D = S.draw;
  switch (el.dataset.act) {
    case "add": return addNames();
    case "up": case "down": { const j = el.dataset.act === "up" ? i - 1 : i + 1; [S.players[i], S.players[j]] = [S.players[j], S.players[i]]; break; }
    case "del": S.players.splice(i, 1); break;
    case "clear-players": if (!confirm("Remove every player?")) return; S.players = []; break;
    case "to-bag": S.step = "bag"; break;
    case "to-players": S.step = "players"; break;
    case "random": S.bag = randomBag(S.players.length); break;
    case "empty-bag": S.bag = []; break;
    case "toggle": {
      const r = el.dataset.role;
      S.bag = S.bag.some(b => b.role === r) ? S.bag.filter(b => b.role !== r) : [...S.bag, { role: r, shown: "" }].sort(byTeam);
      fixShown(S.bag);
      break;
    }
    case "start-draw":
      if (!countsOk(S.players.length, S.bag.map(b => b.role)) && !confirm("The bag doesn't match the usual setup for this many players. Draw anyway?")) return;
      S.drawn = {};
      S.draw = { left: shuffle(S.bag.map(b => ({ ...b }))), queue: S.players.map(p => p.id), step: "pass" };
      wake();
      break;
    case "draw-me": D.step = "pick"; break;
    case "draw-back": D.step = "pass"; break;
    case "draw-later": D.queue.push(D.queue.shift()); break;
    case "draw-pick": { const b = D.left.splice(i, 1)[0]; if (!b) return; S.drawn[D.queue[0]] = b; D.step = "show"; break; }
    case "draw-reshow": D.step = "show"; break;
    case "draw-hide": D.queue.shift(); D.step = D.queue.length ? "pass" : "done"; break;
    case "draw-stop": D.step = "stop"; break;
    case "draw-stop-yes": S.draw = null; S.step = "grim"; break;
    case "draw-finish": S.draw = null; S.step = "grim"; Object.assign(S, { bluffs: ["", "", ""], redHerring: "", rem: {}, dead: {}, log: [], phase: "", night: null }); break;
    case "sel": ui.sel = ui.sel === el.dataset.pid ? null : el.dataset.pid; render(); return;
    case "side": S.drawn[el.dataset.pid].align = el.dataset.v; break;
    case "dead": S.dead[el.dataset.pid] = !S.dead[el.dataset.pid]; break;
    case "unrem": S.rem[el.dataset.pid] = remsOf(el.dataset.pid).filter(r => r !== el.dataset.r); break;
    case "bluffs-random": S.bluffs = ["", "", ""]; autoBluffs(); break;
    case "start-night":
      if (S.bluffs.filter(Boolean).length < 3 && S.players.length >= 7 && !confirm("You haven't chosen 3 bluffs for the Demon. Start anyway?")) return;
      startNight(); wake(); break;
    case "night-cancel": if (S.preNight) Object.assign(S, JSON.parse(S.preNight)); S.night = null; S.log = []; S.step = "grim"; break;
    case "night-next": nextStep(false); break;
    case "night-back": prevStep(); break;
    case "night-show": S.night.view = "player"; break;
    case "night-hide": S.night.view = "st"; break;
    case "night-done": nextStep(true); break;
    case "night-dawn": S.step = "grim"; S.phase = "day1"; S.night = null; break;
    case "truth": { const N = S.night, st = N.steps[N.i]; N.cur.truth = el.dataset.v === "1"; if (ACT[st.key].info) N.cur.info = makeInfo(st, N.cur.truth); break; }
    case "num": S.night.cur.info.n = Math.max(0, S.night.cur.info.n + Number(el.dataset.v)); break;
    case "info-toggle": { const I = S.night.cur.info, r = el.dataset.role; I.roles = I.roles.includes(r) ? I.roles.filter(x => x !== r) : [...I.roles, r]; break; }
    case "np-pick": {
      const c = S.night.cur, a = ACT[S.night.steps[S.night.i].key], q = el.dataset.pid;
      c.picks = c.picks.includes(q) ? c.picks.filter(x => x !== q) : [...c.picks, q].slice(-a.pick);
      break;
    }
    case "np-char": S.night.cur.char = el.dataset.role; break;
    case "np-ok": { const N = S.night, st = N.steps[N.i]; workResult(st, N.cur); N.cur.done = true; break; }
    case "np-skip": S.night.cur.skipped = true; nextStep(true); break;
    case "show-again": show = { pid: el.dataset.pid, step: "ready" }; break;
    case "show-reveal": show.step = "show"; break;
    case "show-close": show = null; break;
    case "redraw": if (!confirm("Clear everyone's characters and go back to the bag?")) return; S.drawn = {}; S.step = "bag"; ui.sel = null; break;
    case "new-game": if (!confirm("Start a new game? The players stay; the bag and characters are cleared.")) return; S = { ...fresh(), script: S.script, players: S.players }; break;
    default: return;
  }
  render();
  if (!["np-pick", "np-char", "num", "truth", "info-toggle", "side", "dead", "unrem"].includes(el.dataset.act)) window.scrollTo({ top: 0 });
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.dataset.name !== undefined) { S.players[Number(t.dataset.name)].name = t.value; save(); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.script !== undefined) { if (S.bag.length && !confirm("Changing the script empties the bag. Change it?")) { t.value = S.script; return; } S.script = t.value; S.bag = []; render(); }
  if (t.dataset.shown !== undefined) { S.bag[Number(t.dataset.shown)].shown = t.value; render(); }
  if (t.dataset.bluff !== undefined) { S.bluffs[Number(t.dataset.bluff)] = t.value; render(); }
  if (t.dataset.redherring !== undefined) { S.redHerring = t.value; render(); }
  if (t.dataset.setrole) { const d = S.drawn[t.dataset.setrole]; d.role = t.value; d.align = alignOf(t.value); d.shown = ""; if (SHOWN[t.value]) d.shown = pickOne(scriptChars([SHOWN[t.value]]).filter(r => !inPlay().some(q => roleOf(q) === r))); render(); }
  if (t.dataset.setshown) { S.drawn[t.dataset.setshown].shown = t.value; render(); }
  if (t.dataset.addrem && t.value) { addRem(t.dataset.addrem, t.value); render(); }
  const I = S.night && S.night.cur && S.night.cur.info;
  if (I && t.dataset.infoPid !== undefined) { const k = t.dataset.infoPid; if (k === "g") I.pid = t.value; else I.pids[Number(k)] = t.value; render(); }
  if (I && t.dataset.infoRole !== undefined) { I.role = t.value; render(); }
  if (I && t.dataset.infoNone !== undefined) { I.none = t.checked; if (!t.checked && !I.pids) Object.assign(I, makeInfo({ ...S.night.steps[S.night.i] }, false), { none: false }); render(); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.id === "newName") { ev.preventDefault(); addNames(); } });

// Keep the screen on while the phone is passed round, where the browser allows it
let lock = null;
async function wake() { try { if (navigator.wakeLock && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => (lock = null)); } } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (S.draw || S.step === "night")) wake(); });

// A draw in progress picks up where it left off, without showing the last token to whoever holds the phone
if (S.draw && S.draw.step === "show") S.draw.step = "ready";
render();
</script>
</body>
</html>
