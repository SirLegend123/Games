<meta charset="utf-8">

<body>
<div class="wrap" id="app"><p class="hint">Opening…</p></div>
<dialog id="dlg"></dialog>
<script>
/* ---------- Clocktower Daily: the player's app ----------
   Join with the game code, then play in your own time: chat, nominate and vote in the day,
   choose your night action at night, and find out what happened each dawn. */
const LKEY = "ctd-player-game";
const params = new URLSearchParams(location.search);
// The game this device last joined ("none" after choosing to join a different game)
const lastGame = (() => { try { return localStorage.getItem(LKEY) || ""; } catch (e) { return ""; } })();
// A Home Screen app always opens at the address it was saved with, which may be an old game, so it uses the last game instead
let gid = fromHomeScreen() && lastGame ? (lastGame === "none" ? "" : lastGame) : cleanCode(params.get("g")) || (lastGame === "none" ? "" : lastGame);
let G = null, me = "", SEC = null, joined = null, ready = false, loadErr = "";
let noms = [], myVotes = {}, square = [], chats = {}, myAct = null, gated = {};
const ui = { tab: "today", chat: "", draft: {}, toast: "", picks: null, codeIn: "", nameIn: "" };
const subs = {}, cur = { day: 0 };
const $ = s => document.querySelector(s);
const seen = (() => { try { return JSON.parse(localStorage.getItem("ctd-seen")) || {}; } catch (e) { return {}; } })();
const saveSeen = () => { try { localStorage.setItem("ctd-seen", JSON.stringify(seen)); } catch (e) {} };

/* ---------- Live data ---------- */
function sub(key, target, cb) { if (subs[key]) return; subs[key] = FB.onSnapshot(target, cb, e => { console.warn(key, e.code || e); delete subs[key]; }); }
function unsub(prefix) { for (const k of Object.keys(subs)) if (k.startsWith(prefix)) { subs[k](); delete subs[k]; } }
function watch() {
  sub("game", gref(gid), s => {
    if (!s.exists()) { loadErr = "There's no game with that code. Check it with your Storyteller. (Games are deleted 30 days after they end.)"; G = null; ready = true; return render(); }
    G = s.data(); ready = true; loadErr = "";
    if (G.kind === "shadows") return location.replace(`shadows.html?g=${gid}${EMU ? "&emu=1" : ""}`);
    if (G.next && G.next !== gid) return switchGame(G.next);
    try { localStorage.setItem(LKEY, gid); } catch (e) {}
    const was = me;
    me = Object.keys(G.uids || {}).find(p => G.uids[p] === myUid) || "";
    if (me !== was) { unsub("sec"); unsub("chat"); chats = {}; SEC = null; }
    if (!me) { FB.getDoc(gref(gid, "joins", myUid)).then(d => { joined = d.exists() ? d.data() : null; render(); }).catch(() => {}); return render(); }
    sub("sec", gref(gid, "secret", me), d => { SEC = d.exists() ? d.data() : null; render(); });
    if (!push) refreshPush(false);
    for (const s2 of G.seats) if (s2.id !== me) {
      const pair = pairId(me, s2.id);
      sub("chat" + pair, FB.query(gcol(gid, "chats", pair, "msgs"), FB.orderBy("at")), q => { chats[pair] = q.docs.map(x => x.data()); render(); });
    }
    // My private line to the Storyteller
    sub("chat-st", FB.query(gcol(gid, "stchat", me, "msgs"), FB.orderBy("at")), q => { chats.st = q.docs.map(x => x.data()); render(); });
    const d = G.day || 0;
    if (d && cur.day !== d) { unsub("noms"); noms = []; myVotes = {}; cur.day = d; }
    if (d) sub("noms", gcol(gid, "days", String(d), "noms"), q => { noms = q.docs.map(x => x.data()).sort((a, b) => a.at - b.at); loadMyVotes(); render(); });
    loadAct(); refreshGated(); ping();
    render();
  });
  sub("square", FB.query(gcol(gid, "square"), FB.orderBy("at", "desc"), FB.limit(300)), q => { square = q.docs.map(x => ({ id: x.id, ...x.data() })).reverse(); render(); });
}
// The Storyteller started again with the same players: follow them to the new game, with a clean slate
function switchGame(code) {
  for (const k of Object.keys(subs)) { subs[k](); delete subs[k]; }
  clearTimeout(gatedTimer);
  push = "";
  G = null; me = ""; SEC = null; joined = null; ready = false; noms = []; myVotes = {}; square = []; chats = {}; myAct = null; gated = {}; cur.day = 0;
  ui.tab = "today"; ui.chat = ""; ui.picks = null; ui.draft = {};
  gid = code;
  try { localStorage.setItem(LKEY, gid); } catch (e) {}
  history.replaceState(null, "", `?g=${gid}${EMU ? "&emu=1" : ""}`);
  render(true); toast("🔄 A new game has started");
  watch();
}
// My own votes on today's nominations (nobody else can see them until voting closes)
async function loadMyVotes() {
  const d = String(G.day);
  for (const x of noms) if (myVotes[x.of] === undefined) {
    myVotes[x.of] = false;
    FB.getDoc(gref(gid, "days", d, "votes", `${x.of}_${me}`)).then(v => { myVotes[x.of] = v.exists(); render(); }).catch(() => {});
  }
}
async function loadAct() {
  const n = (G.day || 0) + 1;
  if (!me || !G.nights || !G.nights[n] || (myAct && myAct.n === n)) return;
  myAct = { n, picks: [], saved: false };
  try { const a = await FB.getDoc(gref(gid, "nights", String(n), "acts", me)); if (a.exists()) myAct = { n, picks: a.data().picks || [], saved: true }; } catch (e) {}
  render();
}
// News that waits for its moment: the dawn, the execution, the end of the game.
// Checked when the game changes, at the moment each piece is due, and again shortly after if it isn't readable yet.
let gatedTimer = 0;
async function refreshGated() {
  if (!G || !G.status || G.status === "lobby") return;
  clearTimeout(gatedTimer);
  const now = nowMs(), want = [], d = G.day || 0;
  if (d && now >= G.days[d].dawn) want.push("dawn" + d);
  if (d && now >= G.days[d].reveal) want.push("result" + d);
  if (d > 1) want.push("result" + (d - 1));
  if (G.overAt && now >= G.overAt) want.push("end");
  for (const k of want) if (!gated[k]) {
    try {
      const x = await retryDenied(() => FB.getDoc(gref(gid, "gated", k)));
      if (x.exists()) { const v = x.data(); if (k.startsWith("result")) v.deaths = v.exec ? [{ pid: v.exec, how: v.how || "executed", d: v.d }] : []; gated[k] = v; render(); }
    } catch (e) { /* not yet */ }
  }
  const missing = want.some(k => !gated[k]);
  const due = [d && G.days[d].dawn, d && G.days[d].reveal, G.overAt].filter(t => t && t > nowMs());
  const next = missing ? 4000 : due.length ? Math.min(...due) - nowMs() + 1500 : 0;
  if (next) gatedTimer = setTimeout(refreshGated, Math.min(next, 2 ** 31 - 1));
}

/* ---------- Helpers ---------- */
function toast(t) { ui.toast = t; render(true); clearTimeout(toast.h); toast.h = setTimeout(() => { ui.toast = ""; render(true); }, 3500); }
async function run(fn, done) {
  try { await retryDenied(fn); if (done) toast(done); }
  catch (e) { console.error(e); toast("⚠️ " + (e.code === "permission-denied" ? "That's closed now." : e.message || e)); }
}
const nm = pid => esc(seatName(G, pid));
const P = () => phaseOf(G);
const dead = () => deadNow(G, gated);
const amDead = () => !!dead()[me];
const myRole = () => SEC && SEC.role;
const ghostUsed = () => !!(G.ghost || {})[me] || Object.values(gated).some(g => g && g.rows && g.rows.some(r => r.voters.includes(me)) && (G.dead || {})[me] && g.d >= ((G.dead || {})[me].d || 0));
const infoNow = () => ((SEC && SEC.info) || []).filter(x => x.at <= nowMs()).sort((a, b) => b.at - a.at);
// A chat's key: "st" for the Storyteller, otherwise the pair of seats
const chatKey = pid => pid === "st" ? "st" : pairId(me, pid);
const unreadChat = pair => (chats[pair] || []).filter(m => m.from !== me && m.at > (seen[gid + pair] || 0)).length;
const unreadInfo = () => infoNow().filter(x => x.at > (seen[gid + "info"] || 0)).length;
const unreadSquare = () => square.filter(m => m.at > (seen[gid + "sq"] || 0) && m.pid !== me).length;

/* ---------- Screens ---------- */
let pending = false;
function render(force) {
  const a = document.activeElement;
  if (!force && a && a.closest && a.closest("#app") && a.matches("input[type=text], textarea")) { pending = true; return; }
  pending = false;
  markSeen();
  const feed = $("#feed"), atBottom = feed && feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40, y = window.scrollY;
  $("#app").innerHTML = `<header><h1><img class="title-img" src="img/title-clocktower-daily.webp?v=117" alt="Clocktower Daily" width="1010" height="150" style="height:var(--title-h, 44px);width:auto;max-width:100%;display:block"></h1>
    <span class="head-btns">${G && G.sched ? `<button class="btn" data-act="cal" aria-label="Add the timetable to your calendar">📅</button>` : ""}<button class="btn" data-act="sheet" aria-label="Characters">📜<span class="lbl"> Characters</span></button><button class="btn" data-act="theme" aria-label="Light or dark">${themeLabel()}</button></span></header>
    ${body()}<footer class="brand"><img class="wordmark" style="width:min(300px,80%);height:auto" src="img/botc-logo.webp" alt="Blood on the Clocktower" width="1200" height="262"><img class="ccc" style="width:130px;max-width:45%;height:auto" src="img/ccc-badge.webp" alt="Community Created Content" width="540" height="215"><span><i>Blood on the Clocktower</i> and its character names belong to The Pandemonium Institute. Unofficial fan-made tool. <a href="privacy.html">Privacy notice</a></span></footer>${ui.toast ? `<div class="toast" role="status">${esc(ui.toast)}</div>` : ""}`;
  window.scrollTo(0, y);
  const f = $("#feed"); if (f && (atBottom || !feed)) f.scrollTop = f.scrollHeight;
}
document.addEventListener("focusout", () => setTimeout(() => { if (pending) render(); }, 0));
function markSeen() {
  if (!G || !me) return;
  let ch = false;
  const mark = (k, v) => { if (v && v > (seen[gid + k] || 0)) { seen[gid + k] = v; ch = true; } };
  if (ui.tab === "chats" && ui.chat) { const k = chatKey(ui.chat), l = chats[k] || []; mark(k, l.length ? l[l.length - 1].at : 0); }
  if (ui.tab === "square" && square.length) mark("sq", square[square.length - 1].at);
  if (ui.tab === "votes" && G.day) for (const x of noms) if (nowMs() >= voteOpensAt(G, x)) mark(`v${G.day}${x.of}`, 1);
  if (ui.tab === "me" || ui.tab === "today") { const i = infoNow(); if (i.length && ui.tab === "me") mark("info", i[0].at); }
  if (ch) saveSeen();
}

function body() {
  if (!gid) return `<div class="centre-page">${joinCodeHtml()}</div>`;
  if (loadErr) return `<section class="card"><p class="err">${esc(loadErr)}</p><div class="row"><button class="btn" data-act="other-game">Enter another code</button></div></section>`;
  if (!ready) return `<p class="hint">Finding the game…</p>`;
  if (!me) return `<div class="centre-page">${joinNameHtml()}</div>`;
  if (G.status === "lobby" || !SEC) return `<div class="centre-page">${waitHtml()}</div>`;
  return gameHtml();
}

/* ---------- Joining ---------- */
// iPhone and iPad keep a Home Screen app's storage apart from Safari's, so it has to be added before joining
const homeTipHtml = () => !isIOS() || fromHomeScreen() ? "" : `<section class="card home-tip">${gid && G ? `<h2>📲 Already on your Home Screen?</h2>
    <p class="lead">A QR code always opens Safari. Open <b>Clocktower Daily</b> from your Home Screen instead, tap <b>🎲 Join a different game</b>, and enter this code:</p>
    <div class="row"><span class="code">${gid}</span><button class="btn small" data-act="copy-code">📋 Copy</button></div>
    <h3>Not on your Home Screen yet?</h3>` : `<h2>📲 Want it on your Home Screen?</h2>`}
    <p class="lead">Do it <b>now</b>, before you join:</p>
    <ol class="steps"><li>Tap <b>Share</b> <span aria-hidden="true">(the square with an arrow ⬆️)</span></li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b></li><li>Open <b>Clocktower Daily</b> from your Home Screen and join there</li></ol>
    <p class="hint">If you join here first and add it afterwards, the Home Screen app won't know who you are. Happy to stay in Safari? Just join below.</p></section>`;
function joinCodeHtml() {
  return `<section class="card"><img class="crest" style="width:110px;max-width:40%;height:auto;display:block;margin:0 auto" src="img/knocker.webp" alt="" width="700" height="755"><h2>Welcome to Clocktower Daily</h2>
    <p class="lead">A game of Blood on the Clocktower that runs over several days. You play on this phone, in your own time.</p>
    <div class="field"><span class="label">Game code</span><input type="text" id="code" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="e.g. K7QM2X" value="${esc(ui.codeIn)}"></div>
    <div class="row"><button class="btn primary" data-act="go-code">Find the game →</button></div>
    </section>${homeTipHtml()}`;
}
function joinNameHtml() {
  if (joined) return `<section class="card"><div class="big-ico">⏳</div><h2>${esc(G.name)}</h2>
    <p class="lead">Thanks, ${esc(joined.name)}. The Storyteller will give you a seat soon.</p>
    <p class="hint">Keep this page open, or come back to it later on this phone. Game code <b>${gid}</b>.</p>
    <div class="row"><button class="btn small" data-act="other-game">Not your game?</button></div></section>`;
  return `${homeTipHtml()}<section class="card"><img class="crest" style="width:110px;max-width:40%;height:auto;display:block;margin:0 auto" src="img/knocker.webp" alt="" width="700" height="755"><h2>${esc(G.name)}</h2>
    <p class="lead">You've found the game. What's your name?</p>
    <div class="field"><span class="label">Your name</span><input type="text" id="name" maxlength="30" autocomplete="given-name" value="${esc(ui.nameIn)}"></div>
    <div class="row"><button class="btn primary" data-act="join">Join the game</button><button class="btn small" data-act="other-game">Not your game?</button></div>
    <p class="hint">If you've played in this game on another phone, join with the same name: the Storyteller will move your seat to this phone.</p>
    <p class="hint">🔒 Your name, and what you do in the game, are kept until the game is deleted (30 days after it ends). <a href="privacy.html">Privacy notice</a></p></section>`;
}
function waitHtml() {
  return `${pushCardHtml()}<section class="card"><div class="big-ico">🕯️</div><h2>${esc(G.name)}</h2>
    <p class="lead">You're in, ${nm(me)}. The Storyteller will deal the characters soon: your character appears here when they do.</p>
    <p class="hint">${plural(G.seats.length, "player")} seated so far.</p>
    <div class="row"><button class="btn small" data-act="other-game">🎲 Not this game? Join a different one</button></div></section>
    ${timetableHtml()}`;
}
function timetableHtml() {
  const s = G.sched, t = G.days && G.days[G.day];
  return `<section class="card"><h2>⏰ Each day</h2>
    <ul class="tt">${(K => K.map(([k, ic, label, sub], i) => { const at = t ? t[k] : null, now = nowMs(), nextAt = t && i < K.length - 1 ? t[K[i + 1][0]] : Infinity;
      return `<li class="${at && now >= at ? (now < nextAt ? "now" : "past") : ""}"><b>${t ? clock(at) : s[k]}</b><span>${ic}</span><span>${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ""}</span></li>`; }).join(""))(SCHED_KEYS.filter(([k]) => t ? t[k] : s[k]))}</ul>
    <div class="row"><button class="btn small" data-act="cal">📅 Add to my calendar</button></div>
    <p class="hint">The calendar entries remind you before voting and night actions close.</p></section>`;
}

/* ---------- The game ---------- */
function gameHtml() {
  const p = P();
  const chatDot = unreadChat("st") > 0 || G.seats.some(s => s.id !== me && unreadChat(pairId(me, s.id)) > 0);
  const tabs = [["today", "🏠", "Today", unreadInfo() > 0], ["square", "🗣️", "Square", unreadSquare() > 0], ["chats", "✉️", "Chats", chatDot], ["votes", "⚖️", "Votes", newNoms(p) > 0], ["me", "🎭", "Me", false]];
  // On a phone the tabs sit in a bar along the bottom of the screen
  const nav = `<nav class="tabs bottom">${tabs.map(([k, ic, l, dot]) => `<button data-act="tab" data-tab="${k}" aria-pressed="${ui.tab === k}"><span class="ti" aria-hidden="true">${ic}</span> <span>${l}</span>${dot ? `<span class="dot" aria-label="new"></span>` : ""}</button>`).join("")}</nav>`;
  return `${bannerHtml(p)}${nav}${{ today: todayHtml, square: squareHtml, chats: chatsHtml, votes: votesHtml, me: meHtml }[ui.tab](p)}`;
}
function bannerHtml(p) {
  const dark = ["night", "dark", "wait"].includes(p.k);
  const what = {
    night: myAction(p) ? "Choose your night action, and message your neighbours." : "Sleep tight. You can message your neighbours.",
    dark: "The Storyteller is working through the night.", dawn: "See what happened in the night.", chats: "Message anyone in private.",
    noms: G.days[G.day] && G.days[G.day].vote ? `Nominate, and defend yourself if you're nominated. Voting opens at ${clock(G.days[G.day].vote)}. Private messages to neighbours only.` : "Nominate and vote. Private messages to neighbours only.",
    vote: "Vote on the nominations. Private messages to neighbours only.", count: "The votes are being counted.", dusk: "Night falls soon.", over: "", wait: "", lobby: ""
  }[p.k];
  const till = isFinite(p.to) ? `Until ${when(p.to)} · ${left(p.to)} left` : p.k === "dark" ? `Dawn is usually at ${G.sched.dawn}` : "";
  return `<section class="banner ${dark ? "dark" : ""}"><span class="ph">${phaseGold(p)}</span>${till ? `<span class="till">${till}</span>` : ""}${what ? `<span>${what}</span>` : ""}</section>`;
}
function myAction(p) {
  if (p.k !== "night" || amDead()) return null;
  return actOf(myRole(), p.n);
}
// Today's execution has to be known before the night: you might have been executed
const waitingForResult = () => !!(G.day && !gated["result" + G.day] && !G.overAt);
function todayHtml(p) {
  const out = [];
  if (p.k === "over") out.push(overHtml());
  const act = myAction(p);
  out.push(pushCardHtml());
  if (act && waitingForResult()) out.push(`<section class="card"><p class="lead">🌙 Night actions open once the Storyteller has confirmed today's execution. Check back soon.</p></section>`);
  else if (act) out.push(actHtml(p, act));
  const d = G.day || 0, dn = gated["dawn" + d], res = gated["result" + d];
  if (res && ["dusk", "night", "dark", "over"].includes(p.k)) out.push(resultHtml(res));
  if (d && dn && ["dawn", "chats", "noms", "count", "dusk", "night", "dark"].includes(p.k)) out.push(dawnHtml(dn));
  if (d && !dn && nowMs() >= G.days[d].dawn) out.push(`<section class="card"><p class="hint">Fetching the news from the night…</p></section>`);
  if (p.k === "dusk" && !res) out.push(`<section class="card"><p class="lead">The Storyteller is still counting the votes. Check back soon.</p></section>`);
  const accused = noms.find(x => x.of === me);
  if (accused && dayOpen(p) && p.n === d) out.push(`<section class="card todo"><h2>⚖️ You've been nominated</h2>${nomCardHtml(accused, noms.indexOf(accused), p)}</section>`);
  else if (noms.length && dayOpen(p) && p.n === d) out.push(`<section class="card"><h2>⚖️ Today's nominations</h2><p class="lead">${plural(noms.length, "nomination")} so far.${newNoms(p) ? ` <b>${newNoms(p)} waiting for your vote.</b>` : ""}</p><div class="row"><button class="btn primary" data-act="tab" data-tab="votes">See the nominations →</button></div></section>`);
  const fresh = infoNow().filter(x => x.at >= (d ? G.days[d].dawn : 0) - 1);
  if (fresh.length) out.push(`<section class="card"><h2>🔮 Your info</h2>${fresh.map(infoHtml).join("")}<p class="hint">Everything you've learnt is under 🎭 Me.</p></section>`);
  if (unreadInfo()) { seen[gid + "info"] = infoNow()[0].at; saveSeen(); }
  out.push(townHtml(p), timetableHtml());
  return out.join("");
}
function infoHtml(x) { return `<p class="info"><small>${esc(x.label || "Info")} · ${x.n ? `Night ${x.n}` : when(x.at)}</small>${esc(x.text)}</p>`; }
function dawnHtml(dn) {
  const ds = dn.deaths || [];
  const c = COMP[Math.min(15, G.seats.length)];
  return `<section class="card"><h2>🌅 Dawn of Day ${dn.d}</h2>
    ${ds.length ? `<p class="lead">In the night, ${ds.map(x => `<b>💀 ${nm(x.pid)}</b>`).join(" and ")} ${ds.length === 1 ? "was" : "were"} found dead.</p>`
      : dn.d === 1 ? `<p class="lead">A body was found in the town square. There is a Demon amongst you. Find out who, and execute them before it's too late.</p>
        ${c ? `<p class="hint">With ${G.seats.length} players: ${TEAMS.map((t, i) => `<b class="t-${t}">${c[i]} ${c[i] === 1 ? TEAM_ONE[t] : t === "demon" ? "Demons" : TEAM_LABEL[t]}</b>`).join(" · ")} (the Baron adds 2 Outsiders)</p>` : ""}`
      : `<p class="lead">Nobody died in the night.</p>`}</section>`;
}
function resultHtml(r) {
  return `<section class="card"><h2>🪓 Day ${r.d}'s execution</h2>
    <p class="lead">${r.exec ? `<b>${nm(r.exec)}</b> was executed${r.how === "virgin" ? " for nominating the Virgin" : ""}.` : "Nobody was executed."} <span class="hint">${esc(r.why || "")}</span></p>

/* ---------- Nominations & votes ---------- */
function votesHtml(p) {

  const t = G.days[d], D = dead(), alive = G.seats.length - Object.keys(D).length, need = needVotes(alive), open = dayOpen(p) && p.n === d;
  const iNominated = noms.some(x => x.by === me), canVote = open && (!D[me] || !ghostUsed());
  const ghostSpent = D[me] && noms.some(x => myVotes[x.of]);
  const res = gated["result" + d];
  return `<section class="card"><h2>⚖️ Day ${d}: nominations</h2>
    <p class="hint">${open ? (t.vote && nowMs() < t.vote ? `Nominations are open until ${clock(t.vote)}, then voting until ${clock(t.close)}.` : `Voting is open until ${clock(t.close)} (${left(t.close)} left).`) : nowMs() < t.noms ? `Nominations open at ${clock(t.noms)}.` : res ? "Voting has closed." : `Voting closed at ${clock(t.close)}. The result is revealed at ${clock(t.reveal)}.`}

    <p class="hint">📝 Each nomination gives a reason. The nominee then has ${plural(defMins(G), "minute")} to give a defence; ${t.vote ? `voting on all the nominations opens at ${clock(t.vote)}.` : "voting opens when they do, or when the time is up."}</p>
    ${open && !D[me] && !iNominated ? nowMs() < nomsCloseAt(G, d) ? `<div class="row"><button class="btn primary" data-act="nominate-open">☝️ Nominate someone</button><span class="hint">You can nominate once a day, until ${clock(nomsCloseAt(G, d))}.</span></div>` : `<p class="hint">${t.vote ? `New nominations closed when voting opened at ${clock(t.vote)}.` : `New nominations closed at ${clock(nomsCloseAt(G, d))}, to leave time for a defence and the vote.`}</p>` : ""}

}

/* ---------- 📜 The story so far: every earlier day's deaths, nominations and votes ---------- */
const hist = {};
let histLoading = false;
const histDays = () => { const d = G.day || 0, out = []; for (let i = d - (G.overAt ? 0 : 1); i >= 1; i--) out.push(i); return out; };
async function loadHistory() {
  if (histLoading) return;
  // A day without a result yet (or ever, if the game ended early) is checked again at most once a minute
  const need = histDays().filter(d => !hist[d] || (!hist[d].result && nowMs() - hist[d].at > 60000));
  if (!need.length) return;
  histLoading = true;
  try {
    for (const d of need) {
      const get = async k => { try { const x = await retryDenied(() => FB.getDoc(gref(gid, "gated", k))); return x.exists() ? x.data() : null; } catch (e) { return null; } };
      const [dawn, result, nq] = await Promise.all([get("dawn" + d), get("result" + d), FB.getDocs(gcol(gid, "days", String(d), "noms")).catch(() => null)]);
      hist[d] = { dawn, result, noms: nq ? byTime(nq.docs.map(x => x.data())) : [], at: nowMs() };
    }
  } finally { histLoading = false; render(); }
}
function historyHtml() {
  const days = histDays();
  if (!days.length) return "";
  loadHistory();
  return `<section class="card"><h2>📜 Earlier days</h2><p class="hint">Who died, every nomination, and who voted for whom.</p>
    ${days.map((d, i) => { const h = hist[d];
      if (!h) return `<p class="hint">Day ${d}: loading…</p>`;
      const r = h.result, nightDeaths = (h.dawn && h.dawn.deaths) || [], other = (G.events || []).filter(e => e.d === d && e.dies);
      const head = `Day ${d}: ${r ? (r.exec ? `${nm(r.exec)} executed` : "nobody executed") : "result not out yet"}${nightDeaths.length ? ` · ${nightDeaths.map(x => nm(x.pid)).join(" & ")} died in the night` : ""}`;
      return `<details class="hist" ${i === 0 ? "open" : ""}><summary>${head}</summary>
        ${nightDeaths.length ? `<p>🌙 Found dead at dawn: <b>${nightDeaths.map(x => nm(x.pid)).join(", ")}</b></p>` : `<p class="hint">🌙 Nobody died in the night before Day ${d}.</p>`}
        ${other.map(e => `<p>${e.kind === "slayer" ? "🏹" : "💀"} <b>${nm(e.dies)}</b> ${e.kind === "slayer" ? "was shot by the Slayer" : "died"}.</p>`).join("")}
        ${h.noms.length ? h.noms.map((x, j) => { const row = r && r.rows && r.rows.find(y => y.of === x.of);
          return `<div class="vote-row"><span><span class="tag">${j + 1}</span> <b>${nm(x.by)}</b> nominated <b>${nm(x.of)}</b></span>
            ${x.reason ? `<p class="quote"><small>Why</small>“${esc(x.reason)}”</p>` : ""}${x.defence ? `<p class="quote def"><small>Defence</small>“${esc(x.defence)}”</p>` : ""}
            ${row ? `<span><b>${row.count}</b> vote${row.count === 1 ? "" : "s"}: <span class="hint">${row.voters.map(nm).join(", ") || "nobody"}</span></span>` : ""}</div>`; }).join("") : `<p class="hint">No nominations.</p>`}
        ${r ? `<p>🪓 ${r.exec ? `<b>${nm(r.exec)}</b> was executed${r.how === "virgin" ? " (the Virgin)" : ""}.` : "Nobody was executed."} <span class="hint">${esc(r.why || "")}${r.need ? ` ${r.need} votes were needed.` : ""}</span></p>` : ""}
      </details>`; }).join("")}</section>`;
}
// Nominations whose voting is open and that you haven't looked at yet
function newNoms(p) {
  if (!dayOpen(p) || p.n !== G.day) return 0;
  return noms.filter(x => nowMs() >= voteOpensAt(G, x) && !myVotes[x.of] && !seen[`${gid}v${G.day}${x.of}`]).length;
}
// One nomination: who, why, their defence, and your vote
function nomCardHtml(x, i, p) {
  const d = G.day, t = G.days[d], D = dead(), open = dayOpen(p) && p.n === d, opens = voteOpensAt(G, x), votingNow = open && nowMs() >= opens;
  const res = gated["result" + d], r = res && res.rows && res.rows.find(y => y.of === x.of), mine = myVotes[x.of];
  const canVote = votingNow && (!D[me] || !ghostUsed()), ghostSpent = D[me] && noms.some(y => myVotes[y.of] && y.of !== x.of);
  const accused = x.of === me && nowMs() < t.close && !res;
  return `<div class="vote-row nom"><span><span class="tag">${i + 1}</span> <b>${nm(x.by)}</b> nominated <b>${nm(x.of)}</b> <span class="hint">· ${clock(x.at)}</span></span>
    ${x.reason ? `<p class="quote"><small>Why</small>“${esc(x.reason)}”</p>` : ""}
    ${x.defence ? `<p class="quote def"><small>${nm(x.of)}'s defence</small>“${esc(x.defence)}”</p>` : open && nowMs() < opens ? `<p class="hint">⏳ Waiting for ${x.of === me ? "your" : `${nm(x.of)}'s`} defence: voting opens at ${clock(opens)}${x.of === me || t.vote ? "" : `, or sooner if ${nm(x.of)} answers`}.</p>` : ""}
    ${accused ? `<div class="field"><span class="label">${x.defence ? "Change your defence" : "Your defence"}</span><textarea id="def" maxlength="600" placeholder="Why the town shouldn't execute you">${esc(ui.draft.def ?? x.defence ?? "")}</textarea><div class="row"><button class="btn primary" data-act="def-save" data-of="${x.of}">${x.defence ? "Update my defence" : "Give my defence"}</button>${x.defence ? "" : `<span class="hint">Voting opens when you do, or at ${clock(opens)}.</span>`}</div></div>` : ""}
    ${r ? `<span class="lead"><b>${r.count}</b> vote${r.count === 1 ? "" : "s"}: <span class="hint">${r.voters.map(nm).join(", ") || "nobody"}</span></span>` : ""}
    ${votingNow ? `<div class="seg"><button class="g" data-act="vote" data-of="${x.of}" data-v="1" aria-pressed="${!!mine}" ${canVote && (!D[me] || mine || !ghostSpent) ? "" : "disabled"}>✋ Yes, execute</button><button data-act="vote" data-of="${x.of}" data-v="" aria-pressed="${!mine}" ${canVote ? "" : "disabled"}>No</button></div><span class="hint">Voting open until ${clock(t.close)}.</span>`
      : !r && nowMs() >= t.close ? `<span class="hint">You voted ${mine ? "✋ yes" : "no"}.</span>` : ""}</div>`;
}

/* ---------- 🔔 Phone notifications ---------- */

}

/* ---------- Dialogs ---------- */
function dialog(html) { const d = $("#dlg"); d.innerHTML = html; d.showModal(); }
document.getElementById("dlg").addEventListener("click", e => {

      <div class="row"><button class="btn" data-dact="close">Cancel</button><span class="spacer"></span><button class="btn primary" data-dact="nominate-go" data-pid="${pid}">☝️ Nominate</button></div>`;
    d.querySelector("#why").focus();
  }
  if (el.dataset.dact === "nominate-go") {

  }

  switch (a) {
    case "theme": toggleTheme("ctd-theme"); return render(true);
    case "sheet": return dialog(`<h2>📜 Trouble Brewing</h2>${sheetHtml("tb")}<div class="row"><button class="btn" data-dact="close">Close</button></div>`);
    case "cal": return downloadIcs(icsFile(G.name, G.sched, nowMs()));
    case "go-code": { const c = cleanCode($("#code").value); if (c.length !== 6) return toast("The code has 6 letters and numbers."); gid = c; history.replaceState(null, "", `?g=${c}${EMU ? "&emu=1" : ""}`); ready = false; render(true); return watch(); }
    case "other-game": if (G && me && G.status !== "lobby" && !(G.overAt && nowMs() >= G.overAt) && !confirm("Leave this game and join a different one? You can come back to it with its code.")) return;
      Object.keys(subs).forEach(k => { if (typeof subs[k] === "function") subs[k](); delete subs[k]; }); try { localStorage.setItem(LKEY, "none"); } catch (e2) {} push = ""; gid = ""; G = null; me = ""; joined = null; loadErr = ""; ready = false; history.replaceState(null, "", EMU ? "?emu=1" : location.pathname); return render(true);
    case "join": { const n = $("#name").value.trim(); if (!n) return toast("Type your name first."); ui.nameIn = n;
      return run(async () => { await FB.setDoc(gref(gid, "joins", myUid), { name: n.slice(0, 30), at: nowMs() }); joined = { name: n }; render(true); }); }
    case "tab": ui.tab = el.dataset.tab; ui.chat = ""; render(true); return window.scrollTo(0, 0);
    case "pick": { const max = +el.dataset.max, cur = ui.picks || [...((myAct && myAct.picks) || [])];
      ui.picks = cur.includes(pid) ? cur.filter(q => q !== pid) : max === 1 ? [pid] : cur.length < max ? [...cur, pid] : [...cur.slice(1), pid]; return render(true); }
    case "save-act": { const p = P(), picks = ui.picks || myAct.picks;
      return run(async () => { await FB.setDoc(gref(gid, "nights", String(p.n), "acts", me), { picks, role: myRole(), at: nowMs() }); myAct = { n: p.n, picks, saved: true }; ui.picks = null; render(true); }, "Saved"); }
    case "say": { const t = $("#say").value.trim(); if (!t) return; ui.draft.sq = ""; $("#say").value = "";
      return run(() => FB.addDoc(gcol(gid, "square"), { pid: me, kind: "say", text: t, at: nowMs(), d: G.day || 0 })); }
    case "open-chat": ui.chat = pid; render(true); return window.scrollTo(0, 0);
    case "close-chat": ui.chat = ""; return render(true);
    case "dm": { const pair = chatKey(pid), t = $("#dm").value.trim(); if (!t) return;
      if (pid !== "st" && !canChat(G, P(), me, pid)) return toast(chatWhy(P()));
      ui.draft[pair] = ""; $("#dm").value = "";
      return run(() => FB.addDoc(pid === "st" ? gcol(gid, "stchat", me, "msgs") : gcol(gid, "chats", pair, "msgs"), { from: me, text: t, at: nowMs() })); }
    case "nominate-open": { const D = dead(), taken = noms.map(x => x.of);
      return dialog(`<h2>☝️ Nominate</h2><p class="hint">Each player can be nominated once a day.</p><div class="picks">${G.seats.map(s => `<button class="pick ${D[s.id] ? "dead" : ""}" data-dact="nominate" data-pid="${s.id}" ${taken.includes(s.id) ? "disabled" : ""}>${D[s.id] ? "💀 " : ""}${nm(s.id)}${s.id === me ? " (you)" : ""}</button>`).join("")}</div><div class="row"><button class="btn" data-dact="close">Cancel</button></div>`); }
    case "vote": { const of = el.dataset.of, yes = !!el.dataset.v, r = gref(gid, "days", String(G.day), "votes", `${of}_${me}`);
      if (!!myVotes[of] === yes) return;
      if (yes && amDead() && !confirm("This uses your one ghost vote for the rest of the game (if voting closes with it still in place). Vote?")) return;
      myVotes[of] = yes; render(true);
      return run(() => yes ? FB.setDoc(r, { nom: of, voter: me, at: nowMs() }) : FB.deleteDoc(r)).then(() => toast(yes ? "✋ Voted yes (secret until voting closes)" : "Vote removed")); }
    case "def-save": { const t = ($("#def").value || "").trim(); if (!t) return toast("Type your defence first.");
      ui.draft.def = undefined;
      return run(() => FB.updateDoc(gref(gid, "days", String(G.day), "noms", me), { defence: t.slice(0, 600), defAt: nowMs() }), "Defence given"); }
    case "tok": if (pid === me) { ui.tab = "me"; } else { ui.tab = "chats"; ui.chat = pid; } render(true); return window.scrollTo(0, 0);
    case "push-on": return refreshPush(true);
    case "copy-code": navigator.clipboard && navigator.clipboard.writeText(gid).then(() => toast("Code copied"), () => toast(gid)); return;
    case "push-later": try { localStorage.setItem("ctd-push-later", String(Date.now())); } catch (e2) {} return render(true);
    case "push-off": return pushOff().then(() => { push = "off"; render(true); toast("Notifications are off"); });
    case "slay-open": return dialog(`<h2>🏹 Slayer shot</h2><p class="hint">If you're the Slayer and you choose the Demon, they die. Everyone sees you do it.</p><div class="picks">${G.seats.filter(s => s.id !== me && !dead()[s.id]).map(s => `<button class="pick" data-dact="slay" data-pid="${s.id}">${nm(s.id)}</button>`).join("")}</div><div class="row"><button class="btn" data-dact="close">Cancel</button></div>`);
  }
});
document.getElementById("app").addEventListener("input", e => {
  const el = e.target;
  if (el.id === "say") ui.draft.sq = el.value;
  if (el.id === "dm") ui.draft[chatKey(ui.chat)] = el.value;
  if (el.id === "code") ui.codeIn = el.value;
  if (el.id === "def") ui.draft.def = el.value;
  if (el.id === "name") ui.nameIn = el.value;
});
document.getElementById("app").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && (e.target.id === "dm" || e.target.id === "say")) { e.preventDefault(); e.target.closest(".send").querySelector("button").click(); }
  if (e.key === "Enter" && e.target.id === "code") $("[data-act=go-code]").click();
  if (e.key === "Enter" && e.target.id === "name") $("[data-act=join]").click();
});

/* ---------- Start ---------- */
// Let the Storyteller see when you were last here (at most every few minutes)
let lastPing = 0;
function ping(force) {
  if (!G || !me || document.visibilityState !== "visible" || (!force && nowMs() - lastPing < 4 * 60000)) return;
  lastPing = nowMs();
  FB.setDoc(gref(gid, "joins", myUid), { seen: nowMs() }, { merge: true }).catch(() => {});
}
setInterval(() => { if (G) { refreshGated(); loadAct(); ping(); } render(); }, 20000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && G) { refreshGated(); ping(true); render(); } });
fbStart().then(() => { if (gid) watch(); else render(); }).catch(e => { loadErr = "Couldn't connect: " + (e.message || e); ready = true; render(); });
</script>
</body>
</html>
