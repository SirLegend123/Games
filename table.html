<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15121b">
<script>try { const t = localStorage.getItem("botc-table-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<title>Table Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
:root {
  --bg: #15121b; --surface: #211c29; --surface-2: #2b2534; --line: #3b3346;
  --fg: #ece6f2; --muted: #a69cb3; --brass: #d4ab55; --on-brass: #1a1408;
  --parch: #efe4c9; --parch-ink: #2a2118;
  --good: #4c8ce4; --evil: #d8435a; --unsure: #8d8299;
  --townsfolk: #3e7fd6; --outsider: #5cb8ec; --minion: #d4485e; --demon: #b0263d;
  --warn: #e3a53c;
  --felt: radial-gradient(circle at 50% 45%, #2c2436 0%, #1b1622 62%, #15121b 100%);
  --font-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
/* Light mode: following the phone, unless the player has picked one with the ☀️/🌙 button */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f1eef4; --surface: #ffffff; --surface-2: #f4f0f7; --line: #dcd4e3;
    --fg: #231d2b; --muted: #6c6278; --brass: #94701f; --on-brass: #fff;
    --good: #2463c2; --evil: #be2a42; --unsure: #8a8095;
    --townsfolk: #2463c2; --outsider: #2a92cc; --minion: #c0344b; --demon: #8a1428; --warn: #b7791f;
    --felt: radial-gradient(circle at 50% 45%, #ffffff 0%, #ebe5f0 70%, #e2dbe9 100%);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f1eef4; --surface: #ffffff; --surface-2: #f4f0f7; --line: #dcd4e3;
  --fg: #231d2b; --muted: #6c6278; --brass: #94701f; --on-brass: #fff;
  --good: #2463c2; --evil: #be2a42; --unsure: #8a8095;
  --townsfolk: #2463c2; --outsider: #2a92cc; --minion: #c0344b; --demon: #8a1428; --warn: #b7791f;
  --felt: radial-gradient(circle at 50% 45%, #ffffff 0%, #ebe5f0 70%, #e2dbe9 100%);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.wrap { max-width: 1180px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header h1 { margin: 0 auto 0 0; font-family: var(--font-display); font-weight: 400; color: var(--brass); font-size: 1.6rem; }
.home { text-decoration: none; color: var(--muted); font-size: 1.3rem; }
.head-btns { display: flex; gap: 8px; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps span { font-size: .8rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
.steps span.on { background: var(--brass); color: var(--on-brass); border-color: var(--brass); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; color: var(--brass); }
.card h3 { margin: 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; color: var(--muted); }
.hint { color: var(--muted); font-size: .92rem; margin: 0; }
.lead { font-size: 1.1rem; margin: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
.warn { color: var(--warn); font-weight: 700; margin: 0; }

.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 16px; min-height: 46px; font-weight: 800; }
.btn:hover:not(:disabled) { border-color: var(--brass); }
.btn.primary { background: var(--brass); color: var(--on-brass); border-color: var(--brass); }
.btn.danger { color: var(--evil); }
.btn:disabled { opacity: .45; cursor: default; }
.icon { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); display: inline-grid; place-items: center; }
.icon:disabled { opacity: .3; cursor: default; }
input[type=text], select, textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; }
textarea { resize: vertical; min-height: 90px; }
label.field, .field { display: grid; gap: 6px; }
.label { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; color: var(--muted); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface-2); padding: 8px 14px; min-height: 44px; font-weight: 800; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--brass); color: var(--on-brass); }
.seg button.r-trust[aria-pressed="true"], .seg button.g[aria-pressed="true"] { background: var(--good); color: #fff; }
.seg button.r-suspect[aria-pressed="true"], .seg button.e[aria-pressed="true"] { background: var(--evil); color: #fff; }
.seg button.r-demon[aria-pressed="true"] { background: var(--demon); color: #fff; }
.seg button.r-unsure[aria-pressed="true"] { background: var(--unsure); color: #fff; }

/* Players */
.players { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 2em minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.prow .n { color: var(--muted); font-weight: 800; text-align: right; }
.prow .btns { display: flex; gap: 4px; }
.me-btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; min-height: 40px; padding: 0 12px; font-weight: 800; color: var(--muted); }
.me-btn[aria-pressed="true"] { background: var(--brass); color: var(--on-brass); border-color: var(--brass); }
.add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }

/* Token */
.t-townsfolk { color: var(--townsfolk); } .t-outsider { color: var(--outsider); } .t-minion { color: var(--minion); } .t-demon { color: var(--demon); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 8px; }
.tile { display: grid; justify-items: center; gap: 2px; padding: 10px 6px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); text-align: center; font-weight: 700; font-size: .9rem; line-height: 1.15; min-height: 84px; align-content: center; }
.tile .ico { font-size: 1.7rem; line-height: 1.2; }
.tile[aria-pressed="true"] { background: var(--parch); color: var(--parch-ink); }
.tile.townsfolk[aria-pressed="true"] { border-color: var(--townsfolk); } .tile.outsider[aria-pressed="true"] { border-color: var(--outsider); }
.tile.minion[aria-pressed="true"] { border-color: var(--minion); } .tile.demon[aria-pressed="true"] { border-color: var(--demon); }
.side-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.side-btn { min-height: 110px; border-radius: 16px; border: 3px solid var(--line); background: var(--surface-2); font-family: var(--font-display); font-size: 2rem; }
.side-btn.good[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.side-btn.evil[aria-pressed="true"] { background: var(--evil); border-color: var(--evil); color: #fff; }

/* Grimoire circle */
.grim-wrap { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .grim-wrap { grid-template-columns: minmax(0, 1.15fr) minmax(330px, 1fr); } }
.side { display: grid; gap: 16px; }
.circle { position: relative; width: 100%; max-width: 640px; margin: 0 auto; aspect-ratio: 1; container-type: inline-size; border-radius: 50%; background: var(--felt); border: 1px solid var(--line); }
.seat { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; background: none; border: 0; padding: 0; width: var(--tok); color: inherit; }
.disc { width: var(--tok); aspect-ratio: 1; border-radius: 50%; background: var(--parch); color: var(--parch-ink); border: 4px solid var(--unsure); display: grid; place-content: center; justify-items: center; text-align: center; padding: 6%; box-shadow: 0 2px 6px rgba(0,0,0,.35); overflow: hidden; line-height: 1.02; }
.seat.trust .disc { border-color: var(--good); } .seat.suspect .disc { border-color: var(--evil); } .seat.demon .disc { border-color: var(--demon); border-width: 6px; }
.seat.me .disc { outline: 4px solid var(--brass); outline-offset: 2px; }
.seat.sel .disc { box-shadow: 0 0 0 4px var(--fg); }
.seat.dead .disc { filter: grayscale(1) brightness(.65); }
.disc .ico { font-size: calc(var(--tok) * .3); line-height: 1.1; }
.disc .nm { font-weight: 800; font-size: calc(var(--tok) * var(--fs)); }
.disc .q { font-family: var(--font-display); font-size: calc(var(--tok) * .34); color: #8d826f; }
.plate { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font-weight: 800; font-size: clamp(.7rem, 2.6cqi, .95rem); max-width: calc(var(--tok) * 1.6); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat.dead .plate { text-decoration: line-through; color: var(--muted); }
.badge { font-size: clamp(.6rem, 2.1cqi, .72rem); font-weight: 800; border-radius: 999px; padding: 0 6px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.badge.demon { background: var(--demon); color: #fff; border-color: var(--demon); }
.center { position: absolute; inset: 30%; display: grid; place-content: center; justify-items: center; text-align: center; gap: 6px; }
.center .ph { font-family: var(--font-display); color: var(--brass); font-size: clamp(1.2rem, 6cqi, 2.2rem); }
.phase { display: flex; align-items: center; gap: 8px; }
.phase b { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; color: var(--brass); min-width: 5.5em; text-align: center; }

.ability { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin: 0; }
.ability small { display: block; color: var(--muted); margin-top: 4px; }
.mine { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.mine .big { font-size: 2.6rem; }
.log { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.log li { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; display: flex; gap: 8px; align-items: baseline; }
.log li .ph { color: var(--brass); font-weight: 800; font-size: .85rem; white-space: nowrap; }
.log li .t { flex: 1; overflow-wrap: anywhere; }
.x { background: none; border: 0; color: var(--muted); font-weight: 800; padding: 0 4px; }
.claims { display: grid; gap: 6px; }
.claim { display: flex; gap: 8px; align-items: center; }
.claim .ico { width: 1.6em; text-align: center; }

/* Table Notes */
/* 👋 The signal: a big card to hold up when you want a word */
.signal { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--sig, #d4ab55); color: #1a1408; text-align: center; animation: sigpulse 1.6s ease-in-out infinite; }
.signal .in { display: grid; gap: 3vh; justify-items: center; width: min(900px, 100%); }
.signal .hand { font-size: clamp(4rem, 20vmin, 9rem); line-height: 1; }
.signal .msg { font-weight: 800; font-size: clamp(3rem, 14vw, 8rem); line-height: 1.05; }
.signal .opts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.signal .opts button { border: 2px solid rgba(0,0,0,.35); background: rgba(255,255,255,.35); color: inherit; border-radius: 999px; padding: 8px 14px; font-weight: 800; min-height: 44px; }
.signal .opts button[aria-pressed="true"] { background: #1a1408; color: #fff; border-color: #1a1408; }
.signal .close { background: #1a1408; color: #fff; border: 0; border-radius: 12px; padding: 12px 28px; font-weight: 800; font-size: 1.1rem; min-height: 50px; }
@keyframes sigpulse { 50% { filter: brightness(1.15); } }
@media (prefers-reduced-motion: reduce) { .signal { animation: none; } }
.tiles.small { grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 6px; }
.tiles.small .tile { min-height: 66px; font-size: .8rem; padding: 6px 4px; }
.tiles.small .tile .ico { font-size: 1.4rem; }
.pick-chars { display: grid; gap: 8px; }
.infoform { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.infoform > .seg, .modal .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.notes-page { display: grid; gap: 16px; }
.mx { border-collapse: collapse; width: 100%; font-size: .95rem; }
.mx th:first-child { width: 9em; }
.mx th, .mx td { text-align: left; vertical-align: top; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.mx thead th { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.mx .c > div + div { margin-top: 4px; }
.mx small { color: var(--muted); font-weight: 700; }
.mx th small { display: block; font-weight: 700; }
.mx tr.dead .mx-name { text-decoration: line-through; color: var(--muted); }
.mx tr.on th { box-shadow: inset 4px 0 0 var(--brass); }
/* Phones: each player as a block, with the column names beside the lines */
@media (max-width: 640px) {
  .mx thead { display: none; }
  .mx, .mx tbody, .mx tr, .mx th, .mx td { display: block; width: auto; }
  .mx tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .mx th, .mx td { border: 0; padding: 3px 0; }
  .mx td { display: grid; grid-template-columns: 3.5em minmax(0, 1fr); gap: 8px; }
  .mx td::before { content: attr(data-l); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; padding-top: 2px; }
  .mx th small { display: inline; margin-left: 8px; }
}
.mx-name { background: none; border: 0; padding: 0; font-weight: 800; color: inherit; text-align: left; }
.pick-row { display: flex; flex-wrap: wrap; gap: 6px; }
.pbtn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 8px 14px; min-height: 44px; font-weight: 800; }
.pbtn.num { min-width: 48px; }
.pbtn[aria-pressed="true"] { background: var(--brass); color: var(--on-brass); border-color: var(--brass); }
.next-btn { justify-self: center; }
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(8,6,12,.7); display: grid; place-items: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.modal-in { width: min(560px, 100%); border: 2px solid var(--brass); }
.disc .ico.multi { font-size: calc(var(--tok) * .2); letter-spacing: -.1em; }
.card > .seg { display: grid; grid-template-columns: 1fr 1fr; }
.card > .seg button + button { border-left: 1px solid var(--line); }
.seat.soft .disc { border-style: dashed; border-color: var(--brass); }
.seat.hard .disc { border-color: var(--brass); }
.seat .flag { position: absolute; top: -4px; right: -4px; font-size: clamp(.8rem, 3cqi, 1.1rem); background: var(--warn); color: #1a1408; border-radius: 999px; width: 1.4em; height: 1.4em; display: grid; place-items: center; font-weight: 800; }
.disc .sm { font-size: calc(var(--tok) * .13); font-weight: 800; color: #6b5f4c; }
.kind { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.kind.hard { background: var(--brass); color: var(--on-brass); }
.kind.soft { border: 1px dashed var(--brass); color: var(--brass); }
.cl-list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.cl-list li { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.cl-list .ico { font-size: 1.5rem; }
.cl-list small { color: var(--muted); display: block; }
.deaths { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.deaths .btn { min-height: 52px; }
.dead-box { background: var(--surface-2); border-left: 4px solid var(--evil); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.flagtxt { color: var(--warn); font-weight: 800; font-size: .85rem; }
footer { color: var(--muted); font-size: .8rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="home" href="index.html" aria-label="All apps">⌂</a>
    <h1>Table Notes</h1>
    <nav class="steps" id="steps" aria-label="Steps"></nav>
    <span class="head-btns"><button class="btn" data-act="signal" id="sigBtn">👋 Signal</button><button class="btn" id="themeBtn" data-act="theme"></button></span>
  </header>
  <main id="app"></main>
  <div id="sigBox" hidden></div>
  <footer><i>Blood on the Clocktower</i> and its character names belong to The Pandemonium Institute. Unofficial fan-made tool; the symbols are our own.</footer>
</div>
<script>window.APP_V = 73;</script>
<script src="update.js"></script>
<script src="characters.js"></script>
<script>
/* A notepad for playing Blood on the Clocktower round a real table: the players, your character,
   what you learn each night, who claims what, and who died and how. Everything stays on this device.
   👋 Signal fills the screen with a big card to hold up when you want a word. */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
// Phases: 0 is Night 1, 1 is Day 1, 2 is Night 2…
const phaseName = ph => `${ph % 2 ? "Day" : "Night"} ${Math.floor(ph / 2) + 1}`;
const DEATHS = [["executed", "🪓", "Executed"], ["night", "🌙", "Died at night"], ["slayer", "🏹", "Slayer shot"], ["virgin", "🕊️", "Virgin"], ["other", "❓", "Other"]];
const deathOf = k => DEATHS.find(d => d[0] === k) || DEATHS[4];

/* ---------- Light and dark ---------- */
const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
function themeBtn() {
  const d = isDark(), b = $("themeBtn");
  b.textContent = d ? "☀️ Light" : "🌙 Dark";
  b.setAttribute("aria-label", d ? "Switch to light mode" : "Switch to dark mode");
  document.querySelector('meta[name="theme-color"]').content = d ? "#15121b" : "#f1eef4";
}
function toggleTheme() {
  const t = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("botc-table-theme", t); } catch (e) {}
  themeBtn();
}
matchMedia("(prefers-color-scheme: light)").addEventListener("change", themeBtn);

/* ---------- State ---------- */
const LS = "botc-table-v1";
const fresh = () => ({ step: "players", script: "tb", players: [], me: "", role: "", ph: 0, P: {}, info: [] });
let S;
try { S = JSON.parse(localStorage.getItem(LS)); } catch (e) { S = null; }
if (!S || !S.step) S = fresh();
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };
const ui = { sel: null, kind: "hard", claimRoles: [], inf: { by: "", char: "", form: 0, ps: [], rs: [], n: null, yn: null, none: false, pick: false }, next: null };
const about = pid => (S.P[pid] = S.P[pid] || { claims: [], death: null, ghost: false, notes: "" });
const nameOf = pid => (S.players.find(p => p.id === pid) || {}).name || "?";
const alive = () => S.players.filter(p => !about(p.id).death);

// The characters to choose from: the script's, or every character we know for other scripts
function charGroups() {
  if (S.script !== "other") return TEAMS.map(t => [TEAM_LABEL[t], SCRIPTS[S.script].roles[t].map(r => r[0])]);
  return TEAMS.map(t => [TEAM_LABEL[t], Object.values(CHAR).filter(c => c.team === t).map(c => c.name).sort()]);
}
const iconOf = r => (CHAR[r] || {}).icon || "❔";
const teamCls = r => CHAR[r] ? `t-${CHAR[r].team}` : "";
// For other scripts, characters are typed, with suggestions
const roleInput = (id, val = "") => S.script === "other"
  ? `<input type="text" id="${id}" list="allChars" value="${esc(val)}" placeholder="Character" autocomplete="off"><datalist id="allChars">${Object.keys(CHAR).sort().map(n => `<option value="${esc(n)}">`).join("")}</datalist>`
  : `<select id="${id}"><option value="">Character…</option>${charGroups().map(([l, rs]) => `<optgroup label="${l}">${rs.map(r => `<option ${r === val ? "selected" : ""}>${esc(r)}</option>`).join("")}</optgroup>`).join("")}</select>`;

// A soft claim can be one of several characters ("I'm the Slayer, Soldier or Mayor")
const rolesOf = c => c.roles || [c.role];
const orList = a => a.length <= 1 ? (a[0] || "") : a.slice(0, -1).join(", ") + " or " + a[a.length - 1];
const claimText = c => orList(rolesOf(c));
// What each player is claiming: their latest hard claim, or else their latest soft one
function currentClaim(pid) {
  const cs = about(pid).claims;
  return [...cs].reverse().find(c => c.kind === "hard") || cs[cs.length - 1] || null;
}
// ⚠ when someone's story has changed, or two players hard claim the same character
function flagsOf(pid) {
  const f = [], cs = about(pid).claims;
  // Two claims that can't both be true: no character in common
  if (cs.some((a, i) => cs.slice(i + 1).some(b => !rolesOf(a).some(r => rolesOf(b).includes(r))))) f.push("Claims have changed");
  const c = currentClaim(pid);
  if (c && c.kind === "hard") {
    const others = S.players.filter(p => p.id !== pid && (currentClaim(p.id) || {}).role === c.role && currentClaim(p.id).kind === "hard");
    if (others.length) f.push(`${others.map(p => p.name).join(", ")} also hard claims the ${c.role}`);
    if (pid !== S.me && c.role === S.role) f.push("Claims your character");
  }
  return f;
}

  const short = ph => `${ph % 2 ? "D" : "N"}${Math.floor(ph / 2) + 1}`;
  const claimCell = (cs) => cs.length ? cs.map(c => `<div>${rolesOf(c).map(iconOf).join("")} ${esc(claimText(c))} <small>${short(c.ph)}</small></div>`).join("") : `<span class="hint">–</span>`;
  const rows = S.players.map(p => {
    const A = about(p.id), me = p.id === S.me, cs = A.claims, f = me ? [] : flagsOf(p.id), info = infoOf(me ? "" : p.id);
    return `<tr class="${A.death ? "dead" : ""} ${ui.sel === p.id ? "on" : ""}">
      <th scope="row"><button class="mx-name" data-act="sel" data-pid="${p.id}">${me ? "★ " : ""}${esc(p.name)}</button>${A.death ? `<small>${deathOf(A.death.how)[1]} ${short(A.death.ph)}</small>` : ""}${f.length ? `<small class="flagtxt" title="${esc(f.join("; "))}">⚠ ${esc(f.join("; "))}</small>` : ""}</th>
      <td data-l="Soft"><div class="c">${me ? `<span class="hint">–</span>` : claimCell(cs.filter(c => c.kind === "soft"))}</div></td>
      <td data-l="Hard"><div class="c">${me ? `<div>${iconOf(S.role)} ${esc(S.role)} <span class="kind hard">You</span></div>` : claimCell(cs.filter(c => c.kind === "hard"))}</div></td>
      <td data-l="Info"><div class="c">${info.length ? info.map(e => `<div><small>${short(e.ph)}</small> ${esc(e.text)}</div>`).join("") : `<span class="hint">–</span>`}</div></td>

    <div class="mx-wrap"><table class="mx"><thead><tr><th scope="col">Player</th><th scope="col">Soft claims</th><th scope="col">Hard claims</th><th scope="col">Info</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint">Tap a name to add claims or info. N1 is Night 1, D1 is Day 1.</p></section>`;
}
function summaryCard() {

function addNames() {
  const box = $("newName"), names = box.value.split(",").map(s => s.trim()).filter(Boolean);
  if (!names.length) return;
  for (const name of names) S.players.push({ id: uid(), name });

}
function addInfo() {
  if (S.script === "other" && $("infRoles")) ui.inf.rs = $("infRoles").value.split(",").map(x => x.trim()).filter(Boolean).slice(0, infForm().r);
  const note = ($("infoIn").value || "").trim(), line = infLine();
  const t = line && note ? `${line}. ${note}` : line || note;
  if (!t) { $("infoIn").focus(); return; }
  const ch = infChar() && infChar() !== baseChar(ui.inf.by) ? infChar() : "";
  S.info.push({ id: uid(), ph: S.ph, text: ch ? `(${ch}) ${t}` : t, ps: ui.inf.ps.slice(), ...(ui.inf.by ? { by: ui.inf.by } : {}) });
  Object.assign(ui.inf, { ps: [], rs: [], n: null, yn: null, none: false });
  render();
}
/* ---------- What each character learns or does ---------- */
// A form for each character: players to pick (p, at least pMin), characters (r, from the teams rt),

const nm = n => `${n}`;
const chose = verb => ({ p: 1, say: f => `${verb} ${f.ps[0]}` });

  "Pit-Hag": { p: 1, r: 1, rt: ALL_TEAMS, say: f => `I turned ${f.ps[0]} into the ${f.rs[0]}` },
  Barber: { p: 2, say: f => `I swapped ${andList(f.ps)}` },
  "Fang Gu": chose("I attacked"), Vigormortis: chose("I attacked"), "No Dashii": chose("I attacked"), Vortox: chose("I attacked")
};
// Anything else: players, characters or a number, as you like
const GENERIC = { p: 3, pMin: 0, r: 2, rMin: 0, rt: ALL_TEAMS, n: true, nOpt: true, say: f => [andList(f.ps), orList(f.rs), f.n != null ? nm(f.n) : ""].filter(Boolean).join(" · ") };
const EVIL_TEAM = { label: "👿 Evil team", p: 4, pMin: 1, say: f => `Evil team: ${andList(f.ps)}` };
const BLUFFS = { label: "🎭 Bluffs", r: 3, rMin: 1, rt: ["townsfolk", "outsider"], say: f => `Demon bluffs: ${andList(f.rs)}` };
function formsFor(ch) {
  const c = CHAR[ch], own = INFO[ch] ? { ...INFO[ch], label: `${iconOf(ch)} ${ch}` } : { ...GENERIC, label: c ? `${iconOf(ch)} ${ch}` : "📝 Info" };
  return [own, ...(c && c.team === "minion" ? [EVIL_TEAM] : c && c.team === "demon" ? [EVIL_TEAM, BLUFFS] : [])];
}
const baseChar = by => by ? (currentClaim(by) ? rolesOf(currentClaim(by))[0] : "") : S.role;
const infChar = () => ui.inf.char || baseChar(ui.inf.by);
const resetInf = by => Object.assign(ui.inf, { by, char: "", form: 0, ps: [], rs: [], n: null, yn: null, none: false, pick: false });
const infoOf = by => S.info.filter(e => (e.by || "") === by);
const infoLog = by => { const L = infoOf(by); return L.length ? `<ol class="log">${L.map(e => `<li><span class="ph">${phaseName(e.ph)}</span><span class="t">${esc(e.text)}</span><button class="x" data-act="info-del" data-id="${e.id}" aria-label="Delete">×</button></li>`).join("")}</ol>` : ""; };
const infForm = () => { const fs = formsFor(infChar()); return fs[Math.min(ui.inf.form, fs.length - 1)]; };
// The line the picks make (without the note)
function infLine() {
  const F = infForm(), I = ui.inf, f = { ps: I.ps.map(nameOf), rs: I.rs, n: I.n, yn: I.yn };
  if (I.none && F.none) return F.none;
  const ready = (!F.p || I.ps.length >= (F.pMin ?? F.p)) && (!F.r || I.rs.length >= (F.rMin ?? F.r)) && (!F.n || F.nOpt || I.n != null) && (!F.yn || I.yn != null);
  if (!ready) return "";
  return F.p || F.r || F.n || F.yn ? F.say(f) : "";
}
function infoFormHtml() {
  const F = infForm(), I = ui.inf, fs = formsFor(infChar()), ch = infChar(), typed = S.script === "other";
  const need = [F.p ? `${F.pMin === 0 ? "up to " : ""}${F.p} player${F.p === 1 ? "" : "s"}` : "", F.r ? `${F.rMin === 0 ? "up to " : ""}${F.r} character${F.r === 1 ? "" : "s"}` : "", F.n && !F.nOpt ? "a number" : "", F.yn ? "an answer" : ""].filter(Boolean);
  const nMax = Math.min(F.nMax ?? 10, Math.max(S.players.length, 1));
  return `<div class="infoform">
    <div class="row"><b>${F.label.startsWith("👿") || F.label.startsWith("🎭") ? `${iconOf(ch)} ${esc(ch)}` : esc(F.label)}: ${ui.inf.by ? `what ${esc(nameOf(ui.inf.by))} says they learnt` : "what I learnt or did"}</b><span class="spacer"></span><button class="btn" data-act="inf-pick">${I.pick ? "Close" : "Another character…"}</button></div>
    ${I.pick ? `<p class="hint">Whose form? (If you were drunk, or your character changed.)</p>${typed ? `<div class="add"><input type="text" id="infChar" list="allChars" placeholder="Character" autocomplete="off"><button class="btn" data-act="inf-char-typed">Use</button></div><datalist id="allChars">${Object.keys(CHAR).sort().map(n => `<option value="${esc(n)}">`).join("")}</datalist>`
      : `<div class="tiles small">${TEAMS.flatMap(t => SCRIPTS[S.script].roles[t].map(([name, icon]) => `<button class="tile ${t}" data-act="inf-char" data-role="${esc(name)}" aria-pressed="${ch === name}"><span class="ico" aria-hidden="true">${icon}</span>${esc(name)}</button>`)).join("")}</div>`}` : ""}
    ${fs.length > 1 ? `<div class="seg" role="group">${fs.map((x, k) => `<button data-act="inf-form" data-v="${k}" aria-pressed="${x === F}">${esc(x.label)}</button>`).join("")}</div>` : ""}
    ${need.length ? `<p class="hint">Pick ${andList(need)}.</p>` : `<p class="hint">Write it down below.</p>`}
    ${F.p ? `<div class="pick-row">${S.players.map(p => `<button class="pbtn" data-act="inf-p" data-pid="${p.id}" aria-pressed="${I.ps.includes(p.id)}">${esc(p.name)}</button>`).join("")}</div>` : ""}
    ${F.none ? `<div class="pick-row"><button class="pbtn" data-act="inf-none" aria-pressed="${I.none}">${esc(F.none)}</button></div>` : ""}
    ${F.r ? (typed ? `<input type="text" id="infRoles" list="allChars" value="${esc(I.rs.join(", "))}" placeholder="Character${F.r > 1 ? "s, separated by commas" : ""}" autocomplete="off"><datalist id="allChars">${Object.keys(CHAR).sort().map(n => `<option value="${esc(n)}">`).join("")}</datalist>`
      : `<div class="pick-chars">${(F.rt || ALL_TEAMS).filter(t => SCRIPTS[S.script].roles[t].length).map(t => `<h3 class="t-${t}">${TEAM_LABEL[t]}</h3><div class="tiles small">${SCRIPTS[S.script].roles[t].map(([name, icon]) => `<button class="tile ${t}" data-act="inf-r" data-role="${esc(name)}" aria-pressed="${I.rs.includes(name)}"><span class="ico" aria-hidden="true">${icon}</span>${esc(name)}</button>`).join("")}</div>`).join("")}</div>`) : ""}
    ${F.n ? `<div class="pick-row">${Array.from({ length: nMax + 1 }, (_, k) => `<button class="pbtn num" data-act="inf-n" data-v="${k}" aria-pressed="${I.n === k}">${k}</button>`).join("")}</div>` : ""}
    ${F.yn ? `<div class="seg" role="group">${F.yn.map((l, k) => `<button data-act="inf-yn" data-v="${k}" aria-pressed="${I.yn === k}">${esc(l)}</button>`).join("")}</div>` : ""}
    <input type="text" id="infoIn" placeholder="${F.p || F.r || F.n || F.yn ? "Anything else (optional)" : `What did you learn on ${phaseName(S.ph)}?`}" autocomplete="off" enterkeyhint="done" aria-label="What you learnt">
    ${infLine() ? `<p class="ability" id="infPrev">${esc(infLine())}</p>` : ""}
    <button class="btn primary" data-act="info-add">Add to ${phaseName(S.ph)}</button>
  </div>`;
}

// Redraw without losing what's been typed in the claim's note
function keepDraft() {
  const n = $("claimNote") && $("claimNote").value, m = $("infoIn") && $("infoIn").value, y = window.scrollY;
  if (S.script === "other" && $("infRoles")) ui.inf.rs = $("infRoles").value.split(",").map(x => x.trim()).filter(Boolean);
  render();
  if ($("claimNote")) $("claimNote").value = n || "";
  if ($("infoIn")) $("infoIn").value = m || "";
  window.scrollTo(0, y);
}
function addClaim(pid) {
  // Typed characters: a soft claim can list several, separated by commas or "or"
  const typed = S.script === "other" ? ($("claimRole").value || "").split(ui.kind === "soft" ? /,|\s+or\s+|\//i : /$^/).map(x => x.trim()).filter(Boolean) : null;
  const roles = typed || ui.claimRoles;
  if (!roles.length) { if ($("claimRole")) $("claimRole").focus(); return; }
  about(pid).claims.push({ id: uid(), kind: ui.kind, role: roles[0], roles: ui.kind === "soft" ? [...new Set(roles)] : [roles[0]], note: ($("claimNote").value || "").trim(), ph: S.ph });
  ui.claimRoles = [];
  render();
}
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const i = Number(el.dataset.i), pid = el.dataset.pid;
  switch (el.dataset.act) {
    case "theme": toggleTheme(); return;
    case "add": return addNames();
    case "up": case "down": { const j = el.dataset.act === "up" ? i - 1 : i + 1; [S.players[i], S.players[j]] = [S.players[j], S.players[i]]; break; }
    case "del": if (S.players[i].id === S.me) S.me = ""; S.players.splice(i, 1); break;
    case "me": S.me = pid; break;
    case "clear-players": if (!confirm("Remove every player?")) return; S.players = []; S.me = ""; break;
    case "to-players": S.step = "players"; break;
    case "to-role": S.step = "role"; break;
    case "to-notes": S.step = "notes"; break;
    case "role": S.role = el.dataset.role; break;
    case "role-typed": S.role = ($("myRole").value || "").trim(); break;
    case "sel": ui.claimRoles = []; if (ui.inf.by) resetInf(""); ui.sel = ui.sel === pid ? null : pid; render(); if (ui.sel && innerWidth < 900) { const c = document.querySelector(".grim-wrap > .side + .side"); if (c) c.scrollIntoView({ behavior: "smooth" }); } return;
    case "claim-role": {
      // Soft: tap as many as they might be. Hard: just the one.
      const r = el.dataset.role, on = ui.claimRoles.includes(r);
      ui.claimRoles = ui.kind === "soft" ? (on ? ui.claimRoles.filter(x => x !== r) : [...ui.claimRoles, r]) : (on ? [] : [r]);
      keepDraft(); return;
    }
    case "kind": ui.kind = el.dataset.v; if (ui.kind === "hard") ui.claimRoles = ui.claimRoles.slice(-1); { const r = $("claimRole") && $("claimRole").value, n = $("claimNote") && $("claimNote").value; render(); if ($("claimRole")) $("claimRole").value = r || ""; if ($("claimNote")) $("claimNote").value = n || ""; } return;
    case "claim-add": return addClaim(pid);
    case "claim-del": about(pid).claims = about(pid).claims.filter(c => c.id !== el.dataset.id); break;
    case "die": about(pid).death = { how: el.dataset.v, ph: S.ph }; break;
    case "undead": about(pid).death = null; about(pid).ghost = false; break;
    case "ghost": about(pid).ghost = !about(pid).ghost; break;
    case "ph": S.ph = Math.max(0, S.ph + Number(el.dataset.v)); break;
    case "info-add": return addInfo();
    case "inf-by": resetInf(pid || ""); keepDraft(); return;
    case "inf-pick": ui.inf.pick = !ui.inf.pick; keepDraft(); return;
    case "inf-char": Object.assign(ui.inf, { char: el.dataset.role === S.role ? "" : el.dataset.role, form: 0, ps: [], rs: [], n: null, yn: null, none: false, pick: false }); keepDraft(); return;
    case "inf-char-typed": { const v = ($("infChar").value || "").trim(); Object.assign(ui.inf, { char: v === S.role ? "" : v, form: 0, ps: [], rs: [], n: null, yn: null, none: false, pick: false }); keepDraft(); return; }
    case "inf-form": Object.assign(ui.inf, { form: Number(el.dataset.v), ps: [], rs: [], n: null, yn: null, none: false }); keepDraft(); return;
    case "inf-p": { const F = infForm(), I = ui.inf; I.ps = I.ps.includes(pid) ? I.ps.filter(x => x !== pid) : [...I.ps, pid].slice(-F.p); keepDraft(); return; }
    case "inf-r": { const F = infForm(), I = ui.inf, r = el.dataset.role; I.rs = I.rs.includes(r) ? I.rs.filter(x => x !== r) : [...I.rs, r].slice(-F.r); I.none = false; keepDraft(); return; }
    case "inf-n": ui.inf.n = ui.inf.n === Number(el.dataset.v) ? null : Number(el.dataset.v); keepDraft(); return;
    case "inf-yn": ui.inf.yn = ui.inf.yn === Number(el.dataset.v) ? null : Number(el.dataset.v); keepDraft(); return;
    case "inf-none": ui.inf.none = !ui.inf.none; if (ui.inf.none) { ui.inf.ps = []; ui.inf.rs = []; } keepDraft(); return;
    case "next-open": ui.next = []; keepDraft(); return;
    case "next-pick": { const day = S.ph % 2 === 1; ui.next = ui.next.includes(pid) ? ui.next.filter(x => x !== pid) : day ? [pid] : [...ui.next, pid]; keepDraft(); return; }
    case "next-cancel": ui.next = null; keepDraft(); return;
    case "next-go": {
      // Mark who died, then move on: an execution at the end of the day, deaths in the night by morning
      const day = S.ph % 2 === 1;
      for (const q of ui.next) about(q).death = { how: day ? "executed" : "night", ph: S.ph };
      S.ph++; ui.next = null; Object.assign(ui.inf, { ps: [], rs: [], n: null, yn: null, none: false });
      break;
    }
    case "info-del": S.info = S.info.filter(e => e.id !== el.dataset.id); break;
    case "new-game": if (!confirm("Start a new game? The players stay; your character, notes, claims and deaths are cleared.")) return; S = { ...fresh(), script: S.script, players: S.players, me: S.me, step: "role" }; ui.sel = null; break;
    default: return;
  }
  render();
  if (["to-players", "to-role", "to-notes", "new-game"].includes(el.dataset.act)) window.scrollTo({ top: 0 });
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.dataset.name !== undefined) { S.players[Number(t.dataset.name)].name = t.value; save(); }
  if (t.dataset.notes !== undefined) { about(t.dataset.notes).notes = t.value; save(); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.script !== undefined) { S.script = t.value; if (S.role && S.script !== "other" && !SCRIPTS[S.script].roles[CHAR[S.role] ? CHAR[S.role].team : "townsfolk"].some(r => r[0] === S.role)) S.role = ""; render(); }
  if (t.dataset.name !== undefined) render();
});
document.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  if (ev.target.id === "newName") { ev.preventDefault(); addNames(); }
  if (ev.target.id === "infoIn") { ev.preventDefault(); addInfo(); }
  if (ev.target.id === "claimNote") { ev.preventDefault(); addClaim(ui.sel); }
});
/* ---------- 👋 Signal ---------- */
// A big card to hold up at the table: no names, so anyone who catches your eye knows you want a word
const SIG_MSGS = ["Can we talk?", "Later?", "After this vote?", "Come and find me", "Yes!", "No"];
const SIG_COLOURS = ["#f0c66a", "#7fd1ff", "#ff9aa9", "#9ef0a8"];
const sig = { on: false, msg: 0, colour: 0 };
function showSignal() {
  const box = $("sigBox");
  if (!sig.on) { box.hidden = true; box.innerHTML = ""; document.body.style.overflow = ""; return; }
  box.hidden = false; document.body.style.overflow = "hidden";
  box.innerHTML = `<div class="signal" style="--sig:${SIG_COLOURS[sig.colour]}" role="dialog" aria-label="Signal"><div class="in">
      <div class="hand" aria-hidden="true">👋</div>
      <div class="msg">${esc(SIG_MSGS[sig.msg])}</div>
      <div class="opts">${SIG_MSGS.map((m, k) => `<button data-act="sig-msg" data-v="${k}" aria-pressed="${k === sig.msg}">${esc(m)}</button>`).join("")}</div>
      <div class="opts">${SIG_COLOURS.map((c, k) => `<button data-act="sig-colour" data-v="${k}" aria-pressed="${k === sig.colour}" aria-label="Colour ${k + 1}" style="background:${c};width:44px"></button>`).join("")}</div>
      <button class="close" data-act="sig-close">Done</button></div></div>`;
}
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act;
  if (a === "signal") sig.on = true;
  else if (a === "sig-msg") sig.msg = Number(el.dataset.v);
  else if (a === "sig-colour") sig.colour = Number(el.dataset.v);
  else if (a === "sig-close") sig.on = false;
  else return;
  ev.stopImmediatePropagation();
  showSignal();
}, true);
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && sig.on) { sig.on = false; showSignal(); } }, true);
render();
</script>
