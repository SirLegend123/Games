<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solo">
<title>Solo Practice</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15121b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script src="companion.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Solo practice against bots. Dark-first, same palette as the Clocktower Companion apps. */
:root {
  --bg: #15121b; --surface: #211c29; --surface-2: #2b2534; --line: #3b3346;
  --fg: #ece6f2; --muted: #a69cb3; --brass: #d4ab55;
  --parch: #efe4c9; --parch-ink: #2a2118;
  --good: #4c8ce4; --evil: #d8435a;
  --townsfolk: #3e7fd6; --outsider: #3aa0b5; --minion: #d4485e; --demon: #9e1f33;
  --ok: #3aa35c; --warn: #e3a53c;
  --felt-1: #2c2436; --felt-2: #1b1622;
  --font-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f1eef4; --surface: #ffffff; --surface-2: #f4f0f7; --line: #dcd4e3;
    --fg: #231d2b; --muted: #6c6278; --brass: #94701f;
    --good: #2463c2; --evil: #be2a42;
    --townsfolk: #2463c2; --outsider: #1f8296; --minion: #c0344b; --demon: #8a1428; --ok: #2a9150; --warn: #b7791f;
    --felt-1: #ffffff; --felt-2: #e2dbe9;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f1eef4; --surface: #ffffff; --surface-2: #f4f0f7; --line: #dcd4e3;
  --fg: #231d2b; --muted: #6c6278; --brass: #94701f;
  --good: #2463c2; --evil: #be2a42;
  --townsfolk: #2463c2; --outsider: #1f8296; --minion: #c0344b; --demon: #8a1428; --ok: #2a9150; --warn: #b7791f;
  --felt-1: #ffffff; --felt-2: #e2dbe9;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #15121b; --surface: #211c29; --surface-2: #2b2534; --line: #3b3346;
  --fg: #ece6f2; --muted: #a69cb3; --brass: #d4ab55;
  --good: #4c8ce4; --evil: #d8435a;
  --townsfolk: #3e7fd6; --outsider: #3aa0b5; --minion: #d4485e; --demon: #9e1f33; --ok: #3aa35c; --warn: #e3a53c;
  --felt-1: #2c2436; --felt-2: #1b1622;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 1rem; line-height: 1.45; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; display: grid; gap: 14px; }
.bar { display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; margin-inline: -16px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { font-family: var(--font-display); font-weight: 400; font-size: 1.45rem; color: var(--brass); margin: 0; line-height: 1; margin-right: auto; }
.phase { font-weight: 800; font-size: .9rem; color: var(--muted); white-space: nowrap; }
@media (max-width: 420px) { .brand { font-size: 1.15rem; } }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 700; min-height: 44px; }
.btn:hover { border-color: var(--brass); }
.btn.primary { background: var(--brass); color: #1a1408; border-color: var(--brass); }
.btn.sm { padding: 5px 11px; min-height: 34px; font-size: .88rem; }
.btn.danger { color: var(--evil); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.45rem; color: var(--brass); }
.card h3 { margin: 0; font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 800; }
.card p { margin: 0; }
.hint { font-size: .88rem; color: var(--muted); }
.muted { color: var(--muted); }
textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 220px; resize: vertical; }
select.inp { flex: 1 1 14em; min-width: 0; max-width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* Name grid for passing the phone */
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.name-btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 14px 10px; font-weight: 800; font-size: 1.05rem; min-height: 56px; overflow-wrap: anywhere; }
.name-btn:hover:not(:disabled) { border-color: var(--brass); }
.name-btn:disabled { opacity: .45; cursor: default; font-weight: 600; }

/* Player picker */
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.pc { border: 2px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 8px; font-weight: 700; min-height: 48px; overflow-wrap: anywhere; }
.pc.on { border-color: var(--brass); background: color-mix(in srgb, var(--brass) 22%, var(--surface-2)); }
.pc.dead { color: var(--muted); }

/* Private screens */
.private { border-color: var(--brass); }
.big-name { font-family: var(--font-display); font-size: 2.2rem; color: var(--brass); text-align: center; line-height: 1.1; overflow-wrap: anywhere; }
.role-card { background: var(--parch); color: var(--parch-ink); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; border-left: 6px solid var(--townsfolk); }
.role-card.outsider { border-left-color: var(--outsider); } .role-card.minion { border-left-color: var(--minion); } .role-card.demon { border-left-color: var(--demon); }
.role-name { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.1; }
.role-team { font-weight: 800; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
.role-card.townsfolk .role-team, .role-card.outsider .role-team { color: #1f5bb0; }
.role-card.minion .role-team, .role-card.demon .role-team { color: #a3203a; }
.info { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.info b { color: var(--brass); }
.msg { background: color-mix(in srgb, var(--evil) 16%, var(--surface-2)); border: 1px solid var(--evil); border-radius: 10px; padding: 10px 12px; }
.hist { display: grid; gap: 8px; }
.hist-when { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 800; }

/* Grimoire table (Spy and end of game) */
table.grim { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.grim td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.grim tr.dead td:first-child { text-decoration: line-through; color: var(--muted); }
.tag { display: inline-block; font-size: .72rem; font-weight: 800; border-radius: 99px; padding: 1px 8px; margin: 1px 2px 1px 0; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.tag.evil { color: var(--evil); border-color: var(--evil); } .tag.good { color: var(--good); border-color: var(--good); }

/* Town square */
.banner { border-radius: 12px; padding: 12px 14px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); }
.banner.evil { border-color: var(--evil); color: var(--evil); }
.timer { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 1.2rem; }
.big-timer { text-align: center; font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size: clamp(4rem, 26vw, 9rem); line-height: 1; color: var(--brass); padding: 10px 0 4px; }
.big-timer.low { color: var(--warn); }
.big-timer.up { color: var(--evil); font-size: clamp(3rem, 17vw, 6rem); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .big-timer.up { animation: none; } }
.timer-row { justify-content: center; }
.tok.next { box-shadow: 0 0 0 5px var(--brass), 0 3px 10px rgba(0,0,0,.35); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 14px; font-weight: 700; min-height: 44px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--brass); color: #1a1408; }
.setting { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.setting > span { font-weight: 700; min-width: 5.5em; }
.win { text-align: center; font-family: var(--font-display); font-size: clamp(3.2rem, 17vw, 7rem); line-height: 1; padding: 28px 12px; border-radius: 14px; border: 2px solid currentColor; text-wrap: balance; }
.win.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.win.evil { color: var(--evil); background: color-mix(in srgb, var(--evil) 14%, var(--surface)); }
.win-reason { text-align: center; font-size: 1.2rem; text-wrap: balance; }

/* The table: seats in a circle, clockwise from the top */
.table { position: relative; width: 100%; max-width: 560px; margin: 4px auto; aspect-ratio: 1; container-type: inline-size; border-radius: 50%; background: radial-gradient(circle at 50% 45%, var(--felt-1) 0%, var(--felt-2) 72%); border: 1px solid var(--line); }
.tok { position: absolute; width: var(--d); height: var(--d); transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center; padding: 4%; background: var(--parch); color: var(--parch-ink); border: 3px solid var(--line); box-shadow: 0 3px 10px rgba(0,0,0,.35); font: 800 var(--fs)/1.05 var(--font-body); text-align: center; }
.tok-nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: var(--nfs); }
button.tok { cursor: pointer; border-color: var(--brass); animation: glow 1.8s ease-in-out infinite; }
button.tok:hover { transform: translate(-50%, -50%) scale(1.07); }
.tok.done { opacity: .5; }
.tok.dead { filter: grayscale(1) brightness(.68); }
.tok.block { border-color: var(--evil); box-shadow: 0 0 0 3px var(--evil); }
.tok .mark { position: absolute; top: -6%; right: -10%; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 99px; padding: 1px 5px; font-size: max(10px, calc(var(--fs) * .8)); white-space: nowrap; }
.tok-sub { font-weight: 700; font-size: var(--sfs); color: color-mix(in srgb, var(--parch-ink) 72%, transparent); white-space: nowrap; }
.tok:has(.tok-sub) { align-content: center; gap: 1px; }
.tok.flipped { animation: none; border-width: 4px; }
.tok.flipped.good { border-color: var(--good); } .tok.flipped.evil { border-color: var(--evil); }
.tok.flipped.minion, .tok.flipped.demon { background: color-mix(in srgb, var(--evil) 22%, var(--parch)); }
.tok.flipped.dead { filter: none; opacity: .72; }
.tok.picked { box-shadow: 0 0 0 4px var(--brass), 0 3px 10px rgba(0,0,0,.35); }
.reveal-detail { display: grid; gap: 8px; }
.reveal-detail h3 { font-size: .9rem; color: var(--fg); }
.table-mid { position: absolute; inset: 27%; display: grid; place-content: center; text-align: center; gap: 2px; }
.mid-big { font-family: var(--font-display); color: var(--brass); font-size: 11cqw; line-height: 1; }
.mid-sm { color: var(--muted); font-weight: 700; font-size: max(11px, 3.6cqw); }
.mid-counts { font-weight: 800; font-size: max(13px, 5cqw); font-variant-numeric: tabular-nums; margin-top: 2px; }
.mid-key { color: var(--muted); font-weight: 700; font-size: max(9px, 2.6cqw); white-space: nowrap; }
.evil-txt { color: var(--evil); }
@keyframes glow { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--brass) 40%, transparent), 0 3px 10px rgba(0,0,0,.35); } }
@media (prefers-reduced-motion: reduce) { button.tok { animation: none; } }
.log { display: grid; gap: 4px; font-size: .92rem; }
.log .when { font-weight: 800; color: var(--brass); margin-top: 8px; }
.err { color: var(--evil); font-weight: 700; }
.wait { text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.wait b { color: var(--brass); font-size: 1.2rem; }
.pc:disabled { opacity: .55; cursor: default; }

/* Solo practice: the town talk, votes and your notebook */
.feed { display: grid; gap: 6px; }
.say { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.say .who { font-weight: 800; color: var(--brass); margin-right: 4px; }
.say.me { border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, var(--surface-2)); }
.say.me .who { color: var(--good); }
.say.sys { background: transparent; border-style: dashed; color: var(--muted); }
.say.sys b { color: var(--fg); }
.say.dead .who::after { content: " ☠"; }
details > summary { cursor: pointer; font-weight: 700; color: var(--muted); }
details[open] > summary { margin-bottom: 8px; }
.votes { display: flex; flex-wrap: wrap; gap: 6px; }
.vote-chip { border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; font-weight: 700; font-size: .88rem; background: var(--surface-2); }
.vote-chip.yes { border-color: var(--evil); color: var(--evil); }
.vote-chip.no { color: var(--muted); }
.vote-chip.wait { border-style: dashed; color: var(--muted); }
table.notes { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.notes th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 4px; border-bottom: 1px solid var(--line); }
table.notes td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.notes tr.dead td:first-child { text-decoration: line-through; color: var(--muted); }
table.notes tr.sel td { background: color-mix(in srgb, var(--brass) 12%, transparent); }
table.notes .facts { display: grid; gap: 2px; color: var(--muted); font-size: .85rem; }
.pct { font-variant-numeric: tabular-nums; font-weight: 800; }
.form { display: grid; gap: 10px; }
.form label { display: grid; gap: 4px; font-weight: 700; font-size: .9rem; }
.inp { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; max-width: 100%; }
input.inp { width: 100%; }
.panel { border-color: var(--brass); }
.panel-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.panel-head h2 { margin-right: auto; }
.share-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.share-row .info { flex: 1; }
.result { font-size: 1.1rem; font-weight: 700; }
.whisper { display: grid; gap: 6px; }
.form.whisper { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.reasons { display: grid; gap: 6px; }
.reasons .pc { text-align: left; font-weight: 600; min-height: 40px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chips .pc { min-height: 36px; padding: 6px 10px; font-size: .88rem; }
.seg button[aria-pressed="true"], .btn[aria-pressed="true"] { background: var(--brass); color: #1a1408; border-color: var(--brass); }
/* Claim matrix: characters across, players down */
.matrix-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.matrix-head h3 { margin-right: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; font-style: normal; font-size: .7rem; font-weight: 800; }
.matrix-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; max-width: 100%; }
table.matrix { border-collapse: separate; border-spacing: 0; font-size: .85rem; }
.matrix th, .matrix td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; background: var(--surface); }
.matrix .band th { color: #fff; font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; padding: 4px 6px; text-align: left; white-space: nowrap; }
.matrix th.corner { background: var(--surface); }
.matrix th.rname { vertical-align: bottom; padding: 8px 0 6px; }
.matrix th.rname span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-weight: 700; display: inline-block; padding: 3px 1px; border-radius: 4px; }
.matrix th.rname.multi span { background: var(--warn); color: #1a1408; }
.matrix .pcol { position: sticky; left: 0; z-index: 2; text-align: left; padding: 0 8px; white-space: nowrap; max-width: 8rem; overflow: hidden; text-overflow: ellipsis; font-weight: 700; border-right: 2px solid var(--line); }
.matrix .pcol button { background: none; border: 0; padding: 6px 0; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.matrix tr.dead .pcol button { text-decoration: line-through; color: var(--muted); }
.matrix tr.sel .pcol { box-shadow: inset 3px 0 0 var(--brass); }
.matrix td.cell { width: 30px; min-width: 30px; height: 30px; text-align: center; font-weight: 800; font-size: .78rem; }
.matrix .team-start { border-left: 2px solid var(--line); }
.mx-hard { background: var(--ok) !important; color: #fff; }
.mx-soft { background: color-mix(in srgb, var(--ok) 20%, var(--surface)) !important; color: var(--ok); outline: 1px dashed var(--ok); outline-offset: -4px; }
.mx-conf { background: var(--good) !important; color: #fff; }
.mx-was { background: var(--surface-2) !important; color: var(--muted); }
.matrix td.cell.multi { box-shadow: inset 0 0 0 3px var(--warn); }
.matrix tfoot td, .matrix tfoot th { font-variant-numeric: tabular-nums; text-align: center; font-size: .78rem; color: var(--muted); height: 26px; }
.matrix tfoot td.multi { color: #1a1408; background: var(--warn); font-weight: 800; }
.matrix tfoot td.one { color: var(--ok); font-weight: 800; }
.toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-weight: 700; font-size: .82rem; min-height: 32px; }
.toggle[aria-pressed="true"] { background: var(--brass); color: #1a1408; border-color: var(--brass); }
.matrix td.cell.mx-lab { box-shadow: inset 0 0 0 2px var(--brass); }
.matrix td.cell.mx-lab.multi { box-shadow: inset 0 0 0 3px var(--warn), inset 0 0 0 5px var(--brass); }
.tok.lab-evil, button.tok.seat.lab-evil { border-color: var(--evil); border-style: dashed; border-width: 3px; }
.tok.lab-good, button.tok.seat.lab-good { border-color: var(--good); border-style: dashed; border-width: 3px; }
.tok.mate, button.tok.seat.mate { box-shadow: 0 0 0 3px color-mix(in srgb, var(--evil) 55%, transparent), 0 3px 10px rgba(0,0,0,.35); }
/* Day tabs and the fixed action bar */
.tabs { display: flex; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); z-index: 9; background: var(--bg); margin: 0 -16px; padding: 6px 16px; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: none; font-weight: 800; padding: 8px 4px; min-height: 44px; border-radius: 10px; color: var(--muted); position: relative; }
.tabs button[aria-selected="true"] { color: var(--brass); background: var(--surface); box-shadow: inset 0 -3px 0 var(--brass); }
.tabs .badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--evil); color: #fff; font-size: .7rem; margin-left: 4px; vertical-align: 2px; }
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line); padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; justify-content: center; box-shadow: 0 -6px 16px rgba(0,0,0,.18); }
.actionbar .btn { flex: 1; max-width: 260px; }
body.has-actionbar .wrap { padding-bottom: 96px; }
.whatnow { border-radius: 12px; padding: 10px 14px; border: 1px dashed var(--brass); background: color-mix(in srgb, var(--brass) 10%, var(--surface)); }
.whatnow b { color: var(--brass); }
.chips-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 4px 12px; font-weight: 700; font-size: .85rem; white-space: nowrap; min-height: 34px; }
.chip[aria-pressed="true"] { background: var(--brass); color: #1a1408; border-color: var(--brass); }
.say .who-btn { border: 0; background: none; padding: 0; font: inherit; font-weight: 800; color: var(--brass); margin-right: 4px; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
#player-panel, #talk-end { scroll-margin-top: 120px; }
/* After-game review */
.review-row { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: baseline; }
.ok-txt { color: var(--ok); font-weight: 800; } .bad-txt { color: var(--evil); font-weight: 800; }
.bar-track { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar-fill { height: 100%; background: var(--evil); }
/* Seats you can tap to talk to: quieter than the glowing turn tokens */
button.tok.seat { animation: none; border-color: var(--line); }
button.tok.seat.picked { border-color: var(--brass); }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="btn sm home-link" href="index.html" title="Choose another app" aria-label="All apps" style="text-decoration:none;color:inherit;display:inline-grid;place-items:center">&#8962;</a>
    <h1 class="brand">Solo Practice</h1>
    <span class="phase" id="phase"></span>
    <button class="btn sm" data-act="menu">Menu</button>
  </header>
  <main id="app" class="wrap" style="padding:0;width:100%"></main>
</div>
<script>
'use strict';
const KEY = 'clocktower-solo-v1';

/* ---------- Trouble Brewing ---------- */
const ROLES = {
  'Washerwoman': { type: 'townsfolk', text: 'You start knowing that 1 of 2 players is a particular Townsfolk.' },
  'Librarian': { type: 'townsfolk', text: 'You start knowing that 1 of 2 players is a particular Outsider (or that zero are in play).' },
  'Investigator': { type: 'townsfolk', text: 'You start knowing that 1 of 2 players is a particular Minion.' },
  'Chef': { type: 'townsfolk', text: 'You start knowing how many pairs of evil players are sitting next to each other.' },
  'Empath': { type: 'townsfolk', text: 'Each night, you learn how many of your 2 alive neighbours are evil.' },
  'Fortune Teller': { type: 'townsfolk', text: 'Each night, choose 2 players: you learn if either is the Demon. There is a good player that registers as the Demon to you.' },
  'Undertaker': { type: 'townsfolk', text: 'Each night except the first, you learn which character died by execution today.' },
  'Monk': { type: 'townsfolk', text: 'Each night except the first, choose a player (not yourself): they are safe from the Demon tonight.' },
  'Ravenkeeper': { type: 'townsfolk', text: 'If you die at night, you are woken to choose a player: you learn their character.' },
  'Virgin': { type: 'townsfolk', text: 'The 1st time you are nominated, if the nominator is a Townsfolk, they are executed immediately.' },
  'Slayer': { type: 'townsfolk', text: 'Once per game, during the day, publicly choose a player: if they are the Demon, they die.' },
  'Soldier': { type: 'townsfolk', text: 'You are safe from the Demon.' },
  'Mayor': { type: 'townsfolk', text: 'If only 3 players live and no execution occurs, your team wins. If you die at night, another player might die instead.' },
  'Butler': { type: 'outsider', text: 'Each night, choose a player (not yourself): tomorrow, you may only vote if they are voting too.' },
  'Drunk': { type: 'outsider', text: 'You do not know you are the Drunk. You think you are a Townsfolk character, but you are not.' },
  'Recluse': { type: 'outsider', text: 'You might register as evil and as a Minion or Demon, even if dead.' },
  'Saint': { type: 'outsider', text: 'If you die by execution, your team loses.' },
  'Poisoner': { type: 'minion', text: 'Each night, choose a player: they are poisoned tonight and tomorrow day.' },
  'Spy': { type: 'minion', text: 'Each night, you see the Grimoire. You might register as good and as a Townsfolk or Outsider, even if dead.' },
  'Scarlet Woman': { type: 'minion', text: 'If there are 5 or more players alive and the Demon dies, you become the Demon.' },
  'Baron': { type: 'minion', text: 'There are extra Outsiders in play. [+2 Outsiders]' },
  'Imp': { type: 'demon', text: 'Each night except the first, choose a player: they die. If you kill yourself this way, a Minion becomes the Imp.' },
};
const TF = Object.keys(ROLES).filter(r => ROLES[r].type === 'townsfolk');
const OS = Object.keys(ROLES).filter(r => ROLES[r].type === 'outsider');
const MN = Object.keys(ROLES).filter(r => ROLES[r].type === 'minion');
const CLAIMABLE = [...TF, ...OS.filter(r => r !== 'Drunk')];
const INFO_ROLES = ['Washerwoman', 'Librarian', 'Investigator', 'Chef', 'Empath', 'Fortune Teller', 'Undertaker', 'Ravenkeeper', 'Monk'];
// Townsfolk, Outsiders, Minions, Demons
const COUNTS = { 5: [3,0,1,1], 6: [3,1,1,1], 7: [5,0,1,1], 8: [5,1,1,1], 9: [5,2,1,1], 10: [7,0,2,1], 11: [7,1,2,1], 12: [7,2,2,1], 13: [9,0,3,1], 14: [9,1,3,1], 15: [9,2,3,1] };
// How often the Storyteller's choices go a particular way
const LIE = 0.8;            // a drunk or poisoned player gets false info
const SPY_GOOD = 0.5;       // the Spy registers as good
const RECLUSE_EVIL = 0.4;   // the Recluse registers as evil
const MAYOR_BOUNCE = 0.5;   // a Demon kill on the Mayor goes to someone else
const NAMES = ['Ada', 'Ben', 'Cleo', 'Dev', 'Esme', 'Finn', 'Gus', 'Hana', 'Ivo', 'Juno', 'Kit', 'Lena', 'Milo', 'Nia', 'Oscar', 'Pip', 'Quinn', 'Rosa', 'Sol', 'Tess', 'Uma', 'Vic', 'Wren', 'Yara', 'Zed'];

/* ---------- State ---------- */
let G = load();
if (G) {
  G.whispers = G.whispers || []; G.privFacts = G.privFacts || []; G.callouts = G.callouts || []; G.team = G.team || {}; G.labels = G.labels || {}; G.requests = G.requests || [];
  G.players.forEach(p => { if (p.bot) { p.bot.heardFacts = p.bot.heardFacts || []; } });
}
const PREFS_KEY = 'clocktower-solo-prefs';
let prefs = { text: 1, coach: false, n: 8, team: 'random', name: '', diff: 'normal' };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREFS_KEY)) || {}); } catch (e) {}
function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {} applyPrefs(); }
function applyPrefs() { document.documentElement.style.fontSize = ''; }  // text size is now in the shared ⚙ settings
applyPrefs();

let U = { view: G ? 'game' : 'home', sel: [], need: 0, menu: false, panel: null, confirmEnd: false, form: null, bc: null };

function load() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function save() { try { if (G) localStorage.setItem(KEY, JSON.stringify(G)); else localStorage.removeItem(KEY); } catch (e) {} }

const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const chance = p => Math.random() < p;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const P = id => G.players.find(p => p.id === id);
const me = () => P(G.me);
const nm = id => id === G.me ? 'you' : esc(P(id).name);
const Nm = id => id === G.me ? 'You' : esc(P(id).name);
const alive = () => G.players.filter(p => p.alive);
const bots = () => G.players.filter(p => p.id !== G.me);
const believed = p => p.role === 'Drunk' ? p.fake : p.role;
const isGood = p => ROLES[p.role].type === 'townsfolk' || ROLES[p.role].type === 'outsider';
const inPlay = r => G.players.some(p => p.role === r);
const poisonerAlive = () => G.players.some(p => p.alive && p.role === 'Poisoner');
const poisoned = p => G.poison === p.id && poisonerAlive();
const sober = p => p.role !== 'Drunk' && !poisoned(p);
const why = p => p.role === 'Drunk' ? 'they are the Drunk' : 'they are poisoned';
const label = () => (G.time === 'night' ? 'Night ' : 'Day ') + G.n;
const plural = (n, one, many) => n === 1 ? one : many;
const list = names => names.length < 2 ? names.join('') : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
const claimOf = id => P(id).claim || null;
const bump = () => { G.ver++; };

function log(text) { G.log.push({ when: label(), text }); }
function tell(id, lines) { G.info[id].push({ when: label(), lines }); }
function message(id, html) { G.inbox[id].push(html); tell(id, [html]); }
function win(team, reason) { if (!G.winner) { G.winner = { team, reason }; log(`${team === 'good' ? 'Good' : 'Evil'} wins: ${reason}`); } }
function checkTwoLeft() {
  if (!G.winner && alive().length <= 2 && alive().some(p => p.role === 'Imp')) win('evil', 'Only two players are left alive, and one of them is the Demon.');
  if (!G.winner && !alive().some(isGood) && alive().some(p => p.role === 'Imp')) win('evil', 'Every good player is dead.');
}
// Something everyone hears: a player speaking in town, or the Storyteller (who = null)
function say(who, text) { G.feed.push({ when: label(), who, text }); bump(); }
function sys(text) { say(null, text); }

function teamWord(r) {
  return { townsfolk: 'Townsfolk · good', outsider: 'Outsider · good', minion: 'Minion · evil', demon: 'Demon · evil' }[ROLES[r].type];
}
function roleCard(r) {
  return `<div class="role-card ${ROLES[r].type}"><div class="role-team">${teamWord(r)}</div><div class="role-name">${esc(r)}</div><div>${esc(ROLES[r].text)}</div></div>`;
}
function bluffLine() { return `Three good characters not in play, safe to bluff as: <b>${G.bluffs.map(esc).join(', ')}</b>.`; }
function breakdown(n) {
  const [t, o, m] = COUNTS[n];
  return `${t} Townsfolk, ${o} ${plural(o, 'Outsider', 'Outsiders')}, ${m} ${plural(m, 'Minion', 'Minions')} and the Imp (a Baron swaps 2 Townsfolk for 2 Outsiders).`;
}

/* ---------- Setup ---------- */
function newGame(opts) {
  const n = opts.n;
  let [t, o, m] = COUNTS[n];
  const minions = shuffle(MN).slice(0, m);
  if (minions.includes('Baron')) { t -= 2; o += 2; }
  const dealt = shuffle(['Imp', ...minions, ...shuffle(OS).slice(0, o), ...shuffle(TF).slice(0, t)]);
  const evilRole = r => ['minion', 'demon'].includes(ROLES[r].type);
  const seat = opts.team === 'random' ? rnd(n) : pick(dealt.map((r, i) => i).filter(i => evilRole(dealt[i]) === (opts.team === 'evil')));
  const myName = (opts.name || '').trim() || 'You';
  const names = shuffle(NAMES.filter(x => x.toLowerCase() !== myName.toLowerCase())).slice(0, n - 1);
  names.splice(seat, 0, myName);
  G = {
    v: 1, ver: 0, n: 1, time: 'night', stage: 'night', me: seat, opts,
    players: names.map((name, i) => ({ id: i, name, role: dealt[i], alive: true, ghost: true, used: false, master: null, claim: null, claimHist: [], deadFrom: null })),
    log: [], info: {}, inbox: {}, facts: {}, poison: null, bluffs: [], redHerring: null,
    lastExecuted: null, winner: null, announce: null, dayS: null, dawnInfo: {}, diedTonight: [], rkWait: false,
    feed: [], pub: [], deaths: [], virgins: [], nominatedEver: [], shots: [], opinions: [], execs: {}, vote: null, lastVote: null,
    whispers: [], privFacts: [], callouts: [], team: {}, labels: {}, requests: [],
  };
  G.players.forEach(p => { G.info[p.id] = []; G.inbox[p.id] = []; G.facts[p.id] = []; });
  const drunk = G.players.find(p => p.role === 'Drunk');
  if (drunk) drunk.fake = pick(TF.filter(r => !inPlay(r)));
  G.bluffs = shuffle([...TF, ...OS].filter(r => r !== 'Drunk' && !inPlay(r) && !(drunk && drunk.fake === r))).slice(0, 3);
  G.redHerring = pick(G.players.filter(isGood)).id;

  log(`Setup for ${n} players: ` + G.players.map(p => `${esc(p.name)}${p.id === G.me ? ' (you)' : ''} is the ${p.role === 'Drunk' ? `Drunk (thinks they're the ${p.fake})` : p.role}`).join('; ') + '.');
  log(`Demon bluffs: ${G.bluffs.join(', ')}. The Fortune Teller's red herring is ${esc(P(G.redHerring).name)}.`);

  const imp = G.players.find(p => p.role === 'Imp');
  const minionPs = G.players.filter(p => MN.includes(p.role));
  G.players.forEach(p => {
    const lines = [roleCard(believed(p))];
    if (n >= 7) {
      if (MN.includes(p.role)) {
        lines.push(`The Demon is <b>${Nm(imp.id)}</b>.`);
        const mates = minionPs.filter(q => q.id !== p.id);
        if (mates.length) lines.push(`Your fellow ${plural(mates.length, 'Minion is', 'Minions are')} <b>${list(mates.map(q => Nm(q.id)))}</b>.`);
      }
      if (p.role === 'Imp') {
        lines.push(`Your ${plural(minionPs.length, 'Minion is', 'Minions are')} <b>${list(minionPs.map(q => Nm(q.id)))}</b>.`);
        lines.push(bluffLine());
      }
    } else if (!isGood(p)) lines.push('With fewer than 7 players, the evil team does not learn who each other are.');
    tell(p.id, lines);
  });

  // Each bot's personality, and the evil team's plans
  bots().forEach(p => { p.bot = { open: 0.4 + Math.random() * 0.55, bias: null, bluff: null, frame: null, fakes: [], fakeN: 0, sharedN: 0, shot: false, refused: 0, heard: null, heardFacts: [], gave: null, toldMe: null, calledOut: false }; });
  const evilBots = bots().filter(p => !isGood(p)).sort((a, b) => (b.role === 'Imp') - (a.role === 'Imp'));
  let bi = 0;
  evilBots.forEach(p => { if (knowsBluffs(p) && bi < G.bluffs.length) p.bot.bluff = G.bluffs[bi++]; });
  evilBots.forEach(p => log(`${esc(p.name)} (${p.role}) plans to say they are the ${p.bot.bluff || 'something not yet claimed'}.`));

  G.duskAlive = alive().map(p => p.id);
}
// The Demon learns the bluffs with 7 or more players and shares them with the Minions; the Spy sees them in the Grimoire
const knowsBluffs = p => !isGood(p) && (G.players.length >= 7 || p.role === 'Spy');
// The evil players this player knows about (just themselves if they are good, or evil in a small game)
function knownTeam(p) {
  if (isGood(p)) return [];
  if (G.players.length >= 7 || p.role === 'Spy') return G.players.filter(q => !isGood(q)).map(q => q.id);
  return [p.id];
}

/* ---------- How players register to abilities ---------- */
function reg(q, want) {
  if (q.role === 'Spy' && sober(q) && chance(SPY_GOOD)) {
    const type = want === 'outsider' ? 'outsider' : (want === 'townsfolk' || chance(0.8)) ? 'townsfolk' : 'outsider';
    const pool = (type === 'townsfolk' ? TF : OS).filter(r => r !== 'Drunk');
    const free = pool.filter(r => !inPlay(r));
    return { good: true, type, role: pick(free.length ? free : pool), spoof: true };
  }
  if (q.role === 'Recluse' && sober(q) && chance(RECLUSE_EVIL)) {
    const type = want === 'minion' || want === 'demon' ? want : chance(0.3) ? 'demon' : 'minion';
    return { good: false, type, role: type === 'demon' ? 'Imp' : pick(MN), spoof: true };
  }
  return { good: isGood(q), type: ROLES[q.role].type, role: q.role };
}
const others = p => G.players.filter(q => q.id !== p.id);
function aliveNeighbours(p) {
  const N = G.players.length, out = [];
  for (const dir of [-1, 1]) {
    for (let k = 1; k < N; k++) {
      const q = G.players[((p.id + dir * k) % N + N) % N];
      if (q.alive && q.id !== p.id) { if (!out.includes(q)) out.push(q); break; }
    }
  }
  return out;
}
function noteInfo(p, text, lied, extra) {
  const br = believed(p);
  const tag = lied ? ` <i>(false: ${why(p)})</i>` : !sober(p) ? ` <i>(true, though ${why(p)})</i>` : '';
  log(`${esc(br)} ${esc(p.name)} learned: ${text}${tag}${extra ? ' ' + extra : ''}`);
}
function onePairInfo(p, kind) {
  const pool = kind === 'townsfolk' ? TF : kind === 'outsider' ? OS : MN;
  const role = { townsfolk: 'Washerwoman', outsider: 'Librarian', minion: 'Investigator' }[kind];
  let lie = !sober(p) && chance(LIE);
  if (!lie) {
    const hit = shuffle(others(p)).map(q => ({ q, r: reg(q, kind) })).find(x => x.r.type === kind);
    if (hit) {
      const other = pick(others(p).filter(q => q.id !== hit.q.id));
      const pair = shuffle([hit.q, other]);
      return { text: `One of <b>${Nm(pair[0].id)}</b> and <b>${Nm(pair[1].id)}</b> is the <b>${esc(hit.r.role)}</b>.`, lie: false, extra: hit.r.spoof ? `(${esc(hit.q.name)} is really the ${hit.q.role})` : '', f: { k: 'pair', role, a: pair[0].id, b: pair[1].id, char: hit.r.role } };
    }
    if (kind === 'outsider' && sober(p)) return { text: 'There are <b>no Outsiders</b> in play.', lie: false, f: { k: 'noOut', role } };
    lie = true;
  }
  const pair = shuffle(others(p)).slice(0, 2), char = pick(pool.filter(r => r !== believed(p)));
  return { text: `One of <b>${Nm(pair[0].id)}</b> and <b>${Nm(pair[1].id)}</b> is the <b>${esc(char)}</b>.`, lie: true, f: { k: 'pair', role, a: pair[0].id, b: pair[1].id, char } };
}
function falseCharacter(q) { return isGood(q) ? pick([...MN, 'Imp']) : pick(TF); }

/* ---------- Deaths ---------- */
function killAtNight(t) {
  if (!t.alive) return;
  die(t, 'night');
  G.diedTonight.push(t.id);
}
function starPass(imp) {
  die(imp, 'night', true);
  G.diedTonight.push(imp.id);
  const minions = alive().filter(q => MN.includes(q.role));
  if (!minions.length) { log(`The Imp (${esc(imp.name)}) killed themselves with no Minion left to take over.`); win('good', `The Demon (${esc(imp.name)}) died.`); return; }
  const heir = minions.find(q => q.role === 'Scarlet Woman') || pick(minions);
  log(`The Imp (${esc(imp.name)}) killed themselves; the ${heir.role} (${esc(heir.name)}) became the Imp.`);
  heir.was = heir.role; heir.role = 'Imp';
  message(heir.id, `The Imp (${Nm(imp.id)}) killed themselves to pass on their power. <b>You are now the Imp.</b> From tomorrow night, you choose who dies. ${bluffLine()}`);
}
function die(p, cause, quiet) {
  if (!p.alive) return;
  const before = alive().length;
  p.alive = false;
  p.deadFrom = cause === 'night' ? G.n : G.n + 1;  // the first night they no longer wake
  G.deaths.push({ id: p.id, how: cause, n: G.n, claim: p.claim });
  bump();
  if (cause === 'execution' && p.role === 'Saint' && sober(p)) win('evil', `The Saint (${esc(p.name)}) was executed.`);
  if (p.role === 'Imp' && !quiet) {
    const sw = G.players.find(q => q.alive && q.role === 'Scarlet Woman' && sober(q));
    if (sw && before >= 5) {
      sw.was = 'Scarlet Woman'; sw.role = 'Imp';
      log(`The Imp (${esc(p.name)}) died, so the Scarlet Woman (${esc(sw.name)}) became the Imp.`);
      message(sw.id, `The Demon (${Nm(p.id)}) has died. As the Scarlet Woman, <b>you are now the Imp</b>. Each night, you choose who dies. ${bluffLine()}`);
    } else win('good', `The Demon (${esc(p.name)}) died.`);
  }
}

/* ---------- Night ---------- */
function resolveNight(c) {
  const n = G.n, awake = id => G.duskAlive.includes(id);
  const holder = role => G.players.find(p => p.role === role && awake(p.id));
  G.diedTonight = []; G.dawnInfo = {}; G.rkWait = false;
  const learn = (p, text, f) => {
    (G.dawnInfo[p.id] = G.dawnInfo[p.id] || []).push(text);
    if (f) { f.n = n; f.src = f.src || believed(p); G.facts[p.id].push(f); }
  };

  // Poisoner: the old poison ends at dusk
  G.poison = null;
  const pz = holder('Poisoner');
  if (pz && c[pz.id]) { G.poison = c[pz.id][0]; log(`The Poisoner (${esc(pz.name)}) poisoned ${esc(P(G.poison).name)}.`); }

  // Monk
  let protect = null;
  if (n >= 2) G.players.filter(p => awake(p.id) && believed(p) === 'Monk' && c[p.id]).forEach(p => {
    const t = c[p.id][0];
    G.facts[p.id].push({ k: 'monk', who: t, n, src: 'Monk' });
    if (sober(p)) { protect = t; log(`The Monk (${esc(p.name)}) protected ${esc(P(t).name)}.`); }
    else log(`The Monk (${esc(p.name)}) chose ${esc(P(t).name)}, but ${why(p)}, so nobody is protected.`);
  });

  // Imp
  const imp = holder('Imp');
  if (imp && n >= 2 && c[imp.id]) {
    const t = P(c[imp.id][0]);
    if (poisoned(imp)) log(`The Imp (${esc(imp.name)}) chose ${esc(t.name)}, but is poisoned, so nobody dies.`);
    else if (t.id === imp.id) starPass(imp);
    else if (!t.alive) log(`The Imp chose ${esc(t.name)}, who is already dead.`);
    else if (t.id === protect) log(`The Imp chose ${esc(t.name)}, but the Monk protected them.`);
    else if (t.role === 'Soldier' && sober(t)) log(`The Imp chose ${esc(t.name)}, but the Soldier is safe from the Demon.`);
    else if (t.role === 'Mayor' && sober(t) && chance(MAYOR_BOUNCE)) {
      const opts = alive().filter(q => q.id !== t.id && q.id !== imp.id && isGood(q) && q.id !== protect && !(q.role === 'Soldier' && sober(q)));
      if (opts.length) { const b = pick(opts); log(`The Imp chose the Mayor (${esc(t.name)}); the kill bounced to ${esc(b.name)}.`); killAtNight(b); }
      else { log(`The Imp killed the Mayor (${esc(t.name)}).`); killAtNight(t); }
    } else { log(`The Imp (${esc(imp.name)}) killed ${esc(t.name)}.`); killAtNight(t); }
  }

  // Information, after the kills (as in the real wake order)
  G.players.filter(p => awake(p.id) && p.alive).forEach(p => {
    const br = believed(p), lie = () => !sober(p) && chance(LIE);
    if (n === 1 && (br === 'Washerwoman' || br === 'Librarian' || br === 'Investigator')) {
      const r = onePairInfo(p, { Washerwoman: 'townsfolk', Librarian: 'outsider', Investigator: 'minion' }[br]);
      learn(p, r.text, r.f); noteInfo(p, r.text, r.lie, r.extra);
    }

  return cands.length ? topBy(cands, q => ratio(p, q.id)).id : p.id;
}

/* ---------- Bots voting and nominating ---------- */
function mayorTrusted(p) {
  const m = alive().find(q => q.claim === 'Mayor');
  // A day with no execution at three alive that didn't win the game means the Mayor isn't real
  if (G.dry > 0 && G.dryAt3) return false;
  return m && (m.id === p.id ? isGood(p) : ratio(p, m.id) < 0.8);
}
// The evil team (as far as it knows itself) can carry a vote on its own
function evilHasVotes() { return alive().filter(q => !isGood(q)).length >= votesNeeded(); }
function botVote(p, a, b) {
  if (b === p.id) return false;
  const al = alive().length, d = G.dayS, nominee = P(b);
  if (!isGood(p)) {
    const team = knownTeam(p);
    if (team.includes(b)) return false;
    if (d.block != null && team.includes(d.block)) return true;  // knock a teammate off the block
    if (evilHasVotes()) return true;
    if (d.virginTest === b) return chance(0.15);
    const r = townRatio(b);
    if (!p.alive) return r > 1.8 && chance(0.5);
    return r > 1.05 || chance(0.3);
  }
  const r = ratio(p, b);
  if (al <= 3) {
    if (mayorTrusted(p) && r < 3) return false;
    const top = topBy(alive().filter(q => q.id !== p.id), q => ratio(p, q.id));
    return top && top.id === b;
  }
  if (nominee.claim === 'Saint' && r < 2.6) return false;
  if (d.virginTest === b && r < 2.2) return false;  // a Virgin test isn't a real push to execute
  if (d.block != null && d.block !== b && susOf(belief(p.id), b) * (1 + bias(p, b)) <= susOf(belief(p.id), d.block) * (1 + bias(p, d.block))) return false;
  let need = (al <= 4 ? 1.1 : 1.4) - 0.15 * (G.dry || 0);
  if (!p.alive) need += 0.8;  // save the ghost vote for something sure
  return r >= need;
}
// The bot keenest to nominate someone, or null if nobody wants to
function botNomination() {
  const d = G.dayS, al = alive();
  if (d.botNoms >= 4 && al.length > 3) return null;
  // Test a claimed Virgin: a good Townsfolk who believes them nominates them, to prove both of them
  const virgin = al.find(x => x.claim === 'Virgin' && !G.nominatedEver.includes(x.id) && !d.nominees.includes(x.id));
  if (virgin && al.length > 4) {
    const tester = topBy(al.filter(p => p.id !== G.me && p.id !== virgin.id && isGood(p) && TF.includes(believed(p)) && TF.includes(p.claim) && !d.nominators.includes(p.id) && ratio(p, virgin.id) < 1.3), p => -ratio(p, virgin.id) + Math.random() * 0.3);
    if (tester) return { a: tester.id, b: virgin.id, want: 5, test: true };
  }
  let best = null;
  al.filter(q => q.id !== G.me && !d.nominators.includes(q.id)).forEach(p => {
    const team = knownTeam(p);
    al.filter(x => x.id !== p.id && !d.nominees.includes(x.id)).forEach(x => {
      let want;
      if (isGood(p)) {
        want = ratio(p, x.id) - (al.length <= 3 ? 0 : al.length <= 4 ? 1.2 : 1.5 - 0.2 * (G.dry || 0));
        if (x.claim === 'Saint') want -= 1;
        if (d.block != null && susOf(belief(p.id), x.id) <= susOf(belief(p.id), d.block)) want = -1;
      } else {
        if (team.includes(x.id)) return;
        want = townRatio(x.id) - 1.4 + (d.block != null && team.includes(d.block) ? 1.5 : 0) + (x.id === p.bot.frame ? 0.3 : 0);
        if (d.block != null && !team.includes(d.block) && townRatio(x.id) <= townRatio(d.block)) want = -1;
        if (evilHasVotes() && team.length > 1 && (d.block == null || team.includes(d.block))) want = 2 + Math.random();
      }
      if (want > 0 && (!best || want > best.want)) best = { a: p.id, b: x.id, want };
    });
  });
  return best;
}
function botNominates() {
  const nom = botNomination();
  if (!nom) return false;
  G.dayS.botNoms++;
  if (nom.test) {
    G.dayS.virginTest = nom.b;
    nominate(nom.a, nom.b, `I'm testing the Virgin. I nominate <b>${nm(nom.b)}</b>. I'm the ${esc(P(nom.a).claim)}, a Townsfolk: if I'm executed, ${nm(nom.b)} really ${nom.b === G.me ? 'are' : 'is'} the Virgin.`);
    return true;
  }
  nominate(nom.a, nom.b, `I nominate <b>${nm(nom.b)}</b>. ${reasonFor(nom.b).replace(/^./, c => c.toUpperCase())}.`);
  return true;
}

function tableHtml(seat, mid) {
  const N = G.players.length, d = Math.min(23, 0.9 * 2 * Math.PI * 39 / N);
  const toks = G.players.map((q, i) => {
    const a = 2 * Math.PI * i / N - Math.PI / 2, s = seat(q), tag = s.button ? 'button' : 'div';
    const text = s.text || q.name, longest = Math.max(3, ...text.split(/\s+/).map(w => w.length));
    const nfs = (s.text ? Math.min(d * 0.19, d * 1.05 / longest) : Math.min(d * 0.24, d * 1.4 / longest)).toFixed(2);
    const sfs = s.sub ? Math.min(d * 0.16, d * 1.25 / Math.max(4, s.sub.length)).toFixed(2) : 0;
    const lab = G && G.labels && G.stage !== 'over' ? G.labels[q.id] : null;

    if (lab) s.mark = (s.mark ? s.mark + ' ' : '') + `🏷${esc(lab === 'Fortune Teller' ? 'FT' : lab === 'Scarlet Woman' ? 'SW' : lab)}`;
    return `<${tag} class="tok ${s.cls || ''} ${labCls}" style="left:${(50 + 39 * Math.cos(a)).toFixed(2)}%;top:${(50 + 39 * Math.sin(a)).toFixed(2)}%;--nfs:${nfs}cqw;--sfs:${sfs}cqw" ${s.attrs || ''}><span class="tok-nm">${esc(text)}</span>${s.sub ? `<span class="tok-sub">${esc(s.sub)}</span>` : ''}${s.mark ? `<span class="mark">${s.mark}</span>` : ''}</${tag}>`;
  }).join('');
  return `<div class="table" style="--d:${d.toFixed(2)}cqw;--fs:${(d * 0.2).toFixed(2)}cqw">${toks}<div class="table-mid">${mid}</div></div>`;
}

// How strongly a player has claimed a character: conf (proven by the game), hard, soft (one of three), was (an earlier claim)
function claimState(q, r) {
  if (r === 'Virgin' && G.virgins.some(v => v.fired && v.v === q.id)) return { k: 'conf', why: 'Proven: their nominator was executed' };
  if (r === 'Slayer' && G.shots.some(x => x.hit && x.by === q.id)) return { k: 'conf', why: 'Proven: their shot killed the Demon' };
  if (q.claim === r) return { k: 'hard', why: 'Said in town' };
  // In private: what a bot told you, or what you told the bots
  let told = q.bot ? q.bot.toldMe && q.bot.toldMe.roles : null;
  if (q.id === G.me) {
    const heard = bots().map(b => b.bot.heard).filter(Boolean);
    if (heard.some(h => h.roles.length === 1 && h.roles[0] === r)) told = [r];
    else if (heard.some(h => h.roles.includes(r))) told = [r, '', ''];
  }
  if (told && told.includes(r)) return told.length === 1 ? { k: 'hard', priv: true, why: 'Said privately' } : { k: 'soft', why: 'One of three, said privately' };
  if (q.claimHist.includes(r)) return { k: 'was', why: 'An earlier claim' };
  return null;
}

  return `${head}<div class="matrix-wrap"><table class="matrix">

      <tr><th class="corner pcol">Player</th>${cols.map(c => `<th class="rname${c.start ? ' team-start' : ''}${hardCount[c.j] > 1 ? ' multi' : ''}" title="${esc(c.r)}"><span>${esc(c.r)}</span></th>`).join('')}</tr>
    </thead>
    <tbody>${G.players.map(q => `<tr class="${q.alive ? '' : 'dead'}${U.panel === q.id ? ' sel' : ''}">
      <th class="pcol" scope="row"><button data-act="seat" data-id="${q.id}">${q.id === G.me ? 'You' : esc(q.name)}</button></th>
      ${cols.map(c => { const st = states[q.id][c.j]; const multi = st && (st.k === 'hard' || st.k === 'conf') && hardCount[c.j] > 1, lab = G.labels[q.id] === c.r;

function feedHtml(items, tappable) {
  return `<div class="feed">${items.map(e => {

// The setup for this many players, shown in the middle of the table

// Bots waiting for your answer in private
function requestsCard() {

      <div class="row">${roleSel(id)}<button class="btn sm" data-act="rq-one" data-id="${id}">Tell them I'm this</button></div>

      <button class="btn primary sm" data-act="rq-sus" data-id="${id}">I think it's them</button><button class="btn sm" data-act="rq-unsure" data-id="${id}">Not sure yet</button></div>`;
    return `<div class="form whisper"><div class="whisper">${asked}</div>${answers}<div class="row"><button class="btn sm" data-act="rq-no" data-id="${id}">Not now</button></div></div>`;

function dayView() {
  const d = G.dayS, m = me();
  const seats = tableHtml(q => ({
    button: true, attrs: `data-act="seat" data-id="${q.id}" aria-label="${esc(q.name)}"`,

    mark: [teammate(q) ? '🔴' : '', openRequests().some(r => r.by === q.id) ? '✉' : '', q.alive ? '' : q.ghost ? '☠ vote' : '☠'].filter(Boolean).join(' '),
  }), `<div class="mid-big">${alive().length}</div><div class="mid-sm">alive of ${G.players.length}</div>${midCounts()}${d.block != null ? `<div class="mid-sm" style="color:var(--evil)">${nm(d.block)} on the block</div>` : ''}`);

    `<button role="tab" aria-selected="${tab === k}" data-act="tab" data-t="${k}">${l}${n ? `<span class="badge">${n > 99 ? '99+' : n}</span>` : ''}</button>`).join('')}</nav>`;
  let body = '';

// The fixed bar at the bottom of the day: the two things that move the day on

// Town talk, with a filter for one player's words, and names you can tap
function talkCard(today, earlier) {

function revealHtml() {
  const shown = G.revealed || [], all = shown.length === G.players.length;
  const table = tableHtml(q => {

    return {
      button: true, attrs: `data-act="flip" data-id="${q.id}" aria-label="${esc(q.name)}${open ? ': ' + esc(q.role) : ': reveal'}"`,
      cls: open ? `flipped ${team} ${ROLES[q.role].type}${q.alive ? '' : ' dead'}${U.revealSel === q.id ? ' picked' : ''}` : (q.alive ? '' : 'dead'),
      text: open ? q.role : '', sub: open ? (q.id === G.me ? 'You' : q.name) : '', mark: q.alive ? '' : '☠',
    };
  }, all ? `<div class="mid-big">${G.winner.team === 'good' ? 'Good' : 'Evil'}</div><div class="mid-sm">wins</div>`
        : `<div class="mid-big">${shown.length}/${G.players.length}</div><div class="mid-sm">tap a seat to reveal</div>`);
  const p = U.revealSel != null && shown.includes(U.revealSel) ? P(U.revealSel) : null;

  return `${table}
    <div class="row" style="justify-content:center">${all ? '<button class="btn" data-act="flip-none">Hide everyone</button>' : '<button class="btn primary" data-act="flip-all">Reveal everyone</button>'}</div>

// After the game: what you could have spotted, and how your choices lined up with the truth
function reviewHtml() {
  const m = me(), good = isGood(m), team = q => isGood(q) ? 'good' : 'evil';
  const tag = q => `<span class="${isGood(q) ? 'ok-txt' : 'bad-txt'}">${isGood(q) ? 'good' : 'evil'}</span>`;
  const who = id => id === G.me ? 'you' : `<b>${esc(P(id).name)}</b>`;
  const parts = [];
  // The evil team and their stories
  const evil = G.players.filter(q => !isGood(q));
  parts.push(`<h3>The evil team</h3><div class="hist">${evil.map(q => {
    const lies = q.bot ? q.bot.fakes.map(f => `<div class="hint">Made up: ${factText(f)}</div>`).join('') : '';
    const claims = [...new Set(q.claimHist)];
    const dup = claims.map(c => G.players.find(o => o.id !== q.id && o.claimHist.includes(c) && isGood(o))).find(Boolean);
    return `<div class="info">${who(q.id)}: really the <b>${esc(q.was ? q.was + ' → Imp' : q.role)}</b>${claims.length ? `, claimed ${list(claims.map(c => 'the ' + esc(c)))}` : ', never claimed'}${dup ? ` <span class="bad-txt">(double claim with ${who(dup.id)}, a giveaway)</span>` : ''}.${lies}</div>`;
  }).join('')}</div>`);
  // How close your own info was to the Demon, morning by morning
  const tr = (G.track || []).filter(t => t.view === (good ? 'you' : 'town'));
  if (tr.length) {
    const firstTop = tr.find(t => t.top === t.demon);
    parts.push(`<h3>${good ? 'What your info said about the Demon' : 'How suspicious the town found your Demon'}</h3>
      <div class="hist">${tr.map(t => `<div class="review-row"><span>Day ${t.day}</span><div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(100 * t.pd)}%"></div></div>
        <span class="hint">${who(t.demon)}: ${Math.round(100 * t.pd)}% likely the Demon${t.top !== t.demon && t.top != null ? `. Top suspect: ${who(t.top)} (${Math.round(100 * t.topPd)}%)` : ' (the top suspect)'}</span></div></div>`).join('')}</div>
      <p class="hint">${good ? (firstTop ? `From day ${firstTop.day}, everything you'd heard pointed at the real Demon more than anyone else.` : 'The evidence never quite pointed at the real Demon: their bluff held up.') : (firstTop ? `From day ${firstTop.day}, the town had the Demon as its top suspect.` : 'The town never made the Demon its top suspect.')}</p>`);
  }
  // Executions and your votes
  const ex = G.deaths.filter(d => d.how === 'execution');
  if (ex.length) parts.push(`<h3>Executions</h3><div class="hist">${ex.map(d => `<div class="info">Day ${d.n}: ${who(d.id)} (${esc(P(d.id).was || P(d.id).role)}, ${tag(P(d.id))})</div>`).join('')}</div>`);
  const votes = G.myVotes || [];
  if (votes.length) {
    const right = votes.filter(v => v.yes === (good ? !isGood(P(v.b)) : isGood(P(v.b))));
    parts.push(`<h3>Your votes</h3><p>${right.length} of ${votes.length} ${plural(votes.length, 'vote', 'votes')} helped your team${good ? ' (yes on evil, no on good)' : ' (yes on good, no on evil)'}.</p>
      <div class="hist">${votes.map(v => { const okv = v.yes === (good ? !isGood(P(v.b)) : isGood(P(v.b))); return `<div class="hint">Day ${v.day}: ${v.yes ? 'voted' : "didn't vote"} on ${who(v.b)} (${tag(P(v.b))}) <span class="${okv ? 'ok-txt' : 'bad-txt'}">${okv ? '✓' : '✗'}</span></div>`; }).join('')}</div>`);
  }
  // Your reads: labels, accusations and characters you named
  const reads = [];
  Object.keys(G.labels || {}).forEach(id => {
    const q = P(+id), l = G.labels[id], lg = l === 'Good' || (ROLES[l] && ['townsfolk', 'outsider'].includes(ROLES[l].type));
    const exact = ROLES[l] && (q.role === l || q.was === l);
    reads.push({ ok: lg === isGood(q), text: `Your label on ${who(q.id)}: ${esc(l)}${exact ? ' (exactly right)' : ''}` });
  });
  const latest = {};
  G.opinions.filter(o => o.by === G.me).forEach(o => { latest[o.x] = o; });
  Object.values(latest).forEach(o => {
    const q = P(o.x), saidGood = o.kind === 'good';
    reads.push({ ok: saidGood === isGood(q), text: `You said ${who(q.id)} ${o.role ? `was the ${esc(o.role)}` : saidGood ? 'was good' : o.kind === 'demon' ? 'was the Demon' : 'could be evil'}` });
  });
  if (reads.length) parts.push(`<h3>Your reads</h3><p>${reads.filter(r => r.ok).length} of ${reads.length} right.</p><div class="hist">${reads.map(r => `<div class="hint">${r.text} <span class="${r.ok ? 'ok-txt' : 'bad-txt'}">${r.ok ? '✓' : '✗'}</span></div>`).join('')}</div>`);
  // False info from drunk or poisoned good players
  const falseInfo = G.log.filter(e => e.text.includes('(false:'));
  if (falseInfo.length) parts.push(`<h3>False info from the Drunk or the Poisoner</h3><div class="hist">${falseInfo.map(e => `<div class="hint">${e.when}: ${e.text}</div>`).join('')}</div>`);
  return `<section class="card"><h2>How it went</h2>${parts.join('')}</section>`;
}

function render() {
  let html = '';
  if (U.menu) html += menuView();
  if (U.view === 'home') html += homeView();
  else if (U.view === 'how') html += howView();
  else if (U.view === 'setup') html += setupView();
  else if (G) {
    if (G.stage === 'night') html += nightView() + (G.n > 1 ? myCard() : '');
    else if (G.stage === 'dawn') html += dawnView();
    else if (G.stage === 'day') html += dayView();
    else if (G.stage === 'dusk') html += duskView();
    else html += overView();
  } else { U.view = 'home'; html += homeView(); }
  $app.innerHTML = html + actionBar();
  document.body.classList.toggle('has-actionbar', !!actionBar());
  if (G && G.stage === 'day' && (U.tab || 'town') === 'talk') U.seenFeed = G.feed.length;
  document.getElementById('phase').textContent = G && U.view === 'game' ? (G.stage === 'over' ? 'Game over' : label()) : '';
  save();
}

/* ---------- Your actions ---------- */
function makeForm() {
  const p = me(), role = p.claim && INFO_ROLES.includes(p.claim) ? p.claim : INFO_ROLES.includes(believed(p)) ? believed(p) : 'Empath';
  const oth = G.players.filter(q => q.id !== G.me);
  return { role, n: G.n, a: oth[0].id, b: oth[1].id, char: '', num: 0, yes: '0' };
}
function submitForm() {
  const f = U.form, r = f.role, a = +f.a, b = +f.b, n = +f.n;
  let fact = null;
  if (['Washerwoman', 'Librarian', 'Investigator'].includes(r)) {
    const chars = r === 'Washerwoman' ? TF : r === 'Librarian' ? ['(no Outsiders)', ...OS] : MN;
    const char = chars.includes(f.char) ? f.char : chars[0];
    if (char === '(no Outsiders)') fact = { k: 'noOut', role: r };
    else { if (a === b) return 'Choose two different players.'; fact = { k: 'pair', role: r, a, b, char }; }
  } else if (r === 'Chef') fact = { k: 'chef', num: +f.num };
  else if (r === 'Empath') fact = { k: 'empath', num: +f.num, nb: aliveNeighbours(me()).map(q => q.id) };
  else if (r === 'Fortune Teller') { if (a === b) return 'Choose two different players.'; fact = { k: 'ft', a, b, yes: f.yes === '1' }; }
  else if (r === 'Undertaker' || r === 'Ravenkeeper') fact = { k: 'see', who: a, char: ROLES[f.char] ? f.char : Object.keys(ROLES)[0] };
  else if (r === 'Monk') fact = { k: 'monk', who: a };
  fact.n = n; fact.src = r;
  if (f.to != null && f.to !== 'town') whisper(P(+f.to), 'info', fact);
  else shareFact(fact);
  U.form = null;
  return null;
}
function shareFact(f) {
  if (me().claim !== f.src) { setClaim(me(), f.src); say(G.me, `I'm the <b>${esc(f.src)}</b>.`); }
  G.pub.push({ by: G.me, f, day: G.n });
  say(G.me, factText(f, true));
}

/* ---------- Events ---------- */
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pref === 'n') { prefs.n = +t.value; savePrefs(); render(); }
  if (t.dataset.f && U.form) {
    U.form[t.dataset.f] = t.value;
    if (t.dataset.f === 'role') { U.form.char = ''; render(); }
    if (t.dataset.f === 'to') render();
  }
  if (t.dataset.label != null) { const v = t.value; if (v) G.labels[+t.dataset.label] = v; else delete G.labels[+t.dataset.label]; render(); }
  if (t.dataset.sf === 'role' && U.sayForm) {
    const was = sayReasonKind(U.sayForm);
    U.sayForm.role = t.value;
    if (sayReasonKind(U.sayForm) !== was) U.sayForm.r = 0;
    render();
  }
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.dataset && d.dataset.priv != null) U.privOpen = d.open ? +d.dataset.priv : null;
}, true);
document.addEventListener('input', e => {
  if (e.target.id === 'my-name') { prefs.name = e.target.value; savePrefs(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id != null ? +b.dataset.id : null;
  const go = () => { render(); window.scrollTo(0, 0); };
  switch (act) {
    case 'menu': U.menu = !U.menu && U.menu !== 'abandon' ? true : false; break;
    case 'home': U.view = 'home'; U.menu = false; break;
    case 'how': U.view = 'how'; U.menu = false; return go();
    case 'resume': U.view = 'game'; break;
    case 'setup': U.view = 'setup'; U.menu = false; return go();
    case 'team': prefs.team = b.dataset.v; savePrefs(); break;
    case 'diff': prefs.diff = b.dataset.v; savePrefs(); break;
    case 'start':
      newGame({ n: prefs.n, team: prefs.team, name: prefs.name, diff: prefs.diff || 'normal' });
      G.created = Date.now();
      U = { view: 'game', sel: [], need: 0, menu: false, panel: null, confirmEnd: false, form: null, bc: null };
      return go();
    case 'abandon': U.menu = 'abandon'; break;
    case 'abandon-yes': G = null; U.view = 'home'; U.menu = false; break;
    case 'text': prefs.text = +b.dataset.v; savePrefs(); break;
    case 'coach': prefs.coach = b.dataset.v === '1'; savePrefs(); break;
    case 'sel':
      if (U.sel.includes(id)) U.sel = U.sel.filter(x => x !== id);
      else if (U.need === 1) U.sel = [id];
      else { U.sel.push(id); if (U.sel.length > U.need) U.sel.shift(); }
      break;
    case 'sleep': endNight(U.sel.slice()); U.sel = []; return go();
    case 'rk': ravenkeeperLearns(me(), U.sel[0]); G.rkWait = false; U.sel = []; break;
    case 'day': startDay(); U.panel = null; return go();
    case 'night': startNight(); U.sel = []; U.panel = null; U.form = null; U.sayForm = null; U.three = []; U.confirmEnd = false; return go();
    case 'to-over': G.stage = 'over'; return go();
    case 'tab': U.tab = b.dataset.t; render(); window.scrollTo(0, 0); if (U.tab === 'talk') { const el = document.getElementById('talk-end'); if (el) el.scrollIntoView({ block: 'end' }); } return;
    case 'filter': U.feedFilter = b.dataset.id === '' ? null : +b.dataset.id; break;
    case 'seat-go': U.tab = 'town'; U.panel = id; U.sayForm = null; U.three = []; U.privOpen = null; U.nomForm = null; render(); { const el = document.getElementById('player-panel'); if (el) el.scrollIntoView({ block: 'start' }); } return;
    case 'seat': {
      const fromTown = (U.tab || 'town') === 'town';
      U.panel = U.panel === id && fromTown ? null : id; U.sayForm = null; U.three = []; U.privOpen = null; U.nomForm = null; U.tab = 'town';
      render();
      const el = document.getElementById('player-panel');
      if (el) el.scrollIntoView({ block: 'start', behavior: fromTown ? 'smooth' : 'auto' });
      return;
    }
    case 'ask': ask(P(id), b.dataset.q); break;
    case 'mx-all': prefs.mxAll = !prefs.mxAll; savePrefs(); break;
    case 'say-open': U.sayForm = U.sayForm && U.sayForm.x === id && sayGroup(U.sayForm.k) === b.dataset.k ? null : { x: id, k: b.dataset.k, r: 0, role: 'Poisoner' }; break;
    case 'announce': announce(b.dataset.t); break;
    case 'say-kind': U.sayForm.k = b.dataset.k; break;
    case 'say-reason': U.sayForm.r = +b.dataset.i; break;
    case 'say-cancel': U.sayForm = null; break;
    case 'say-it': humanSay(); break;
    case 'three-pick': {
      const r = b.dataset.r, t = U.three = U.three || [];
      if (t.includes(r)) U.three = t.filter(x => x !== r); else { t.push(r); if (t.length > 3) t.shift(); }
      U.privOpen = U.panel;
      break;
    }
    case 'whisper-three': whisper(P(id), 'three', U.three.slice()); U.three = []; U.privOpen = null; break;
    case 'whisper-one': whisper(P(id), 'one', U.three.slice()); U.three = []; U.privOpen = null; break;
    case 'whisper-ask': whisper(P(id), b.dataset.k); break;
    case 'whisper-fact': whisper(P(id), 'info', G.facts[G.me][+b.dataset.i]); break;
    case 'nominate': U.confirmEnd = false; nominate(G.me, id); return go();
    case 'nom-open': U.nomForm = U.nomForm === id ? null : id; U.nomR = 0; break;
    case 'nom-reason': U.nomR = +b.dataset.i; break;
    case 'nom-cancel': U.nomForm = null; break;
    case 'nom-go': {
      const rs = humanReasons(id, 'evil'), r = rs[U.nomR || 0] || rs[0];
      G.opinions.push({ by: G.me, x: id, day: G.n, kind: 'evil', w: r.w });
      U.nomForm = null; U.confirmEnd = false;
      nominate(G.me, id, `I nominate <b>${esc(P(id).name)}</b>: ${r.t}.`);
      return go();
    }
    case 'def-claim': { const r = document.getElementById('def-role').value; setClaim(me(), r); say(G.me, `I'm the <b>${esc(r)}</b>.`); break; }
    case 'def-share': { const f = G.facts[G.me][+b.dataset.i]; if (G.pub.some(e => e.by === G.me && fkey(e.f) === fkey(f))) say(G.me, factText(f, true)); else shareFact(f); break; }
    case 'def-point': {
      const x = +document.getElementById('def-x').value;
      say(G.me, `Look at <b>${esc(P(x).name)}</b> instead: ${reasonFor(x)}.`);
      G.opinions.push({ by: G.me, x, day: G.n, kind: 'evil', w: 0.8 });
      defend(P(x), G.me, true);
      break;
    }
    case 'def-plead': say(G.me, pick(["I'm good. Executing me wastes a day we can't afford.", "I'm on your side. Look at who's pushing this.", "Vote me and you'll be one good player down tomorrow."])); break;
    case 'def-done': decideVotes(); return go();
    case 'team': teamWhisper(P(id), b.dataset.k); break;
    case 'rq-three': U.panel = id; U.privOpen = id; U.three = []; U.sayForm = null; U.nomForm = null; render(); { const el = document.querySelector('details[data-priv]'); if (el) el.scrollIntoView({ block: 'center' }); } return;
    case 'rq-one': whisper(P(id), 'one', [document.getElementById(`rq-role-${id}`).value]); break;
    case 'rq-fact': whisper(P(id), 'info', G.facts[G.me][+b.dataset.i]); break;
    case 'rq-sus': answerRequest(P(id), 'sus', +document.getElementById(`rq-x-${id}`).value); break;
    case 'rq-unsure': answerRequest(P(id), 'unsure'); break;
    case 'rq-no': answerRequest(P(id), 'no'); break;
    case 'team-sel': { const v = document.getElementById(b.dataset.src).value; teamWhisper(P(id), b.dataset.k, b.dataset.k === 'give' ? v : +v); break; }
    case 'shoot': {
      G.myShot = true;
      if (me().claim !== 'Slayer') setClaim(me(), 'Slayer');
      say(G.me, `I'm the Slayer, and I'm shooting <b>${esc(P(id).name)}</b>.`);
      slayerShot(G.me, id);
      return go();
    }
    case 'vote': G.vote.mine = b.dataset.v === '1'; finishVote(); return go();
    case 'town-nom':
      U.confirmEnd = false;
      if (botNominates()) { G.dayS.quiet = false; return go(); }
      G.dayS.quiet = true; sys('Nobody else wants to nominate.');
      break;
    case 'end':
      // Anyone still keen gets one last nomination first
      if (botNominates()) { sys('Before the day ends…'); return go(); }
      U.confirmEnd = true; break;
    case 'end-no': U.confirmEnd = false; break;
    case 'end-yes': U.confirmEnd = false; endDay(); return go();
    case 'claim': {
      const r = document.getElementById('claim-role').value;
      if (me().claim === r) break;
      setClaim(me(), r); say(G.me, `I'm the <b>${esc(r)}</b>.`);
      break;
    }
    case 'share': shareFact(G.facts[G.me][+b.dataset.i]); break;
    case 'make-open': U.form = makeForm(); break;
    case 'make-cancel': U.form = null; break;
    case 'make': { const err = submitForm(); if (err) alert(err); break; }
    case 'flip': {
      const shown = G.revealed = G.revealed || [];
      if (!shown.includes(id)) shown.push(id);
      U.revealSel = id;
      break;
    }
    case 'flip-all': G.revealed = G.players.map(q => q.id); U.revealSel = null; break;
    case 'flip-none': G.revealed = []; U.revealSel = null; break;
  }
  render();
});
render();
</script>
</body>
</html>
